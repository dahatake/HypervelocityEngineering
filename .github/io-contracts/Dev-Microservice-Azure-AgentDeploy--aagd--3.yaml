# Agent 別 workflow ファイルの出力先ディレクトリ。templates/aagd/step-3.md `## 出力` の
# `.github/workflows/deploy-agent-{key}.yml` は本ディレクトリ配下に作られる。
# （Dev-Microservice-Azure-ComputeDeploy-AzureFunctions--asdw-web--3.4 も
#  `.github/workflows/*` を output として宣言している）
- path: .github/workflows/
  required: true
  mode: create
- path: src/infra/azure/create-azure-agent-resources-prep.sh
  required: true
  mode: create
- path: src/infra/azure/create-azure-agent-resources.sh
  required: true
  mode: create
- path: src/infra/azure/verify-agent-resources.sh
  required: true
  mode: create
- path: .github/workflows/deploy-agent-{key}.yml
  required: true
  mode: create
- path: docs/test-specs/deploy-step2-agent-test-spec.md
  required: true
  mode: create
- path: docs/azure/azure-service-catalog.md
