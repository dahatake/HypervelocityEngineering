inputs:
- path: docs/screen/{screenId}-{screenNameSlug}-description.md
  required: true
  kind: agent_artifact
  producer: Arch-UI-Detail--aad-web--2.1
- path: docs/catalog/screen-catalog-APP-*.md
  required: true
  kind: agent_artifact
  producer: Arch-UI-List--aad-web--1
- path: docs/catalog/service-catalog-matrix.md
  required: true
  kind: agent_artifact
  producer: Arch-Microservice-ServiceCatalog--aas--5
- path: docs/catalog/use-case-catalog.md
  required: true
  kind: agent_artifact
  producer: Arch-ARD-UseCaseCatalog--ard--3.3
- path: src/data/sample-data.json
  required: true
  kind: agent_artifact
  producer: Arch-DataModeling--aas--3.2
- path: docs/test-specs/{screenId}-test-spec.md
  required: true
  kind: agent_artifact
  producer: Arch-TDD-TestSpec--aad-web--2.4
- path: docs/catalog/app-catalog.md
  required: true
  kind: agent_artifact
  producer: Arch-ApplicationAnalytics--ard--4.1
- path: src/test/ui/
  required: true
  kind: agent_artifact
  producer: Dev-Microservice-Azure-UITestCoding--asdw-web--4.1
outputs:
- path: src/app/
  required: true
  mode: create
- path: src/app/package.json
  required: true
  mode: create
- path: src/app/main.js
  required: true
  mode: create
- path: tests/run/<run-id>/<workflow-id>/step-<step-id>/<target-key>/<phase>/tdd-test-report.md
  required: true
  mode: create
