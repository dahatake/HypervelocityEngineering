inputs:
- path: docs/screen/{screenId}-{screenNameSlug}-description.md
  required: true
  kind: agent_artifact
  producer: Arch-UI-Detail--aad-web--2.1
- path: docs/catalog/screen-catalog-APP-*.md
  required: true
  kind: agent_artifact
  producer: Arch-UI-List--aad-web--1
- path: docs/catalog/service-catalog-matrix.md
  required: true
  kind: agent_artifact
  producer: Arch-Microservice-ServiceCatalog
- path: docs/catalog/use-case-catalog.md
  required: true
  kind: agent_artifact
  producer: Arch-ARD-UseCaseCatalog--ard--3.3
- path: src/data/sample-data.json
  required: true
  kind: agent_artifact
  producer: Arch-DataModeling--aas--4.2
- path: docs/test-specs/{screenId}-test-spec.md
  required: true
  kind: agent_artifact
  producer: Arch-TDD-TestSpec
- path: docs/catalog/app-catalog.md
  required: true
  kind: agent_artifact
  producer: Arch-ApplicationAnalytics
outputs:
- path: src/app/
  required: true
  mode: create
- path: src/app/package.json
  required: true
  mode: create
- path: src/app/main.js
  required: true
  mode: create
- path: '{WORK}work-status.md'
  required: true
  mode: upsert
- path: src/test/ui/
  required: true
  mode: create
