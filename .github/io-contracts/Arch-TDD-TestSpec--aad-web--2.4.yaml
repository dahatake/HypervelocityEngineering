inputs:
- path: docs/catalog/test-strategy.md
  required: true
  kind: agent_artifact
  producer: Arch-TDD-TestStrategy--aas--6
- path: docs/catalog/service-catalog-matrix.md
  # templates/aad-web/step-2.4.md `## 入力` には本ファイルが列挙されていない（画面別
  # テスト仕様書の必須入力ではない）ため required: false とする。
  required: false
  kind: agent_artifact
  producer: Arch-Microservice-ServiceCatalog--aas--5
- path: docs/catalog/screen-catalog-{key}.md
  required: true
  kind: agent_artifact
  producer: Arch-UI-List--aad-web--1
- path: template/atdd-template.md
  required: true
  kind: static
- path: docs/screen/{screenId}-{screenNameSlug}-description.md
  required: true
  kind: agent_artifact
  producer: Arch-UI-Detail--aad-web--2.1
- path: docs/catalog/app-catalog.md
  required: true
  kind: agent_artifact
  producer: Arch-ApplicationAnalytics--ard--4.1
- path: docs/catalog/data-model.md
  required: true
  kind: agent_artifact
  producer: Arch-DataModeling--aas--3.1
- path: docs/catalog/domain-analytics.md
  required: true
  kind: agent_artifact
  producer: Arch-Microservice-DomainAnalytics--aas--2.1
- path: knowledge/D05-ユースケース-シナリオカタログ.md
  required: true
  kind: static
outputs:
- path: docs/test-specs/{screenId}-test-spec.md
  required: true
  mode: create
