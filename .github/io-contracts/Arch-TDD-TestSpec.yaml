inputs:
- path: docs/catalog/test-strategy.md
  required: true
  kind: agent_artifact
  producer: Arch-TDD-TestStrategy
- path: docs/catalog/service-catalog-matrix.md
  required: true
  kind: agent_artifact
  producer: Arch-Microservice-ServiceCatalog
- path: template/atdd-template.md
  required: true
  kind: static
- path: docs/services/{serviceId}-{serviceNameSlug}-description.md
  required: true
  kind: agent_artifact
  producer: Arch-Microservice-ServiceDetail--aad-web--2.2
- path: docs/screen/{screenId}-{screenNameSlug}-description.md
  required: true
  kind: agent_artifact
  producer: Arch-UI-Detail--aad-web--2.1
- path: docs/catalog/app-catalog.md
  required: true
  kind: agent_artifact
  producer: Arch-ApplicationAnalytics
- path: docs/catalog/data-model.md
  required: true
  kind: agent_artifact
  producer: Arch-DataModeling--aas--3.1
- path: docs/catalog/domain-analytics.md
  required: true
  kind: agent_artifact
  producer: Arch-Microservice-DomainAnalytics--aas--2.1
- path: knowledge/D05-ユースケース-シナリオカタログ.md
  required: true
  kind: static
outputs:
- path: docs/test-specs/{serviceId}-test-spec.md
  required: true
  mode: create
- path: docs/test-specs/{screenId}-test-spec.md
  required: true
  mode: create
- path: docs/test-specs/{key}-test-spec.md
  required: true
  mode: create
- path: work/run/<run-id>/Arch-TDD-TestSpec/Issue-<識別子>/plan.md
  required: true
  mode: create
- path: subissues.md
  required: true
  mode: create
