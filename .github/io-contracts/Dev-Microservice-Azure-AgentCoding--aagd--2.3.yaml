inputs:
- path: docs/agent/agent-detail-{key}.md
  required: true
  kind: agent_artifact
  producer: Arch-AIAgentDesign-Step3--aag--3
- path: docs/ai-agent-catalog.md
  required: true
  kind: agent_artifact
  producer: Arch-AIAgentDesign-Step3--aag--3
- path: src/test/agent/{key}.Tests/
  required: true
  kind: agent_artifact
  producer: Dev-Microservice-Azure-AgentTestCoding--aagd--2.2
- path: docs/test-specs/{key}-test-spec.md
  required: true
  kind: agent_artifact
  producer: Arch-TDD-TestSpec--aagd--2.1
- path: docs/catalog/service-catalog-matrix.md
  required: true
  kind: agent_artifact
  producer: Arch-Microservice-ServiceCatalog--aas--6
- path: docs/azure/azure-services-additional.md
  required: true
  kind: agent_artifact
  producer: Dev-Microservice-Azure-AddServiceDesign--asdw-web--2.1
- path: docs/catalog/app-catalog.md
  required: true
  kind: agent_artifact
  producer: Arch-ApplicationAnalytics--aas--1
- path: docs/azure/azure-services-data.md
  required: true
  kind: agent_artifact
  producer: Dev-Microservice-Azure-DataDesign--asdw-web--1.1
- path: docs/catalog/service-catalog.md
  required: true
  kind: agent_artifact
  producer: Arch-Microservice-ServiceIdentify--aas--3.2
- path: src/agent/
  required: false
  kind: agent_artifact
  producer: Dev-Microservice-Azure-AgentCoding--aagd--2.3
# Dev-Microservice-Azure-AgentCoding.prompt.md 「knowledge/ 参照（任意・存在する場合のみ）」
# — 生成物ではなく参照入力。
- path: knowledge/
  required: false
  kind: static
- path: knowledge/D06-業務ルール-判定表仕様書.md
  required: false
  kind: static
- path: knowledge/D10-API-Event-File-連携契約パック.md
  required: false
  kind: static
- path: knowledge/D12-権限-認可-職務分掌設計書.md
  required: false
  kind: static
- path: knowledge/D18-Prompt-ガバナンス-入力統制パック.md
  required: false
  kind: static
outputs:
- path: src/agent/{key}/
  required: true
  mode: create
# Agent Plugins Specification 1.0.0 の plugin root マニフェスト。
# `skills/` は AG-CAP-06 が required のときだけ生成される条件付き成果物のため宣言しない。
- path: src/agent/{key}/plugin.json
  required: true
  mode: create
# 注: 設定ファイル（Python: agent-config.json / C#: appsettings.json）は
# Dev-Microservice-Azure-AgentCoding.prompt.md のとおり `src/agent/{key}/` 配下の
# 言語排他な条件付き成果物であり、リポジトリルート直下の契約パスではないため
# outputs から削除した（`src/agent/{key}/` 配下に包含される）。
- path: src/agent/{key}/README.md
  required: true
  mode: create
- path: tests/run/<run-id>/<workflow-id>/step-<step-id>/<target-key>/<phase>/tdd-test-report.md
  required: true
  mode: create
