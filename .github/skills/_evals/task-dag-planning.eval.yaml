# .github/skills/_evals/task-dag-planning.eval.yaml
#
# Skill 発動テストケース
# - 各テストケースは「この入力が来たとき、このSkillが発動すべきか/すべきでないか」を定義
# - CI や手動レビューでの Skill ルーティング検証に使用

skill: task-dag-planning
skill_path: .github/skills/task-dag-planning/SKILL.md
description: 計画を書くときの最小規約（受入条件と非対象、exit code で判定できる完了条件、独立して検証できる分割単位、任意の見積）を提供するスキル。

test_cases:
  # --- 正のテストケース（このSkillが発動すべき入力） ---
  - id: create-plan-request
    input: "この Issue の実装計画を作成してください。依存関係も整理してほしいです。"
    expected_trigger: true
    verify:
      - type: file_creation
        detail: "計画にノード一覧と依存関係が含まれること"
      - type: content_contains
        detail: "DAG（依存関係ノード）と見積（分単位）が含まれること"
      - type: content_contains
        detail: "受入条件と非対象、および exit code で判定できる完了条件が記載されること"
    reason: "SKILL.md の USE FOR に 'task decomposition into a dependency graph' が明示されており、計画作成依頼は典型的なトリガー"

  - id: estimate-task-split
    input: "このタスクの見積を出して、分割が必要か判定してください。"
    expected_trigger: true
    verify:
      - type: content_contains
        detail: "各ノードの見積（分）が記載されること"
      - type: content_contains
        detail: "分割する場合は、独立して検証できる単位と分けた理由が記載されること（作業量だけを根拠に分割を強制しない）"
    reason: "SKILL.md の USE FOR に 'estimate task' と 'choosing independently verifiable split units when the agent decides to split' が明示されており、見積・分割の相談は典型的なトリガー"

  - id: definition-of-done-request
    input: "各タスクの完了条件を、exit code で判定できる形に整理してください。"
    expected_trigger: true
    verify:
      - type: content_contains
        detail: "完了条件が exit code またはファイル状態で判定できる形で記載されること"
    reason: "SKILL.md の USE FOR に 'definition-of-done rules' が明示されており、完了条件の規約化はトリガー条件に該当する"

  - id: dag-dependency-analysis
    input: "実装するタスクの依存関係を DAG で整理して、どの順番で作業すればよいか教えてください。"
    expected_trigger: true
    verify:
      - type: content_contains
        detail: "ノード一覧と依存関係、および起動可能な順序が記載されること"
    reason: "SKILL.md の USE FOR に 'task decomposition into a dependency graph' が明示されており、依存関係整理はトリガー条件に該当する"

  # --- 負のテストケース（このSkillが発動すべきでない入力） ---
  - id: run-tests-request
    input: "ビルドとテストを実行して、結果を確認してください。"
    expected_trigger: false
    expected_skill: harness-verification-loop
    reason: "SKILL.md の frontmatter DO NOT USE FOR に 'implementation execution' が明示されており、テスト実行は対象外"

  - id: gather-context-request
    input: "このタスクの要件が不明確なので、質問票を作成して不明点を整理してください。"
    expected_trigger: false
    expected_skill: task-questionnaire
    reason: "SKILL.md の frontmatter USE FOR は計画の受入条件・完了条件・分割単位・見積の規約に限定され、質問票による不明点整理を列挙していない"

  - id: direct-implementation-request
    input: "Azure Functions の HTTP トリガー関数を実装してください。"
    expected_trigger: false
    expected_skill: null
    reason: "SKILL.md の frontmatter DO NOT USE FOR に 'implementation execution (agents do that separately)' が明示されており、直接実装依頼は対象外"

  # --- エッジケース ---
  - id: ambiguous-plan-or-implement
    input: "新機能を追加したいのですが、どこから始めればいいですか？"
    expected_trigger: true
    reason: "作業の開始点を問う曖昧な入力は、まず計画・見積（task-dag-planning）から着手するのが適切。ただし不明点が多い場合は task-questionnaire が先行することもある。"
