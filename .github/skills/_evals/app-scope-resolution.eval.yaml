skill: app-scope-resolution
skill_path: .github/skills/app-scope-resolution/SKILL.md
description: APP-ID に基づくスコープ解決ルール。Issue body から APP-ID を取得し、app-catalog.md との紐付けで対象サービス・画面・エンティティを特定する。AAD-WEB/ASDW-WEB/ADFD/ADFDV では app-arch-catalog.md の推薦アーキテクチャで自動フィルタリングする。

test_cases:
  # --- 正のテストケース ---
  - id: resolve-app-id-from-issue-body
    input: "Issue body に <!-- app-id: APP-03 --> が記載されている。対象サービスと画面を特定してほしい"
    expected_trigger: true
    verify:
      - type: action
        detail: "docs/catalog/app-catalog.md を参照して APP-03 に紐付くサービス・画面・エンティティを特定する"
    reason: "USE FOR: APP-ID scope resolution に該当する"

  - id: identify-services-for-app
    input: "APP-ID のスコープを解決してください。app-catalog.md から APP-05 に属するサービス一覧を取得する"
    expected_trigger: true
    verify:
      - type: action
        detail: "APP-05 に紐付くサービス一覧をカンマ区切りで取得する（N:N 関係）"
    reason: "WHEN: APP-ID のスコープ解決 に該当する"

  - id: aad-web-no-app-id-uses-arch-filter
    input: "aad-web ワークフローで APP-ID が未指定の場合、何を対象にするか"
    expected_trigger: true
    verify:
      - type: action
        detail: "docs/catalog/app-arch-catalog.md の A) サマリ表（全APP横断）を参照し、推薦アーキテクチャを実行分類へ変換して web-cloud の APP-ID のみを対象にする"
    reason: "AAD-WEB では APP-ID 未指定時に全対象とせず推薦アーキテクチャでフィルタリングする"

  - id: adfd-no-app-id-uses-arch-filter
    input: "adfd ワークフローで APP-ID が未指定の場合、何を対象にするか"
    expected_trigger: true
    verify:
      - type: action
        detail: "docs/catalog/app-arch-catalog.md の A) サマリ表（全APP横断）を参照し、推薦アーキテクチャを実行分類へ変換して batch の APP-ID のみを対象にする"
    reason: "ADFD では APP-ID 未指定時に全対象とせず推薦アーキテクチャでフィルタリングする"

  - id: aad-web-bff-falls-back-to-web-cloud
    input: "app-arch-catalog.md で推薦が BFF + 会員管理マイクロサービスの APP は aad-web の対象になるか"
    expected_trigger: true
    verify:
      - type: action
        detail: "非空の未知表記で batch 判定語を含まないため web-cloud に分類し、aad-web の対象にする"
    reason: "未知の非空推薦を未分類にせず web-cloud へ振り分けるフォールバックを確認する"

  - id: adfd-dwh-analytics-falls-back-to-batch
    input: "app-arch-catalog.md で推薦が クラウドDWH + BI/Analytics Platform の APP は adfd の対象になるか"
    expected_trigger: true
    verify:
      - type: action
        detail: "DWH、独立語 BI、Analytics を含むため batch に分類し、adfd の対象にする"
    reason: "DWH・分析系の非空推薦を batch へ振り分けるフォールバックを確認する"

  - id: adfd-lowercase-dwh-analytics-falls-back-to-batch
    input: "推薦が cloud dwh + analytics platform の APP は adfd の対象になるか"
    expected_trigger: true
    verify:
      - type: action
        detail: "英字キーワードを大文字小文字を区別せず検出し、batch に分類する"
    reason: "英字キーワードの大小文字を区別しない規則を確認する"

  - id: aad-web-bi-substring-does-not-trigger-batch
    input: "推薦が BIBLE Platform の APP は BI を含むものとして adfd の対象になるか"
    expected_trigger: true
    verify:
      - type: action
        detail: "BIBLE 内の BI は独立した英数字語ではないため batch 判定語として扱わず、web-cloud に分類する"
    reason: "BI の単純な部分一致による誤分類を防ぐ境界規則を確認する"

  # --- 負のテストケース ---
  - id: not-for-service-implementation
    input: "SVC-10 の get_ticket_status エンドポイントを Python で実装してほしい"
    expected_trigger: false
    expected_skill: null
    reason: "DO NOT USE FOR: service implementation に該当する。実装は Dev 系 Agent が担当"

  - id: not-for-data-modeling
    input: "ポイント管理ドメインのエンティティ関連図（erDiagram）を作成してほしい"
    expected_trigger: false
    expected_skill: null
    reason: "DO NOT USE FOR: data modeling に該当する。データモデリングは Arch-DataModeling Agent が担当"

  # --- エッジケース ---
  - id: edge-app-id-in-html-comment-vs-plain-text
    input: "Issue body に 'APP-ID: APP-07' とプレーンテキストで書かれている（HTMLコメント形式ではない）"
    expected_trigger: true
    verify:
      - type: action
        detail: "HTMLコメント形式で見つからない場合、Issue body 本文から APP-ID らしき記述を検索するフォールバックを実行する"
    reason: "APP 取得手順のステップ2（フォールバック: Issue body 本文から検索）に該当するエッジケース"
