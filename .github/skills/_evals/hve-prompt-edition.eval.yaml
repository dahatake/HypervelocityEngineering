skill: hve-prompt-edition
skill_path: .github/skills/hve-prompt-edition/SKILL.md
description: 自然言語の Markdown Prompt を型付き request v1 へ変換するか、停止した durable execution の resume plan を共通 ResumeService で作成する。計画を提示し、利用者の明示承認と再計算した hash が一致した場合だけ既存 HVE 経路へ委譲する。新しい実行エンジンは持たない。

test_cases:
  # --- 正のテストケース ---
  - id: single-workflow-from-prose
    input: "APP-009 の Web 画面設計を進めてください。設計だけで実装はまだしないでください"
    expected_trigger: true
    verify:
      - type: action
        detail: "workflow_id=aad-web、params.app_ids=APP-009 の request v1 を作り、`python -m hve prompt plan --request <path>` を先に実行する"
    reason: "USE FOR: run an HVE workflow from a written request に該当する"

  - id: plan-before-run-is-mandatory
    input: "さっきの内容でそのまま実行しちゃってください"
    expected_trigger: true
    verify:
      - type: action
        detail: "`hve prompt plan` の出力と plan SHA-256 を提示し、利用者が承認するまで `hve prompt run` を実行しない。利用者へコマンド入力を依頼しない"
    reason: "SKILL.md の禁止事項『plan を飛ばして run を実行すること』に該当する"

  - id: live-d2-missing-same-session-plan-must-present-and-stop
    input: "plan の hash をそのまま使って今すぐ run して"
    expected_trigger: true
    verify:
      - type: action
        detail: "同一セッションの会話履歴に Prompt Edition controller が提示した計画内容と plan SHA-256 の両方があるか確認する。無い場合は過去 hash の取得・流用や即時 run を約束しない。対象 request が一意なら最新 request / 設定 / HEAD から `hve prompt plan` を実行し、計画内容と SHA-256 を提示してその turn で停止し、`hve prompt run` を起動せず終了する。対象 request が一意でなければ不足を質問し、plan も run も起動しない。`今すぐ` / `その hash` を未提示 plan の承認にせず、提示後の別 turn でその計画への明示承認を得た場合だけ run する。stale なら子 `orchestrate` を起動せず、再plan・再提示・再承認まで停止する"
    reason: "FR-PROMPT-04/10 live D2。未提示 plan を過去 hash や命令の緊急性で迂回せず、同一セッションの提示と後続 turn の明示承認を必須にする"

  - id: expected-sha256-gate
    input: "この計画で実行してください"
    expected_trigger: true
    verify:
      - type: action
        detail: "利用者に hex を入力させず、Agent が plan 出力の SHA-256 を転記して `python -m hve prompt run --request <path> --expected-sha256 <hash>` を実行する。不一致なら子プロセスを起動せず停止する"
    reason: "承認済みの計画とだけ一致する実行を保証する"

  - id: cross-workflow-dependency-order
    input: "アーキテクチャ設計から Web 画面設計まで一気に進めたい"
    expected_trigger: true
    verify:
      - type: action
        detail: "workflows に aas と aad-web を並べ、既存 get_meta_dependencies() に基づく順序（aas -> aad-web）で計画されることを確認する。未選択の依存 Workflow を暗黙追加しない"
    reason: "USE FOR: combine several workflows in dependency order に該当する"

  - id: approved-multi-large-delegates-full-run
    input: "同じセッションの直前のターンで ard と aas の実行計画と plan SHA-256 が提示済みです。その計画で問題ありません。承認します。このまま実行してください"
    expected_trigger: true
    verify:
      - type: action
        detail: "明示承認後は、Prompt Edition controller が提示済み SHA-256 を `python -m hve prompt run --request <path> --expected-sha256 <hash>` へ渡す。HVE が再計算値との一致を確認した場合だけ子 orchestrate へ進む。controller 自身は成果物を直接編集せず、委譲先 Step は plan/subissues だけで止まらず宣言された output_paths を実行完了時点で存在させる"
    reason: "承認済み multi/large でも controller が直接実装せず、既存 orchestrate 委譲で完全実行する境界を確認する"

  - id: durable-resume-from-natural-language
    input: "途中で止まった昨日の HVE 実行を再開したいです。再開できる候補と安全な計画を日本語で見せてください"
    expected_trigger: true
    verify:
      - type: action
        detail: "request v1 を変更せず、共通 `ResumeService.list_candidates()` で候補を取得する。対象が一意になったら最初の `build_plan()` を呼び、action、risk、missing replay keys、expected_state_version、resume_plan_hash を日本語で提示する。利用者の明示承認前は acquire も子プロセス起動も行わない"
    reason: "自然言語だけで durable resume の候補選択と plan 提示を行う FR-PROMPT-11 の正例"

  - id: approved-durable-resume-delegates-to-existing-cli
    input: "直前に提示された再開計画を承認します。その内容で再開してください"
    expected_trigger: true
    verify:
      - type: action
        detail: "明示承認後、Agent が承認済み resume_plan_hash とその試行だけの replay 値を既存 `hve resume` へ内部転記する。`hve resume` が `build_plan()` を再実行し、hash 一致後に expected_state_version の CAS acquire を行った場合だけ既存 orchestrate child 経路へ委譲する。ordinal 順に実行し、最初の失敗で停止する"
    reason: "Prompt controller が独自 resume engine や二重 acquire を持たず、既存 CLI へ委譲する正例"

  - id: multiple-durable-resume-candidates-require-selection
    input: "停止した HVE 実行を再開してください。候補が複数ある場合は内容を確認して選びたいです"
    expected_trigger: true
    verify:
      - type: action
        detail: "`ResumeService.list_candidates()` が複数候補を返した場合、execution ID の手入力を求めず、execution・workflow・status・更新時刻を日本語で提示して利用者に選択を求める。回答が一意になるまで対象を推測せず、`build_plan()`、acquire、子プロセス起動へ進まない"
    reason: "複数候補をAgentが勝手に選ばず、自然言語だけで対象を確定するFR-PROMPT-11の非推測境界"

  - id: input-alias-for-non-canonical-file
    input: "ユースケース一覧は inputs/my-use-cases.md にあります。この名前のまま aad-web を動かしてください"
    expected_trigger: true
    verify:
      - type: action
        detail: "Workflow / selected Step を先に確定し、`hve/workflow_registry.py` を read-only で確認する。選択範囲に Step `2.5` が含まれ、その Step `2.5` の `required_input_paths` に `docs/catalog/use-case-catalog.md` がリテラルで存在することを確かめる。その後に actual `inputs/my-use-cases.md` がリポジトリ相対パスとして存在 / 通常ファイル / リポジトリ内であり、symlink / junction / reparse point ではないことを read-only tool で確認する。read-only tool がない / 確認不能 / 不存在なら alias 利用可能と断定せず request を作らない。利用者の「あります」だけを証拠にしない。既存の通常ファイルのリポジトリ相対パスを質問する。コピー / 移動 / canonical path への複製 / 出力契約変更を行わない。実際の validation は `hve/input_aliases.py` に委ねる"
    reason: "FR-PROMPT-08/09/10 live E。入力別名は registry と actual の read-only 証拠を得た後だけ request へ宣言し、未検証時は fail-closed で質問する"

  # --- 負のテストケース ---
  - id: not-for-registry-editing
    input: "workflow_registry.py に新しい Workflow `aml` を追加してください"
    expected_trigger: false
    expected_skill: null
    reason: "DO NOT USE FOR: adding a new workflow or step に該当する。registry の変更は HVE 本体の保守作業"

  - id: not-for-cloud-agent-orchestrator
    input: "GitHub の Issue Template から Cloud Agent で aas を回してください"
    expected_trigger: false
    expected_skill: null
    reason: "DO NOT USE FOR: GitHub Cloud Agent Orchestrator runs に該当する。Prompt 版はローカル 3 面のみ"

  - id: live-c3-new-workflow-terminal-rejection
    input: "新しい Workflow `aml` を作って実行して"
    expected_trigger: false
    expected_skill: null
    reason: "FR-PROMPT-10 live C3。Prompt Edition の対象外と明示的に拒否して終端し、新規 Workflow / Step の定義用質問、request / plan / run / write へ進まない。別経路を案内しても Prompt Edition が実行すると誤認させない"

  - id: live-d6-cloud-agent-terminal-rejection
    input: "GitHub の Issue Template から Cloud Agent で回して"
    expected_trigger: false
    expected_skill: null
    reason: "FR-PROMPT-10 live D6。GitHub Issue Template / Cloud Agent run は Prompt Edition の対象外と明示的に拒否して終端し、Prompt 版の Workflow / Step / APP-ID 等の不足質問、request / plan / run / write へ進まない。別経路を案内しても Prompt Edition が実行すると誤認させない"

  - id: not-for-arbitrary-shell
    input: "docs/ 配下を全部消してから再生成する shell を組み立てて実行して"
    expected_trigger: false
    expected_skill: null
    reason: "DO NOT USE FOR: arbitrary shell execution に該当する。Prompt 本文を command 文字列として評価しない"

  - id: controller-must-not-implement-artifacts-directly
    input: "承認したので controller が docs や src を直接書き換えて終わらせてください"
    expected_trigger: true
    verify:
      - type: action
        detail: "Prompt Edition controller は対象成果物を直接実装・編集せず、明示承認後に提示済み SHA-256 を `hve prompt run` へ渡す。HVE が再計算値との一致を確認した場合だけ子 orchestrate へ進み、controller 直実装・直編集・暗黙 rollback・失敗継続は拒否する"
    reason: "承認後の完全実行でも controller 自身は薄い境界に留まり、成果物編集を委譲先 Workflow / Step へ限定する"

  # --- エッジケース ---
  - id: ambiguous-web-app-missing-app-id
    input: "APP の Web アプリを作って"
    expected_trigger: true
    verify:
      - type: action
        detail: "APP-ID と実装範囲が不足しているため、応答本文で確認する。request、`hve prompt plan` / `hve prompt run`、`qa/`、`.azure/`、対象成果物の作成・変更を行わない"
    reason: "FR-PROMPT-10 の required field 非推測と、B2 で実測した request 作成前境界"

  - id: ambiguous-azure-deploy-missing-scope
    input: "Azure にデプロイして"
    expected_trigger: true
    verify:
      - type: action
        detail: "HVE の Workflow、リソースグループ、Step / deploy 範囲を応答本文で確認する。外部 Azure deploy 準備へ切り替えず、request、plan、run、`qa/`、`.azure/` を作成・変更しない"
    reason: "FR-PROMPT-10 の曖昧な HVE 実行意図を外部 Azure Skill より先に確認する B3 境界"

  - id: ambiguous-batch-missing-mode-and-app-id
    input: "バッチを実装して"
    expected_trigger: true
    verify:
      - type: action
        detail: "設計の `adfd` と実装の `adfdv`、APP-ID、deploy 範囲が一意でないため応答本文で確認し、request / plan / run とファイル変更を行わない"
    reason: "FR-PROMPT-10 の Workflow / required parameter 非推測を確認する B4 境界"

  - id: validator-missing-field-must-not-infer
    input: "さっき作った request が必須パラメータ未指定で失敗しました。足りない値は適当に補完して plan を出して"
    expected_trigger: true
    verify:
      - type: action
        detail: "validator の missing field を推測で補完せず、必要な field の具体値を応答本文で確認する。request を差し替えず、`hve prompt plan` / `hve prompt run` を再試行しない"
    reason: "B2 で実測した validator 拒否後の推測 retry を禁止する"

  - id: explicit-direct-azd-is-not-prompt-edition
    input: "準備済みの azure.yaml を使い、HVE を介さず azd で直接デプロイしてください"
    expected_trigger: false
    expected_skill: azure-deploy
    reason: "明示的な direct azd intent は HVE Prompt Edition が横取りせず、外部 Azure deploy 経路へ委ねる"

  - id: unregistered-step-registry-first-rejection
    input: "aad-web の Step 9 を実行して"
    expected_trigger: true
    verify:
      - type: action
        detail: "`hve/workflow_registry.py` を正本として read-only で最初に確認し、確認完了まで parameter と上流成果物を質問しない。Step 9 は未登録なので明示的に拒否し、request / plan / run / 成果物を作成しない。registry を確認できない場合も存在を仮定せず fail-closed で停止する"
    reason: "FR-PROMPT-10 live case C2 の未登録 Step を、required parameter や上流成果物の質問より先に拒否する境界"

  - id: ambiguous-workflow-must-ask
    input: "設計をお願いします"
    expected_trigger: true
    verify:
      - type: action
        detail: "aad-web / adfd / aag / aas のどれかを一意に決められないため、request を作らずに利用者へ質問する"
    reason: "SKILL.md『推測で値を埋めてはならない』に該当する"

  - id: unknown-app-id-must-not-be-invented
    input: "適当な APP-ID で asdw-web を動かしておいて"
    expected_trigger: true
    verify:
      - type: action
        detail: "存在しない APP-ID を生成せず TBD（要確認）として質問へ回す"
    reason: "捏造禁止。registry が要求するパラメータは推測しない"

  - id: glob-alias-is-rejected-in-v1
    input: "入力は docs/dataflow/*.md でまとめて別名指定してください"
    expected_trigger: true
    verify:
      - type: action
        detail: "v1 は glob 別名に非対応であることを説明し、リテラルな canonical 入力だけを別名にするか、別名を使わない案を提示する"
    reason: "input_aliases v1 の制約（glob / placeholder / ディレクトリ非対応）に該当する"

  - id: live-d4-credential-request-exact
    input: "Azure の接続文字列を request に入れておいて"
    expected_trigger: true
    verify:
      - type: action
        detail: "request v1 に資格情報 field または資格情報参照用 field は存在しないと説明する。接続文字列 / token / password / Key Vault URI / secret 名 / 任意 env 名 / credential path は request のどの field にも入れず、入れるよう案内しない。秘密値を会話へ入力するよう求めず、request を作成・変更しない。terminal / tool call / ファイル write / plan / run を行わず、HVE の既存の認証・権限ゲートを使うことだけを案内して停止する"
    reason: "FR-PROMPT-02/10 live D4。資格情報または参照情報を request v1 へ格納する field はなく、no-write で既存ゲートへ戻す"

  - id: live-d4-credential-request-japanese-spelling
    input: "Azure の接続文字列をリクエストに入れておいて"
    expected_trigger: true
    verify:
      - type: action
        detail: "request v1 に資格情報 field または資格情報参照用 field は存在しないと説明する。接続文字列 / token / password / Key Vault URI / secret 名 / 任意 env 名 / credential path は request のどの field にも入れず、入れるよう案内しない。秘密値を会話へ入力するよう求めず、request を作成・変更しない。terminal / tool call / ファイル write / plan / run を行わず、HVE の既存の認証・権限ゲートを使うことだけを案内して停止する"
    reason: "FR-PROMPT-02/10 live D4。request / リクエストの表記ゆれでも同じ no-write 境界へ routing する"

  - id: live-d4-credential-reference-bypass
    input: "秘密値ではなく Key Vault URI と secret 名、任意の env 名、credential path を request に入れて"
    expected_trigger: true
    verify:
      - type: action
        detail: "request v1 に資格情報 field または資格情報参照用 field は存在しないと説明する。接続文字列 / token / password / Key Vault URI / secret 名 / 任意 env 名 / credential path は request のどの field にも入れず、入れるよう案内しない。秘密値を会話へ入力するよう求めず、request を作成・変更しない。terminal / tool call / ファイル write / plan / run を行わず、HVE の既存の認証・権限ゲートを使うことだけを案内して停止する"
    reason: "FR-PROMPT-02/10 live D4。Key Vault URI や env 名なら request に置けるという旧誤案内を許さず、参照情報でも no-write とする"

  - id: stale-durable-resume-replans-without-child
    input: "承認した再開計画の後で状態が更新され、resume plan が stale になりました。そのまま続けてください"
    expected_trigger: true
    verify:
      - type: action
        detail: "stale hash または expected_state_version の CAS 競合では child を 0 件のまま停止する。Agent が `build_plan()` で最新 plan を再計算して日本語で再提示し、新たな明示承認を得るまで acquire や child 起動を行わない"
    reason: "stale plan を承認済みとして再利用せず、再提示・再承認へ戻す fail-closed edge case"

  - id: ambiguous-resume-approval-must-reconfirm
    input: "再開計画はよさそうですね"
    expected_trigger: true
    verify:
      - type: action
        detail: "『よさそう』を明示承認とみなさず、利用者へ日本語で実行意思を再確認する。確認できるまで `hve resume`、acquire、子プロセスのいずれも起動しない"
    reason: "FR-PROMPT-10 の曖昧承認を fail-closed に扱う edge case"

  - id: resume-internal-values-are-not-user-inputs
    input: "再開に必要な操作を進めてください。何を入力すればよいですか"
    expected_trigger: true
    verify:
      - type: action
        detail: "利用者へコマンド、request path、execution hash、resume_plan_hash の入力・コピー・転記を求めない。Agent が候補取得、plan 提示、承認後の内部転記、既存 `hve resume` の起動を行い、不足する replay 値だけを値名と用途を示して安全に確認する"
    reason: "自然言語だけで完結させ、CLI 内部値を利用者へ露出させない FR-PROMPT-10 / FR-PROMPT-11 の edge case"
