name: Test HVE bootstrap on macOS

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: 実行する bootstrap test scope
        required: true
        default: prerequisites
        type: choice
        options:
          - prerequisites
          - distribution
      runner_label:
        description: 実行する GitHub-hosted macOS runner
        required: true
        default: macos-15
        type: choice
        options:
          - macos-15
          - macos-26
      source_ref:
        description: 事前レビュー済みの branch、tag、または commit SHA
        required: true
        type: string
      estimated_cost_usd:
        description: 実行前に提示・承認された予測課金額（USD）
        required: true
        type: string
      cost_approved:
        description: 提示された費用見積りに対する今回1回限りの承認
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  gate:
    name: Reject unapproved or rerun requests
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Validate dispatch approval
        shell: bash
        env:
          TEST_SCOPE: ${{ inputs.test_scope }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          SOURCE_REF: ${{ inputs.source_ref }}
          ESTIMATED_COST_USD: ${{ inputs.estimated_cost_usd }}
          COST_APPROVED: ${{ inputs.cost_approved }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -eu
          case "$TEST_SCOPE" in prerequisites|distribution) ;; *) exit 2 ;; esac
          case "$RUNNER_LABEL" in macos-15|macos-26) ;; *) exit 2 ;; esac
          test -n "$SOURCE_REF"
          printf '%s' "$SOURCE_REF" | grep -Eq '^[0-9a-f]{40}$'
          test -n "$ESTIMATED_COST_USD"
          test "$COST_APPROVED" = "true"
          test "$RUN_ATTEMPT" = "1"

  prerequisites:
    name: Inspect fixed macOS prerequisites
    needs: gate
    if: >-
      inputs.test_scope == 'prerequisites' &&
      inputs.cost_approved &&
      inputs.estimated_cost_usd != '' &&
      inputs.source_ref != '' &&
      github.run_attempt == 1
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Record approved source and runner facts
        shell: bash
        env:
          HVE_RUNNER_LABEL: ${{ inputs.runner_label }}
          HVE_SOURCE_REF: ${{ inputs.source_ref }}
        run: bash .github/scripts/bash/probe-hve-bootstrap-macos.sh

      - name: Upload prerequisite facts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hve-bootstrap-prerequisites-${{ inputs.runner_label }}
          path: ${{ runner.temp }}/hve-bootstrap-prerequisites/runner-facts.txt
          retention-days: 7
          if-no-files-found: error

  distribution:
    name: Validate macOS distribution artifact
    needs: gate
    if: >-
      inputs.test_scope == 'distribution' &&
      inputs.cost_approved &&
      inputs.estimated_cost_usd != '' &&
      inputs.source_ref != '' &&
      github.run_attempt == 1
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Build macOS distribution artifact
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/hve-bootstrap-distribution"
          python3 .github/scripts/build-hve-bootstrap.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --target macos-arm64 \
            --output-dir "$RUNNER_TEMP/hve-bootstrap-distribution"

      - name: Validate archive and source isolation
        shell: bash
        env:
          HVE_DIST_DIR: ${{ runner.temp }}/hve-bootstrap-distribution
        run: |
          set -eu
          python3 - <<'PY'
          import hashlib
          import pathlib
          import zipfile
          root = pathlib.Path(__import__("os").environ["HVE_DIST_DIR"])
          archives = sorted(root.glob("*.zip"))
          assert len(archives) == 1, f"expected exactly one ZIP, found {len(archives)}"
          archive = archives[0]
          digest = archive.with_suffix(archive.suffix + ".sha256").read_text().strip()
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == digest
          with zipfile.ZipFile(archive) as zf:
              names = set(zf.namelist())
              assert "Start-HVE.command" in names
              assert not any(name.startswith(prefix) for prefix in (".git/", ".venv/", "work/", "src/", "docs/", ".github/workflows/", ".github/ISSUE_TEMPLATE/"))
          PY

      - name: Upload distribution artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hve-bootstrap-distribution-${{ inputs.runner_label }}
          path: ${{ runner.temp }}/hve-bootstrap-distribution/
          retention-days: 7
          if-no-files-found: error
