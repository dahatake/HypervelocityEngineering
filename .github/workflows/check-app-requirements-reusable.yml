name: APP Requirement Preflight

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: string
      workflow_id:
        required: true
        type: string
      mode:
        required: false
        type: string
        default: ''
      runner_type:
        required: false
        type: string
        default: "github-hosted"

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  validate:
    runs-on: ${{ fromJSON(inputs.runner_type == 'self-hosted' && '["self-hosted","linux","x64","aca"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      WORKFLOW_ID: ${{ inputs.workflow_id }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Resolve validation subject
        id: context
        run: |
          set -euo pipefail
          issue_json=$(gh api "/repos/${REPO}/issues/${ISSUE_NUMBER}")
          printf '%s' "${issue_json}" | jq -j '.body // ""' > "${RUNNER_TEMP}/app-requirement-issue-body.md"
          printf '%s' "${issue_json}" | jq -j '.title // ""' > "${RUNNER_TEMP}/app-requirement-issue-title.txt"
          : > "${RUNNER_TEMP}/app-requirement-pr-body.md"
          branch=$(python3 - "${RUNNER_TEMP}/app-requirement-issue-body.md" <<'PY'
          import re
          import sys
          from pathlib import Path

          body = Path(sys.argv[1]).read_text(encoding="utf-8")
          match = re.search(r"<!--\s*branch:\s*([^>]+?)\s*-->", body)
          if not match:
              match = re.search(r"###\s*対象ブランチ\s*\n+([^\n]+)", body)
          branch = match.group(1).strip() if match else "main"
          if branch == "_No response_":
              branch = "main"
          if (
              not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._/-]*", branch)
              or ".." in branch
              or branch.endswith("/")
          ):
              raise SystemExit(f"invalid target branch: {branch!r}")
          print(branch)
          PY
          )
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

          subject_ref="${branch}"
          completion_pr_number=""
          if [[ "${MODE}" == "state_transition" || "${MODE}" == "closed" ]]; then
            candidate_pr_number=$(gh api --paginate "/repos/${REPO}/issues/${ISSUE_NUMBER}/timeline?per_page=100" \
              --jq '.[] | select(.event == "cross-referenced" and .source.type == "pull_request") | [.created_at, .source.issue.number] | @tsv' \
              2>/dev/null | sort | tail -n 1 | cut -f 2 || true)
            if [[ "${candidate_pr_number}" =~ ^[1-9][0-9]*$ ]]; then
              pr_json=$(gh api "/repos/${REPO}/pulls/${candidate_pr_number}" 2>/dev/null || true)
              head_sha=$(printf '%s' "${pr_json}" | jq -r '.head.sha // ""' 2>/dev/null || true)
              if [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                subject_ref="${head_sha}"
                completion_pr_number="${candidate_pr_number}"
                printf '%s' "${pr_json}" | jq -j '.body // ""' \
                  > "${RUNNER_TEMP}/app-requirement-pr-body.md"
              fi
            fi
          fi
          echo "subject_ref=${subject_ref}" >> "${GITHUB_OUTPUT}"
          echo "completion_pr_number=${completion_pr_number}" >> "${GITHUB_OUTPUT}"

      - name: Checkout trusted validator
        uses: actions/checkout@v4
        with:
          path: trusted

      - name: Checkout validation subject as data
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.subject_ref }}
          path: subject
          persist-credentials: false

      - name: Validate APP requirement scope
        id: validate
        continue-on-error: true
        run: |
          set -euo pipefail
          evidence_dir="work/run/cloud-appreq-${GITHUB_RUN_ID}/Issue-${ISSUE_NUMBER}/artifacts"
          mkdir -p "${evidence_dir}"
          export ISSUE_BODY_FILE="${RUNNER_TEMP}/app-requirement-issue-body.md"
          export ISSUE_TITLE_FILE="${RUNNER_TEMP}/app-requirement-issue-title.txt"
          export PR_BODY_FILE="${RUNNER_TEMP}/app-requirement-pr-body.md"
          export COMPLETION_PR_NUMBER="${{ steps.context.outputs.completion_pr_number }}"
          python3 -I - <<'PY' 2>&1 | tee "${evidence_dir}/preflight.log"
          import os
          import re
          import sys
          from pathlib import Path

          trusted_root = Path(os.environ["GITHUB_WORKSPACE"]) / "trusted"
          subject_root = Path(os.environ["GITHUB_WORKSPACE"]) / "subject"
          # Validator code is imported only from the trusted checkout. The
          # subject checkout is treated strictly as data from the target/PR ref.
          sys.path.insert(0, str(trusted_root))

          from hve.app_arch_filter import resolve_app_arch_scope
          from hve.application_requirements import (
              build_application_requirement_context,
              extract_application_requirement_app_ids,
              resolve_application_requirement_app_ids,
              validate_application_requirement_trace_block,
              validate_requirement_coverage,
          )
          from hve.workflow_registry import get_workflow

          body = Path(os.environ["ISSUE_BODY_FILE"]).read_text(encoding="utf-8")
          title = Path(os.environ["ISSUE_TITLE_FILE"]).read_text(encoding="utf-8")
          workflow_id = os.environ["WORKFLOW_ID"].lower()
          completion_mode = os.environ.get("MODE") in {"state_transition", "closed"}
          step_match = re.match(r"^\[[^]]+\]\s+Step\.([0-9A-Z.]+):", title)

          if workflow_id == "ard":
              if not completion_mode or not re.match(r"^\[ARD\]\s+Step\.4\.2:", title):
                  print("APP_REQUIREMENT_COMPLETION_NA workflow=ard")
                  raise SystemExit(0)
              if not os.environ.get("COMPLETION_PR_NUMBER"):
                  raise SystemExit("ARD Step 4.2 completion PR is missing")
              coverage = validate_requirement_coverage(subject_root)
              for orphan in coverage.orphan_paths:
                  print(f"WARNING: orphan preserved: {orphan.as_posix()}")
              if coverage.errors:
                  for error in coverage.errors:
                      print(f"ERROR: {error}")
                  raise SystemExit(1)
              print(f"APP_REQUIREMENT_COVERAGE_PASS apps={len(coverage.app_ids)}")
              raise SystemExit(0)

          selected = extract_application_requirement_app_ids(body)
          if selected and workflow_id in {"aad-web", "asdw-web", "adfd", "adfdv"}:
              filtered = resolve_app_arch_scope(
                  workflow_id=workflow_id,
                  requested_app_ids=list(selected),
                  catalog_path=str(subject_root / "docs/catalog/app-arch-catalog.md"),
                  dry_run=False,
              )
              selected = tuple(filtered.matched_app_ids)
              if not selected:
                  print("APP_REQUIREMENT_PREFLIGHT_NA effective_apps=0")
                  raise SystemExit(0)

          params = {"app_ids": selected}
          app_ids = resolve_application_requirement_app_ids(
              workflow_id=workflow_id,
              workflow_params=params,
              fanout_meta=None,
              repo_root=subject_root,
          )
          print(build_application_requirement_context(
              workflow_id=workflow_id,
              workflow_params=params,
              fanout_meta=None,
              repo_root=subject_root,
          ))
          if completion_mode and step_match:
              workflow = get_workflow(workflow_id)
              if workflow is None:
                  raise SystemExit(f"unknown workflow: {workflow_id}")
              step = workflow.get_step(step_match.group(1))
              if step is None:
                  raise SystemExit(
                      f"unknown Cloud Step: workflow={workflow_id}, "
                      f"step={step_match.group(1)}"
                  )
              if not step.is_container:
                  if not os.environ.get("COMPLETION_PR_NUMBER"):
                      raise SystemExit("completion PR is missing")
                  pr_body = Path(os.environ["PR_BODY_FILE"]).read_text(
                      encoding="utf-8"
                  )
                  errors = validate_application_requirement_trace_block(
                      pr_body,
                      repo_root=subject_root,
                      expected_app_ids=app_ids,
                  )
                  if errors:
                      for error in errors:
                          print(f"ERROR: {error}")
                      raise SystemExit(1)
          print(f"APP_REQUIREMENT_PREFLIGHT_PASS apps={len(app_ids)}")
          PY

      - name: Mark workflow blocked
        if: steps.validate.outcome != 'success'
        run: |
          set -euo pipefail
          prefix=$(printf '%s' "${WORKFLOW_ID}" | tr '[:upper:]' '[:lower:]')
          label="${prefix}:blocked"
          gh label create "${label}" --repo "${REPO}" --color D73A4A \
            --description "APP requirement preflight blocked" 2>/dev/null || true
          for stale_label in \
            "${prefix}:ready" "${prefix}:running" "${prefix}:done" \
            "${prefix}:qa-ready" "${prefix}:qa-drafting"; do
            gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" \
              --remove-label "${stale_label}" >/dev/null 2>&1 || true
          done
          gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --add-label "${label}"
          comment_file="${RUNNER_TEMP}/app-requirement-preflight-failed.md"
          cat > "${comment_file}" <<'EOF'
          ## ⛔ APP要求preflight failed

          対象ブランチ上で、実効APPスコープに対応する要求定義書の存在・schema・未解決Blocker、または完了traceを検証できませんでした。詳細はActions logを確認し、ARD Step 4.1 / 4.2またはPR本文を修正して再実行してください。

          <!-- app-requirement-preflight-failed -->
          EOF
          existing=$(gh api --paginate "/repos/${REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            --jq '[.[] | select((.body // "") | contains("<!-- app-requirement-preflight-failed -->"))] | length' \
            2>/dev/null | awk '{total += $1} END {print total + 0}')
          if [[ "${existing}" -eq 0 ]]; then
            gh issue comment "${ISSUE_NUMBER}" --repo "${REPO}" --body-file "${comment_file}"
          fi
          exit 1
