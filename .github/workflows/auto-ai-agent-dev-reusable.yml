name: "AAGD: AI Agent Dev & Deploy (Reusable)"

# auto-ai-agent-dev ラベル付き Issue の opened/labeled/closed イベントで起動
#
# 設計メモ:
#   - Issue Template の labels: でラベルを付与した場合、GitHub は issues.labeled イベントを
#     発火せず issues.opened のみを発火する（GitHub Community Discussion #26753）。
#   - そのため opened イベントも監視し、ジョブレベル if で対象ラベルを持つ Issue のみ実行する。
#   - opened イベント時は github.event.label が null のため LABEL_NAME は空文字列になる。
#   - 既存の冪等化ガード（aagd:initialized チェック）により、opened + labeled が同時発火しても安全。
on:
  workflow_call:
    inputs:
      mode:
        required: false
        type: string
        default: ''
      issue_number:
        required: true
        type: string
      event_action:
        required: false
        type: string
        default: ''
      label_name:
        required: false
        type: string
        default: ''
      issue_labels:
        required: false
        type: string
        default: '[]'
      runner_type:
        description: "実行 Runner 種別: github-hosted | self-hosted"
        required: false
        type: string
        default: "github-hosted"

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  check_qa_skip:
    uses: ./.github/workflows/check-auto-qa-skip-reusable.yml
    with:
      issue_number: ${{ fromJSON(inputs.issue_number) }}
      issue_labels: ${{ inputs.issue_labels }}
      issue_body: ''
    secrets: inherit

  orchestrate:
    needs: check_qa_skip
    runs-on: ${{ fromJSON(inputs.runner_type == 'self-hosted' && '["self-hosted","linux","x64","aca"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 360
    # AAG/AAGD共有のrepository-wide FIFO。イベント発生順そのものは保証せず、
    # Cloud state mutationと同一branchへのSelf-Improve pushを完全直列化する。
    concurrency:
      group: ai-agent-root-state-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
      REPO: ${{ github.repository }}
      SKIP_AUTO_QA: ${{ needs.check_qa_skip.outputs.skip_auto_qa }}
      SKIP_AUTO_QA_REASON: ${{ needs.check_qa_skip.outputs.skip_reason }}

    steps:
      # ----------------------------------------------------------------
      # 1. 実行ゲート: auto-ai-agent-dev ラベルあり + aagd:initialized なし
      # ----------------------------------------------------------------
      - name: 実行ゲートチェック
        id: gate
        env:
          ISSUE_LABELS: ${{ inputs.issue_labels }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EVENT_ACTION: ${{ inputs.event_action }}
          LABEL_NAME: "${{ inputs.label_name }}"
        run: |
          set -euo pipefail

          # Issue title を API 経由で安全に取得（YAML 展開問題を回避）
          ISSUE_TITLE=$(curl -sf \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('title',''))")
          export ISSUE_TITLE

          # labeled イベントの処理
          if [[ "${EVENT_ACTION}" == "labeled" ]]; then
            if [[ "${LABEL_NAME}" == "aagd:done" ]]; then
              echo "mode=state_transition" >> "$GITHUB_OUTPUT"
              echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
              exit 0
            elif [[ "${LABEL_NAME}" == "auto-ai-agent-dev" ]]; then
              # auto-ai-agent-dev ラベルが後から付与された場合:
              # 下の has_asdw / has_init チェックが未初期化かどうかを判定し、未初期化なら initialize に進む。
              # 既に aagd:initialized 済みの場合は has_init チェックで skip になる。
              echo "auto-ai-agent-dev ラベルの labeled イベント: initialize ゲートチェックへ進みます。"
            else
              echo "aagd:done / auto-ai-agent-dev 系以外の labeled イベント（${LABEL_NAME}）。スキップ。"
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # closed イベントの処理
          if [[ "${EVENT_ACTION}" == "closed" ]]; then
            # [AAGD] Sub Issue のみ処理
            if [[ "${ISSUE_TITLE}" =~ ^\[AAGD\] ]]; then
              # ---- ラベル一覧はイベントペイロードのものを使用（API 呼び出しを削減） ----
              # 既に aagd:done がついている場合は closed イベントで再判定に進む
              has_done=$(echo "${ISSUE_LABELS}" | python3 /dev/fd/3 3<<'PY'
          import sys, json
          labels = json.load(sys.stdin)
          print('true' if 'aagd:done' in labels else 'false')
          PY
              )
              if [[ "${has_done}" == "true" ]]; then
                # aagd:done labeled 時は Issue 未クローズのため自動クローズ判定が失敗する。
                # closed イベントで再度コンテナ自動クローズ判定のみ実行する。
                echo "aagd:done ラベル済み + closed イベント: コンテナ自動クローズ判定のみ実行。"
                echo "mode=container_close_check" >> "$GITHUB_OUTPUT"
                echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # aagd:done がない場合は closed イベントから直接 state_transition を起動
              echo "mode=state_transition" >> "$GITHUB_OUTPUT"
              echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "closed イベント: [AAGD] Sub Issue 以外のためスキップ。"
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # [AAGD] プレフィックスを持つ Sub Issue は初期化をスキップ
          # （Sub Issue の opened イベントによる再帰的な初期化を防止）
          if [[ "${ISSUE_TITLE}" =~ ^\[AAGD\] ]]; then
            echo "[AAGD] Sub Issue のため初期化対象外。スキップ。"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---- リアルタイムにラベル一覧を API 経由で取得（payload はスナップショットのため） ----
          ISSUE_LABELS=$(curl -sf \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}" \
            | python3 -c "import sys,json; print(json.dumps([l['name'] for l in json.load(sys.stdin).get('labels',[])]))")
          echo "リアルタイムラベル: ${ISSUE_LABELS}"
          # auto-ai-agent-dev ラベルを持つか確認
          has_asdw=$(echo "${ISSUE_LABELS}" | python3 /dev/fd/3 3<<'PY'
          import sys, json
          labels = json.load(sys.stdin)
          triggers = {'auto-ai-agent-dev'}
          print('true' if any(l in triggers for l in labels) else 'false')
          PY
          )

          if [[ "${has_asdw}" != "true" ]]; then
            echo "auto-ai-agent-dev ラベルなし。スキップ。"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # aagd:initialized / aagd:ready / aagd:running / aagd:done / aagd:blocked
          # のいずれかを持つ場合はスキップ（冪等化・Sub Issue への誤再初期化防止）
          has_init=$(echo "${ISSUE_LABELS}" | python3 /dev/fd/3 3<<'PY'
          import sys, json
          labels = json.load(sys.stdin)
          skip_labels = {'aagd:initialized', 'aagd:ready', 'aagd:running', 'aagd:done', 'aagd:blocked', 'aagd:qa-ready', 'aagd:self-improve-ready'}
          print('true' if any(l in skip_labels for l in labels) else 'false')
          PY
          )

          if [[ "${has_init}" == "true" ]]; then
            echo "aagd:* ラベル済み。スキップ（冪等化）。"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "mode=initialize" >> "$GITHUB_OUTPUT"
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: ゲート結果のデバッグ出力
        if: always()
        env:
          GATE_MODE: ${{ steps.gate.outputs.mode }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EVENT_ACTION: ${{ inputs.event_action }}
        run: |
          echo "::notice::ゲート判定結果: mode=${GATE_MODE}, event=${EVENT_ACTION}, issue=#${ISSUE_NUMBER}"
          if [[ "${GATE_MODE}" == "skip" ]]; then
            echo "::notice::Issue #${ISSUE_NUMBER} のゲートチェックは skip でした（event: ${EVENT_ACTION}）"
          fi

      # ----------------------------------------------------------------
      # 2. ラベル bootstrap
      # ----------------------------------------------------------------
      - name: ラベル bootstrap
        if: steps.gate.outputs.mode == 'initialize'
        run: |
          set -euo pipefail

          # ラベル作成関数（インライン定義: checkout 前でも動作可能にするため）
          create_label() {
            local name="$1" color="$2" desc="${3:-}"
            local http_code
            http_code=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/labels" \
              -d "{\"name\":\"${name}\",\"color\":\"${color}\",\"description\":\"${desc}\"}")
            case "${http_code}" in
              201) echo "ラベル作成: ${name}" ;;
              422) echo "ラベル既存（スキップ）: ${name}" ;;
              *)   echo "ラベル作成エラー: ${name} HTTP ${http_code}" ;;
            esac
            sleep 1
          }

          create_label "auto-ai-agent-dev" "6A5ACD" "AI Agent Dev & Deploy ワークフロートリガー"
          create_label "aagd:initialized"           "C5DEF5" ""
          create_label "aagd:ready"                 "0075CA" ""
          create_label "aagd:running"               "E4E669" ""
          create_label "aagd:done"                  "0E8A16" ""
          create_label "aagd:blocked"               "D73A4A" ""
          create_label "aagd:test-failed"           "EE0701" "test execution failed (TDD RED not confirmed or GREEN not reached)"
          create_label "aagd:self-improve-ready"    "FBCA04" "AAGD DAG完了・Post-DAG Self-Improve待ち"
          create_label "adversarial-review"       "B60205" "explicit adversarial review trigger for Copilot review workflow"
          create_label "auto-qa"                    "BFD4F2" "auto QA trigger for copilot-auto-qa workflow"
          create_label "auto-approve-ready"          "1D76DB" "trigger auto-approve and auto-merge for PR (added by orchestrators when auto-merge is enabled)"

      # ----------------------------------------------------------------
      # 2.5. 即時 aagd:initialized 付与（二重実行防止）
      # ----------------------------------------------------------------
      - name: 即時 aagd:initialized 付与（二重実行防止）
        if: steps.gate.outputs.mode == 'initialize'
        env:
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
        run: |
          set -euo pipefail
          max_retries=5
          attempt=1
          http_code=""
          while (( attempt <= max_retries )); do
            http_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}/labels" \
              -d '{"labels":["aagd:initialized"]}')
            if [[ "${http_code}" =~ ^2 ]]; then
              echo "aagd:initialized を Issue #${ISSUE_NUMBER} に付与しました。（HTTP ${http_code}）"
              break
            fi
            if (( attempt == max_retries )); then
              echo "ERROR: aagd:initialized の付与に失敗しました。HTTP ${http_code}（試行回数: ${attempt}/${max_retries}）" >&2
              exit 1
            fi
            echo "WARN: aagd:initialized の付与に失敗しました。HTTP ${http_code}（試行回数: ${attempt}/${max_retries}）。リトライします..." >&2
            sleep $(( 2 ** (attempt - 1) ))
            attempt=$(( attempt + 1 ))
          done

      # ----------------------------------------------------------------
      # 2.6. リポジトリ checkout（state_transition で auto-close.sh を利用するため）
      # ----------------------------------------------------------------
      - name: Checkout repository
        if: steps.gate.outputs.mode != 'skip'
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 3. Issue body パース & Step Issue 生成
      # ----------------------------------------------------------------
      - name: 成果物ディレクトリの事前作成
        if: steps.gate.outputs.mode == 'initialize'
        run: |
          # 成果物ディレクトリの事前作成
          mkdir -p docs/catalog
          mkdir -p docs/dataflow
          mkdir -p docs/dataflow/apps
          mkdir -p docs/services
          mkdir -p docs/screen
          mkdir -p docs/test-specs
          mkdir -p docs/agent
          mkdir -p docs/azure
          mkdir -p docs/usecase

      - name: Issue 初期化とStep Issue 生成
        if: steps.gate.outputs.mode == 'initialize'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
        run: |
          set -euo pipefail

          # Issue body を API 経由で安全に取得（YAML 展開問題を回避）
          ISSUE_BODY=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('body',''))")
          export ISSUE_BODY

          if [[ -z "${COPILOT_PAT}" ]]; then
            echo "WARNING: COPILOT_PAT が設定されていません。Copilot アサインは全てスキップされます。" >&2
          fi

          ROOT_ISSUE="${ISSUE_NUMBER}"

          # ---- ユーティリティ関数 ----

          # リトライ付き curl
          api_call() {
            local method="$1"; shift
            local url="$1"; shift
            local data="${1:-}"
            local max_retry=5
            local wait=1
            local http_code response body

            for i in $(seq 1 "${max_retry}"); do
              if [[ -n "${data}" ]]; then
                response=$(curl -s -w "\n%{http_code}" \
                  -X "${method}" \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  -H "Content-Type: application/json" \
                  "${url}" \
                  -d "${data}")
              else
                response=$(curl -s -w "\n%{http_code}" \
                  -X "${method}" \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "${url}")
              fi
              http_code=$(echo "${response}" | tail -1)
              body=$(echo "${response}" | head -n -1)
              if [[ "${http_code}" =~ ^2 ]]; then
                echo "${body}"
                return 0
              fi
              echo "API エラー: HTTP ${http_code}、${wait}秒後にリトライ (${i}/${max_retry})" >&2
              sleep "${wait}"
              wait=$((wait * 2))
            done
            echo "API 呼び出し失敗: ${method} ${url}" >&2
            return 1
          }

          # Issue 作成
          create_issue() {
            local title="$1"
            local body="$2"
            local labels_json="$3"
            local data
            data=$(python3 - "${title}" "${body}" "${labels_json}" <<'PY'
          import json, re, sys
          from pathlib import Path
          title = sys.argv[1]
          body  = sys.argv[2]
          labels = json.loads(sys.argv[3])
          _m = re.search(r'## Custom Agent\s*\n\s*`([^`]+)`', body)
          if _m:
              _agent = _m.group(1).strip()
              _path = Path('.github/prompts') / f'{_agent}.prompt.md'
              if _path.is_file():
                  body = body + '\n\n## エージェント指示（Prompt）\n\n' + _path.read_text(encoding='utf-8')
          print(json.dumps({'title': title, 'body': body, 'labels': labels}))
          PY
          )
            api_call POST "https://api.github.com/repos/${REPO}/issues" "${data}"
          }

          # Sub Issue 紐付け
          link_sub_issue() {
            local parent_num="$1"
            local child_id="$2"
            local data="{\"sub_issue_id\":${child_id}}"
            api_call POST \
              "https://api.github.com/repos/${REPO}/issues/${parent_num}/sub_issues" \
              "${data}" || true
            sleep 1
          }

          # ラベル付与
          add_label() {
            local issue_num="$1"
            local label="$2"
            api_call POST \
              "https://api.github.com/repos/${REPO}/issues/${issue_num}/labels" \
              "{\"labels\":[\"${label}\"]}" > /dev/null
            sleep 1
          }

          # アサイン
          source "${GITHUB_WORKSPACE}/.github/scripts/bash/lib/assign-copilot.sh"

          # コメント投稿
          post_comment() {
            local issue_num="$1"
            local comment_body="$2"
            local data
            data=$(python3 -c "import sys,json; print(json.dumps({'body': sys.argv[1]}))" "${comment_body}")
            api_call POST \
              "https://api.github.com/repos/${REPO}/issues/${issue_num}/comments" \
              "${data}" > /dev/null
            sleep 1
          }

          # Issue body から Custom Agent 名を抽出
          extract_custom_agent() {
            local body="$1"
            echo "${body}" | python3 /dev/fd/3 3<<'PY'
          import sys, re
          body = sys.stdin.read()
          m = re.search(r'## Custom Agent\s*\n\s*`([^`]+)`', body)
          print(m.group(1) if m else '')
          PY
          }

          # ---- Issue body パース ----
          PARSED=$(python3 - <<'PYEOF'
          import sys, os, re, json

          body = os.environ.get("ISSUE_BODY", "")

          # ブランチ名抽出（input フォームの値）
          branch = "main"
          m = re.search(r"###\s*対象ブランチ\s*\n+(.+)", body)
          if m:
              branch = m.group(1).strip()
              if not branch or branch == "_No response_":
                  branch = "main"

          # リソースグループ名抽出
          resource_group = ""
          m = re.search(r"###\s*リソースグループ名\s*\n+(.+)", body)
          if m:
              resource_group = m.group(1).strip()
              if resource_group == "_No response_":
                  resource_group = ""

          # 実行するステップからスキップ対象を検出
          skip_steps = set()
          exec_section = re.search(
              r"###\s*実行するステップ\s*\n(.*?)(?=###|\Z)",
              body, re.DOTALL
          )
          if exec_section:
              section_text = exec_section.group(1)
              all_items = re.findall(
                  r"-\s*\[[ xX]\]\s*Step\.(\d+)",
                  section_text
              )
              all_steps = set(all_items)
              checked_items = re.findall(
                  r"-\s*\[[xX]\]\s*Step\.(\d+)",
                  section_text
              )
              exec_steps = set(checked_items)
              skip_steps = all_steps - exec_steps
              # チェックが1つもない場合は「全ステップ実行」とみなしてスキップなし
              if not exec_steps and all_steps:
                  skip_steps = set()

          # 追加コメント抽出
          additional_comment = ""
          m = re.search(r"###\s*追加コメント[^\n]*\n+(.*?)(?=###|\Z)", body, re.DOTALL)
          if m:
              additional_comment = m.group(1).strip()
              if additional_comment == "_No response_":
                  additional_comment = ""

          # ユースケースID抽出
          usecase_id = ""
          m = re.search(r"###\s*ユースケースID\s*\n+(.+)", body)
          if m:
              usecase_id = m.group(1).strip()
              if usecase_id == "_No response_":
                  usecase_id = ""

          # レビュー設定: チェック [x] → 有効 (True)、未チェック → 無効 (False)
          # 後方互換: 旧形式「スキップする」はロジック反転（未チェック → 有効）
          adversarial_review = False
          review_section = re.search(
              r"###\s*レビュー設定\s*\n(.*?)(?=###|\Z)",
              body, re.DOTALL
          )
          if review_section:
              section_text = review_section.group(1)
              if re.search(r"スキップする", section_text):
                  # 旧形式（後方互換）: 未チェック = スキップしない = 有効
                  adversarial_review = not bool(re.search(r"-\s*\[[xX]\]", section_text))
              else:
                  # 新形式: チェック → 有効
                  adversarial_review = bool(re.search(r"-\s*\[[xX]\]", section_text))

          # 質問票設定: チェック [x] → 有効 (True)、未チェック → 無効 (False)
          # 後方互換: 旧形式「スキップする」はロジック反転（未チェック → 有効）
          auto_qa = False
          qa_section = re.search(
              r"###\s*質問票設定\s*\n(.*?)(?=###|\Z)",
              body, re.DOTALL
          )
          if qa_section:
              section_text = qa_section.group(1)
              if re.search(r"スキップする", section_text):
                  # 旧形式（後方互換）: 未チェック = スキップしない = 有効
                  auto_qa = not bool(re.search(r"-\s*\[[xX]\]", section_text))
              else:
                  # 新形式: チェック → 有効
                  auto_qa = bool(re.search(r"-\s*\[[xX]\]", section_text))

          # PR完全自動化設定: チェック [x] → 有効 (True)、未チェック → 無効 (False)
          auto_merge = False
          merge_section = re.search(
              r"###\s*PR完全自動化設定\s*\n(.*?)(?=###|\Z)",
              body, re.DOTALL
          )
          if merge_section:
              section_text = merge_section.group(1)
              auto_merge = bool(re.search(r"-\s*\[[xX]\]", section_text) or re.search(r"^\s*有効にする\s*$", section_text, re.MULTILINE))

          # APP-ID 抽出（複数 APP-ID に対応：カンマ区切りで分割・正規化）
          app_ids_raw = ""
          m = re.search(r"###\s*対象アプリケーション.*?\n+(.+)", body)
          if m:
              app_ids_raw = m.group(1).strip()
              if app_ids_raw == "_No response_":
                  app_ids_raw = ""

          # カンマ区切りで分割し、空要素を除去
          app_ids_list = [s.strip() for s in app_ids_raw.split(",") if s.strip()] if app_ids_raw else []
          # 後方互換: 単一 APP-ID の場合は app_id にも設定
          app_id = app_ids_list[0] if len(app_ids_list) == 1 else ""

          # TDD GREEN リトライ最大回数
          tdd_max_retries = "5"
          m_tdd = re.search(r"###\s*TDD GREEN リトライ最大回数\s*\n+([^\n]+)", body)
          if m_tdd:
              raw_tdd = m_tdd.group(1).strip()
              nm_tdd = re.search(r'\d+', raw_tdd)
              tdd_max_retries = nm_tdd.group() if nm_tdd else "5"

          self_improve_max_iterations = "3"
          m = re.search(r"###\s*自己改善\s*最大イテレーション数.*?\n+(.+)", body)
          if m:
              val = m.group(1).strip()
              n = re.match(r"(\d+)", val)
              if n:
                  self_improve_max_iterations = n.group(1)

          self_improve_quality_threshold = "80"
          q = re.search(r"###\s*自己改善\s*品質スコア(?:目標値|閾値).*?\n+(.+)", body)
          if q:
              val = q.group(1).strip()
              n = re.match(r"(\d+)", val)
              if n:
                  self_improve_quality_threshold = n.group(1)

          tool_search_policy = "auto"
          t = re.search(r"###\s*生成する\s*AI Agent\s*の\s*Tool Search\s*方針[^\n]*\n+(.+)", body)
          if t:
              val = t.group(1).strip()
              if val and val != "_No response_":
                  tool_search_policy = re.split(r"[（(\s]", val, 1)[0].strip().lower()

          result = {"branch": branch, "resource_group": resource_group, "skip_steps": list(skip_steps), "additional_comment": additional_comment, "usecase_id": usecase_id, "adversarial_review": adversarial_review, "auto_qa": auto_qa, "auto_merge": auto_merge, "app_ids": app_ids_list, "app_id": app_id, "tdd_max_retries": tdd_max_retries, "self_improve_max_iterations": self_improve_max_iterations, "self_improve_quality_threshold": self_improve_quality_threshold, "tool_search_policy": tool_search_policy}
          print(json.dumps(result))
          PYEOF
          )

          BRANCH=$(echo "${PARSED}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['branch'])")
          RESOURCE_GROUP=$(echo "${PARSED}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['resource_group'])")
          SKIP_STEPS=$(echo "${PARSED}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join(d['skip_steps']))")
          ADDITIONAL_COMMENT=$(echo "${PARSED}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['additional_comment'])")
          USECASE_ID=$(echo "${PARSED}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('usecase_id',''))")
          ADVERSARIAL_REVIEW=$(echo "${PARSED}" | python3 -c "import sys,json; d=json.load(sys.stdin); print('true' if d.get('adversarial_review') else 'false')")
          AUTO_QA=$(echo "${PARSED}" | python3 -c "import sys,json; d=json.load(sys.stdin); print('true' if d.get('auto_qa') else 'false')")
          if [[ "${AUTO_QA}" == "true" && "${SKIP_AUTO_QA}" == "true" ]]; then
            echo "既存 QA 検知により AUTO_QA を false に上書きします: ${SKIP_AUTO_QA_REASON}"
            AUTO_QA="false"
          fi
          AUTO_MERGE=$(echo "${PARSED}" | python3 -c "import sys,json; d=json.load(sys.stdin); print('true' if d.get('auto_merge') else 'false')")
          SELF_IMPROVE_MAX_ITER=$(echo "${PARSED}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('self_improve_max_iterations','3'))")
          SELF_IMPROVE_QUALITY_THRESHOLD=$(echo "${PARSED}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('self_improve_quality_threshold','80'))")
          TOOL_SEARCH_POLICY=$(echo "${PARSED}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('tool_search_policy','auto'))")
          case "${TOOL_SEARCH_POLICY}" in
            auto|yes|no) ;;
            *)
              echo "::error::Invalid tool search policy: ${TOOL_SEARCH_POLICY}" >&2
              exit 1
              ;;
          esac
          MODEL_RAW=$(extract_model "${ISSUE_BODY}")
          SELECTED_MODEL=$(resolve_model "${MODEL_RAW}")
          REVIEW_MODEL_RAW=$(extract_review_model "${ISSUE_BODY}")
          SELECTED_REVIEW_MODEL=$(resolve_model "${REVIEW_MODEL_RAW}")
          QA_MODEL_RAW=$(extract_qa_model "${ISSUE_BODY}")
          SELECTED_QA_MODEL=$(resolve_model "${QA_MODEL_RAW}")
          APP_IDS_JSON=$(echo "${PARSED}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get('app_ids',[])))")
          APP_IDS=$(echo "${PARSED}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(', '.join(d.get('app_ids',[])))")
          APP_ID=$(echo "${PARSED}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('app_id',''))")
          TDD_MAX_RETRIES=$(echo "${PARSED}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('tdd_max_retries','5'))")
          [[ -z "${TDD_MAX_RETRIES}" ]] && TDD_MAX_RETRIES="5"

          echo "対象ブランチ: ${BRANCH}"
          echo "リソースグループ名: ${RESOURCE_GROUP}"
          echo "スキップ Steps: ${SKIP_STEPS}"
          echo "ユースケースID: ${USECASE_ID}"
          echo "対象 APP-IDs: ${APP_IDS:-（未指定 = 全アプリケーション対象）}"
          echo "敵対的レビュー (adversarial-review): ${ADVERSARIAL_REVIEW}"
          echo "質問票 (auto-qa): ${AUTO_QA}"
          echo "PR完全自動化 (auto-merge): ${AUTO_MERGE}"

          # ---- ROOT_REF（リソースグループメタコメント含む）----
          ROOT_REF=$(printf '<!-- root-issue: #%s -->\n<!-- branch: %s -->\n<!-- resource-group: %s -->' \
            "${ROOT_ISSUE}" "${BRANCH}" "${RESOURCE_GROUP}")
          if [[ -n "${APP_IDS}" ]]; then
            ROOT_REF+=$(printf '\n<!-- app-ids: %s -->' "${APP_IDS}")
          fi
          ROOT_REF+=$(printf '\n<!-- adversarial-review: %s -->\n<!-- auto-qa: %s -->\n<!-- auto-merge: %s -->' \
            "${ADVERSARIAL_REVIEW}" "${AUTO_QA}" "${AUTO_MERGE}")

          # 追加コンテキスト参照セクション（QA/Review 反映ルール — Phase 3 追加）
          QA_REVIEW_SECTION=$(printf '\n\n## 追加コンテキストの参照\n\n以下が存在する場合は必ず参照してください。存在しない情報は推測せず、必要に応じて不足事項として記録してください。\n\n- `qa/` 配下の、この Root Issue / Step / PR に関連する QA 回答\n- この PR または関連 Issue のレビュー指摘\n- Self-Improve 結果または改善計画（存在する場合のみ）\n- `## 入力` に記載された前 Step 成果物（`docs/` 成果物経由のみ。他 Step の `work/run/<run-id>/...` 配下の作業ファイルは入力として読まないこと）\n- 追加で注入された既存成果物・reuse context\n\n参照した QA / Review / Self-Improve の内容は、成果物へ反映してください。反映しない場合は理由を完了コメントまたは成果物内に記録してください。\n\n## 検証結果（PR本文に必須）\n<!-- validation-confirmed -->\n- 検証: 実行したテスト/ビルド/静的解析と結果を記載してください。')
          if [[ -n "${ADDITIONAL_COMMENT}" ]]; then
            ADDITIONAL_SECTION="${QA_REVIEW_SECTION}$(printf '\n\n## 追加コメント\n%s' "${ADDITIONAL_COMMENT}")"
          else
            ADDITIONAL_SECTION="${QA_REVIEW_SECTION}"
          fi

          # ---- Root Issue の title に APP-ID(s) を追記 ----
          if [[ -n "${APP_IDS}" ]]; then
            CURRENT_TITLE=$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/issues/${ROOT_ISSUE}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('title',''))") || CURRENT_TITLE=""
            if [[ -n "${CURRENT_TITLE}" ]] && [[ "${CURRENT_TITLE}" != *"(${APP_IDS})"* ]]; then
              NEW_TITLE="${CURRENT_TITLE} (${APP_IDS})"
              api_call PATCH "https://api.github.com/repos/${REPO}/issues/${ROOT_ISSUE}" \
                "$(python3 -c "import sys,json; print(json.dumps({'title': sys.argv[1]}))" "${NEW_TITLE}")" > /dev/null || true
              echo "Root Issue #${ROOT_ISSUE} のタイトルに APP-ID(s) を追記しました: ${NEW_TITLE}"
            fi
          fi

          # ---- Root Issue body からスキップ対象のステップ行を除去して更新 ----
          # （注意: ISSUE_BODY シェル変数は古い値のまま。パースは完了済みなので影響なし）
          if [[ -n "${SKIP_STEPS}" ]]; then
            echo "Root Issue body から未チェックのステップを除去します..."

            PATCH_JSON_FILE=$(mktemp)

            python3 - "${SKIP_STEPS}" "${PATCH_JSON_FILE}" <<'PYBODY'
          import sys, os, re, json

          body = os.environ.get("ISSUE_BODY", "")
          skip_steps_str = sys.argv[1]
          output_file = sys.argv[2]

          skip_steps = set(skip_steps_str.split()) if skip_steps_str.strip() else set()

          if skip_steps:
              lines = body.split('\n')
              new_lines = []
              for line in lines:
                  # 未チェック行のみ除去（チェック済み行 - [x] は残す）
                  m = re.match(r'^\s*-\s*\[[ ]\]\s*Step\.(\d+)\b', line)
                  if m and m.group(1) in skip_steps:
                      continue
                  new_lines.append(line)

              # 連続空行を最大2行に制限
              cleaned = []
              blank_count = 0
              for line in new_lines:
                  if line.strip() == '':
                      blank_count += 1
                      if blank_count <= 2:
                          cleaned.append(line)
                  else:
                      blank_count = 0
                      cleaned.append(line)

              body = '\n'.join(cleaned)

          with open(output_file, 'w', encoding='utf-8') as f:
              json.dump({'body': body}, f, ensure_ascii=False)
          PYBODY

            api_call PATCH \
              "https://api.github.com/repos/${REPO}/issues/${ROOT_ISSUE}" \
              "$(cat "${PATCH_JSON_FILE}")" > /dev/null \
              && echo "Root Issue #${ROOT_ISSUE} の body を更新しました（未チェックのステップ行を除去）。" \
              || echo "WARNING: Root Issue body の更新に失敗しました。処理を続行します。" >&2

            rm -f "${PATCH_JSON_FILE}"

            # PYBODY が body を更新したため、PYREVIEW 用に最新の body を再取得する
            _refreshed=$(gh api "/repos/${REPO}/issues/${ROOT_ISSUE}" --jq '.body // ""' 2>/dev/null) \
              && ISSUE_BODY="${_refreshed}" && export ISSUE_BODY \
              || echo "WARNING: ISSUE_BODY の再取得に失敗しました。スキップステップ除去後の body で adversarial-review タグが埋め込まれない可能性があります。" >&2
          else
            echo "全ステップ実行のため Root Issue body の更新は不要です。"
          fi

          # ---- Root Issue に adversarial-review タグを埋め込み ----
          REVIEW_TAG_FILE=$(mktemp)
          python3 - "${ADVERSARIAL_REVIEW}" "${AUTO_MERGE}" "${TDD_MAX_RETRIES}" "${BRANCH}" "${SELF_IMPROVE_MAX_ITER}" "${SELF_IMPROVE_QUALITY_THRESHOLD}" "${TOOL_SEARCH_POLICY}" "${REVIEW_TAG_FILE}" <<'PYMERGE'
          import sys, os, re, json

          body = os.environ.get("ISSUE_BODY", "")
          adversarial_review = sys.argv[1]
          auto_merge = sys.argv[2]
          tdd_max_retries = sys.argv[3]
          branch = sys.argv[4]
          si_max_iter = sys.argv[5]
          si_quality_threshold = sys.argv[6]
          tool_search_policy = sys.argv[7]
          output_file = sys.argv[8]

          tags = [
              ("adversarial-review", adversarial_review),
              ("auto-merge", auto_merge),
              ("tdd-max-retries", tdd_max_retries),
              ("branch", branch),
              ("self-improve-max-iterations", si_max_iter),
              ("self-improve-quality-threshold", si_quality_threshold),
              ("tool-search-policy", tool_search_policy),
          ]

          for key, value in tags:
              tag = f"<!-- {key}: {value} -->"
              pat = re.compile(rf"<!--\s*{re.escape(key)}\s*:[^>]*-->")
              if pat.search(body):
                  body = pat.sub(tag, body, count=1)
              else:
                  body = body.rstrip() + "\n" + tag + "\n"

          with open(output_file, 'w', encoding='utf-8') as f:
              json.dump({'body': body}, f, ensure_ascii=False)
          PYMERGE

          api_call PATCH \
            "https://api.github.com/repos/${REPO}/issues/${ROOT_ISSUE}" \
            "$(cat "${REVIEW_TAG_FILE}")" > /dev/null \
            && echo "Root Issue #${ROOT_ISSUE} に adversarial-review / auto-merge / tdd-max-retries / branch / Self-Improve上限タグを埋め込みました。" \
            || echo "WARNING: Root Issue body のタグ埋め込みに失敗しました。" >&2

          rm -f "${REVIEW_TAG_FILE}"

          add_label "${ROOT_ISSUE}" "aagd:initialized"
          echo "aagd:initialized を付与しました。"

          if [[ "${ADVERSARIAL_REVIEW}" == "true" ]]; then
            add_label "${ROOT_ISSUE}" "adversarial-review"
            echo "Root Issue #${ROOT_ISSUE} に adversarial-review ラベルを付与しました。"
          else
            gh issue edit "${ROOT_ISSUE}" --repo "${REPO}" --remove-label "adversarial-review" >/dev/null 2>&1 || true
            echo "false marker を優先し、Root Issue #${ROOT_ISSUE} の adversarial-review ラベルを除去しました。"
          fi

          if [[ "${AUTO_QA}" == "true" ]]; then
            add_label "${ROOT_ISSUE}" "auto-qa"
            echo "Root Issue #${ROOT_ISSUE} に auto-qa ラベルを付与しました。"
          fi

          if [[ "${AUTO_MERGE}" == "true" ]]; then
            add_label "${ROOT_ISSUE}" "auto-approve-ready"
            echo "Root Issue #${ROOT_ISSUE} に auto-approve-ready ラベルを付与しました。"
          fi
          if [[ -n "${SELECTED_MODEL}" ]]; then
            add_label "${ROOT_ISSUE}" "model/${SELECTED_MODEL}" || true
          fi
          if [[ -n "${SELECTED_REVIEW_MODEL}" ]]; then
            add_label "${ROOT_ISSUE}" "review-model/${SELECTED_REVIEW_MODEL}" || true
          fi
          if [[ -n "${SELECTED_QA_MODEL}" ]]; then
            add_label "${ROOT_ISSUE}" "qa-model/${SELECTED_QA_MODEL}" || true
          fi

          # skip_step helper: SKIP_STEPS に Step 番号が含まれていれば true
          # tool search を使わない構成では Toolbox が無く、実測対象が存在しない。
          if [[ "${TOOL_SEARCH_POLICY}" == "no" ]]; then
            SKIP_STEPS="${SKIP_STEPS} 4"
            echo "Tool Search 方針 no のため tool search 実測評価は作成しません。"
          fi

          # ---- 生成する AI Agent の Tool Search 方針（Step.2.3 / 3 / 4 のみ）----
          TOOL_SEARCH_SECTION=$(printf '\n\n## 生成する AI Agent の Tool Search 方針\n- 方針: `%s`\n- これは利用者指定であり、Agent の判断・追加コメントで上書きしない。\n- `auto` / `yes` / `no` 以外なら推測せず、blocked として停止する。' "${TOOL_SEARCH_POLICY}")

          skip_step() { echo " ${SKIP_STEPS} " | grep -q " $1 "; }

          # ---- APP-ID スコープセクション（複数 APP-ID 対応）----
          if [[ -n "${APP_IDS}" ]]; then
            APP_ID_SECTION=$(APP_IDS="${APP_IDS}" python3 -c 'import os; ids=[s.strip() for s in os.environ.get("APP_IDS","").split(",") if s.strip()]; id_list=", ".join("`"+aid+"`" for aid in ids); print("\\n\\n## 対象アプリケーション\\n- APP-ID: "+id_list+"\\n- この Step では上記 APP-ID に関連するサービス/エンティティ/画面のみを対象とする\\n- `docs/catalog/app-catalog.md` を参照し、対象 APP-ID に紐づく項目を特定する\\n- 共有サービス/エンティティ（複数 APP で利用されるもの）も対象に含む")')
          else
            APP_ID_SECTION=""
          fi

          # Step Issue タイトルに APP-ID(s) を付加するサフィックス
          APP_ID_SUFFIX="${APP_IDS:+ (${APP_IDS})}"

          # Step Issue に付与するラベルセット
          if [[ "${ADVERSARIAL_REVIEW}" == "true" ]] && [[ "${AUTO_QA}" == "true" ]]; then
            STEP_LABELS='["auto-ai-agent-dev","adversarial-review","auto-qa"]'
          elif [[ "${ADVERSARIAL_REVIEW}" == "true" ]]; then
            STEP_LABELS='["auto-ai-agent-dev","adversarial-review"]'
          elif [[ "${AUTO_QA}" == "true" ]]; then
            STEP_LABELS='["auto-ai-agent-dev","auto-qa"]'
          else
            STEP_LABELS='["auto-ai-agent-dev"]'
          fi

          if [[ "${AUTO_MERGE}" == "true" ]]; then
            STEP_LABELS=$(echo "${STEP_LABELS}" | jq -c '. + ["auto-approve-ready"]')
          fi
          if [[ -n "${SELECTED_MODEL}" ]]; then
            STEP_LABELS=$(echo "${STEP_LABELS}" | jq -c --arg ml "model/${SELECTED_MODEL}" '. + [$ml]')
          fi
          if [[ -n "${SELECTED_REVIEW_MODEL}" ]]; then
            STEP_LABELS=$(echo "${STEP_LABELS}" | jq -c --arg rml "review-model/${SELECTED_REVIEW_MODEL}" '. + [$rml]')
          fi
          if [[ -n "${SELECTED_QA_MODEL}" ]]; then
            STEP_LABELS=$(echo "${STEP_LABELS}" | jq -c --arg qml "qa-model/${SELECTED_QA_MODEL}" '. + [$qml]')
          fi

          # ---- Step Issue 生成 ----
          # ---- Step Issue 生成 ----
          # registry (hve/workflow_registry.py) と workflow-registry.sh の aagd と同じ構成。
          # データ / コンピュート / UI / アーキテクチャレビューは ASDW-WEB の担当。
          S1_NUM=""  S1_ID=""
          S2_NUM=""  S2_ID=""
          S21_NUM="" S21_ID=""
          S22_NUM="" S22_ID=""
          S23_NUM="" S23_ID=""
          S3_NUM=""  S3_ID=""
          S4_NUM=""  S4_ID=""

          # ---- Step.1 (AI Agent 構成設計) ----
          if ! skip_step "1"; then
            USECASE_PATH=""
            if [[ -n "${USECASE_ID}" ]]; then
              USECASE_PATH="docs/usecase/${USECASE_ID}/usecase-description.md"
            fi

            BODY_S1=$(printf '%s\n## 目的\nユースケース記述を入力として、AI Agent のアプリケーション定義書を作成する（Step 1）。\n\n## 入力\n- ユースケースID: %s\n- ユースケース記述: %s\n- ガイドライン: `users-guide/08-ai-agent.md`（Step 1 セクション参照）\n- `docs/catalog/app-catalog.md`（アプリケーション一覧 — 対象 APP-ID のスコープ判定根拠。存在しない場合はスコープ絞り込みなしで全件処理）\n- 参照（存在すれば）:\n  - `docs/catalog/service-catalog-matrix.md`\n  - `docs/catalog/service-catalog.md`\n  - `docs/catalog/data-model.md`\n  - `docs/catalog/domain-analytics.md`\n  - `docs/catalog/use-case-catalog.md`\n  - `docs/services/SVC-*.md`\n  - `docs/azure/azure-services-data.md`\n  - `docs/azure/azure-services-additional.md`\n\n## 成果物\n- `docs/agent/agent-application-definition.md`\n\n## 既存成果物がある場合の更新方針\n- 既存ファイルがある場合でも、メインタスク本体を必ず実行する\n- 新規情報を作成し、既存ファイルへ差分マージする\n- 参照節追記のみ・ヘッダ注記のみで完了にしない\n- `knowledge/` など参照元に更新が無い場合は「更新なし」を明示する\n- 「再作成して」は将来実装予定のオプション（現時点では自動削除・再作成しない）\n- 確認できない情報は補完せず、変更が無い場合は「変更なし」と明記する\n\n## Custom Agent\n`Arch-AIAgentDesign-Step1` を使用\n\n## 依存\n- 本ワークフローの最初の Step。上流成果物（`docs/catalog/` / `docs/azure/` 配下）は AAS / AAD-WEB / ASDW-WEB で作成済みであること\n\n## 完了条件\n- `docs/agent/agent-application-definition.md` が作成されている\n- 完了時に自身に `aagd:done` ラベルを付与すること%s%s' \
              "${ROOT_REF}" "${USECASE_ID}" "${USECASE_PATH}" "${APP_ID_SECTION}" "${ADDITIONAL_SECTION}")
            RESP=$(create_issue \
              "[AAGD] Step.1: AI Agent 構成設計${APP_ID_SUFFIX}" \
              "${BODY_S1}" \
              "${STEP_LABELS}")
            S1_NUM=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['number'])")
            S1_ID=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id'])")
            echo "Step.1 作成: #${S1_NUM}"
            sleep 3
          else
            echo "Step.1 はスキップされました。"
          fi

          # ---- Step.2 コンテナ + サブステップ ----
          if ! skip_step "2"; then
            BODY_S2=$(printf '%s\n## Step.2 コンテナ\nStep.2 はコンテナ Issue。Sub Task（Step.2.1, Step.2.2, Step.2.3）の完了を待つ。%s' \
              "${ROOT_REF}" "${ADDITIONAL_SECTION}")
            RESP=$(create_issue \
              "[AAGD] Step.2: AI Agent 実装（コンテナ）${APP_ID_SUFFIX}" \
              "${BODY_S2}" \
              "${STEP_LABELS}")
            S2_NUM=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['number'])")
            S2_ID=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id'])")
            echo "Step.2 作成: #${S2_NUM}"
            sleep 3

            # ---- Step.2.1 (TDD RED: AI Agent テスト仕様書) ----
            BODY_S21=$(printf '%s\n## 目的\nTDD RED フェーズ: Agent 詳細設計書・テスト戦略書に基づき、Agent 用 TDD テスト仕様書を生成する（APP-ID 指定時はスコープ内の Agent のみ）。\n\n## 必須テストカテゴリ（全5種を含めること）\n1. **Agent I/O 契約テスト** — 入力（ユーザーメッセージ・コンテキスト）→ 期待出力（応答・アクション）の検証\n2. **Tool モック統合テスト** — Tool 呼び出しのパラメータ・戻り値・エラー時の動作検証（Tool は全てモック化）\n3. **Guardrails テスト** — 禁止操作・PII マスキング・ポリシー違反検出の検証\n4. **状態遷移テスト** — 正常フロー・例外フロー・エスカレーションフローの検証\n5. **プロンプト回帰テスト** — System Prompt 変更後の動作一貫性（期待出力のマッチング）検証\n\n## 入力\n- `docs/catalog/test-strategy.md`\n- `docs/ai-agent-catalog.md`\n- `docs/agent/agent-detail-*.md`\n- `docs/catalog/service-catalog-matrix.md`\n- `docs/catalog/data-model.md`\n- `docs/catalog/app-catalog.md`（アプリケーション一覧 — 対象 APP-ID のスコープ判定根拠。存在しない場合はスコープ絞り込みなしで全件処理）\n\n## 出力\n- `docs/test-specs/{agentId}-test-spec.md`（Agent 別テスト仕様書）\n\n## Custom Agent\n`Arch-TDD-TestSpec` を使用\n\n## 依存\n- Step.1（AI Agent 構成設計）が `aagd:done` であること\n- `docs/catalog/test-strategy.md` が存在すること\n\n## 完了条件\n- `docs/test-specs/` 配下に Agent 別テスト仕様書が生成されている\n- テスト仕様書に上記5種のテストカテゴリが含まれている\n- 完了時に自身に `aagd:done` ラベルを付与すること%s%s' \
              "${ROOT_REF}" "${APP_ID_SECTION}" "${ADDITIONAL_SECTION}")
            RESP=$(create_issue \
              "[AAGD] Step.2.1: AI Agent テスト仕様書 (TDD RED)${APP_ID_SUFFIX}" \
              "${BODY_S21}" \
              "${STEP_LABELS}")
            S21_NUM=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['number'])")
            S21_ID=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id'])")
            echo "Step.2.1 作成: #${S21_NUM}"
            sleep 3

            # ---- Step.2.2 (TDD RED: AI Agent テストコード生成) ----
            BODY_S22=$(printf '%s\n## 目的\nTDD RED フェーズ: Agent テスト仕様書（`docs/test-specs/{agentId}-test-spec.md`）からテストコードのみを生成する（APP-ID 指定時はスコープ内の Agent のみ）。\n全テストが FAIL（TDD RED 状態）であることを確認してから Step.2.3（GREEN フェーズ）へ進む。\n\n## 入力\n- `docs/test-specs/{agentId}-test-spec.md`（Step.2.1 で生成済みの Agent テスト仕様書）\n- `docs/agent/agent-detail-*.md`\n- `docs/catalog/service-catalog-matrix.md`\n- `docs/catalog/app-catalog.md`（アプリケーション一覧 — 対象 APP-ID のスコープ判定根拠。存在しない場合はスコープ絞り込みなしで全件処理）\n\n## 出力\n- `src/test/agent/{AgentName}.Tests/` 配下にテストプロジェクト（テストコードのみ）\n\n## Custom Agent\n`Dev-Microservice-Azure-AgentTestCoding` を使用\n\n## TDD RED 確認手順（必須）\n1. テストを実行し、全テストが FAIL であることを確認する（RED 状態）\n2. RED 確認結果（テスト実行ログ）を Issue コメントに記録する\n\n## 依存\n- Step.2.1（AI Agent テスト仕様書）が `aagd:done` であること\n\n## 完了条件\n- `src/test/agent/{AgentName}.Tests/` 配下にテストコードが生成されている\n- テストで全テストが FAIL（RED 状態）であることが確認されている\n- 完了時に自身に `aagd:done` ラベルを付与すること%s%s' \
              "${ROOT_REF}" "${APP_ID_SECTION}" "${ADDITIONAL_SECTION}")
            RESP=$(create_issue \
              "[AAGD] Step.2.2: AI Agent テストコード生成 (TDD RED)${APP_ID_SUFFIX}" \
              "${BODY_S22}" \
              "${STEP_LABELS}")
            S22_NUM=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['number'])")
            S22_ID=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id'])")
            echo "Step.2.2 作成: #${S22_NUM}"
            sleep 3

            # ---- Step.2.3 (TDD GREEN: AI Agent 実装) ----
            BODY_S23=$(printf '%s\n## 目的\nTDD GREEN フェーズ: Agent 詳細設計書から AI Agent を実装し、全テストを PASS させる。\nMicrosoft Foundry（Azure AI Foundry Agent Service）を使用して Agent を実装する（APP-ID 指定時はスコープ内の Agent のみ）。\n\n## 重要\n- **Azure AI Foundry Agent Service** を使用する\n- チュートリアル参照: https://learn.microsoft.com/ja-jp/azure/foundry/quickstarts/get-started-code?tabs=python\n  - ⚠️ チュートリアルのコードをそのままコピーしない\n- **ユーザーが指定したプログラミング言語で最新の SDK** を使用する\n  - Python: `azure-ai-projects`（最新版）\n  - C#: `Azure.AI.Projects`（最新版）\n- `DefaultAzureCredential` を使用して Azure に認証する\n\n## 入力\n- `docs/agent/agent-detail-*.md`（Agent 詳細設計書）\n- `docs/ai-agent-catalog.md`\n- TDD テストコード（RED状態）: `src/test/agent/{AgentName}.Tests/`\n- TDD テスト仕様書: `docs/test-specs/{agentId}-test-spec.md`\n- `docs/catalog/service-catalog-matrix.md`\n- `docs/azure/azure-services-additional.md`\n- `docs/catalog/app-catalog.md`（アプリケーション一覧 — 対象 APP-ID のスコープ判定根拠。存在しない場合はスコープ絞り込みなしで全件処理）\n\n## 出力\n- `src/agent/{AgentID}-{AgentName}/`\n\n## TDD GREEN フロー（反復）\n1. テストが全て FAIL（RED 状態）であることを確認する\n2. 最小限の Agent 実装を作成する\n3. テストを実行する\n4. 全テスト PASS なら REFACTOR へ進む。FAIL があれば実装を修正して手順3に戻る\n5. 最大 %s 回反復する\n6. %s 回で全 PASS にならない場合: `aagd:blocked` ラベルを付与し、未 PASS テスト一覧を報告する\n\n## Custom Agent\n`Dev-Microservice-Azure-AgentCoding` を使用\n\n## 依存\n- Step.2.2（AI Agent テストコード生成）が `aagd:done` であること\n\n## 完了条件\n- `src/agent/` 配下に Agent 実装コードが存在する\n- テストの全テストが PASS であること（TDD GREEN 確認）\n- 完了時に自身に `aagd:done` ラベルを付与すること%s%s%s' \
              "${ROOT_REF}" "${TDD_MAX_RETRIES}" "${TDD_MAX_RETRIES}" "${APP_ID_SECTION}" "${TOOL_SEARCH_SECTION}" "${ADDITIONAL_SECTION}")
            RESP=$(create_issue \
              "[AAGD] Step.2.3: AI Agent 実装 (TDD GREEN)${APP_ID_SUFFIX}" \
              "${BODY_S23}" \
              "${STEP_LABELS}")
            S23_NUM=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['number'])")
            S23_ID=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id'])")
            echo "Step.2.3 作成: #${S23_NUM}"
            sleep 3
          else
            echo "Step.2 はスキップされました。"
          fi

          # ---- Step.3 (AI Agent Deploy) ----
          if ! skip_step "3"; then
            # ---- Step.3 本体 ----
            BODY_S3=$(printf '%s\n## 目的\nAI Agent を Azure AI Foundry Agent Service へデプロイし、GitHub Actions で CI/CD を構築する（APP-ID 指定時はスコープ内の Agent のみ）。\n\n## 入力\n- リソースグループ名: `%s`\n- `src/agent/{agentId}-{agentName}/`\n- `docs/ai-agent-catalog.md`\n- `docs/azure/azure-services-additional.md`\n- `docs/catalog/app-catalog.md`（アプリケーション一覧 — 対象 APP-ID のスコープ判定根拠。存在しない場合はスコープ絞り込みなしで全件処理）\n\n## 出力\n- `src/infra/azure/create-azure-agent-resources-prep.sh`\n- `src/infra/azure/create-azure-agent-resources.sh`\n- `src/infra/azure/verify-agent-resources.sh`\n- `.github/workflows/deploy-agent-{agentId}-{agentName}.yml`\n- `docs/test-specs/deploy-step2-agent-test-spec.md`\n- `docs/azure/azure-service-catalog.md`（Agent エンドポイント追記）\n\n## デプロイ TDD フロー（必須）\n1. デプロイテスト仕様書の生成: `docs/test-specs/deploy-step2-agent-test-spec.md`\n2. 検証スクリプトの生成: `src/infra/azure/verify-agent-resources.sh`（exit code: 0=全PASS, 非0=FAILあり）\n3. 検証スクリプト実行 → 全 FAIL 確認（RED 状態）\n4. デプロイスクリプトの作成・実行\n5. 検証スクリプト実行 → 全 PASS まで修正（最大 3 回反復。超過時は `aagd:blocked` + FAIL 項目一覧を報告）\n\n## Custom Agent\n`Dev-Microservice-Azure-AgentDeploy` を使用\n\n## 依存\n- Step.2.3（AI Agent 実装）が `aagd:done` であること\n\n## 完了条件\n- デプロイスクリプトと CI/CD ワークフローが作成されている\n- 検証スクリプトで全項目 PASS であること\n- 完了時に自身に `aagd:done` ラベルを付与すること%s%s%s' \
              "${ROOT_REF}" "${RESOURCE_GROUP}" "${APP_ID_SECTION}" "${TOOL_SEARCH_SECTION}" "${ADDITIONAL_SECTION}")
            RESP=$(create_issue \
              "[AAGD] Step.3: AI Agent Deploy${APP_ID_SUFFIX}" \
              "${BODY_S3}" \
              "${STEP_LABELS}")
            S3_NUM=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['number'])")
            S3_ID=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id'])")
            echo "Step.3 作成: #${S3_NUM}"
            sleep 3
          else
            echo "Step.3 はスキップされました。"
          fi

          # ---- Step.4 (tool search 実測評価) ----
          if ! skip_step "4"; then
            # ---- Step.4 本体 ----
            BODY_S4=$(printf '%s\n## 目的\nデプロイ済みの Toolbox に対して tool search の on / off を実測比較し、TB-CAP-02 の判定が妥当だったかを測定で裏付ける。\n\n## なぜ必要か\n公開されているトークン削減率（50 Tool で 60 パーセント超、1,000 Tool で 97 パーセント超）は ToolRet ベンチマークの値であり、**自社カタログの Tool 記述品質に依存する**。description が不揃いだとトークンは減っても Tool 選択精度が落ちる。導入効果は実測でしか判断できない。\n\n## 入力\n- `docs/agent/agent-detail-{agentId}-{agentName}.md`（TB-CAP-01〜05 の設計値）\n- `src/agent/{agentId}-{agentName}/`（評価クエリの再利用元）\n- `docs/catalog/app-catalog.md`\n\n## 出力\n- `docs/agent/tool-search-eval/{agentId}-{agentName}-eval-report.md`\n\n## 測定要件\n- 評価クエリは最低 10 件。うち **複数 Tool の組み合わせが必要なタスクを 3 件以上**含める。\n- 実行すべき Tool が存在しないタスクを含め、過剰呼び出し率を測る。\n- 同一 Toolbox・同一クエリ集合に対し、tool search の on / off だけを変える。\n- prompt caching は既定で有効。ベースラインでも有効のまま測る。\n\n## 記録する指標\n初期 `tools/list` トークン数 / 1 ターンあたり総入力トークン / Tool 選択正解率 / `tool_search` 呼び出し回数 / 追加レイテンシ（p50・p95）/ 過剰呼び出し率\n\n## レポートの固定フォーマット（HVE artifact gate が機械検証）\n- 測定条件: `Toolbox name` / `Toolbox version` / `Total tools` / `Pinned tools` / `limit` / `Measured at` / `SDK / API version`\n- 評価クエリ表: `| Query ID | Query | Expected tools | Multi tool |`\n- 指標表: `| Metric | Measured off | Measured on | Evidence |`\n- 結論: `- Conclusion:` と `- Rationale:`\n\n## 禁止事項\n- 測定していない数値を書かない。実行できなかった指標は on / off 両列を「未測定（理由）」と記す。\n- **公開ベンチマークの数値を自社の実測値として引用しない**。\n- 精度低下を隠してトークン削減だけを報告しない。両方を並記する。\n\n## Custom Agent\n`QA-ToolSearchEval` を使用\n\n## 依存\n- Step.3（AI Agent Deploy）が `aagd:done` であること\n\n## 完了条件\n- 評価クエリが 10 件以上あり、うち 3 件以上が複数 Tool の組み合わせを要する\n- tool search の on / off 両方で全クエリを測定した\n- `Conclusion` と `Rationale` が記載されている\n- TB-CAP-01〜05 を持たない Agent が対象の場合もレポートを省略せず、`- Status: N/A` / `- Reason:` / `- Decision source:` / `- Recheck condition:` の理由付き N/A レポートを残す\n- 完了時に自身に `aagd:done` ラベルを付与すること%s%s%s' \
              "${ROOT_REF}" "${APP_ID_SECTION}" "${TOOL_SEARCH_SECTION}" "${ADDITIONAL_SECTION}")
            RESP=$(create_issue \
              "[AAGD] Step.4: tool search 実測評価${APP_ID_SUFFIX}" \
              "${BODY_S4}" \
              "${STEP_LABELS}")
            S4_NUM=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['number'])")
            S4_ID=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id'])")
            echo "Step.4 作成: #${S4_NUM}"
            sleep 3
          else
            echo "Step.4 はスキップされました。"
          fi

          # ---- Sub Issue 紐付け ----
          echo "Sub Issue 紐付けを開始します..."

          # Root → Step.1, Step.2（コンテナ）, Step.3, Step.4
          [[ -n "${S1_ID}" ]] && { link_sub_issue "${ROOT_ISSUE}" "${S1_ID}"; echo "Root → Step.1 紐付け完了"; }
          [[ -n "${S2_ID}" ]] && { link_sub_issue "${ROOT_ISSUE}" "${S2_ID}"; echo "Root → Step.2 紐付け完了"; }
          [[ -n "${S3_ID}" ]] && { link_sub_issue "${ROOT_ISSUE}" "${S3_ID}"; echo "Root → Step.3 紐付け完了"; }
          [[ -n "${S4_ID}" ]] && { link_sub_issue "${ROOT_ISSUE}" "${S4_ID}"; echo "Root → Step.4 紐付け完了"; }

          # Step.2 → Step.2.1, Step.2.2, Step.2.3
          [[ -n "${S2_NUM}" && -n "${S21_ID}" ]] && { link_sub_issue "${S2_NUM}" "${S21_ID}"; echo "Step.2 → Step.2.1 紐付け完了"; }
          [[ -n "${S2_NUM}" && -n "${S22_ID}" ]] && { link_sub_issue "${S2_NUM}" "${S22_ID}"; echo "Step.2 → Step.2.2 紐付け完了"; }
          [[ -n "${S2_NUM}" && -n "${S23_ID}" ]] && { link_sub_issue "${S2_NUM}" "${S23_ID}"; echo "Step.2 → Step.2.3 紐付け完了"; }

          # ---- 最初の Step を起動（Step.1 → Step.2.1 → Step.3 → Step.4 の順でフォールバック）----
          if [[ -n "${S1_NUM}" ]]; then
            if [[ "${AUTO_QA}" == "true" ]]; then
              add_label "${S1_NUM}" "aagd:qa-ready"
              echo "Step.1 (#${S1_NUM}) に aagd:qa-ready を付与しました（QA 完了待ち）。Copilot アサインは QA 回答後に実行されます。"
            else
              add_label "${S1_NUM}" "aagd:ready"
              CA=$(extract_custom_agent "${BODY_S1}")
              if assign_copilot "${S1_NUM}" "${CA}" "${BRANCH}" "" "${SELECTED_MODEL}"; then
                add_label "${S1_NUM}" "aagd:running"
                echo "Step.1 に copilot アサイン + aagd:running 付与完了"
              else
                echo "WARNING: Step.1 へのアサイン失敗。aagd:running は付与しません。"
              fi
            fi
          elif [[ -n "${S21_NUM}" ]]; then
            add_label "${S21_NUM}" "aagd:ready"
            CA=$(extract_custom_agent "${BODY_S21}")
            if assign_copilot "${S21_NUM}" "${CA}" "${BRANCH}" ""; then
              add_label "${S21_NUM}" "aagd:running"
              echo "Step.1 がスキップ済み: Step.2.1 (#${S21_NUM}) を起動しました。"
            else
              echo "WARNING: Step.2.1 へのアサイン失敗。aagd:running は付与しません。"
            fi
          elif [[ -n "${S3_NUM}" ]]; then
            add_label "${S3_NUM}" "aagd:ready"
            CA=$(extract_custom_agent "${BODY_S3}")
            if assign_copilot "${S3_NUM}" "${CA}" "${BRANCH}" ""; then
              add_label "${S3_NUM}" "aagd:running"
              echo "Step.1/2 がスキップ済み: Step.3 (#${S3_NUM}) を起動しました。"
            else
              echo "WARNING: Step.3 へのアサイン失敗。aagd:running は付与しません。"
            fi
          elif [[ -n "${S4_NUM}" ]]; then
            add_label "${S4_NUM}" "aagd:ready"
            CA=$(extract_custom_agent "${BODY_S4}")
            if assign_copilot "${S4_NUM}" "${CA}" "${BRANCH}" ""; then
              add_label "${S4_NUM}" "aagd:running"
              echo "Step.1/2/3 がスキップ済み: Step.4 (#${S4_NUM}) を起動しました。"
            else
              echo "WARNING: Step.4 へのアサイン失敗。aagd:running は付与しません。"
            fi
          else
            echo "起動可能な leaf Step が存在しません。初期化をスキップします。"
          fi

          echo "初期化完了。"

      # ----------------------------------------------------------------
      # 4. 状態遷移: aagd:done ラベル付与時
      # ----------------------------------------------------------------
      - name: 状態遷移処理
        if: steps.gate.outputs.mode == 'state_transition'
        env:
          DONE_ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
        run: |
          set -euo pipefail

          # Issue の body と title を API 経由で安全に取得（YAML 展開問題を回避）
          _ISSUE_JSON=$(curl -sf \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/issues/${DONE_ISSUE_NUMBER}")
          DONE_ISSUE_BODY=$(echo "${_ISSUE_JSON}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('body',''))")
          DONE_ISSUE_TITLE=$(echo "${_ISSUE_JSON}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('title',''))")
          export DONE_ISSUE_BODY DONE_ISSUE_TITLE

          # closed イベント由来の場合: aagd:done ラベルをまだ持っていなければ付与する
          # （labeled(aagd:done) イベントと closed イベントのどちらで state_transition に来ても正しく動作するための冪等処理）
          _HAS_DONE_LABEL=$(echo "${_ISSUE_JSON}" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          labels = [l['name'] for l in d.get('labels', [])]
          print('true' if 'aagd:done' in labels else 'false')
          ")
          if [[ "${_HAS_DONE_LABEL}" == "false" ]]; then
            echo "aagd:done ラベルを付与します（closed イベント由来）..."
            _done_label_verified="false"
            for attempt in 1 2 3; do
              if gh issue edit "${DONE_ISSUE_NUMBER}" --repo "${REPO}" \
                --add-label "aagd:done" >/dev/null \
                && gh issue view "${DONE_ISSUE_NUMBER}" --repo "${REPO}" \
                  --json labels --jq '.labels[].name' | grep -Fxq "aagd:done"
              then
                _done_label_verified="true"
                break
              fi
              echo "WARN: aagd:done の付与または確認に失敗しました (${attempt}/3)。" >&2
              sleep $((2 ** (attempt - 1)))
            done
            if [[ "${_done_label_verified}" != "true" ]]; then
              echo "ERROR: closed event の aagd:done を付与・確認できないため状態遷移を停止します。" >&2
              exit 1
            fi
            echo "aagd:done ラベルを付与しました。"
          fi

          if [[ -z "${COPILOT_PAT}" ]]; then
            echo "WARNING: COPILOT_PAT が設定されていません。Copilot アサインは全てスキップされます。" >&2
          fi

          # ---- ユーティリティ関数（再定義） ----
          api_call() {
            local method="$1"; shift
            local url="$1"; shift
            local data="${1:-}"
            local max_retry=5
            local wait=1
            local http_code response body

            for i in $(seq 1 "${max_retry}"); do
              if [[ -n "${data}" ]]; then
                response=$(curl -s -w "\n%{http_code}" \
                  -X "${method}" \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  -H "Content-Type: application/json" \
                  "${url}" \
                  -d "${data}")
              else
                response=$(curl -s -w "\n%{http_code}" \
                  -X "${method}" \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "${url}")
              fi
              http_code=$(echo "${response}" | tail -1)
              body=$(echo "${response}" | head -n -1)
              if [[ "${http_code}" =~ ^2 ]]; then
                echo "${body}"
                return 0
              fi
              echo "API エラー: HTTP ${http_code}、${wait}秒後にリトライ (${i}/${max_retry})" >&2
              sleep "${wait}"
              wait=$((wait * 2))
            done
            echo "API 呼び出し失敗: ${method} ${url}" >&2
            return 1
          }

          add_label() {
            local issue_num="$1"
            local label="$2"
            api_call POST \
              "https://api.github.com/repos/${REPO}/issues/${issue_num}/labels" \
              "{\"labels\":[\"${label}\"]}" > /dev/null
            sleep 1
          }

          source "${GITHUB_WORKSPACE}/.github/scripts/bash/lib/assign-copilot.sh"

          post_comment() {
            local issue_num="$1"
            local body="$2"
            local data
            data=$(python3 -c "import sys,json; print(json.dumps({'body': sys.argv[1]}))" "${body}")
            api_call POST \
              "https://api.github.com/repos/${REPO}/issues/${issue_num}/comments" \
              "${data}" > /dev/null
            sleep 1
          }

          # Issue body から Custom Agent 名を抽出
          extract_custom_agent() {
            local body="$1"
            echo "${body}" | python3 /dev/fd/3 3<<'PY'
          import sys, re
          body = sys.stdin.read()
          m = re.search(r'## Custom Agent\s*\n\s*`([^`]+)`', body)
          print(m.group(1) if m else '')
          PY
          }

          activate_issue() {
            local issue_num="$1"
            local issue_body
            issue_body=$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/issues/${issue_num}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('body',''))") || true
            local agent_name
            agent_name=$(extract_custom_agent "${issue_body}") || true
            add_label "${issue_num}" "aagd:ready"
            if assign_copilot "${issue_num}" "${agent_name}" "${BRANCH:-main}" ""; then
              add_label "${issue_num}" "aagd:running"
              echo "Issue #${issue_num} を aagd:ready + copilot アサイン + aagd:running に設定しました。(custom_agent: ${agent_name})"
            else
              echo "WARNING: Issue #${issue_num} へのアサイン失敗。aagd:running は付与しません。"
            fi
          }

          # Step.2 完了後の遷移先。Step.1 / 2.1 / 2.2 / 2.3 のいずれからも呼ばれる。
          # Step.3（Deploy）→ Step.4（実測評価）→ 必須 Self-Improve の順にフォールバックする。
          activate_deploy_or_eval_or_finish() {
            local next_num
            next_num=$(get_sub_issue_number '\[AAGD\] Step\.3:')
            if [[ -n "${next_num}" ]]; then
              activate_issue "${next_num}"
              return 0
            fi
            echo "WARNING: Step.3 が見つかりません。Step.4 にフォールバック。"
            next_num=$(get_sub_issue_number '\[AAGD\] Step\.4:')
            if [[ -n "${next_num}" ]]; then
              activate_issue "${next_num}"
              return 0
            fi
            echo "WARNING: Step.4 も見つかりません。必須 Self-Improve 待ちにします。"
            mark_root_self_improve_ready
          }

          # ---- done Issue の title から Step 番号を特定 ----
          STEP_MATCH=$(echo "${DONE_ISSUE_TITLE}" | python3 /dev/fd/3 3<<'PY'
          import sys, re
          title = sys.stdin.read().strip()
          m = re.search(r'\[AAGD\] Step\.(\d+(?:\.\d+)?[A-Z]{0,2})', title)
          print(m.group(1) if m else '')
          PY
          )

          if [[ -z "${STEP_MATCH}" ]]; then
            echo "Step 番号が特定できません（title: ${DONE_ISSUE_TITLE}）。スキップ。"
            exit 0
          fi

          echo "完了した Step: ${STEP_MATCH}"

          # ---- Root Issue 番号の取得 ----
          ROOT_ISSUE=$(python3 - <<'PY'
          import os, re
          body = os.environ.get('DONE_ISSUE_BODY', '')
          m = re.search(r'<!-- root-issue: #(\d+) -->', body)
          print(m.group(1) if m else '')
          PY
          )

          if [[ -z "${ROOT_ISSUE}" ]]; then
            echo "Root Issue 番号が取得できません。スキップ。"
            exit 0
          fi

          echo "Root Issue: #${ROOT_ISSUE}"

          # ---- ブランチ名の取得 ----
          BRANCH=$(python3 - <<'PY'
          import os, re
          body = os.environ.get('DONE_ISSUE_BODY', '')
          m = re.search(r'<!-- branch: (.+?) -->', body)
          print(m.group(1).strip() if m else 'main')
          PY
          )

          echo "対象ブランチ: ${BRANCH}"

          # ---- adversarial-review / auto-qa PR ラベル付与 ----
          ADVERSARIAL_REVIEW=$(python3 - <<'PY'
          import os, re
          body = os.environ.get('DONE_ISSUE_BODY', '')
          m = re.search(r'<!--\s*adversarial-review:\s*(true|false)\s*-->', body)
          print(m.group(1) if m else 'false')
          PY
          )
          AUTO_QA=$(python3 - <<'PY'
          import os, re
          body = os.environ.get('DONE_ISSUE_BODY', '')
          m = re.search(r'<!--\s*auto-qa:\s*(true|false)\s*-->', body)
          print(m.group(1) if m else 'false')
          PY
          )
          if [[ "${ADVERSARIAL_REVIEW}" == "true" ]] || [[ "${AUTO_QA}" == "true" ]]; then
            # Timeline API で Issue を close する open PR を逆引き（gh pr list --search では "closes:#N" 構文が機能しないため）
            LINKED_PRS=$(gh api "/repos/${REPO}/issues/${DONE_ISSUE_NUMBER}/timeline?per_page=100" \
              --jq '[.[] | select(.event == "cross-referenced" and .source.type == "pull_request" and .source.issue.state == "open") | .source.issue.number] | unique | .[]' \
              2>/dev/null || true)
            if [[ -n "${LINKED_PRS}" ]]; then
              while IFS= read -r pr_num; do
                if [[ "${ADVERSARIAL_REVIEW}" == "true" ]]; then
                  gh pr edit "${pr_num}" --repo "${REPO}" --add-label "adversarial-review" 2>/dev/null \
                    && echo "PR #${pr_num} に adversarial-review ラベルを付与しました。" \
                    || echo "WARNING: PR #${pr_num} への adversarial-review ラベル付与に失敗しました。" >&2
                fi
                if [[ "${AUTO_QA}" == "true" ]]; then
                  gh pr edit "${pr_num}" --repo "${REPO}" --add-label "auto-qa" 2>/dev/null \
                    && echo "PR #${pr_num} に auto-qa ラベルを付与しました。" \
                    || echo "WARNING: PR #${pr_num} への auto-qa ラベル付与に失敗しました。" >&2
                fi
              done <<< "${LINKED_PRS}"
            fi
          fi

          # ---- Root Issue の Sub Issues を取得して Step Issue を特定 ----
          get_sub_issue_number() {
            local pattern="$1"
            # Root Issue から全 Sub Issues を取得
            local resp
            resp=$(api_call GET \
              "https://api.github.com/repos/${REPO}/issues/${ROOT_ISSUE}/sub_issues")
            echo "${resp}" | python3 /dev/fd/3 "${pattern}" 3<<'PY'
          import sys, re, json
          issues = json.load(sys.stdin)
          pattern = sys.argv[1]
          for issue in issues:
              title = issue.get('title', '')
              if re.search(pattern, title):
                  print(issue['number'])
                  break
          PY
          }

          get_sub_issue_number_from_parent() {
            local parent_num="$1"
            local pattern="$2"
            local resp
            resp=$(api_call GET \
              "https://api.github.com/repos/${REPO}/issues/${parent_num}/sub_issues")
            echo "${resp}" | python3 /dev/fd/3 "${pattern}" 3<<'PY'
          import sys, re, json
          issues = json.load(sys.stdin)
          pattern = sys.argv[1]
          for issue in issues:
              title = issue.get('title', '')
              if re.search(pattern, title):
                  print(issue['number'])
                  break
          PY
          }

          mark_root_self_improve_ready() {
            _si_issue_json=$(gh api "/repos/${REPO}/issues/${ROOT_ISSUE}")
            _si_current_body=$(printf '%s' "${_si_issue_json}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('body','') or '')")
            _si_current_status=$(printf '%s' "${_si_current_body}" | sed -n 's/^.*<!-- aagd-self-improve-status: *\([^>]*\) *-->.*$/\1/p' | head -1 | tr '[:upper:]' '[:lower:]' | xargs || true)
            _si_has_ready=$(printf '%s' "${_si_issue_json}" | python3 -c "
          import sys, json
          labels = [item.get('name', '') for item in json.load(sys.stdin).get('labels', [])]
          print('true' if 'aagd:self-improve-ready' in labels else 'false')
          ")
            if [[ "${_si_current_status}" =~ ^(running|finalizing|completed)$ ]]; then
              echo "Root Issue #${ROOT_ISSUE}: status=${_si_current_status} のためpendingへ戻しません。"
              return 0
            fi
            if [[ "${_si_current_status}" == "pending" && "${_si_has_ready}" == "true" ]]; then
              echo "Root Issue #${ROOT_ISSUE}: Self-Improve pending/ready済みです。"
              return 0
            fi

            if ! python3 -m hve.cloud_aagd_gate \
              --repo "${REPO}" --root "${ROOT_ISSUE}"
            then
              gh issue edit "${ROOT_ISSUE}" --repo "${REPO}" --add-label "aagd:blocked" >/dev/null 2>&1 || true
              post_comment "${ROOT_ISSUE}" \
                "❌ TDDまたはDeploy gateが失敗しているため、Post-DAG Self-Improveへ進めません。失敗をSelf-Improveで成功扱いにはしません。" \
                || true
              return 1
            fi

            gh issue edit "${ROOT_ISSUE}" --repo "${REPO}" --remove-label "aagd:done" >/dev/null 2>&1 || true
            gh issue edit "${ROOT_ISSUE}" --repo "${REPO}" --remove-label "aagd:blocked" >/dev/null 2>&1 || true
            _si_body_file=$(mktemp)
            _si_payload_file=$(mktemp)
            printf '%s' "${_si_current_body}" > "${_si_body_file}"
            python3 - "${_si_body_file}" "${_si_payload_file}" <<'PY'
          import json, re, sys
          body = open(sys.argv[1], encoding='utf-8').read()
          tag = '<!-- aagd-self-improve-status: pending -->'
          pattern = re.compile(r'<!--\s*aagd-self-improve-status\s*:[^>]*-->')
          body = pattern.sub(tag, body, count=1) if pattern.search(body) else body.rstrip() + '\n' + tag + '\n'
          with open(sys.argv[2], 'w', encoding='utf-8') as handle:
              json.dump({'body': body}, handle, ensure_ascii=False)
          PY
            gh api --method PATCH "/repos/${REPO}/issues/${ROOT_ISSUE}" --input "${_si_payload_file}" >/dev/null
            rm -f "${_si_body_file}" "${_si_payload_file}"
            add_label "${ROOT_ISSUE}" "aagd:self-improve-ready"
            post_comment "${ROOT_ISSUE}" \
              "⏳ AAGDの全実装・テスト・Deploy Stepが完了しました。必須Post-DAG Self-Improveを実行してから最終完了へ遷移します。" \
              || true
          }

          # ---- 依存関係マップに基づき次 Step を特定 & 起動 ----
          case "${STEP_MATCH}" in
            "1")
              # Step.1 完了 → Step.2.1（なければ Step.3）を起動
              S2_NUM=$(get_sub_issue_number '\[AAGD\] Step\.2:')
              _NEXT=""
              if [[ -n "${S2_NUM}" ]]; then
                _NEXT=$(get_sub_issue_number_from_parent "${S2_NUM}" '\[AAGD\] Step\.2\.1:')
              fi
              if [[ -n "${_NEXT}" ]]; then
                activate_issue "${_NEXT}"
                echo "Step.1 完了: Step.2.1 (#${_NEXT}) を起動しました。"
              else
                activate_deploy_or_eval_or_finish
              fi
              ;;

            "2.1")
              # Step.2.1 完了 → Step.2.2（なければ Step.2.3 → Step.3）を起動
              S2_NUM=$(get_sub_issue_number '\[AAGD\] Step\.2:')
              _NEXT=""
              if [[ -n "${S2_NUM}" ]]; then
                _NEXT=$(get_sub_issue_number_from_parent "${S2_NUM}" '\[AAGD\] Step\.2\.2:')
                if [[ -z "${_NEXT}" ]]; then
                  _NEXT=$(get_sub_issue_number_from_parent "${S2_NUM}" '\[AAGD\] Step\.2\.3:')
                fi
              fi
              if [[ -n "${_NEXT}" ]]; then
                activate_issue "${_NEXT}"
              else
                [[ -n "${S2_NUM}" ]] && add_label "${S2_NUM}" "aagd:done"
                activate_deploy_or_eval_or_finish
              fi
              ;;

            "2.2")
              # Step.2.2 完了 → Step.2.3 を起動
              S2_NUM=$(get_sub_issue_number '\[AAGD\] Step\.2:')
              _NEXT=""
              if [[ -n "${S2_NUM}" ]]; then
                _NEXT=$(get_sub_issue_number_from_parent "${S2_NUM}" '\[AAGD\] Step\.2\.3:')
              fi
              if [[ -n "${_NEXT}" ]]; then
                activate_issue "${_NEXT}"
              else
                [[ -n "${S2_NUM}" ]] && add_label "${S2_NUM}" "aagd:done"
                activate_deploy_or_eval_or_finish
              fi
              ;;

            "2.3")
              # Step.2.3 完了 → Step.2 コンテナに aagd:done → Step.3 を起動
              S2_NUM=$(get_sub_issue_number '\[AAGD\] Step\.2:')
              if [[ -n "${S2_NUM}" ]]; then
                add_label "${S2_NUM}" "aagd:done"
                echo "Step.2 コンテナに aagd:done を付与しました。"
              fi
              activate_deploy_or_eval_or_finish
              ;;

            "3")
              # Step.3 完了 → Step.4（なければ必須 Self-Improve 待ち）
              S4_NUM=$(get_sub_issue_number '\[AAGD\] Step\.4:')
              if [[ -n "${S4_NUM}" ]]; then
                activate_issue "${S4_NUM}"
                echo "Step.3 完了: Step.4 (#${S4_NUM}) を起動しました。"
              else
                mark_root_self_improve_ready
              fi
              ;;

            "4")
              # Step.4 完了 → AAGD の最終 Step。必須 Self-Improve 待ちへ
              mark_root_self_improve_ready
              ;;

            *)
              echo "未定義の Step: ${STEP_MATCH}。スキップ。"
              ;;
          esac
          # ── 自動クローズ判定（auto-merge 有効時）──────────────
          if [[ -f "${GITHUB_WORKSPACE}/.github/scripts/bash/lib/auto-close.sh" ]]; then
            source "${GITHUB_WORKSPACE}/.github/scripts/bash/lib/auto-close.sh"

            # コンテナ Issue の自動クローズ判定
            _AC_CONTAINER_NUM=""
            if [[ "${DONE_ISSUE_TITLE}" =~ ^\[AAGD\]\ Step\.[0-9]+\.[0-9] ]]; then
              _AC_PARENT_STEP=$(echo "${DONE_ISSUE_TITLE}" \
                | grep -oP '\[AAGD\]\s*Step\.\K\d+' | head -1)
              if [[ -n "${_AC_PARENT_STEP}" ]]; then
                _AC_CONTAINER_NUM=$(gh api --paginate \
                  "/repos/${REPO}/issues/${ROOT_ISSUE}/sub_issues?per_page=100" \
                  --jq ".[] | select(.title | test(\"\\\\[AAGD\\\\] Step\\\\.${_AC_PARENT_STEP}:\")) | .number" \
                  2>/dev/null | head -1) || _AC_CONTAINER_NUM=""
              fi
            fi

            if [[ -n "${_AC_CONTAINER_NUM}" && "${_AC_CONTAINER_NUM}" =~ ^[0-9]+$ ]]; then
              echo "=== コンテナ Issue #${_AC_CONTAINER_NUM} の自動クローズ判定 ==="
              auto_close_container_if_done "${_AC_CONTAINER_NUM}" "${REPO}" || true
            fi

            echo "Root Issue #${ROOT_ISSUE} の自動クローズは必須Self-Improve成功後まで延期します。"
          fi

      # ----------------------------------------------------------------
      # 4.5. closed イベント時のコンテナ/Root 自動クローズ判定
      # ----------------------------------------------------------------
      - name: コンテナ自動クローズ判定（closed イベント）
        if: steps.gate.outputs.mode == 'container_close_check'
        env:
          DONE_ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
        run: |
          set -euo pipefail

          # ── 完了した Issue の情報取得 ──
          if ! DONE_ISSUE_JSON=$(gh api "/repos/${REPO}/issues/${DONE_ISSUE_NUMBER}" 2>/dev/null); then
            echo "::warning::Issue #${DONE_ISSUE_NUMBER} の取得に失敗しました（削除済みまたはアクセス不可）。"
            DONE_ISSUE_JSON='{}'
          fi
          DONE_ISSUE_TITLE=$(printf '%s' "${DONE_ISSUE_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('title',''))")
          DONE_ISSUE_BODY=$(printf '%s' "${DONE_ISSUE_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('body','') or '')")

          # ── Root Issue 番号の抽出 ──
          ROOT_ISSUE=$(echo "${DONE_ISSUE_BODY}" | python3 /dev/fd/3 3<<'PY'
          import sys, re
          b = sys.stdin.read()
          m = re.search(r'<!--\s*root-issue:\s*#(\d+)\s*-->', b)
          print(m.group(1) if m else '')
          PY
          )

          if [[ -z "${ROOT_ISSUE}" || ! "${ROOT_ISSUE}" =~ ^[0-9]+$ ]]; then
            echo "Root Issue を特定できないためスキップ。"
            exit 0
          fi
          echo "Root Issue: #${ROOT_ISSUE}"

          # ── auto-close.sh の読み込み ──
          if [[ ! -f "${GITHUB_WORKSPACE}/.github/scripts/bash/lib/auto-close.sh" ]]; then
            echo "auto-close.sh が見つかりません。スキップ。"
            exit 0
          fi
          source "${GITHUB_WORKSPACE}/.github/scripts/bash/lib/auto-close.sh"

          # ── コンテナ Issue の自動クローズ判定 ──
          _AC_CONTAINER_NUM=""
          if [[ "${DONE_ISSUE_TITLE}" =~ ^\[AAGD\]\ Step\.[0-9]+\.[0-9] ]]; then
            _AC_PARENT_STEP=$(echo "${DONE_ISSUE_TITLE}" \
              | grep -oP '\[AAGD\]\s*Step\.\K\d+' | head -1)
            if [[ -n "${_AC_PARENT_STEP}" ]]; then
              _AC_CONTAINER_NUM=$(gh api --paginate \
                "/repos/${REPO}/issues/${ROOT_ISSUE}/sub_issues?per_page=100" \
                --jq ".[] | select(.title | test(\"\\\\[AAGD\\\\] Step\\\\.${_AC_PARENT_STEP}:\")) | .number" \
                2>/dev/null | head -1) || _AC_CONTAINER_NUM=""
            fi
          fi

          if [[ -n "${_AC_CONTAINER_NUM}" && "${_AC_CONTAINER_NUM}" =~ ^[0-9]+$ ]]; then
            echo "=== コンテナ Issue #${_AC_CONTAINER_NUM} の自動クローズ判定 ==="
            auto_close_container_if_done "${_AC_CONTAINER_NUM}" "${REPO}" || true
          else
            echo "コンテナ Issue が特定できないためスキップ。"
          fi

          # Root Issue の自動クローズは必須Self-Improve成功後にのみ行う。
          echo "Root Issue #${ROOT_ISSUE} の自動クローズはSelf-Improve完了待ちです。"

  self-improve:
    needs: orchestrate
    if: needs.orchestrate.result == 'success'
    runs-on: ${{ fromJSON(inputs.runner_type == 'self-hosted' && '["self-hosted","linux","x64","aca"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 180
    concurrency:
      group: ai-agent-root-state-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Resolve completed Root Issue and Self-Improve settings
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          current_body=$(gh api "/repos/${REPO}/issues/${ISSUE_NUMBER}" --jq '.body // ""')
          root_issue=$(printf '%s' "${current_body}" | sed -n 's/^.*<!-- root-issue: #\([0-9][0-9]*\) -->.*$/\1/p' | head -1)
          [[ -z "${root_issue}" ]] && root_issue="${ISSUE_NUMBER}"

          root_json=$(gh api "/repos/${REPO}/issues/${root_issue}")
          body=$(printf '%s' "${root_json}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('body','') or '')")
          root_ready=$(printf '%s' "${root_json}" | python3 -c "
          import sys, json
          labels = [item.get('name', '') for item in json.load(sys.stdin).get('labels', [])]
          print('true' if 'aagd:self-improve-ready' in labels else 'false')
          ")
          status=$(printf '%s' "${body}" | sed -n 's/^.*<!-- aagd-self-improve-status: *\([^>]*\) *-->.*$/\1/p' | head -1 | tr '[:upper:]' '[:lower:]' | xargs || true)
          ready="false"
          if [[ "${status}" != "completed" ]] && {
            [[ "${root_ready}" == "true" ]] || [[ "${status}" =~ ^(running|finalizing)$ ]]
          }; then
            ready="true"
          fi

          max_iter=$(printf '%s' "${body}" | sed -n 's/^.*<!-- self-improve-max-iterations: *\([^>]*\) *-->.*$/\1/p' | head -1 | xargs || true)
          branch=$(printf "%s" "${body}" | sed -n 's/^.*<!-- branch: *\([^>]*\) *-->.*$/\1/p' | head -1 | xargs || true)
          quality_threshold=$(printf '%s' "${body}" | sed -n 's/^.*<!-- self-improve-quality-threshold: *\([^>]*\) *-->.*$/\1/p' | head -1 | xargs || true)
          if [[ -z "${max_iter}" ]]; then
            max_iter=$(printf '%s' "${body}" | python3 -c "
          import sys, re
          body = sys.stdin.read()
          m = re.search(r'###\s*自己改善\s*最大イテレーション数.*?\n+(.+)', body)
          if m:
              n = re.match(r'(\d+)', m.group(1).strip())
              print(n.group(1) if n else '3')
          else:
              print('3')
          " 2>/dev/null || echo "3")
          fi
          if [[ -z "${quality_threshold}" ]]; then
            quality_threshold=$(printf '%s' "${body}" | python3 -c "
          import sys, re
          body = sys.stdin.read()
          m = re.search(r'###\s*自己改善\s*品質スコア(?:目標値|閾値).*?\n+(.+)', body)
          if m:
              n = re.match(r'(\d+)', m.group(1).strip())
              print(n.group(1) if n else '80')
          else:
              print('80')
          " 2>/dev/null || echo "80")
          fi
          if [[ -z "${branch}" ]]; then
            branch=$(printf '%s' "${body}" | python3 -c "
          import sys, re
          body = sys.stdin.read()
          m = re.search(r'###\s*対象ブランチ.*?\n+(.+)', body)
          if m:
              val = m.group(1).strip()
              print(val if val and val != '_No response_' else 'main')
          else:
              print('main')
          " 2>/dev/null || echo "main")
          fi
          [[ -z "${max_iter}" ]] && max_iter="3"
          [[ -z "${quality_threshold}" ]] && quality_threshold="80"
          [[ -z "${branch}" ]] && branch="main"
          tool_search_policy=$(printf '%s' "${body}" | sed -n 's/^.*<!-- tool-search-policy: *\([^>]*\) *-->.*$/\1/p' | head -1 | xargs || true)
          case "${tool_search_policy}" in
            auto|yes|no) ;;
            "") tool_search_policy="auto" ;;
            *)
              echo "::error::Invalid tool search policy: ${tool_search_policy}" >&2
              exit 1
              ;;
          esac
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"
          echo "root_issue=${root_issue}" >> "$GITHUB_OUTPUT"
          echo "max_iter=${max_iter}" >> "$GITHUB_OUTPUT"
          echo "quality_threshold=${quality_threshold}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "tool_search_policy=${tool_search_policy}" >> "$GITHUB_OUTPUT"
          if [[ "${ready}" == "true" ]]; then
            git check-ref-format --branch "${branch}" >/dev/null 2>&1 || {
              echo "::error::Invalid AAGD target branch: ${branch}" >&2
              exit 1
            }
            encoded_branch=$(python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=''))" "${branch}")
            gh api "/repos/${REPO}/git/ref/heads/${encoded_branch}" >/dev/null 2>&1 || {
              echo "::error::AAGD target branch does not exist as refs/heads/${branch}" >&2
              exit 1
            }
            claim_payload=$(mktemp)
            printf '%s' "${body}" | python3 -c "
          import json, re, sys
          body = sys.stdin.read()
          tag = '<!-- aagd-self-improve-status: running -->'
          pattern = re.compile(r'<!--\\s*aagd-self-improve-status\\s*:[^>]*-->')
          body = pattern.sub(tag, body, count=1) if pattern.search(body) else body.rstrip() + '\\n' + tag + '\\n'
          json.dump({'body': body}, open(sys.argv[1], 'w', encoding='utf-8'), ensure_ascii=False)
          " "${claim_payload}"
            gh api --method PATCH "/repos/${REPO}/issues/${root_issue}" --input "${claim_payload}" >/dev/null
            rm -f "${claim_payload}"
          fi
          echo "AAGD Post-DAG Self-Improve: ready=${ready}, root=#${root_issue}, branch=${branch}"

      - uses: actions/checkout@v4
        if: steps.parse.outputs.ready == 'true'
        with:
          ref: ${{ steps.parse.outputs.branch }}

      - name: Verify checked out AAGD branch
        if: steps.parse.outputs.ready == 'true'
        env:
          BRANCH: ${{ steps.parse.outputs.branch }}
        run: |
          set -euo pipefail
          current=$(git symbolic-ref --short HEAD)
          [[ "${current}" == "${BRANCH}" ]] || {
            echo "::error::Expected branch ${BRANCH}, got ${current:-detached HEAD}" >&2
            exit 1
          }
      - name: Skip until AAGD Root completion or after completed run
        if: steps.parse.outputs.ready != 'true'
        run: echo "AAGD Root未完了、またはPost-DAG Self-Improve完了済みのため実行しません。"
      - uses: actions/setup-python@v5
        if: steps.parse.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.parse.outputs.ready == 'true'
        with:
          node-version: "20"
      - uses: actions/setup-dotnet@v4
        if: steps.parse.outputs.ready == 'true'
        with:
          dotnet-version: "10.0.x"
      - name: Install dependencies
        if: steps.parse.outputs.ready == 'true'
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)" || { git status --short >&2; exit 1; }
          pip install . ruff pytest pytest-cov
          while IFS= read -r -d '' requirements; do
            echo "Installing generated Agent dependencies: ${requirements}"
            pip install -r "${requirements}"
          done < <(find src/agent -type f -name requirements.txt -print0 2>/dev/null | sort -z)
          npm install -g markdownlint-cli
          test -z "$(git status --porcelain)" || {
            echo "::error::Dependency installation modified repository files." >&2
            git status --short >&2
            exit 1
          }
      - name: Revalidate AAGD TDD and Deploy gates before mutation
        if: steps.parse.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ROOT_ISSUE: ${{ steps.parse.outputs.root_issue }}
          TOOL_SEARCH_POLICY: ${{ steps.parse.outputs.tool_search_policy }}
        run: |
          python3 -m hve.cloud_aagd_gate \
            --repo "${REPO}" \
            --root "${ROOT_ISSUE}" \
            --repo-root "${PWD}" \
            --tool-search-policy "${TOOL_SEARCH_POLICY:-auto}" \
            --allow-root-self-improve-blocked
      - name: Run mandatory AAGD Post-DAG Self-Improve
        id: self_improve
        if: steps.parse.outputs.ready == 'true'
        env:
          MAX_ITERATIONS: ${{ steps.parse.outputs.max_iter }}
          QUALITY_THRESHOLD: ${{ steps.parse.outputs.quality_threshold }}
          ROOT_ISSUE: ${{ steps.parse.outputs.root_issue }}
          GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
          SELF_IMPROVE_RESULT_PATH: ${{ runner.temp }}/aagd-self-improve-result.json
          HVE_WORK_ROOT: ${{ runner.temp }}/hve-work
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from hve.config import SDKConfig
          from hve.orchestrator import (
              _agent_fanout_scope_precondition_error,
              _self_improve_result_succeeded,
              collect_workflow_output_paths,
          )
          from hve.self_improve import discover_task_goal_from_docs, run_improvement_loop

          repo_root = Path.cwd().resolve()
          output_paths = collect_workflow_output_paths('aagd', repo_root=repo_root)
          precondition_error = _agent_fanout_scope_precondition_error(
              'aagd', output_paths, repo_root
          )
          task_goal = discover_task_goal_from_docs(
              workflow_id='aagd',
              repo_root=str(repo_root),
          )['task_goal']

          config = SDKConfig.from_env()
          config.auto_self_improve = True
          config.self_improve_skip = False
          config.self_improve_scope = "workflow"
          config.self_improve_target_scope = ""
          config.self_improve_max_iterations = int(os.environ.get('MAX_ITERATIONS', '3'))
          config.self_improve_quality_threshold = int(os.environ.get('QUALITY_THRESHOLD', '80'))
          config.run_id = f"cloud-aagd-{os.environ['ROOT_ISSUE']}-{os.environ.get('GITHUB_RUN_ID', 'run')}"
          config.workflow_id = 'aagd'
          config._resolved_step_output_paths = output_paths
          config._resolved_workflow_default = ''
          config._resolved_scope_ceiling_paths = output_paths
          config._resolved_scope_precondition_error = precondition_error

          result = run_improvement_loop(
              config=config,
              repo_root=str(repo_root),
              work_dir=Path(os.environ['HVE_WORK_ROOT']) / 'self-improve',
              task_goal=task_goal,
          )
          Path(os.environ['SELF_IMPROVE_RESULT_PATH']).write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          print(f'Self-Improve: {result["stopped_reason"]} (score={result["final_score"]})')
          if not _self_improve_result_succeeded(result, task_goal):
              raise SystemExit(
                  'AAGD Post-DAG Self-Improve failed: '
                  f'{result["stopped_reason"]} / {result.get("blocked_reason", "")}'
              )
          PY
      - name: Commit improvements
        if: steps.parse.outputs.ready == 'true' && success()
        env:
          BRANCH: ${{ steps.parse.outputs.branch }}
          SELF_IMPROVE_RESULT_PATH: ${{ runner.temp }}/aagd-self-improve-result.json
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="${BRANCH}"

          git check-ref-format --branch "${branch}" >/dev/null 2>&1 || {
            echo "::error::Invalid branch name: ${branch}" >&2
            exit 1
          }

          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          result = json.loads(Path(os.environ['SELF_IMPROVE_RESULT_PATH']).read_text(encoding='utf-8'))
          allowed = {
              path
              for record in result.get('records', [])
              for path in record.get('changed_files', [])
              if isinstance(path, str) and path
          }
          def names(*args):
              output = subprocess.check_output(['git', '-c', 'core.quotepath=false', *args])
              return {
                  item.decode('utf-8', errors='surrogateescape').replace('\\', '/')
                  for item in output.split(b'\0') if item
              }
          actual = names('diff', '--name-only', '-z', 'HEAD', '--')
          actual |= names('ls-files', '--others', '--exclude-standard', '-z', '--')
          outside = sorted(actual - allowed)
          if outside:
              raise SystemExit(
                  'Refusing to stage scope-external AAGD Self-Improve changes: '
                  + ', '.join(outside)
              )
          for path in sorted(actual):
              subprocess.run(['git', 'add', '--', path], check=True)
          PY

          if git diff --cached --quiet; then
            echo "No Self-Improve changes to commit."
            exit 0
          fi

          git commit -m "[Self-Improve] 自動品質改善"

          git fetch origin "${branch}"
          if ! git merge-base --is-ancestor "origin/${branch}" HEAD; then
            echo "::error::origin/${branch} advanced during AAGD Self-Improve. Refusing unverified rebase/push; rerun from latest branch." >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/${branch}"

      - name: Record successful AAGD Self-Improve completion
        if: steps.parse.outputs.ready == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ROOT_ISSUE: ${{ steps.parse.outputs.root_issue }}
          SELF_IMPROVE_RESULT_PATH: ${{ runner.temp }}/aagd-self-improve-result.json
        run: |
          set -euo pipefail
          has_label() {
            gh issue view "${ROOT_ISSUE}" --repo "${REPO}" --json labels \
              --jq '.labels[].name' | grep -Fxq "$1"
          }
          ensure_label() {
            local label="$1"
            has_label "${label}" || gh issue edit "${ROOT_ISSUE}" --repo "${REPO}" --add-label "${label}" >/dev/null
            has_label "${label}" || { echo "::error::Failed to add ${label}" >&2; return 1; }
          }
          ensure_no_label() {
            local label="$1"
            if has_label "${label}"; then
              gh issue edit "${ROOT_ISSUE}" --repo "${REPO}" --remove-label "${label}" >/dev/null
            fi
            ! has_label "${label}" || { echo "::error::Failed to remove ${label}" >&2; return 1; }
          }
          body_file=$(mktemp)
          payload_file=$(mktemp)
          gh api "/repos/${REPO}/issues/${ROOT_ISSUE}" --jq '.body // ""' > "${body_file}"
          python3 - "${body_file}" "${payload_file}" <<'PY'
          import json, re, sys
          body = open(sys.argv[1], encoding='utf-8').read()
          tag = '<!-- aagd-self-improve-status: finalizing -->'
          pattern = re.compile(r'<!--\s*aagd-self-improve-status\s*:[^>]*-->')
          body = pattern.sub(tag, body, count=1) if pattern.search(body) else body.rstrip() + '\n' + tag + '\n'
          json.dump({'body': body}, open(sys.argv[2], 'w', encoding='utf-8'), ensure_ascii=False)
          PY
          gh api --method PATCH "/repos/${REPO}/issues/${ROOT_ISSUE}" --input "${payload_file}" >/dev/null

          result_summary=$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['SELF_IMPROVE_RESULT_PATH']).read_text(encoding='utf-8'))
          print(f"reason={result['stopped_reason']}, score={result['final_score']}, iterations={result['iterations_completed']}")
          PY
          )
          gh issue comment "${ROOT_ISSUE}" --repo "${REPO}" \
            --body "✅ AAGD Post-DAG Self-Improve 完了: ${result_summary}" || true
          ensure_no_label "aagd:blocked"
          ensure_no_label "aagd:test-failed"
          ensure_label "aagd:done"
          ensure_no_label "aagd:self-improve-ready"
          if [[ -f "${GITHUB_WORKSPACE}/.github/scripts/bash/lib/auto-close.sh" ]]; then
            source "${GITHUB_WORKSPACE}/.github/scripts/bash/lib/auto-close.sh"
            root_json=$(gh api "/repos/${REPO}/issues/${ROOT_ISSUE}")
            auto_merge_enabled=$(_is_auto_merge_enabled "${root_json}" || true)
            auto_close_root_if_all_done "${ROOT_ISSUE}" "${REPO}"
            if [[ "${auto_merge_enabled}" == "true" ]]; then
              state=$(gh issue view "${ROOT_ISSUE}" --repo "${REPO}" --json state --jq '.state')
              [[ "${state}" == "CLOSED" ]] || {
                echo "::error::AAGD Root auto-close was required but state=${state}" >&2
                exit 1
              }
            fi
          fi

          gh api "/repos/${REPO}/issues/${ROOT_ISSUE}" --jq '.body // ""' > "${body_file}"
          python3 - "${body_file}" "${payload_file}" <<'PY'
          import json, re, sys
          body = open(sys.argv[1], encoding='utf-8').read()
          body = re.sub(
              r'<!--\s*aagd-self-improve-status\s*:[^>]*-->',
              '<!-- aagd-self-improve-status: completed -->',
              body,
              count=1,
          )
          json.dump({'body': body}, open(sys.argv[2], 'w', encoding='utf-8'), ensure_ascii=False)
          PY
          gh api --method PATCH "/repos/${REPO}/issues/${ROOT_ISSUE}" --input "${payload_file}" >/dev/null
          rm -f "${body_file}" "${payload_file}"

      - name: Mark AAGD Root blocked when mandatory Self-Improve fails
        if: ${{ always() && steps.parse.outputs.ready == 'true' && (failure() || cancelled()) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ROOT_ISSUE: ${{ steps.parse.outputs.root_issue }}
          SELF_IMPROVE_OUTCOME: ${{ steps.self_improve.outcome }}
        run: |
          set -euo pipefail
          has_label() {
            gh issue view "${ROOT_ISSUE}" --repo "${REPO}" --json labels \
              --jq '.labels[].name' | grep -Fxq "$1"
          }
          ensure_label() {
            local label="$1"
            has_label "${label}" || gh issue edit "${ROOT_ISSUE}" --repo "${REPO}" --add-label "${label}" >/dev/null
            has_label "${label}" || { echo "::error::Failed to add ${label}" >&2; return 1; }
          }
          ensure_no_label() {
            local label="$1"
            if has_label "${label}"; then
              gh issue edit "${ROOT_ISSUE}" --repo "${REPO}" --remove-label "${label}" >/dev/null
            fi
            ! has_label "${label}" || { echo "::error::Failed to remove ${label}" >&2; return 1; }
          }
          state=$(gh issue view "${ROOT_ISSUE}" --repo "${REPO}" --json state --jq '.state')
          if [[ "${state}" != "OPEN" ]]; then
            gh issue reopen "${ROOT_ISSUE}" --repo "${REPO}" >/dev/null
          fi
          state=$(gh issue view "${ROOT_ISSUE}" --repo "${REPO}" --json state --jq '.state')
          [[ "${state}" == "OPEN" ]] || { echo "::error::Failed to reopen Root" >&2; exit 1; }
          ensure_no_label "aagd:done"
          ensure_label "aagd:self-improve-ready"
          ensure_label "aagd:blocked"
          if [[ "${SELF_IMPROVE_OUTCOME}" == "success" ]]; then
            failure_message="❌ AAGD Post-DAG Self-Improve本体は成功しましたが、commit/pushまたはRoot最終化に失敗しました。Actionsログを確認し、このworkflow runを手動Re-runしてください。"
          else
            failure_message="❌ 必須のAAGD Post-DAG Self-Improveが成功条件を満たしませんでした。Actionsログを確認し、このworkflow runを手動Re-runしてください。TDD/Deploy失敗をSelf-Improveで成功扱いにはしません。"
          fi
          gh issue comment "${ROOT_ISSUE}" --repo "${REPO}" \
            --body "${failure_message}" || true
          body_file=$(mktemp)
          payload_file=$(mktemp)
          gh api "/repos/${REPO}/issues/${ROOT_ISSUE}" --jq '.body // ""' > "${body_file}"
          python3 - "${body_file}" "${payload_file}" <<'PY'
          import json, re, sys
          body = open(sys.argv[1], encoding='utf-8').read()
          tag = '<!-- aagd-self-improve-status: pending -->'
          pattern = re.compile(r'<!--\s*aagd-self-improve-status\s*:[^>]*-->')
          body = pattern.sub(tag, body, count=1) if pattern.search(body) else body.rstrip() + '\n' + tag + '\n'
          json.dump({'body': body}, open(sys.argv[2], 'w', encoding='utf-8'), ensure_ascii=False)
          PY
          gh api --method PATCH "/repos/${REPO}/issues/${ROOT_ISSUE}" --input "${payload_file}" >/dev/null
          rm -f "${body_file}" "${payload_file}"
