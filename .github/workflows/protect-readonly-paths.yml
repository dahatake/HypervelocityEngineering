name: Protect Read-Only Paths

# PR で以下のパスへの変更を禁止する:
#   - docs-original/ 配下のファイル (.github/copilot-instructions.md §0「docs-original/ 読み取り専用（絶対）」)
#     ただし旧 original-docs/ から同じ相対パスへ移す初回リネームだけは許可する。
#   - リポジトリルート直下への新規ファイル／ディレクトリ追加
#     (.github/copilot-instructions.md §0「一時作業ファイルは work/ 配下に限定（絶対）」)
#
# 注: ルート README.md の変更制限は解除済み
#     (.github/copilot-instructions.md §0「ルート README.md の扱い」)。
#     check-readme ジョブは解除を明示する no-op として残している。
#
# 注: paths フィルタを使うと違反のない PR ではチェック自体が実行されず、
#     ブランチ保護の必須チェックとして機能しない。全 PR で実行し、
#     ジョブ内の差分検出で違反時のみ fail する構成にする。
#
# トリガー: 全 PR の作成・更新時

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  check-readme:
    name: ルート README.md 変更禁止チェック（無効）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ルート README.md 変更許可
        run: |
          echo "ℹ️ ルート README.md への変更制限は解除されています。"
          echo "（リポジトリオーナーによる明示的な許可: 2026-05-05）"

  check-docs-original:
    name: docs-original/ 読み取り専用チェック
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: docs-original/ 配下の変更を検出
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if ! DOCS_ORIGINAL_CHANGES=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '
            .[]
            | select(
                (.filename | startswith("docs-original/"))
                or ((.previous_filename // "") | startswith("docs-original/"))
              )
            | [.status, .filename, (.previous_filename // "")]
            | @tsv
          '); then
            echo "::error::PR の docs-original/ 差分取得に失敗しました（PR: #${PR_NUMBER}）"
            exit 1
          fi

          READONLY_VIOLATIONS=""
          while IFS=$'\t' read -r status filename previous_filename; do
            [ -z "${status}" ] && continue

            destination_relative="${filename#docs-original/}"
            source_relative="${previous_filename#original-docs/}"
            if [ "${status}" = "renamed" ] \
              && [[ "${filename}" == docs-original/* ]] \
              && [[ "${previous_filename}" == original-docs/* ]] \
              && [ "${source_relative}" = "${destination_relative}" ]; then
              echo "ℹ️ 初回原本移行を許可: ${previous_filename} -> ${filename}"
              continue
            fi

            READONLY_VIOLATIONS="${READONLY_VIOLATIONS}  - ${status}: ${previous_filename:-<none>} -> ${filename}"$'\n'
          done <<< "${DOCS_ORIGINAL_CHANGES}"

          if [ -n "${READONLY_VIOLATIONS}" ]; then
            echo "::error::docs-original/ 配下の許可されていない変更が検出されました。"
            echo ""
            echo ".github/copilot-instructions.md §0 ルール:"
            echo "  「docs-original/ 読み取り専用（絶対）: docs-original/ 配下のファイルは全 Agent から読み取り専用。変更・削除・追記を禁止。」"
            echo "  例外: original-docs/ から docs-original/ への同じ相対パスの rename のみ。"
            echo ""
            echo "変更されたファイル:"
            echo "${READONLY_VIOLATIONS}"
            exit 1
          fi

          echo "✅ docs-original/ への変更はありません。"

  check-root-temp-files:
    name: ルート直下 一時ファイル作成禁止チェック
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ルート直下への新規追加を許可リストと突合
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # ルート直下へ新規追加してよいファイル（リポジトリ標準の設定ファイル等）。
          ROOT_FILE_ALLOWLIST=$(cat <<'EOF'
          .editorconfig
          .gitattributes
          .gitignore
          babel.config.js
          CHANGELOG.md
          cq.toml
          hve.cmd
          hve.sh
          jest.config.js
          LICENSE
          mdq.toml
          package-lock.json
          package.json
          playwright.config.js
          pyproject.toml
          README.md
          EOF
          )

          # ルート直下へ新規追加してよいディレクトリ。
          ROOT_DIR_ALLOWLIST=$(cat <<'EOF'
          .github
          .vscode
          cq
          docs
          docs-generated
          docs-original
          hve
          hve-dev
          knowledge
          mdq
          qa
          sample
          src
          template
          test
          tests
          tools
          users-guide
          work
          EOF
          )

          if ! ADDED_FILES=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[] | select(.status == "added") | .filename'); then
            echo "::error::PR のファイル一覧取得に失敗しました（PR: #${PR_NUMBER}）"
            exit 1
          fi

          VIOLATIONS=""
          while IFS= read -r path; do
            [ -z "${path}" ] && continue
            top="${path%%/*}"
            if [ "${top}" = "${path}" ]; then
              ALLOWLIST="${ROOT_FILE_ALLOWLIST}"
            else
              ALLOWLIST="${ROOT_DIR_ALLOWLIST}"
            fi
            if ! printf '%s\n' "${ALLOWLIST}" | grep -qxF -- "${top}"; then
              VIOLATIONS="${VIOLATIONS}  - ${path}"$'\n'
            fi
          done <<< "${ADDED_FILES}"

          if [ -n "${VIOLATIONS}" ]; then
            echo "::error::リポジトリルート直下への新規ファイル／ディレクトリ追加が検出されました。"
            echo ""
            echo ".github/copilot-instructions.md §0 ルール:"
            echo "  「一時作業ファイルは work/ 配下に限定（絶対）: 一時作業ファイルをリポジトリルート直下（/）に作成してはならない。」"
            echo ""
            echo "検出されたパス:"
            printf '%s' "${VIOLATIONS}"
            echo "対処:"
            echo "  - 一時作業ファイルであれば work/run/<run-id>/<task>/artifacts/ 配下へ移動する。"
            echo "  - 恒久的に必要なファイルであれば、本ワークフローの ROOT_FILE_ALLOWLIST / ROOT_DIR_ALLOWLIST を同じ PR で更新する。"
            exit 1
          fi

          echo "✅ ルート直下への不正な新規追加はありません。"
