name: ebak-verify

# EABK Lite: the deterministic checks (rdcheck profile from scripts/ebak.config.json, default "lite") and the
# project commands in verify.commands run here for every push and pull request, so the rules in AGENTS.md hold
# for every person and every PC without relying on prompts.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install pytest (for Python projects; add your own toolchain for verify.commands below)
        run: python -m pip install pytest
      # Add the toolchain your verify.commands need (for example actions/setup-node + npm ci) above this step.
      - name: verify
        run: bash scripts/verify.sh --show-warnings
