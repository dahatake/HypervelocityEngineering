name: Plan Validation and Labeling

on:
  pull_request:
    paths:
      - 'work/**/plan.md'

jobs:
  validate-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate changed plan files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          # Pull Request files API を全ページ取得し、300ファイル超のPRも検査する。
          if ! ALL_CHANGED=$(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
              --jq '.[].filename'
          ); then
            echo "::error::Pull Request files API の取得に失敗しました（PR: #${PR_NUMBER}）"
            exit 1
          fi

          ACTUAL_CHANGED_FILES=$(printf '%s\n' "$ALL_CHANGED" | grep -c . || true)
          if [ "$ACTUAL_CHANGED_FILES" -ne "$EXPECTED_CHANGED_FILES" ]; then
            echo "::error::Pull Request files API が一部のファイルしか返しませんでした（期待: ${EXPECTED_CHANGED_FILES}、取得: ${ACTUAL_CHANGED_FILES}）"
            exit 1
          fi

          CHANGED_PLANS=$(echo "$ALL_CHANGED" | grep -E '^work/.*/plan\.md$' || true)

          if [ -z "$CHANGED_PLANS" ]; then
            echo "✅ この PR で変更された plan.md はありません。チェックをスキップします。"
            exit 0
          fi

          echo "📋 検査対象の plan.md:"
          echo "$CHANGED_PLANS" | while IFS= read -r p; do echo "  - $p"; done

          HAS_ERROR=false

          while IFS= read -r plan; do
            if [ ! -f "$plan" ]; then
              echo "⏭️ $plan は削除されたためスキップします。"
              continue
            fi

            if ! bash .github/scripts/bash/validate-plan.sh --path "$plan"; then
              HAS_ERROR=true
            fi
          done <<< "$CHANGED_PLANS"

          if [ "$HAS_ERROR" = true ]; then
            exit 1
          fi

          echo "✅ 全チェック完了（違反なし）"

  label-split-mode:
    needs: [validate-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Add or remove subissues labels based on PR diff
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              }
            );

            const changedSubissues = files
              .filter(f => /^(added|modified|renamed)$/.test(f.status))
              .filter(f => /^work\/.*\/subissues\.md$/.test(f.filename));

            core.info(`PR diff に含まれる subissues.md: ${changedSubissues.length} 件`);
            for (const p of changedSubissues) {
              core.info(`  - ${p.filename} (${p.status})`);
            }

            const prNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (changedSubissues.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: ['split-mode', 'plan-only']
              });
              core.info('✅ subissues.md 変更により split-mode / plan-only ラベルを付与しました。');
            } else {
              core.info('PR 差分に追加・変更された subissues.md はありません。');

              const currentLabels = await github.paginate(
                github.rest.issues.listLabelsOnIssue,
                {
                  owner,
                  repo,
                  issue_number: prNumber,
                  per_page: 100,
                }
              );
              const labelNames = currentLabels.map(l => l.name);

              for (const label of ['split-mode', 'plan-only']) {
                if (!labelNames.includes(label)) continue;
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: prNumber,
                    name: label,
                  });
                  core.info(`🏷️ ${label} ラベルを除去しました。`);
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
              }
              core.info('✅ ラベル除去チェック完了。');
            }
