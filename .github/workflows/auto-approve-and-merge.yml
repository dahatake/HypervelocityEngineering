name: PR 自動 Approve & Auto-merge

# auto-approve-ready ラベルが付与された PR に対して、自動 Approve → auto-merge（squash）を有効化する。
#
# 安全装置:
#   - split-mode は auto-approve/merge 対象外。create-subissues 遷移は PR Transition Dispatcher が所有
#   - 冪等化マーカー（done/partial/failed）で重複実行防止とリトライ制御
#   - 既存 Approve レビューの API 直接確認（dismiss 考慮）
#   - Approve/Merge 失敗時のグレースフルフォールバック（手動対応を促すコメント）
#
# 注意:
#   - pull_request_target を使用（Copilot が作成した PR のブランチには
#     ワークフロー定義がない可能性があるため、ベースブランチの定義で実行）
#   - COPILOT_PAT 優先、未設定時は GITHUB_TOKEN にフォールバック
#   - ${{ }} 式をシェル変数に直接展開せず、env 経由で渡す（スクリプトインジェクション対策）

on:
  pull_request_target:
    types: [labeled, ready_for_review, synchronize, edited]

concurrency:
  group: auto-approve-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  notify-split-mode-skip:
    if: >
      (
        (github.event.action == 'labeled' && github.event.label.name == 'auto-approve-ready')
        || (github.event.action == 'ready_for_review' && contains(github.event.pull_request.labels.*.name, 'auto-approve-ready'))
        || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'auto-approve-ready'))
        || (github.event.action == 'edited' && contains(github.event.pull_request.labels.*.name, 'auto-approve-ready'))
      )
      && contains(github.event.pull_request.labels.*.name, 'split-mode')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: 冪等チェック
        id: guard
        run: |
          set -euo pipefail
          marker='<!-- auto-approve-and-merge-skipped-split-mode -->'
          existing=$(gh api "/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq '.[]' 2>/dev/null \
            | jq -s --arg marker "${marker}" '[.[] | select(.body | contains($marker))] | length' \
            2>/dev/null) || existing=0
          if [ "${existing:-0}" -gt 0 ]; then
            echo "posted=true" >> "${GITHUB_OUTPUT}"
          else
            echo "posted=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: スキップ通知コメント投稿
        if: steps.guard.outputs.posted != 'true'
        run: |
          set -euo pipefail
          comment_body=$(printf '%s\n\n%s\n\n%s\n%s' \
            '<!-- auto-approve-and-merge-skipped-split-mode -->' \
            '## ℹ️ split-mode のため auto-approve/auto-merge をスキップしました' \
            'この PR は `split-mode` のため `auto-approve-and-merge.yml` 対象外です。' \
            '`create-subissues` 遷移は `auto-pr-transition-dispatcher.yml` が strict gate（`split-mode` + `auto-approve-ready`）確認後に担当します。')
          gh pr comment "${PR_NUMBER}" \
            --repo "${REPO}" \
            --body "${comment_body}"

  approve-and-merge:
    # labeled イベント: auto-approve-ready ラベルが付与された時
    # ready_for_review イベント: draft → ready 遷移後に auto-approve-ready ラベルがある場合
    # edited イベント: PR body 変更後に検証マーカーが追加された場合の再評価
    # （draft 中にラベルが付いた場合、labeled では !draft 条件を満たさず実行されないため）
    if: >
      (
        (
          github.event.action == 'labeled'
          && github.event.label.name == 'auto-approve-ready'
        )
        || (
          github.event.action == 'ready_for_review'
          && contains(github.event.pull_request.labels.*.name, 'auto-approve-ready')
        )
        || (
          github.event.action == 'synchronize'
          && contains(github.event.pull_request.labels.*.name, 'auto-approve-ready')
        )
        || (
          github.event.action == 'edited'
          && contains(github.event.pull_request.labels.*.name, 'auto-approve-ready')
        )
      )
      && !github.event.pull_request.draft
      && !contains(github.event.pull_request.labels.*.name, 'split-mode')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    env:
      GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: 判定スクリプトをチェックアウト（base 側、trusted）
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: PR コードをチェックアウト（G-DIFF 検証対象データとしてのみ、subject）
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: subject
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: 冪等化チェック（既に完了・Approve 済みかどうか確認）
        id: guard
        run: |
          set -euo pipefail

          # <!-- auto-approve-and-merge-done --> は完全成功済み（再実行不要）
          MARKER_DONE="<!-- auto-approve-and-merge-done -->"
          existing_done=$(gh api "/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq '.[]' 2>/dev/null \
            | jq -s --arg marker "${MARKER_DONE}" '[.[] | select(.body | contains($marker))] | length' \
            2>/dev/null) || existing_done=0
          echo "done マーカーコメント数: ${existing_done}"

          if [ "${existing_done:-0}" -gt 0 ]; then
            echo "auto-approved マーカーが存在します。ワークフロー完了済みです。スキップします。"
            echo "already_done=true" >> "${GITHUB_OUTPUT}"
            echo "already_approved=true" >> "${GITHUB_OUTPUT}"
            echo "is_retry=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # failed マーカーは同一 head SHA での再実行を抑止（コメントスパム防止）
          MARKER_FAILED="<!-- auto-approve-and-merge-failed -->"
          SHA_MARKER="<!-- auto-approve-and-merge-head-sha: ${HEAD_SHA} -->"
          existing_failed_same_sha=$(gh api "/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq '.[]' \
            | jq -s --arg marker "${MARKER_FAILED}" --arg sha_marker "${SHA_MARKER}" \
              '[.[] | select(.body | contains($marker) and contains($sha_marker))] | length' \
              2>/dev/null) || {
                echo "::warning::failed マーカー判定に失敗しました。API エラーの可能性があるためログを確認してください。"
                existing_failed_same_sha=0
              }
          echo "failed マーカー（同一 SHA）コメント数: ${existing_failed_same_sha}"
          if [ "${existing_failed_same_sha:-0}" -gt 0 ]; then
            echo "同一 head SHA で failed マーカーを検出したため、再実行をスキップします。"
            echo "already_done=true" >> "${GITHUB_OUTPUT}"
            echo "already_approved=false" >> "${GITHUB_OUTPUT}"
            echo "is_retry=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # <!-- auto-approve-and-merge-partial --> は Approve 済み・merge 再試行対象
          MARKER_PARTIAL="<!-- auto-approve-and-merge-partial -->"
          existing_partial=$(gh api "/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq '.[]' 2>/dev/null \
            | jq -s --arg marker "${MARKER_PARTIAL}" '[.[] | select(.body | contains($marker))] | length' \
            2>/dev/null) || existing_partial=0
          echo "partial マーカーコメント数: ${existing_partial}"

          echo "already_done=false" >> "${GITHUB_OUTPUT}"
          if [ "${existing_partial:-0}" -gt 0 ]; then
            echo "partial マーカーを検出しました。前回 Approve 済みの可能性があるため、現在の Approve 状態を API で再確認して必要なら再 Approve します。"
            echo "is_retry=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_retry=false" >> "${GITHUB_OUTPUT}"
          fi

          # 既存 Approve レビューの API 直接確認（dismiss 考慮）
          # Approve 済みの場合は Approve ステップのみスキップ（Auto-merge は引き続き実行）
          approved_count=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq '[.[] | select(.state == "APPROVED")] | length' \
            2>/dev/null) || approved_count=0
          echo "既存 Approve レビュー数: ${approved_count}"

          if [ "${approved_count:-0}" -gt 0 ]; then
            echo "既に Approve 済みです。Approve ステップをスキップし Auto-merge のみ実行します。"
            echo "already_approved=true" >> "${GITHUB_OUTPUT}"
          else
            echo "already_approved=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: 検証実施確認（auto-approve 前提条件）
        # .github/copilot-instructions.md §0 要件: 最低1つの検証を実施。
        # PR body またはコメントに検証実施記録（marker/見出し/箇条書き）が存在することを確認する。
        # 存在しない場合は自動 Approve/Merge をスキップし、不足コメントを投稿する（冪等化）。
        id: check-validation
        if: steps.guard.outputs.already_done != 'true'
        run: |
          set -euo pipefail
          VALIDATION_MARKER='<!-- auto-approve-validation-missing -->'
          HEAD_COMMIT_SUBJECT=$(gh api "/repos/${REPO}/commits/${HEAD_SHA}" \
            --jq '.commit.message // ""' 2>/dev/null \
            | head -n1 \
            | tr -d '\r' || echo '')

          if [ "${HEAD_COMMIT_SUBJECT}" = "Initial plan" ]; then
            echo "ℹ️ HEAD commit message が 'Initial plan' のため、検証不足コメント/auto-approve 判定をスキップします。"
            echo "has_validation=false" >> "${GITHUB_OUTPUT}"
            echo "skip_reason=initial_plan" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "skip_reason=none" >> "${GITHUB_OUTPUT}"

          max_attempts=3
          attempt=1
          # 直前の成功取得結果を保持する（API 一時失敗で空配列に上書きされるのを防ぐ）
          pr_comments_all='[]'
          while [ "${attempt}" -le "${max_attempts}" ]; do
            echo "[診断] 検証リトライ ${attempt}/${max_attempts}"

            # PR body を取得
            pr_body=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" \
              --jq '.body // ""' 2>/dev/null || echo '')

            # [診断ログ] pr_body の取得結果を確認（全文ダンプは不可・先頭20行のみ）
            echo "取得 pr_body 文字数: ${#pr_body}"
            echo "--- pr_body 先頭20行 ---"
            printf '%s' "${pr_body}" | head -20
            echo "--- pr_body 先頭20行 ここまで ---"

            # PR コメントを取得（検証不足通知コメントは判定対象から除外）
            # 成功時のみ pr_comments_all を更新し、失敗時は直前の取得結果を保持する
            # （API 一時失敗で [] に上書きされ、ループ後の冪等性チェックが誤判定するのを防ぐ）
            pr_comments_fetched=$(gh api "/repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --paginate --jq '.[]' 2>/dev/null | jq -s '.' 2>/dev/null || echo '')
            if [ -n "${pr_comments_fetched}" ] \
              && echo "${pr_comments_fetched}" | jq -e 'type == "array"' >/dev/null 2>&1; then
              pr_comments_all="${pr_comments_fetched}"
            else
              echo "[診断] PR コメント取得に失敗しました。直前の取得結果を保持します。"
            fi
            pr_comments=$(echo "${pr_comments_all}" \
              | jq --arg marker "${VALIDATION_MARKER}" '[.[] | select(.body | contains($marker) | not)]' \
              2>/dev/null || echo '[]')

            # 判定は hve/split_fork.py の単一実装（FR-MAINT-06）へ委譲する
            combined_text=$(printf '%s\n%s\n' "${pr_body}" "$(echo "${pr_comments}" | jq -r '.[].body' 2>/dev/null)")
            validation_subject="${RUNNER_TEMP}/validation-subject.md"
            printf '%s' "${combined_text}" > "${validation_subject}"
            if python3 "${GITHUB_WORKSPACE}/trusted/.github/scripts/check_validation_marker.py" \
              --text-file "${validation_subject}"; then
              echo "✅ PR body/コメントに検証実施記録を確認しました。"
              echo "has_validation=true" >> "${GITHUB_OUTPUT}"
              echo "[診断] has_validation=true"
              exit 0
            fi
            echo "[診断] 検証マーカー: 不一致"

            if [ "${attempt}" -lt "${max_attempts}" ]; then
              echo "[診断] 全分岐 不一致（試行 ${attempt}/${max_attempts}）→ 10秒後に再取得します"
              sleep 10
            fi
            attempt=$((attempt + 1))
          done

          # 8) 全不一致
          echo "[診断] 全分岐 不一致（全${max_attempts}回）→ has_validation=false"
          echo "has_validation=false" >> "${GITHUB_OUTPUT}"
          echo "⚠️ PR body・コメントに検証実施記録（marker/見出し/箇条書き）が見つかりません。"

          # 冪等性チェック: 同一 HEAD SHA での不足通知コメントが既に投稿済みならスキップ
          # failed マーカーと同様に HEAD SHA 単位で判定し、新コミット push 時は再評価する
          SHA_MARKER="<!-- auto-approve-and-merge-head-sha: ${HEAD_SHA} -->"
          existing_count=$(echo "${pr_comments_all}" \
            | jq --arg marker "${VALIDATION_MARKER}" --arg sha_marker "${SHA_MARKER}" \
              '[.[] | select(.body | contains($marker) and contains($sha_marker))] | length' 2>/dev/null || echo 0)
          if [ "${existing_count:-0}" -gt 0 ]; then
            echo "同一 HEAD SHA (${HEAD_SHA}) で検証不足通知コメントは既に投稿済みです。スキップします。"
            exit 0
          fi

          # 不足通知コメントを投稿（末尾に HEAD SHA フッターを付与して冪等化）
          comment_body="$(
            {
              printf '%s\n' "${VALIDATION_MARKER}"
              printf '\n'
              printf '%s\n' "## ⚠️ 検証実施記録が確認できません"
              printf '\n'
              printf '%s\n' "PR body またはコメントに検証実施記録（\`validation-confirmed\` マーカー / \`Validation\`・\`検証\` 見出し / \`検証:\` 形式）が見つからないため、自動 Approve/Merge をスキップしました。"
              printf '\n'
              printf '%s\n' "**.github/copilot-instructions.md §0 要件**: 最低1つの検証を実施すること（テスト/ビルド/静的解析のいずれかを行い、できない場合は理由と代替を明記すること）。"
              printf '\n'
              printf '%s\n' "### 対処方法"
              printf '\n'
              printf '%s\n' "以下いずれかを PR body またはコメントに追記してください（推奨順）:"
              printf '\n'
              printf '%s\n' "1. HTML コメントマーカー（推奨）"
              printf '%s\n' "   - \`<!-- validation-confirmed -->\`"
              printf '%s\n' "2. 見出し方式"
              printf '%s\n' "   - \`## 検証\`"
              printf '%s\n' "   - \`## 検証結果\`"
              printf '%s\n' "   - \`## Validation\`"
              printf '%s\n' "3. 箇条書き / 強調方式"
              printf '%s\n' "   - \`- 検証: pytest 実行済\`"
              printf '%s\n' "   - \`**検証**: ビルド成功\`"
              printf '%s\n' "   - \`> Validation: lint OK\`"
              printf '\n'
              printf '%s\n' "### 再実行手順"
              printf '\n'
              printf '%s\n' "1. PR body またはコメントへ検証実施記録を追記する"
              printf '%s\n' "2. 新しいコミットを push すると \`synchronize\` イベントで自動的に再評価されます"
              printf '%s\n' "3. または \`auto-approve-ready\` ラベルを一度外して再付与することでも再実行できます"
              printf '\n'
              printf '%s\n' "> ℹ️ このコメントは \`auto-approve-and-merge.yml\` によって自動投稿されました。"
              printf '\n'
              printf '%s\n' "${SHA_MARKER}"
            }
          )"
          gh pr comment "${PR_NUMBER}" \
            --repo "${REPO}" \
            --body "${comment_body}" || echo "WARNING: 検証不足通知コメントの投稿に失敗しました。"
          echo "検証不足通知コメントを PR #${PR_NUMBER} に投稿しました。"

      - name: QA Reference チェック結果確認（auto-approve 前提条件）
        # verify-qa-reference-in-pr.yml が required モードで FAIL を出した場合に自動 Approve/Merge をスキップする。
        # warning モードの FAIL またはマーカーコメントが存在しない場合は後方互換のためスキップしない。
        id: check-qa-reference
        if: steps.guard.outputs.already_done != 'true' && steps.check-validation.outputs.skip_reason != 'initial_plan'
        run: |
          set -euo pipefail
          QA_REF_MARKER='<!-- auto-approve-qa-reference-missing -->'
          QA_REF_RESULT_MARKER='<!-- qa-reference-check-result -->'
          SHA_MARKER="<!-- auto-approve-and-merge-head-sha: ${HEAD_SHA} -->"
          REQUIRED_MODE_PATTERN='モード: `required`'
          FAIL_PATTERN='❌ FAIL'

          # PR コメントを全件取得（API エラーとコメント0件を区別する）
          api_err_file=$(mktemp)
          if ! pr_comments_raw=$(gh api "/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --paginate --jq '.[]' 2>"${api_err_file}"); then
            err_msg=$(cat "${api_err_file}" 2>/dev/null || echo "unknown error")
            rm -f "${api_err_file}"
            echo "::warning::PR コメントの取得に失敗しました: ${err_msg}。QA Reference チェックをスキップします（qa_reference_passed=true）。"
            echo "qa_reference_passed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          rm -f "${api_err_file}"
          # コメント0件は正常（warn 不要）
          pr_comments=$(printf '%s' "${pr_comments_raw}" | jq -s '.' 2>/dev/null || echo '[]')

          # <!-- qa-reference-check-result --> マーカー付きコメントを検索（最新1件、updated_at 付き）
          qa_ref_data=$(printf '%s' "${pr_comments}" \
            | jq -c --arg marker "${QA_REF_RESULT_MARKER}" \
              '[.[] | select(.body | contains($marker))] | last // null' \
            2>/dev/null || echo 'null')
          qa_ref_comment=$(printf '%s' "${qa_ref_data}" | jq -r '.body // ""' 2>/dev/null || echo '')
          qa_ref_updated_at=$(printf '%s' "${qa_ref_data}" | jq -r '.updated_at // ""' 2>/dev/null || echo '')

          qa_reference_passed="true"
          if [ -n "${qa_ref_comment}" ]; then
            # required モード かつ FAIL を含む場合のみ詳細チェックへ
            if printf '%s' "${qa_ref_comment}" | grep -qF "${REQUIRED_MODE_PATTERN}" && \
               printf '%s' "${qa_ref_comment}" | grep -qF "${FAIL_PATTERN}"; then

              # verify-qa-reference-in-pr.yml は PASS 時にコメントを更新しないため、
              # FAIL コメントの updated_at が HEAD コミット日時より前なら「スタール」として PASS 扱いにする
              stale="false"
              if [ -n "${qa_ref_updated_at}" ]; then
                head_commit_date=$(gh api "/repos/${REPO}/commits/${HEAD_SHA}" \
                  --jq '.commit.committer.date // ""' 2>/dev/null || echo '')
                if [ -n "${head_commit_date}" ]; then
                  qa_updated_epoch=$(date -d "${qa_ref_updated_at}" +%s 2>/dev/null || echo '')
                  head_commit_epoch=$(date -d "${head_commit_date}" +%s 2>/dev/null || echo '')
                  if [ -n "${qa_updated_epoch}" ] && [ -n "${head_commit_epoch}" ] && \
                     [ "${qa_updated_epoch}" -lt "${head_commit_epoch}" ]; then
                    stale="true"
                    echo "::notice::QA Reference FAIL コメント（${qa_ref_updated_at}）は HEAD コミット（${head_commit_date}）より前の結果です。スタールとして扱います。"
                  fi
                fi
              fi

              if [ "${stale}" = "false" ]; then
                qa_reference_passed="false"
              fi
            fi
          fi

          echo "qa_reference_passed=${qa_reference_passed}" >> "${GITHUB_OUTPUT}"

          if [ "${qa_reference_passed}" = "true" ]; then
            echo "✅ QA Reference チェック: PASS または warning モード FAIL（スキップなし）"
            exit 0
          fi

          echo "⚠️ QA Reference チェック: required モードで FAIL を検出。Approve/Merge をスキップします。"

          # 冪等性チェック: 同一 SHA の案内コメントが既に投稿済みならスキップ
          existing_count=0
          if ! existing_count=$(echo "${pr_comments}" \
            | jq --arg marker "${QA_REF_MARKER}" --arg sha_marker "${SHA_MARKER}" \
              '[.[] | select(.body | contains($marker) and contains($sha_marker))] | length' \
            2>/dev/null); then
            echo "::warning::冪等性チェック（jq）に失敗しました。重複投稿を避けるため案内コメントをスキップします。"
            exit 0
          fi
          if [ "${existing_count:-0}" -gt 0 ]; then
            echo "QA Reference 案内コメントは同一 SHA で既に投稿済みです。スキップします。"
            exit 0
          fi

          # 案内コメントを投稿（SHA フッター付き）
          comment_body="$(
            {
              printf '%s\n' "${QA_REF_MARKER}"
              printf '\n'
              printf '%s\n' '## ⚠️ QA Reference チェックが required モードで失敗しています'
              printf '\n'
              printf '%s\n' '`verify-qa-reference-in-pr.yml` が **`required` モード** で **❌ FAIL** を検出したため、自動 Approve/Merge をスキップしました。'
              printf '\n'
              printf '%s\n' '### 対処方法'
              printf '\n'
              printf '%s\n' '1. PR 本文の `<!-- qa-reference-start -->` ～ `<!-- qa-reference-end -->` セクションに、参照した QA ファイルのパス（`qa/...`）を記載してください'
              printf '%s\n' '2. QA 参照が不要な場合は `参照なし: 理由 = <理由>` と明記してください'
              printf '%s\n' '3. `verify-qa-reference-in-pr.yml` のチェックが PASS になったことを確認してください'
              printf '\n'
              printf '%s\n' '### 再実行手順'
              printf '\n'
              printf '%s\n' '1. 上記対処を PR 本文に反映する'
              printf '%s\n' '2. `auto-approve-ready` ラベルを一度外す'
              printf '%s\n' '3. `auto-approve-ready` ラベルを再付与してワークフローを再実行する'
              printf '\n'
              printf '%s\n' '> ℹ️ このコメントは `auto-approve-and-merge.yml` によって自動投稿されました。'
              printf '%s\n' "${SHA_MARKER}"
            }
          )"
          gh pr comment "${PR_NUMBER}" \
            --repo "${REPO}" \
            --body "${comment_body}" || echo "WARNING: QA Reference 案内コメントの投稿に失敗しました。"
          echo "QA Reference 案内コメントを PR #${PR_NUMBER} に投稿しました。"

      - name: G-DIFF 判定用 PR メタデータ収集
        id: g-diff-metadata
        if: steps.guard.outputs.already_done != 'true' && steps.check-validation.outputs.skip_reason != 'initial_plan'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr_json=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}")
          pr_title=$(printf '%s' "${pr_json}" | jq -r '.title // ""')
          pr_body=$(printf '%s' "${pr_json}" | jq -r '.body // ""')

          files_json=$(gh api --paginate "/repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '[.[] | {filename, status, previous_filename}]' | jq -s 'add // []')
          changed_files_count=$(printf '%s' "${files_json}" | jq 'length')

          owner="${REPO%%/*}"
          repo_name="${REPO#*/}"
          linked_json=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $pr: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $pr) {
                  closingIssuesReferences(first: 10) {
                    nodes {
                      title
                      labels(first: 20) { nodes { name } }
                    }
                  }
                }
              }
            }
          ' -f owner="${owner}" -f repo="${repo_name}" -F pr="${PR_NUMBER}" 2>/dev/null || echo '{}')
          issue_titles_json=$(printf '%s' "${linked_json}" \
            | jq -c '[.data.repository.pullRequest.closingIssuesReferences.nodes[]?.title // empty]' 2>/dev/null || echo '[]')
          issue_labels_json=$(printf '%s' "${linked_json}" \
            | jq -c '[.data.repository.pullRequest.closingIssuesReferences.nodes[]?.labels.nodes[]?.name // empty]' 2>/dev/null || echo '[]')

          jq -n \
            --arg title "${pr_title}" \
            --arg body "${pr_body}" \
            --argjson issue_titles "${issue_titles_json:-[]}" \
            --argjson issue_labels "${issue_labels_json:-[]}" \
            --argjson changed_files "${changed_files_count}" \
            '{title: $title, body: $body, issue_titles: $issue_titles, issue_labels: $issue_labels, changed_files: $changed_files}' \
            > "${RUNNER_TEMP}/g-diff-pr-metadata.json"
          printf '%s' "${files_json}" > "${RUNNER_TEMP}/g-diff-changed-files.json"

      - name: G-DIFF 判定（trusted, auto-approve 前提条件）
        id: check-g-diff
        if: steps.guard.outputs.already_done != 'true' && steps.check-validation.outputs.skip_reason != 'initial_plan'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          G_DIFF_MARKER='<!-- hve-workflow-diff-gate-blocked -->'
          SHA_MARKER="<!-- auto-approve-and-merge-head-sha: ${HEAD_SHA} -->"

          result_json=$(python -I "$GITHUB_WORKSPACE/trusted/.github/scripts/validate-workflow-diff.py" \
            --root "$GITHUB_WORKSPACE/subject" \
            --pr-metadata-file "${RUNNER_TEMP}/g-diff-pr-metadata.json" \
            --changed-files-file "${RUNNER_TEMP}/g-diff-changed-files.json" \
            --format json || true)
          if ! printf '%s' "${result_json}" | python -m json.tool >/dev/null 2>&1; then
            echo "::error::G-DIFF validator result was empty or invalid"
            echo "g_diff_passed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          status=$(printf '%s' "${result_json}" | jq -r '.status // ""')
          echo "G-DIFF status=${status}"
          if [ "${status}" = "PASS" ] || [ "${status}" = "N/A" ]; then
            echo "g_diff_passed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "g_diff_passed=false" >> "${GITHUB_OUTPUT}"

          # 同一 SHA の案内コメントがある場合は重複投稿しない
          existing_count=$(gh api "/repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[]' 2>/dev/null \
            | jq -s --arg marker "${G_DIFF_MARKER}" --arg sha_marker "${SHA_MARKER}" \
              '[.[] | select(.body | contains($marker) and contains($sha_marker))] | length' 2>/dev/null || echo 0)
          if [ "${existing_count:-0}" -gt 0 ]; then
            echo "同一 SHA の G-DIFF blocked 案内は投稿済みです。"
            exit 0
          fi
          errors_md=$(printf '%s' "${result_json}" | jq -r '(.errors // [])[] | "- \(.)"' 2>/dev/null || echo '')
          comment_body="$(
            {
              printf '%s\n\n' "${G_DIFF_MARKER}"
              printf '%s\n\n' '## ⛔ G-DIFF（Workflow Diff Gate）が PASS/N-A になりませんでした'
              printf '%s: %s\n\n' 'status' "${status}"
              printf '%s\n' "${errors_md}"
              printf '%s\n' '許可されていない差分が含まれるため auto-approve/auto-merge を停止しました。'
              printf '%s\n' "${SHA_MARKER}"
            }
          )"
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${comment_body}" || echo "WARNING: G-DIFF blocked 案内コメント投稿に失敗しました。"

      - name: Check-run 失敗確認（auto-approve 前提条件）
        id: check-check-runs
        if: steps.guard.outputs.already_done != 'true' && steps.check-validation.outputs.skip_reason != 'initial_plan'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CHECK_FAIL_MARKER='<!-- auto-approve-check-runs-failed -->'
          SHA_MARKER="<!-- auto-approve-and-merge-head-sha: ${HEAD_SHA} -->"
          current_run_prefix="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/"
          check_runs_max_attempts=30
          check_runs_retry_seconds=10
          attempt=1
          blocked="false"
          failed_checks="[]"
          failed_count=0
          relevant_count=0
          g_diff_passed_count=0
          pending_count=0

          while [ "${attempt}" -le "${check_runs_max_attempts}" ]; do
            CHECK_API_ERR_FILE=$(mktemp)
            if ! check_runs_json=$(gh api --paginate "/repos/${REPO}/commits/${HEAD_SHA}/check-runs" --jq '.check_runs[]' 2>"${CHECK_API_ERR_FILE}" | jq -e -s '.'); then
              api_err_msg=$(head -5 "${CHECK_API_ERR_FILE}" 2>/dev/null || echo "unknown error")
              rm -f "${CHECK_API_ERR_FILE}"
              echo "::error::check-runs API の取得または応答検証に失敗しました: ${api_err_msg}"
              echo "checks_passed=false" >> "${GITHUB_OUTPUT}"
              CHECK_API_ERR_MARKER='<!-- auto-approve-check-runs-api-error -->'
              existing_err=$(gh api "/repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[]' 2>/dev/null \
                | jq -s --arg marker "${CHECK_API_ERR_MARKER}" --arg sha_marker "${SHA_MARKER}" \
                  '[.[] | select(.body | contains($marker) and contains($sha_marker))] | length' 2>/dev/null || echo 0)
              if [ "${existing_err:-0}" -eq 0 ]; then
                err_comment="$(printf '%s\n\n%s\n\n%s\n%s\n%s' \
                  "${CHECK_API_ERR_MARKER}" \
                  '## ❌ check-runs API 取得失敗 → auto-approve/auto-merge を停止しました' \
                  "check-runs API の取得または応答検証に失敗したため、fail-closed として auto-approve/auto-merge を停止しました。" \
                  "詳細は trusted workflow log を確認してください。" \
                  "${SHA_MARKER}")"
                gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${err_comment}" \
                  || echo "WARNING: check-runs API エラー案内コメント投稿に失敗しました。"
              fi
              exit 0
            fi
            rm -f "${CHECK_API_ERR_FILE}"

            relevant_checks=$(printf '%s' "${check_runs_json}" | jq -c --arg current_run_prefix "${current_run_prefix}" '
              [.[] | select(((.details_url // "") | startswith($current_run_prefix)) | not)]')
            relevant_count=$(printf '%s' "${relevant_checks}" | jq 'length')

            g_diff_passed_count=$(printf '%s' "${relevant_checks}" | jq '
              [.[] | select((.name // "") == "G-DIFF") | select((.status // "") == "completed") | select((.conclusion // "") == "success")] | length')

            pending_checks=$(printf '%s' "${relevant_checks}" | jq -c '[.[] | select((.status // "") != "completed")]')
            pending_count=$(printf '%s' "${pending_checks}" | jq 'length')

            failed_checks=$(printf '%s' "${relevant_checks}" | jq -c '
              [.[] | select((.status // "") == "completed")
                | . as $check
                | select((["success", "neutral", "skipped"] | index($check.conclusion)) == null)
                | {name: ($check.name // "unknown"), conclusion: ($check.conclusion // "unknown"), details_url: ($check.details_url // "")}
              ]')
            failed_count=$(printf '%s' "${failed_checks}" | jq 'length')

            blocked="false"
            retryable="false"
            if [ "${relevant_count}" -eq 0 ] || [ "${g_diff_passed_count}" -eq 0 ]; then
              blocked="true"
              retryable="true"
            fi
            if [ "${pending_count}" -gt 0 ]; then
              blocked="true"
              retryable="true"
            fi
            if [ "${failed_count}" -gt 0 ]; then
              blocked="true"
              retryable="false"
            fi

            if [ "${retryable}" = "true" ] && [ "${failed_count}" -eq 0 ] && [ "${attempt}" -lt "${check_runs_max_attempts}" ]; then
              echo "check-run が未完了、または G-DIFF check-run が未検出のため再試行します（${attempt}/${check_runs_max_attempts}）..."
              sleep "${check_runs_retry_seconds}"
              attempt=$((attempt + 1))
              continue
            fi
            break
          done

          if [ "${failed_count}" -gt 0 ]; then
            echo "⚠️ 失敗 check-run を ${failed_count} 件検出しました。"
          elif [ "${relevant_count}" -eq 0 ] || [ "${g_diff_passed_count}" -eq 0 ]; then
            echo "⚠️ G-DIFF check-run が検出されないか、成功していません。"
          elif [ "${pending_count}" -gt 0 ]; then
            echo "⚠️ pending 状態の check-run が残っています。"
          else
            echo "✅ check-run 失敗は検出されませんでした。"
          fi

          echo "checks_passed=$([ "${blocked}" = "true" ] && echo false || echo true)" >> "${GITHUB_OUTPUT}"

          if [ "${blocked}" != "true" ]; then
            exit 0
          fi

          # 同一 SHA の案内コメントがある場合は重複投稿しない
          comments_json=$(gh api "/repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[]' 2>/dev/null | jq -s '.' 2>/dev/null || echo '[]')
          existing_count=$(printf '%s' "${comments_json}" \
            | jq --arg marker "${CHECK_FAIL_MARKER}" --arg sha_marker "${SHA_MARKER}" \
              '[.[] | select(.body | contains($marker) and contains($sha_marker))] | length' 2>/dev/null || echo 0)
          if [ "${existing_count:-0}" -gt 0 ]; then
            echo "同一 SHA の check-run 失敗案内は投稿済みです。"
            exit 0
          fi

          failed_md=$(printf '%s' "${failed_checks}" | jq -r '.[] | "- `\(.name)` (\(.conclusion)) \(.details_url)"')
          comment_body="$(
            {
              printf '%s\n\n' "${CHECK_FAIL_MARKER}"
              printf '%s\n\n' '## ⚠️ 必須 check-run が完了/成功していないため auto-approve/auto-merge を停止しました'
              printf '%s\n' '以下のいずれかの状態です: (1) G-DIFF check-run が未検出/未成功、(2) pending の check-run が残存、(3) 失敗 check-run（failure/cancelled/timed_out/action_required/startup_failure 等）。'
              printf '\n%s\n\n' "${failed_md}"
              printf '%s\n' '解消した後に再実行してください。'
              printf '%s\n' '> ℹ️ このコメントは `auto-approve-and-merge.yml` によって自動投稿されました。'
              printf '%s\n' "${SHA_MARKER}"
            }
          )"
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${comment_body}" || echo "WARNING: check-run 失敗案内コメント投稿に失敗しました。"

      - name: Deploy / AC gate 確認（auto-approve 前提条件）
        id: check-deploy-ac
        if: steps.guard.outputs.already_done != 'true' && steps.check-validation.outputs.skip_reason != 'initial_plan'
        run: |
          set -euo pipefail
          DEPLOY_MARKER='<!-- auto-approve-deploy-gate-blocked -->'
          SHA_MARKER="<!-- auto-approve-and-merge-head-sha: ${HEAD_SHA} -->"
          deploy_gate_passed="true"
          is_deploy_pr="false"
          reasons=()

          pr_title=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.title // ""' 2>/dev/null || echo '')
          pr_body=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""' 2>/dev/null || echo '')
          changed_files=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' 2>/dev/null || echo '')
          comments_text=$(gh api "/repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[].body' 2>/dev/null || true)
          combined_text=$(printf '%s\n%s\n%s\n' "${pr_title}" "${pr_body}" "${comments_text}")
          ac13_required="false"

          if printf '%s' "${combined_text}" | grep -Eiq '(deploy|デプロイ)'; then
            is_deploy_pr="true"
          fi
          if printf '%s\n' "${changed_files}" | grep -Eq '(^|/)src/infra/azure/create-|(^|/)src/infra/azure/verify-.*-resources\\.sh|(^|/)docs/test-specs/deploy-|(^|/)\\.github/workflows/(deploy-|azure-static-web-apps-|e2e-app009-playwright\\.yml)'; then
            is_deploy_pr="true"
          fi
          if printf '%s\n' "${changed_files}" | grep -Eq '(^|/)src/infra/azure/create-azure-additional-resources(/|$)|(^|/)src/infra/azure/create-azure-additional-resources-prep\\.sh$|(^|/)docs/test-specs/deploy-step2-additional-test-spec\\.md$'; then
            ac13_required="true"
          fi

          ac_text=''
          ac_file=$(printf '%s\n' "${changed_files}" | grep -E 'ac-verification\\.md$' | head -n1 || true)
          if [ -n "${ac_file}" ]; then
            ac_content=$(gh api "/repos/${REPO}/contents/${ac_file}?ref=${HEAD_SHA}" --jq '.content // ""' 2>/dev/null || true)
            if [ -n "${ac_content}" ]; then
              ac_text=$(printf '%s' "${ac_content}" | tr -d '\n' | base64 -d 2>/dev/null || true)
            fi
          fi
          source_text=$(printf '%s\n%s\n' "${ac_text}" "${combined_text}")
          ac_table_rows=$(printf '%s\n' "${source_text}" | grep -E '^[[:space:]]*\|[[:space:]]*(AC-[0-9]+|AC4B-[0-9]+)[[:space:]]*\|' || true)
          # AC テーブル行の状態カラム（3列目: | AC | 観点 | 状態 | 証跡 |）だけを抽出する。
          # 証跡カラムはスクリプト実出力（例: `FAIL=0`）や設計注記（例: マージ後手動のため未実行）を
          # 含み、whole-row substring 照合では成功シグナルを誤検出する。runner 側
          # validate_deploy_ac_verification と同じく状態カラムのみで not-green を判定する。
          ac_status_cells=$(printf '%s\n' "${ac_table_rows}" | awk -F'|' '{ print $4 }' || true)

          if [ "${is_deploy_pr}" = "true" ]; then
            if [ -n "${ac_table_rows}" ]; then
              if printf '%s' "${ac_status_cells}" | grep -Eq 'NEEDS-VERIFICATION|❌|⏳'; then
                deploy_gate_passed="false"
                reasons+=('AC テーブル行の状態カラムに未検証/失敗（NEEDS-VERIFICATION/❌/⏳）を検出しました。')
              fi

              for required_ac in AC-2 AC-3 AC-6 AC-8 AC-9 AC4B-1; do
                if printf '%s\n' "${ac_table_rows}" | grep -Eq "^[[:space:]]*\|[[:space:]]*${required_ac}[[:space:]]*\|"; then
                  if ! printf '%s\n' "${ac_table_rows}" | grep -Eq "^[[:space:]]*\|[[:space:]]*${required_ac}[[:space:]]*\|[^[:cntrl:]]*✅"; then
                    deploy_gate_passed="false"
                    reasons+=("\`${required_ac} ✅\` が AC テーブル行で確認できません。")
                  fi
                fi
              done

              if printf '%s\n' "${ac_table_rows}" | grep -Eq '^[[:space:]]*\|[[:space:]]*AC-13[[:space:]]*\|'; then
                if ! printf '%s\n' "${ac_table_rows}" | grep -Eq '^[[:space:]]*\|[[:space:]]*AC-13[[:space:]]*\|[^[:cntrl:]]*(✅|N/A|NA|該当なし)'; then
                  deploy_gate_passed="false"
                  reasons+=('`AC-13 ✅`（または N/A）が AC テーブル行で確認できません。')
                fi
              elif [ "${ac13_required}" = "true" ]; then
                if ! printf '%s' "${source_text}" | grep -Eq 'AC-?13[^0-9[:cntrl:]][^[:cntrl:]]*(✅|N/A|NA|該当なし)'; then
                  deploy_gate_passed="false"
                  reasons+=('追加 Azure サービス deploy PR で `AC-13 ✅`（または N/A）が確認できません。')
                fi
              fi
            else
              # AC テーブル行が無い場合は既存の AC-1 / AC-13 フォールバックで判定する。
              # AC-1 判定: AC-1 の直後が数字でないことを保証（AC-10/AC-11 等との部分一致を防ぐ）
              if ! printf '%s' "${source_text}" | grep -Eq 'AC-?1[^0-9[:cntrl:]][^[:cntrl:]]*✅'; then
                deploy_gate_passed="false"
                reasons+=('`AC-1 ✅` が確認できません。')
              fi

              # AC-13 判定: AC-13 の直後が数字でないことを保証（AC-130 等との部分一致を防ぐ）
              if [ "${ac13_required}" = "true" ] && ! printf '%s' "${source_text}" | grep -Eq 'AC-?13[^0-9[:cntrl:]][^[:cntrl:]]*(✅|N/A|NA|該当なし)'; then
                deploy_gate_passed="false"
                reasons+=('追加 Azure サービス deploy PR で `AC-13 ✅`（または N/A）が確認できません。')
              fi
            fi

            # ac-verification.md（ac_text）は上のテーブル行チェック（状態カラム＋必須 AC ✅）で
            # 権威的に検証済み。証跡 prose を naive substring で再走査すると `FAIL=0` や
            # 「マージ後手動のため未実行」等を誤検出するため、ここは PR 本文/コメント
            # （combined_text）だけを対象に未検証キーワードの安全網を残す。
            if printf '%s' "${combined_text}" | grep -Eiq 'NEEDS-VERIFICATION|⏳|FAIL|未実行|手動実行が必要|残作業'; then
              deploy_gate_passed="false"
              reasons+=('PR 本文/コメントに未検証/失敗を示すキーワード（NEEDS-VERIFICATION/⏳/FAIL/未実行/手動実行が必要/残作業）が残っています。')
            fi
          fi

          echo "is_deploy_pr=${is_deploy_pr}" >> "${GITHUB_OUTPUT}"
          echo "deploy_gate_passed=${deploy_gate_passed}" >> "${GITHUB_OUTPUT}"
          if [ "${deploy_gate_passed}" = "true" ]; then
            echo "✅ Deploy/AC gate: PASS（非 deploy PR または条件充足）"
            exit 0
          fi

          reasons_md=$(printf '%s\n' "${reasons[@]}" | sed '/^$/d' | sed 's/^/- /')
          comments_json=$(gh api "/repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[]' 2>/dev/null | jq -s '.' 2>/dev/null || echo '[]')
          existing_count=$(printf '%s' "${comments_json}" \
            | jq --arg marker "${DEPLOY_MARKER}" --arg sha_marker "${SHA_MARKER}" \
              '[.[] | select(.body | contains($marker) and contains($sha_marker))] | length' 2>/dev/null || echo 0)
          if [ "${existing_count:-0}" -eq 0 ]; then
            comment_body="$(
              {
                printf '%s\n\n' "${DEPLOY_MARKER}"
                printf '%s\n\n' '## ⚠️ Deploy/AC gate で auto-approve/auto-merge を停止しました'
                printf '%s\n\n' "${reasons_md}"
                printf '%s\n' 'Deploy 系 PR は `AC-1 ✅`（追加 Azure サービス deploy で AC-13 対象の場合は `AC-13 ✅` または `N/A`）が確認できる状態にして再実行してください。'
                printf '%s\n' '> ℹ️ このコメントは `auto-approve-and-merge.yml` によって自動投稿されました。'
                printf '%s\n' "${SHA_MARKER}"
              }
            )"
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${comment_body}" || echo "WARNING: Deploy/AC gate 案内コメント投稿に失敗しました。"
          fi

      - name: PR を Approve
        id: approve
        if: steps.guard.outputs.already_done != 'true' && steps.guard.outputs.already_approved != 'true' && steps.check-validation.outputs.has_validation != 'false' && steps.check-validation.outputs.skip_reason != 'initial_plan' && steps.check-qa-reference.outputs.qa_reference_passed != 'false' && steps.check-check-runs.outputs.checks_passed == 'true' && steps.check-g-diff.outputs.g_diff_passed == 'true' && steps.check-deploy-ac.outputs.deploy_gate_passed != 'false'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          approved="true"
          if gh pr review "${PR_NUMBER}" \
            --repo "${REPO}" \
            --approve \
            --body "✅ 自動 Approve（auto-approve-and-merge.yml）"; then
            echo "✅ PR #${PR_NUMBER} を Approve しました。"
          else
            echo "::warning::PR #${PR_NUMBER} の Approve に失敗しました。手動で Approve してください。"
            approved="false"
          fi
          echo "approved=${approved}" >> "${GITHUB_OUTPUT}"

      - name: Auto-merge を有効化（squash）
        id: merge
        if: steps.guard.outputs.already_done != 'true' && steps.check-validation.outputs.has_validation != 'false' && steps.check-validation.outputs.skip_reason != 'initial_plan' && steps.check-qa-reference.outputs.qa_reference_passed != 'false' && steps.check-check-runs.outputs.checks_passed == 'true' && steps.check-g-diff.outputs.g_diff_passed == 'true' && steps.check-deploy-ac.outputs.deploy_gate_passed != 'false'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          merge_enabled="true"
          merge_error=""
          merge_output_file=$(mktemp)
          if gh pr merge "${PR_NUMBER}" \
            --repo "${REPO}" \
            --auto \
            --squash 2>"${merge_output_file}"; then
            echo "✅ PR #${PR_NUMBER} の Auto-merge（squash）を有効化しました。"
          else
            merge_error=$(cat "${merge_output_file}" 2>/dev/null || echo "(stderr 取得失敗)")
            echo "::warning::PR #${PR_NUMBER} の Auto-merge 有効化に失敗しました。エラー: ${merge_error}"
            merge_enabled="false"
          fi
          rm -f "${merge_output_file}"
          echo "merge_enabled=${merge_enabled}" >> "${GITHUB_OUTPUT}"
          EOF_MARKER=$(uuidgen 2>/dev/null || printf 'EOF_%s_%s' "$(date +%s%N 2>/dev/null || date +%s)" "$$")
          {
            echo "merge_error<<${EOF_MARKER}"
            echo "${merge_error}"
            echo "${EOF_MARKER}"
          } >> "${GITHUB_OUTPUT}"

      - name: サマリーコメントを PR に投稿
        if: steps.guard.outputs.already_done != 'true' && steps.check-validation.outputs.has_validation != 'false' && steps.check-validation.outputs.skip_reason != 'initial_plan' && steps.check-qa-reference.outputs.qa_reference_passed != 'false' && steps.check-check-runs.outputs.checks_passed == 'true' && steps.check-g-diff.outputs.g_diff_passed == 'true' && steps.check-deploy-ac.outputs.deploy_gate_passed != 'false'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
          APPROVED: ${{ steps.guard.outputs.already_approved == 'true' && 'true' || steps.approve.outputs.approved }}
          MERGE_ENABLED: ${{ steps.merge.outputs.merge_enabled }}
          MERGE_ERROR: ${{ steps.merge.outputs.merge_error }}
        run: |
          set -euo pipefail

          MARKER='<!-- auto-approve-and-merge-failed -->'
          if [ "${APPROVED}" = "true" ] && [ "${MERGE_ENABLED}" = "true" ]; then
            MARKER='<!-- auto-approve-and-merge-done -->'
            STATUS_ICON="✅"
            STATUS_TEXT="Approve と Auto-merge（squash）の有効化が完了しました。全ての必須チェックが通過次第、自動マージされます。"
          elif [ "${APPROVED}" = "true" ]; then
            MARKER='<!-- auto-approve-and-merge-partial -->'
            STATUS_ICON="⚠️"
            STATUS_TEXT="Approve は完了しましたが、Auto-merge の有効化に失敗しました。手動でマージしてください。"
          elif [ "${MERGE_ENABLED}" = "true" ]; then
            STATUS_ICON="⚠️"
            STATUS_TEXT="Auto-merge（squash）は有効化しましたが、Approve に失敗しました。手動で Approve してください。"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="Approve と Auto-merge の両方に失敗しました。手動で Approve → Merge してください。"
          fi

          COMMENT=$(printf '%s\n\n%s %s\n\n%s\n%s\n\n%s' \
            "${MARKER}" \
            "## ${STATUS_ICON} 自動 Approve & Auto-merge" \
            "${STATUS_TEXT}" \
            "- 🔑 **Approve**: $([ "${APPROVED}" = "true" ] && echo "✅ 完了" || echo "❌ 失敗（手動対応が必要です）")" \
            "- 🔀 **Auto-merge（squash）**: $([ "${MERGE_ENABLED}" = "true" ] && echo "✅ 有効化済み" || echo "❌ 失敗（手動対応が必要です）")" \
            '> ℹ️ このコメントは `auto-approve-and-merge.yml` によって自動投稿されました。')
          if [ "${MERGE_ENABLED}" != "true" ] && [ -n "${MERGE_ERROR}" ]; then
            SAFE_MERGE_ERROR=$(printf '%s' "${MERGE_ERROR}" | sed 's/```/[triple-backtick]/g')
            COMMENT=$(printf '%s\n\n%s\n%s\n%s' \
              "${COMMENT}" \
              '<details><summary>🔍 merge エラー詳細</summary>' \
              "" \
              "\`\`\`"$'\n'"${SAFE_MERGE_ERROR}"$'\n'"\`\`\`"$'\n'"</details>")
          fi
          COMMENT=$(printf '%s\n%s' "${COMMENT}" "<!-- auto-approve-and-merge-head-sha: ${HEAD_SHA} -->")

          gh pr comment "${PR_NUMBER}" \
            --repo "${REPO}" \
            --body "${COMMENT}"
          echo "✅ サマリーコメントを PR #${PR_NUMBER} に投稿しました。"
