name: Check ID ledger

# FR-IDL-01: docs/catalog/id-ledger.md と ID の相互参照を決定的に検査する。
# 生成済みのアプリ文書に既存の違反が残る間は --warn-only で注記として表示する（TBD-39）。

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/catalog/**"
      - "docs/test-specs/**"
      - "docs/screen/**"
      - "docs/services/**"
      - "hve/id_ledger.py"
      - "hve/catalog_parsers.py"
      - ".github/scripts/check-id-ledger.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check ID ledger
        run: |
          set -euo pipefail
          python .github/scripts/check-id-ledger.py --warn-only | tee id-ledger-report.txt
          grep '^\[' id-ledger-report.txt | while IFS= read -r line; do
            echo "::warning title=id-ledger::${line}"
          done || true
