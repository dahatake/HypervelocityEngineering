name: Test HVE Python

on:
  push:
    branches: [main]
    paths:
      - 'hve/**'
      - 'hve-dev/**'
      - 'cq/**'
      - 'pyproject.toml'
      - '.github/scripts/**'
      # 契約テスト（test_data_model_split_contract 等）が読むため、単独変更でも検査する。
      - '.github/prompts/**'
      - '.github/io-contracts/**'
      - '.github/workflows/test-hve-python.yml'
      # チェックアウト時の改行を決めるため、test_surface_export のバイト比較結果を左右する。
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths:
      - 'hve/**'
      - 'hve-dev/**'
      - 'cq/**'
      - 'pyproject.toml'
      - '.github/scripts/**'
      - '.github/scripts/bash/lib/workflow-registry.sh'
      # 契約テスト（test_data_model_split_contract 等）が読むため、単独変更でも検査する。
      - '.github/prompts/**'
      - '.github/io-contracts/**'
      - '.github/workflows/**'
      - '.github/workflows/test-hve-python.yml'
      - '.gitattributes'

permissions:
  contents: read

jobs:
  hve-python-tests:
    name: HVE Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt system libraries
        run: |
          set -euo pipefail
          audio_pkg="libasound2"
          if apt-cache policy libasound2 | grep -q 'Candidate: (none)'; then
            audio_pkg="libasound2t64"
          fi
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libnss3 \
            libxkbcommon-x11-0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            "${audio_pkg}" \
            libegl1 \
            libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest "PySide6>=6.11,<7"

      - name: Run DAG parity tests
        run: pytest hve/tests/test_dag_parity.py -v

      - name: Run all HVE tests
        run: pytest hve/tests/ -v --ignore=hve/tests/test_dag_parity.py

  gui-pty-tests:
    name: GUI PTY backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GUI の「GitHub CLI でログイン」は OS 別 PTY backend を必要とする。
      # PySide6 は不要（hve.gui.pty_backend は stdlib のみに依存）。
      - name: Install package with [gui-pty] extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui-pty]"
          pip install pytest

      # backend が無いと実 PTY テストは黙って skip されるため、ここで fail-closed にする。
      - name: Verify the platform PTY backend is available
        run: |
          python -c "from hve.gui.pty_backend import is_pty_available, missing_dependency_hint; assert is_pty_available(), missing_dependency_hint()"

      # 対話 CLI の smoke は解決済み `copilot` を必要とする。SDK が pin するランタイムを
      # 先読みし、解決できない場合はここで fail-closed にする（skip で隠さない）。
      - name: Provision the pinned Copilot CLI runtime
        run: |
          python -m copilot download-runtime
          python -c "from hve.gui.copilot_cli_bridge import CopilotCliBridge; assert CopilotCliBridge.find_binary(), 'Copilot CLI is not resolvable'"

      - name: Run PTY backend tests without skips
        run: |
          set -euo pipefail
          python -m pytest hve/tests/test_pty_backend.py hve/tests/test_copilot_cli_pty_smoke.py -v --junitxml=pty-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("pty-results.xml").getroot().find("testsuite")
          skipped = int(suite.get("skipped", "0"))
          assert skipped == 0, f"PTY backend tests were skipped: {skipped}"
          print("PTY backend tests ran without skips:", suite.get("tests"))
          PY

  cq-python-tests:
    name: cq Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with [code] extras
        run: |
          python -m pip install --upgrade pip
          # repomap の予算テストは tiktoken の計数を前提にする（未導入だと chars/4 近似になり dropped 数が変わる）。
          # tiktoken / watchdog は cq 自身の extras から入れる（mdq の extras へ相乗りしない）。
          pip install -e ".[code,code-sql,code-watch,code-tokenizer,test]"

      # tree-sitter が無いと言語契約テストは黙って skip されるため、ここで fail-closed にする。
      - name: Verify optional grammars are importable
        run: |
          python -c "import tree_sitter, tree_sitter_java, tree_sitter_go, tree_sitter_rust, tree_sitter_c, tree_sitter_cpp"
          python -c "import tree_sitter_bash, tree_sitter_powershell, tree_sitter_batch, tree_sitter_scala"
          python -c "import sqlglot, sqlfluff, tree_sitter_sql"

      # PowerShell の回復ノードを公式パーサで補正する経路が silent skip しないようにする。
      - name: Verify pwsh is available
        run: pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Run all cq tests
        run: pytest cq/tests/ -v

  mdq-smoke:
    name: mdq index smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with [mdq] extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mdq]"
      - name: Build mdq index
        run: python -m mdq index
      - name: Verify stats
        run: |
          set -euo pipefail
          python -m mdq stats > mdq-stats.json
          cat mdq-stats.json
          python - <<'PY'
          import json, sys
          s = json.load(open("mdq-stats.json"))
          assert s.get("files", 0) > 0, f"files={s.get('files')}"
          assert s.get("chunks", 0) > 0, f"chunks={s.get('chunks')}"
          print("OK", s)
          PY
          {
            echo "## mdq smoke"
            echo '```json'
            cat mdq-stats.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
