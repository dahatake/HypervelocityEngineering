name: Test HVE Python

on:
  push:
    branches: [main]
    paths:
      - 'hve/**'
      - 'hve-dev/**'
      - 'cq/**'
      # FR-MAINT-15: the golden gates must run when the search engines or their config change.
      - 'mdq/**'
      - 'tools/skills/markdown_query/**'
      - 'mdq.toml'
      - 'cq.toml'
      - 'pyproject.toml'
      - '.github/scripts/**'
      # 契約テスト（test_data_model_split_contract 等）が読むため、単独変更でも検査する。
      - '.github/prompts/**'
      - '.github/io-contracts/**'
      - '.github/workflows/test-hve-python.yml'
      # チェックアウト時の改行を決めるため、test_surface_export のバイト比較結果を左右する。
      - '.gitattributes'
      # FR-MAINT-12: 能動指示13文書のみ。tests/run/ の証跡・lane は含めない。
      - 'tests/README.md'
      - 'tests/prompt-version/README.md'
      - 'tests/prompt-version/01-request-contract.md'
      - 'tests/prompt-version/02-plan-and-approval-gate.md'
      - 'tests/prompt-version/03-multi-workflow-order.md'
      - 'tests/prompt-version/04-input-alias.md'
      - 'tests/prompt-version/05-gui-settings-reuse.md'
      - 'tests/prompt-version/06-agent-skill-behavior.md'
      - 'tests/prompt-version/07-docs-coverage.md'
      - 'tests/prompt-version/08-e2e-smoke.md'
      - 'tests/prompt-version/09-full-system-test.md'
      - 'tests/\[cli\]SystemTest - Full.txt'
      - 'tests/\[gui\]SystemTest - Full.txt'
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect HVE test scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_heavy: ${{ steps.paths.outputs.run_heavy }}
    steps:
      - name: Determine whether HVE tests are required
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "run_heavy=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files=$(gh api --paginate \
            "/repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          run_heavy=false
          while IFS= read -r path; do
            case "${path}" in
              hve/*|hve-dev/*|cq/*|mdq/*|tools/skills/markdown_query/*|mdq.toml|cq.toml|pyproject.toml|.github/scripts/*|.github/prompts/*|.github/io-contracts/*|.github/workflows/*|.gitattributes)
                run_heavy=true
                break
                ;;
              'tests/README.md'|\
              'tests/prompt-version/README.md'|\
              'tests/prompt-version/01-request-contract.md'|\
              'tests/prompt-version/02-plan-and-approval-gate.md'|\
              'tests/prompt-version/03-multi-workflow-order.md'|\
              'tests/prompt-version/04-input-alias.md'|\
              'tests/prompt-version/05-gui-settings-reuse.md'|\
              'tests/prompt-version/06-agent-skill-behavior.md'|\
              'tests/prompt-version/07-docs-coverage.md'|\
              'tests/prompt-version/08-e2e-smoke.md'|\
              'tests/prompt-version/09-full-system-test.md'|\
              'tests/[cli]SystemTest - Full.txt'|\
              'tests/[gui]SystemTest - Full.txt')
                run_heavy=true
                break
                ;;
            esac
          done <<< "${changed_files}"
          echo "run_heavy=${run_heavy}" >> "${GITHUB_OUTPUT}"

  hve-python-tests:
    name: HVE Python Tests
    needs: detect-changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Require successful path detection
        env:
          DETECTION_RESULT: ${{ needs.detect-changes.result }}
        run: |
          if [ "${DETECTION_RESULT}" != "success" ]; then
            echo "Path detection failed; required check cannot be reported as successful." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        if: needs.detect-changes.outputs.run_heavy == 'true'

      - name: Set up Python
        if: needs.detect-changes.outputs.run_heavy == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt system libraries
        if: needs.detect-changes.outputs.run_heavy == 'true'
        run: |
          set -euo pipefail
          audio_pkg="libasound2"
          if apt-cache policy libasound2 | grep -q 'Candidate: (none)'; then
            audio_pkg="libasound2t64"
          fi
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libnss3 \
            libxkbcommon-x11-0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            "${audio_pkg}" \
            libegl1 \
            libgl1

      - name: Install dependencies
        if: needs.detect-changes.outputs.run_heavy == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest "PySide6>=6.11,<7"

      - name: Run DAG parity tests
        if: needs.detect-changes.outputs.run_heavy == 'true'
        run: pytest hve/tests/test_dag_parity.py -v

      - name: Run all HVE tests
        if: needs.detect-changes.outputs.run_heavy == 'true'
        run: pytest hve/tests/ -v --ignore=hve/tests/test_dag_parity.py

  gui-pty-tests:
    name: GUI PTY backend (${{ matrix.os }})
    needs: detect-changes
    if: needs.detect-changes.outputs.run_heavy == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GUI の「GitHub CLI でログイン」は OS 別 PTY backend を必要とする。
      # PySide6 は不要（hve.gui.pty_backend は stdlib のみに依存）。
      - name: Install package with [gui-pty] extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui-pty]"
          pip install pytest

      # backend が無いと実 PTY テストは黙って skip されるため、ここで fail-closed にする。
      - name: Verify the platform PTY backend is available
        run: |
          python -c "from hve.gui.pty_backend import is_pty_available, missing_dependency_hint; assert is_pty_available(), missing_dependency_hint()"

      # 対話 CLI の smoke は解決済み `copilot` を必要とする。SDK が pin するランタイムを
      # 先読みし、解決できない場合はここで fail-closed にする（skip で隠さない）。
      - name: Provision the pinned Copilot CLI runtime
        run: |
          python -m copilot download-runtime
          python -c "from hve.gui.copilot_cli_bridge import CopilotCliBridge; assert CopilotCliBridge.find_binary(), 'Copilot CLI is not resolvable'"

      - name: Run PTY backend tests without skips
        run: |
          set -euo pipefail
          python -m pytest hve/tests/test_pty_backend.py hve/tests/test_copilot_cli_pty_smoke.py hve/tests/test_dev_task_environment_contract.py::test_copilot_sdk_lock_pins_an_exact_version -v --junitxml=pty-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("pty-results.xml").getroot().find("testsuite")
          skipped = int(suite.get("skipped", "0"))
          assert skipped == 0, f"PTY backend tests were skipped: {skipped}"
          print("PTY backend tests ran without skips:", suite.get("tests"))
          PY

  cq-python-tests:
    name: cq Python Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with [code] extras
        run: |
          python -m pip install --upgrade pip
          # repomap の予算テストは tiktoken の計数を前提にする（未導入だと chars/4 近似になり dropped 数が変わる）。
          # tiktoken / watchdog は cq 自身の extras から入れる（mdq の extras へ相乗りしない）。
          pip install -e ".[code,code-sql,code-watch,code-tokenizer,test]"
          # ベクトル / セマンティック系テストは numpy を module import する。本体は lazy import で
          # degrade するがテスト側は必須。fastembed は importorskip 前提かつ onnxruntime を伴うため入れない。
          pip install "numpy>=2.0"

      # tree-sitter が無いと言語契約テストは黙って skip されるため、ここで fail-closed にする。
      - name: Verify optional grammars are importable
        run: |
          python -c "import tree_sitter, tree_sitter_java, tree_sitter_go, tree_sitter_rust, tree_sitter_c, tree_sitter_cpp"
          python -c "import tree_sitter_bash, tree_sitter_powershell, tree_sitter_batch, tree_sitter_scala"
          python -c "import sqlglot, sqlfluff, tree_sitter_sql"
          python -c "import numpy"

      # PowerShell の回復ノードを公式パーサで補正する経路が silent skip しないようにする。
      - name: Verify pwsh is available
        run: pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Run all cq tests
        run: pytest cq/tests/ -v

      - name: cq golden evaluation (FR-MAINT-15)
        env:
          MIN_TOPK_HVE: "20"
          MIN_TOPK_APP: "21"
        run: |
          set -euo pipefail
          for profile in hve app; do
            python -m cq index --profile "${profile}"
            python -m cq.benchmark --with-cq --profile "${profile}" --baseline "" > "cq-golden-${profile}.json"
          done
          python - <<'PY'
          import json, os
          lines, failed = [], False
          for profile in ("hve", "app"):
              cq = json.load(open(f"cq-golden-{profile}.json", encoding="utf-8"))["baselines"]["cq"]
              minimum = int(os.environ[f"MIN_TOPK_{profile.upper()}"])
              lines.append(f"- {profile}: top-k {cq['topk']}/{cq['total']} (minimum {minimum})")
              failed = failed or cq["topk"] < minimum
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## cq golden\n\n" + "\n".join(lines) + "\n")
          print("\n".join(lines))
          raise SystemExit(1 if failed else 0)
          PY

  mdq-smoke:
    name: mdq index smoke test
    needs: detect-changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful path detection
        env:
          DETECTION_RESULT: ${{ needs.detect-changes.result }}
        run: |
          if [ "${DETECTION_RESULT}" != "success" ]; then
            echo "Path detection failed; required check cannot be reported as successful." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        if: needs.detect-changes.outputs.run_heavy == 'true'
      - uses: actions/setup-python@v5
        if: needs.detect-changes.outputs.run_heavy == 'true'
        with:
          python-version: "3.12"
      - name: Install package with [mdq] extras
        if: needs.detect-changes.outputs.run_heavy == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mdq]"
      - name: Build mdq index
        if: needs.detect-changes.outputs.run_heavy == 'true'
        run: python -m mdq index
      - name: Verify stats
        if: needs.detect-changes.outputs.run_heavy == 'true'
        run: |
          set -euo pipefail
          python -m mdq stats > mdq-stats.json
          cat mdq-stats.json
          python - <<'PY'
          import json, sys
          s = json.load(open("mdq-stats.json"))
          assert s.get("files", 0) > 0, f"files={s.get('files')}"
          assert s.get("chunks", 0) > 0, f"chunks={s.get('chunks')}"
          print("OK", s)
          PY
          {
            echo "## mdq smoke"
            echo '```json'
            cat mdq-stats.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: mdq golden evaluation (FR-MAINT-15)
        if: needs.detect-changes.outputs.run_heavy == 'true'
        env:
          MIN_TOPK: "30"
        run: |
          set -euo pipefail
          python tools/skills/markdown_query/benchmark.py --golden mdq/golden-queries.json --scenarios mdq_auto --db .mdq/index-ja-jp-heading.sqlite --repeat 1 --no-markdown-report --out-dir mdq-golden
          python - <<'PY'
          import glob, json, os
          report = json.load(open(glob.glob("mdq-golden/bench-*.json")[0], encoding="utf-8"))
          per_query = report["scenarios"]["mdq_auto"]["per_query"]
          hits = sum(1 for query in per_query if query["topk"])
          minimum = int(os.environ["MIN_TOPK"])
          line = f"mdq golden top-k: {hits}/{len(per_query)} (minimum {minimum})"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"## mdq golden\n\n{line}\n")
          print(line)
          raise SystemExit(0 if hits >= minimum else 1)
          PY
