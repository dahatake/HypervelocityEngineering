name: Azure Static Web Apps APP-009 CI/CD

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Azure resource group
        required: true
        type: string
      static_web_app_name:
        description: Azure Static Web App name
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    environment: copilot
    env:
      RESOURCE_GROUP: ${{ inputs.resource_group }}
      STATIC_WEB_APP_NAME: ${{ inputs.static_web_app_name }}
    steps:
      - name: Validate deployment target inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RESOURCE_GROUP//[[:space:]]/}" ]]; then
            echo "resource_group is required" >&2
            exit 1
          fi
          if [[ -z "${STATIC_WEB_APP_NAME//[[:space:]]/}" ]]; then
            echo "static_web_app_name is required" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm Azure Static Web App target
        shell: bash
        run: |
          set -euo pipefail
          target_id="$(az staticwebapp show \
            --name "${STATIC_WEB_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query id \
            --output tsv)"
          if [[ -z "${target_id}" ]]; then
            echo "Azure Static Web App target was not found" >&2
            exit 1
          fi
          echo "Azure Static Web App target confirmed"

      - name: Get Azure Static Web Apps deployment token
        id: swa_token
        shell: bash
        run: |
          set -euo pipefail
          deployment_token="$(az staticwebapp secrets list \
            --name "${STATIC_WEB_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query "properties.apiKey" \
            -o tsv)"
          if [[ -z "$deployment_token" ]]; then
            echo "Deployment token is empty" >&2
            exit 1
          fi
          echo "::add-mask::${deployment_token}"
          echo "deployment_token=${deployment_token}" >> "$GITHUB_OUTPUT"

      - name: Build and Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.deployment_token }}
          action: upload
          app_location: src/app
          api_location: ''
          output_location: ''
          skip_app_build: true
          production_branch: main
