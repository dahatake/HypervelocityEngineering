name: State Transition on PR Merge

on:
  pull_request_target:
    types: [closed]

concurrency:
  group: state-transition-on-pr-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  transition:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BODY: ${{ github.event.pull_request.body }}

    steps:
      - name: PR body から parent-issue を解決
        id: resolve
        run: |
          set -euo pipefail
          issue_number=''
          owner="${REPO%%/*}"
          repo_name="${REPO#*/}"

          # Method 1: GraphQL closingIssuesReferences
          gql_issue=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $pr: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $pr) {
                  closingIssuesReferences(first: 10) {
                    nodes {
                      number
                    }
                  }
                }
              }
            }
          ' -f owner="${owner}" -f repo="${repo_name}" -F pr="${PR_NUMBER}" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[0].number' \
            2>/dev/null || echo '')
          if [ -n "${gql_issue}" ] && [ "${gql_issue}" != "null" ]; then
            issue_number="${gql_issue}"
            echo "PR #${PR_NUMBER}: closingIssuesReferences から Issue #${issue_number} を解決しました。"
          fi

          # Method 2: PR body の Closes/Fixes/Resolves #N（owner/repo#N 形式含む）
          if [ -z "${issue_number}" ]; then
            body_issue=$(printf '%s' "${PR_BODY}" \
              | grep -oiP '(?:fix(?:es)?|close[sd]?|resolve[sd]?)\s+(?:[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+)?#\K[0-9]+' \
              | head -1 || true)
            if [ -n "${body_issue}" ]; then
              issue_number="${body_issue}"
              echo "PR #${PR_NUMBER}: PR body から Issue #${issue_number} を解決しました。"
            fi
          fi

          # Method 3: PR title の #N（Issue 実在かつ PR ではないことを確認）
          if [ -z "${issue_number}" ]; then
            pr_title=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.title' 2>/dev/null || echo '')
            title_issue=$(printf '%s' "${pr_title}" | grep -oP '#\K[0-9]+' | tail -1 || true)
            if [ -n "${title_issue}" ]; then
              is_issue=$(gh api "/repos/${REPO}/issues/${title_issue}" \
                --jq 'if .pull_request == null then "true" else "false" end' \
                2>/dev/null || echo 'false')
              if [ "${is_issue}" = "true" ]; then
                issue_number="${title_issue}"
                echo "PR #${PR_NUMBER}: PR title から Issue #${issue_number} を解決しました。"
              fi
            fi
          fi

          # Method 4: PR body の parent-issue マーカー（後方互換）
          if [ -z "${issue_number}" ]; then
            issue_number=$(printf '%s' "${PR_BODY}" | python3 -c "
            import sys, re
            body = sys.stdin.read()
            m = re.search(r'<!--\s*parent-issue:\s*#([0-9]+)\s*-->', body or '')
            print(m.group(1) if m else '')
            " 2>/dev/null || echo '')
            if [ -n "${issue_number}" ]; then
              echo "PR #${PR_NUMBER}: parent-issue マーカーから Issue #${issue_number} を解決しました。"
            fi
          fi

          # Method 5: PR timeline の cross-referenced Issue から解決（フォールバック）
          if [ -z "${issue_number}" ]; then
            xref_issues=$(gh api "/repos/${REPO}/issues/${PR_NUMBER}/timeline" \
              --paginate \
              --jq '[.[] | select(.event == "cross-referenced") | select(.source.issue.pull_request == null) | .source.issue.number] | unique | .[]' \
              2>/dev/null || true)
            xref_unique=$(printf '%s\n' "${xref_issues}" | grep -E '^[0-9]+$' | sort -u || true)
            xref_count=$(printf '%s\n' "${xref_unique}" | sed '/^$/d' | wc -l | tr -d '[:space:]')

            if [ "${xref_count}" = "1" ]; then
              xref_issue=$(printf '%s\n' "${xref_unique}" | head -1 || true)
              managed_issue=$(gh api "/repos/${REPO}/issues/${xref_issue}" 2>/dev/null | python3 -c "import json, sys; issue = json.load(sys.stdin); title = issue.get('title', ''); labels = [l.get('name', '') for l in issue.get('labels', [])]; prefixes = ('ard','aas','aad-web','asdw-web','adfd','adfdv','aag','aagd','aar','ada','akm','adoc','aad','asdw'); title_tokens = ('[ARD]','[AAS]','[AAD-WEB]','[ASDW-WEB]','[ADFD]','[ADFDV]','[AAG]','[AAGD]','[AAR]','[ADA]','[AKM]','[ADOC]','[AAD]','[ASDW]'); print('true' if (title.startswith(title_tokens) or any(any(lbl.startswith(f'{p}:') for p in prefixes) for lbl in labels)) else 'false')" 2>/dev/null || echo 'false')
              if [ "${managed_issue}" = "true" ]; then
                issue_number="${xref_issue}"
                echo "PR #${PR_NUMBER}: Method 5 (PR timeline cross-referenced) から Issue #${issue_number} を解決しました。"
              else
                echo "PR #${PR_NUMBER}: Method 5 は管理対象 Step Issue ではないため採用しません。"
              fi
            elif [ "${xref_count}" -gt 1 ]; then
              echo "PR #${PR_NUMBER}: Method 5 は候補が複数のため採用しません。"
            fi
          fi

          echo "issue_number=${issue_number}" >> "${GITHUB_OUTPUT}"
          if [ -z "${issue_number}" ]; then
            echo "PR #${PR_NUMBER}: Issue 番号を解決できません。スキップします。"
          fi

      - name: 系列プレフィックス判定
        id: detect-prefix
        if: steps.resolve.outputs.issue_number != ''
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
        run: |
          set -euo pipefail
          issue_data=$(gh api "/repos/${REPO}/issues/${ISSUE_NUMBER}" 2>/dev/null) || {
            echo "prefix=" >> "${GITHUB_OUTPUT}"
            echo "Issue #${ISSUE_NUMBER} を取得できません。"
            exit 0
          }

          prefix=$(printf '%s' "${issue_data}" | python3 -c "
          import sys, json
          issue = json.load(sys.stdin)
          title = issue.get('title', '')
          labels = [l.get('name', '') for l in issue.get('labels', [])]

            # 管理系列: aas, aad, aad-web, asdw, asdw-web, adfd, adfdv, aag, aagd, akm, adoc
          title_prefix_map = [
              ('[ARD]', 'ard'),
              ('[AAD-WEB]', 'aad-web'),
              ('[ASDW-WEB]', 'asdw-web'),
              ('[AAS]', 'aas'),
              ('[ADFD]', 'adfd'),
              ('[ADFDV]', 'adfdv'),
              ('[AAG]', 'aag'),
              ('[AAGD]', 'aagd'),
              ('[AAR]', 'aar'),
              ('[ADA]', 'ada'),
              ('[AKM]', 'akm'),
              ('[ADOC]', 'adoc'),
              # 後方互換: 旧プレフィックス [AAD]/[ASDW] は -web 系列にマップ
              ('[AAD]', 'aad-web'),
              ('[ASDW]', 'asdw-web'),
          ]

          resolved = ''
          for token, mapped in title_prefix_map:
              if title.startswith(token):
                  resolved = mapped
                  break

          if not resolved:
              candidates = ['ard', 'aas', 'aad-web', 'asdw-web', 'adfd', 'adfdv', 'aag', 'aagd', 'aar', 'ada', 'akm', 'adoc', 'aad', 'asdw']
              for cand in candidates:
                  if any(lbl.startswith(f'{cand}:') for lbl in labels):
                      if cand == 'aad':
                          resolved = 'aad-web'
                      elif cand == 'asdw':
                          resolved = 'asdw-web'
                      else:
                          resolved = cand
                      break

          print(resolved)
          " 2>/dev/null || echo '')

          echo "prefix=${prefix}" >> "${GITHUB_OUTPUT}"
          if [ -z "${prefix}" ]; then
            echo "Issue #${ISSUE_NUMBER}: 系列プレフィックスを判定できません。スキップします。"
          fi

      - name: Checkout trusted APP requirement validator
        if: steps.detect-prefix.outputs.prefix == 'ard'
        uses: actions/checkout@v4
        with:
          path: trusted

      - name: Checkout PR head as validation data
        if: steps.detect-prefix.outputs.prefix == 'ard'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: subject
          persist-credentials: false

      - name: Validate APP requirement completion contract
        id: validate-app-requirement-completion
        if: steps.detect-prefix.outputs.prefix == 'ard'
        continue-on-error: true
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          issue_title=$(gh api "/repos/${REPO}/issues/${ISSUE_NUMBER}" --jq '.title' 2>/dev/null || echo '')
          export ISSUE_TITLE="${issue_title}"
          python3 -I - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          trusted_root = Path(os.environ["GITHUB_WORKSPACE"]) / "trusted"
          subject_root = Path(os.environ["GITHUB_WORKSPACE"]) / "subject"
          # Validator code is imported only from the trusted checkout. The
          # subject checkout is treated strictly as data from the merged PR head.
          sys.path.insert(0, str(trusted_root))

          from hve.application_requirements import (
              validate_application_requirement_trace_block,
              validate_requirement_coverage,
          )

          workflow_id = "ard"
          title = os.environ.get("ISSUE_TITLE", "")
          pr_body = os.environ.get("PR_BODY", "") or ""

          if workflow_id == "ard" and not re.match(r"^\[ARD\]\s+Step\.4\.2:", title):
              print("APP_REQUIREMENT_COMPLETION_NA workflow=ard")
              raise SystemExit(0)

          coverage = validate_requirement_coverage(subject_root)
          for orphan in coverage.orphan_paths:
              print(f"WARNING: orphan preserved: {orphan.as_posix()}")
          if coverage.errors:
              for error in coverage.errors:
                  print(f"ERROR: {error}")
              raise SystemExit(1)

          # ARD Step 4.2 は単一 Issue で全 catalog APP を順次 upsert し、fan-out
          # child Issue を作らない。そのため共有 preflight と同様、この completion
          # gate も per-child fanout_meta=None 相当の catalog 直接解決で scope を
          # 決定する（fanout_meta を伴う個別呼び出しは行わない）。
          trace_errors = validate_application_requirement_trace_block(
              pr_body,
              repo_root=subject_root,
              expected_app_ids=coverage.app_ids,
          )
          if trace_errors:
              for error in trace_errors:
                  print(f"ERROR: {error}")
              raise SystemExit(1)

          print(f"APP_REQUIREMENT_COMPLETION_PASS apps={len(coverage.app_ids)}")
          PY

      - name: APP requirement completion 失敗コメント
        if: steps.detect-prefix.outputs.prefix == 'ard' && steps.validate-app-requirement-completion.outcome == 'failure'
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
        run: |
          set -euo pipefail
          comment_file="${RUNNER_TEMP}/app-requirement-completion-failed.md"
          cat > "${comment_file}" <<'EOF'
          ## ⛔ APP要求完了契約 failed

          ARD Step.4.2 の完了判定で、要求定義書カバレッジまたは完了報告の trace block を検証できませんでした。詳細は Actions log を確認し、要求定義書または PR 本文を修正してから再度 merge してください。

          <!-- app-requirement-completion-failed -->
          EOF
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPO}" --body-file "${comment_file}"

      - name: done 付与と残置ラベル整理
        id: transition-labels
        if: steps.resolve.outputs.issue_number != '' && steps.detect-prefix.outputs.prefix != '' && steps.validate-app-requirement-completion.outcome != 'failure'
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          PREFIX: ${{ steps.detect-prefix.outputs.prefix }}
        run: |
          set -euo pipefail

          done_label="${PREFIX}:done"
          qa_drafting_label="${PREFIX}:qa-drafting"
          qa_ready_label="${PREFIX}:qa-ready"
          ready_label="${PREFIX}:ready"
          running_label="${PREFIX}:running"
          blocked_label="${PREFIX}:blocked"

          fetch_labels() {
            local issue_json
            issue_json=$(gh api "/repos/${REPO}/issues/${ISSUE_NUMBER}" 2>/dev/null) || return 1
            printf '%s' "${issue_json}" | python3 -c "
          import json, sys
          issue = json.load(sys.stdin)
          labels = issue.get('labels')
          if not isinstance(labels, list):
              raise ValueError('labels must be a list')
          names = []
          for label in labels:
              if not isinstance(label, dict) or not isinstance(label.get('name'), str):
                  raise ValueError('each label must have a string name')
              names.append(label['name'])
          print('\\n'.join(names))
          "
          }

          has_label() {
            local labels="${1}"
            local target="${2}"
            printf '%s\n' "${labels}" | grep -Fxq -- "${target}"
          }

          rollback_done() {
            if gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --remove-label "${done_label}" >/dev/null 2>&1; then
              return 0
            fi
            echo "::warning::fail-closed rollback で ${done_label} を除去できませんでした。手動確認が必要です。"
            return 1
          }

          rollback_failed=false
          verification_failed=false
          if ! labels=$(fetch_labels); then
            verification_failed=true
            if ! rollback_done; then
              rollback_failed=true
            fi
            result=$(printf 'prefix=%s, done_added=false, cleanup_failed=true, verification_failed=true, rollback_failed=%s, stale_remaining=[unknown]' \
              "${PREFIX}" "${rollback_failed}")
            echo "result=${result}" >> "${GITHUB_OUTPUT}"
            echo "done_present=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

          cleanup_failed=false
          removed_labels=''
          for stale in "${qa_drafting_label}" "${qa_ready_label}" "${ready_label}" "${running_label}" "${blocked_label}"; do
            if has_label "${labels}" "${stale}"; then
              if gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --remove-label "${stale}" >/dev/null 2>&1; then
                removed_labels="${removed_labels}${removed_labels:+,}${stale}"
              else
                echo "::warning::残置ラベルの削除に失敗: ${stale}"
                cleanup_failed=true
              fi
            fi
          done

          labels_after_cleanup=''
          if ! labels_after_cleanup=$(fetch_labels); then
            echo "::warning::残置ラベル整理後の Issue 取得に失敗しました。"
            verification_failed=true
            cleanup_failed=true
          fi
          stale_remaining=''
          for stale in "${qa_drafting_label}" "${qa_ready_label}" "${ready_label}" "${running_label}" "${blocked_label}"; do
            if has_label "${labels_after_cleanup}" "${stale}"; then
              stale_remaining="${stale_remaining}${stale_remaining:+,}${stale}"
            fi
          done

          done_present=false
          if has_label "${labels_after_cleanup}" "${done_label}"; then
            done_present=true
          fi
          if [ "${cleanup_failed}" = "true" ] || [ -n "${stale_remaining}" ]; then
            if [ "${done_present}" = "true" ] || [ "${verification_failed}" = "true" ]; then
              if ! rollback_done; then
                rollback_failed=true
              fi
            fi
            result=$(printf 'prefix=%s, done_added=false, cleanup_failed=true, verification_failed=%s, rollback_failed=%s, stale_remaining=[%s]' \
              "${PREFIX}" "${verification_failed}" "${rollback_failed}" "${stale_remaining:-unknown}")
            echo "result=${result}" >> "${GITHUB_OUTPUT}"
            echo "done_present=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

          added_done=false
          add_failed=false
          if [ "${done_present}" = "true" ]; then
            echo "${done_label} は既に存在するため、付与をスキップします。"
          elif gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --add-label "${done_label}"; then
            added_done=true
          else
            echo "::warning::${done_label} の付与に失敗しました。"
            add_failed=true
          fi

          post_done_labels=''
          if ! post_done_labels=$(fetch_labels); then
            verification_failed=true
          fi
          done_present=false
          if has_label "${post_done_labels}" "${done_label}"; then
            done_present=true
          fi
          post_done_stale_remaining=''
          for stale in "${qa_drafting_label}" "${qa_ready_label}" "${ready_label}" "${running_label}" "${blocked_label}"; do
            if has_label "${post_done_labels}" "${stale}"; then
              post_done_stale_remaining="${post_done_stale_remaining}${post_done_stale_remaining:+,}${stale}"
            fi
          done
          if [ "${add_failed}" = "true" ] || [ "${verification_failed}" = "true" ] || \
             [ "${done_present}" != "true" ] || [ -n "${post_done_stale_remaining}" ]; then
            if [ "${done_present}" = "true" ] || [ "${verification_failed}" = "true" ]; then
              if ! rollback_done; then
                rollback_failed=true
              fi
            fi
            result=$(printf 'prefix=%s, done_added=%s, add_failed=%s, cleanup_failed=false, verification_failed=%s, rollback_failed=%s, stale_remaining=[%s]' \
              "${PREFIX}" "${added_done}" "${add_failed}" "${verification_failed}" "${rollback_failed}" "${post_done_stale_remaining:-unknown}")
            echo "result=${result}" >> "${GITHUB_OUTPUT}"
            echo "done_present=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

          result=$(printf 'prefix=%s, done_added=%s, removed=[%s], cleanup_failed=false, verification_failed=false, rollback_failed=false' \
            "${PREFIX}" "${added_done}" "${removed_labels}")
          echo "result=${result}" >> "${GITHUB_OUTPUT}"
          echo "done_present=${done_present}" >> "${GITHUB_OUTPUT}"

      - name: Issue を冪等にクローズ
        id: close-issue
        if: always() && steps.resolve.outputs.issue_number != '' && steps.detect-prefix.outputs.prefix != ''
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          PREFIX: ${{ steps.detect-prefix.outputs.prefix }}
          DONE_PRESENT: ${{ steps.transition-labels.outputs.done_present }}
        run: |
          set -euo pipefail
          AUTO_CLOSE_MARKER='<!-- auto-close-done -->'
          close_status='skipped'

          if [ "${DONE_PRESENT}" != "true" ]; then
            echo "done ラベル未確認のため、クローズをスキップします。"
            echo "close_status=${close_status}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          fetch_labels() {
            local issue_json
            issue_json=$(gh api "/repos/${REPO}/issues/${ISSUE_NUMBER}" 2>/dev/null) || return 1
            printf '%s' "${issue_json}" | python3 -c "
          import json, sys
          issue = json.load(sys.stdin)
          labels = issue.get('labels')
          if not isinstance(labels, list):
              raise ValueError('labels must be a list')
          names = []
          for label in labels:
              if not isinstance(label, dict) or not isinstance(label.get('name'), str):
                  raise ValueError('each label must have a string name')
              names.append(label['name'])
          print('\\n'.join(names))
          "
          }

          has_label() {
            local labels="${1}"
            local target="${2}"
            printf '%s\n' "${labels}" | grep -Fxq -- "${target}"
          }

          verify_g_lbl() {
            local labels="${1}"
            has_label "${labels}" "${PREFIX}:done" && \
              ! has_label "${labels}" "${PREFIX}:running" && \
              ! has_label "${labels}" "${PREFIX}:blocked"
          }

          rollback_done=false
          if ! current_labels=$(fetch_labels) || ! verify_g_lbl "${current_labels}"; then
            if [ -z "${current_labels:-}" ] || has_label "${current_labels}" "${PREFIX}:done"; then
              if ! gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --remove-label "${PREFIX}:done" >/dev/null 2>&1; then
                rollback_done=true
              fi
            fi
            close_status="g-lbl-invalid(rollback_failed=${rollback_done})"
            echo "close_status=${close_status}" >> "${GITHUB_OUTPUT}"
            echo "::warning::close直前の G-LBL 再検証に失敗したため、Issueをクローズしません。"
            exit 1
          fi

          issue_state=$(gh api "/repos/${REPO}/issues/${ISSUE_NUMBER}" --jq '.state' 2>/dev/null || echo '')
          if [ -z "${issue_state}" ]; then
            echo "::warning::Issue #${ISSUE_NUMBER} の state 取得に失敗したため、クローズをスキップします。"
            close_status='skipped'
          elif [ "${issue_state}" != "open" ]; then
            echo "Issue #${ISSUE_NUMBER} は既に ${issue_state} のためクローズ不要です。"
            close_status='already-closed'
          else
            marker_exists=$(gh api "/repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
              --paginate --jq '.[]' 2>/dev/null \
              | jq -s --arg marker "${AUTO_CLOSE_MARKER}" 'any(.[]; (.body // "") | contains($marker))' \
              2>/dev/null || echo 'false')

            if [ "${marker_exists}" != "true" ]; then
              auto_close_comment=$(printf '## ✅ Auto Close\n\nPR マージ後の状態遷移処理により、この Issue を自動クローズします。\n\n%s' "${AUTO_CLOSE_MARKER}")
              if ! gh issue comment "${ISSUE_NUMBER}" --repo "${REPO}" --body "${auto_close_comment}" >/dev/null 2>&1; then
                echo "::warning::Issue #${ISSUE_NUMBER} への auto-close コメント投稿に失敗しました。"
              fi
            fi

            if gh issue close "${ISSUE_NUMBER}" --repo "${REPO}" --reason completed >/dev/null 2>&1; then
              close_status='closed'
            else
              echo "::warning::Issue #${ISSUE_NUMBER} のクローズに失敗しました。"
              close_status='close-failed'
            fi
          fi

          if [ "${close_status}" = "closed" ]; then
            post_close_rollback_failed=false
            post_close_reopen_failed=false
            if ! post_close_labels=$(fetch_labels) || ! verify_g_lbl "${post_close_labels}"; then
              if [ -z "${post_close_labels:-}" ] || has_label "${post_close_labels}" "${PREFIX}:done"; then
                if ! gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --remove-label "${PREFIX}:done" >/dev/null 2>&1; then
                  post_close_rollback_failed=true
                fi
              fi
              if ! gh issue reopen "${ISSUE_NUMBER}" --repo "${REPO}" >/dev/null 2>&1; then
                post_close_reopen_failed=true
              fi
              close_status="post-close-g-lbl-invalid(rollback_failed=${post_close_rollback_failed},reopen_failed=${post_close_reopen_failed})"
              echo "close_status=${close_status}" >> "${GITHUB_OUTPUT}"
              echo "::warning::close直後の G-LBL 再検証に失敗しました。手動確認が必要です。"
              exit 1
            fi
          fi

          echo "close_status=${close_status}" >> "${GITHUB_OUTPUT}"

      - name: 処理結果コメントを Issue に投稿
        if: always() && steps.resolve.outputs.issue_number != ''
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          PREFIX: ${{ steps.detect-prefix.outputs.prefix }}
          RESULT: ${{ steps.transition-labels.outputs.result }}
          CLOSE_STATUS: ${{ steps.close-issue.outputs.close_status }}
        run: |
          set -euo pipefail
          MARKER='<!-- state-transition-on-pr-merge-done -->'

          if [ -z "${PREFIX}" ]; then
            SUMMARY='prefix 判定不能のためスキップ'
            CLOSE_SUMMARY='スキップ（prefix 判定不能）'
          elif [ -n "${RESULT}" ]; then
            SUMMARY="${RESULT}"
            if [ "${CLOSE_STATUS}" = "closed" ]; then
              CLOSE_SUMMARY='実行した'
            elif [ "${CLOSE_STATUS}" = "already-closed" ]; then
              CLOSE_SUMMARY='既にクローズ済み'
            elif [ -n "${CLOSE_STATUS}" ]; then
              CLOSE_SUMMARY="スキップ/失敗（${CLOSE_STATUS}）"
            else
              CLOSE_SUMMARY='スキップ（条件不一致）'
            fi
          else
            SUMMARY='遷移ステップ未実行（条件不一致）'
            CLOSE_SUMMARY='スキップ（条件不一致）'
          fi

          COMMENT=$(printf '%s\n\n## ✅ PR merge 起点の状態遷移\n\n- PR: #%s\n- Issue: #%s\n- 結果: %s\n- クローズ: %s\n\n> ℹ️ このコメントは `state-transition-on-pr-merge.yml` によって自動投稿されました。' \
            "${MARKER}" "${PR_NUMBER}" "${ISSUE_NUMBER}" "${SUMMARY}" "${CLOSE_SUMMARY}")

          comment_id=$(gh api "/repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
            --paginate --jq '.[]' 2>/dev/null \
            | jq -sr --arg marker "${MARKER}" 'map(select((.body // "") | contains($marker))) | last | (.id // empty)') || comment_id=''

          if [ -n "${comment_id}" ]; then
            gh api --method PATCH "/repos/${REPO}/issues/comments/${comment_id}" -f "body=${COMMENT}" >/dev/null
          else
            gh issue comment "${ISSUE_NUMBER}" --repo "${REPO}" --body "${COMMENT}"
          fi
