name: Copilot Auto Feedback

on:
  pull_request_target:
    types: [opened, edited, labeled, ready_for_review]
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      target_issue:
        description: 'テスト対象 Issue 番号'
        required: true
        type: string
      target_pr:
        description: 'テスト対象 PR 番号（PR 経路の場合）'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'ドライラン（書き込み操作をスキップ）'
        required: false
        type: boolean
        default: true
      simulate_label:
        description: 'シミュレートするラベル名（例: aas:qa-ready）'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  auto-qa:
    concurrency:
      group: copilot-auto-qa-${{ github.event_name == 'workflow_dispatch' && inputs.target_pr || github.event.pull_request.number }}
      cancel-in-progress: false
    if: >
      (github.event_name == 'pull_request_target'
      && contains(github.event.pull_request.labels.*.name, 'auto-qa')
      && !contains(github.event.pull_request.labels.*.name, 'qa-questionnaire-pr'))
      || (github.event_name == 'workflow_dispatch' && inputs.target_pr != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.target_issue || github.event.issue.number }}
      PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.target_pr || github.event.pull_request.number }}
      SIMULATE_LABEL: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_label || '' }}
      PR_BODY: ${{ github.event.pull_request.body }}

    steps:
      - name: Check opt-out marker in PR body (excluding quoted sections)
        id: optout
        run: |
          set -euo pipefail
          # <!-- START COPILOT ORIGINAL PROMPT --> 以降（Copilot による元 Issue 引用部分）を除外し、
          # PR 本文のみを対象に opt-out マーカーをチェックする
          PR_BODY_HEAD=$(printf '%s' "${PR_BODY}" | sed '/<!-- START COPILOT ORIGINAL PROMPT -->/,$d')
          if printf '%s' "${PR_BODY_HEAD}" | grep -qF '<!-- auto-qa: false -->'; then
            echo "PR body の先頭部分に opt-out マーカーが含まれています。後続ステップをスキップします。"
            echo "opted_out=true" >> "${GITHUB_OUTPUT}"
          else
            echo "opted_out=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check for existing QA comment
        id: guard
        if: steps.optout.outputs.opted_out != 'true'
        run: |
          set -euo pipefail
          MARKER="<!-- copilot-auto-qa-posted -->"
          existing=0
          if existing=$(gh api "/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq "[.[] | select(.body | contains(\"${MARKER}\"))] | length" \
            2>/dev/null); then
            :
          else
            existing=0
          fi
          if [ "${existing:-0}" -gt 0 ]; then
            echo "質問票作成指示コメントは既に投稿済みです。スキップします。"
            echo "posted=true" >> "${GITHUB_OUTPUT}"
          else
            echo "posted=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout cloud prompt sources for auto QA
        if: steps.optout.outputs.opted_out != 'true' && steps.guard.outputs.posted != 'true'
        uses: actions/checkout@v4

      - name: Post auto QA instruction to Copilot
        if: steps.optout.outputs.opted_out != 'true' && steps.guard.outputs.posted != 'true'
        run: |
          set -euo pipefail
          prompt_path=".github/prompts/cloud/copilot-auto-feedback-auto-qa.prompt.md"
          if [ ! -s "${prompt_path}" ]; then
            echo "::error::Prompt file ${prompt_path} is missing or empty."
            exit 1
          fi
          COMMENT_BODY="$(cat "${prompt_path}")"
          if [ -z "${COMMENT_BODY}" ]; then
            echo "::error::COMMENT_BODY が空です。Prompt file ${prompt_path} を確認してください。"
            exit 1
          fi
          dry_run_guard() {
            local cmd_desc="$1"
            shift
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::notice::[DRY RUN] スキップ: ${cmd_desc}"
              echo "[DRY RUN] would execute: ${cmd_desc}"
              return 0
            fi
            "$@"
          }
          if dry_run_guard "PR への auto-qa 指示コメント投稿" \
            gh pr comment "${PR_NUMBER}" \
              --repo "${REPO}" \
              --body "${COMMENT_BODY}"; then
            echo "✅ 優先順位付き質問票作成指示コメントを PR #${PR_NUMBER} に投稿しました。"
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::group::DRY RUN Summary"
              echo "[DRY RUN] target_issue=${ISSUE_NUMBER}"
              echo "[DRY RUN] target_pr=${PR_NUMBER}"
              echo "[DRY RUN] simulate_label=${SIMULATE_LABEL}"
              echo "[DRY RUN] === Skipped writes ==="
              echo "[DRY RUN] would execute: gh pr comment ${PR_NUMBER} --body \"<COMMENT_BODY (500 chars preview)>\""
              echo "[DRY RUN] === Read-only checks executed ==="
              echo "[DRY RUN] existing QA comment check: OK"
              echo "::endgroup::"
            fi
          else
            echo "::error::PR #${PR_NUMBER} へのコメント投稿に失敗しました。"
            exit 1
          fi

  auto-review:
    concurrency:
      group: copilot-auto-review-${{ github.event_name == 'workflow_dispatch' && inputs.target_pr || github.event.pull_request.number }}
      cancel-in-progress: false
    if: >
      github.event_name == 'pull_request_target'
      || (github.event_name == 'workflow_dispatch' && inputs.target_pr != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.target_issue || github.event.issue.number }}
      PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.target_pr || github.event.pull_request.number }}
      SIMULATE_LABEL: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_label || '' }}

    steps:
      - name: Resolve adversarial review trigger (excluding quoted sections)
        id: trigger
        run: |
          set -euo pipefail
          pr_data=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}")
          pr_body=$(printf '%s' "${pr_data}" | jq -r '.body // ""')
          has_label=$(printf '%s' "${pr_data}" \
            | jq -r '[.labels[].name] | if contains(["adversarial-review"]) then "true" else "false" end')
          # <!-- START COPILOT ORIGINAL PROMPT --> 以降（Copilot による元 Issue 引用部分）を除外し、
          # PR 本文のみを対象に marker をチェックする。false は label / true より優先する。
          PR_BODY_HEAD=$(printf '%s' "${pr_body}" | sed '/<!-- START COPILOT ORIGINAL PROMPT -->/,$d')
          if printf '%s' "${PR_BODY_HEAD}" | grep -qF '<!-- adversarial-review: false -->'; then
            echo "PR body の先頭部分に opt-out マーカーが含まれています。"
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "opted_out=true" >> "${GITHUB_OUTPUT}"
          elif [ "${has_label}" = "true" ] \
            || printf '%s' "${PR_BODY_HEAD}" | grep -qF '<!-- adversarial-review: true -->'; then
            echo "敵対的レビューの明示トリガーを検出しました。"
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "opted_out=false" >> "${GITHUB_OUTPUT}"
          else
            echo "敵対的レビューの明示トリガーがないためスキップします。"
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "opted_out=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "has_label=${has_label}" >> "${GITHUB_OUTPUT}"

      - name: Normalize true marker to adversarial-review label
        if: steps.trigger.outputs.enabled == 'true' && steps.trigger.outputs.has_label != 'true'
        run: |
          set -euo pipefail
          gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label "adversarial-review"
          echo "✅ true marker を adversarial-review ラベルへ正規化しました。"

      - name: Enforce explicit opt-out by removing adversarial-review label
        if: steps.trigger.outputs.opted_out == 'true' && steps.trigger.outputs.has_label == 'true'
        run: |
          set -euo pipefail
          gh pr edit "${PR_NUMBER}" --repo "${REPO}" --remove-label "adversarial-review"
          echo "✅ false marker を優先し、adversarial-review ラベルを除去しました。"

      - name: Check for existing review comment
        id: guard
        if: steps.trigger.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          MARKER="<!-- copilot-auto-review-posted -->"
          existing=$(gh api "/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq "[.[] | select(.body | contains(\"${MARKER}\"))] | length" \
            2>&1) || existing="0"
          if [ "${existing:-0}" -gt 0 ] 2>/dev/null; then
            echo "レビュー指示コメントは既に投稿済みです。スキップします。"
            echo "posted=true" >> "${GITHUB_OUTPUT}"
          else
            echo "posted=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout cloud prompt sources for auto review
        if: steps.trigger.outputs.enabled == 'true' && steps.guard.outputs.posted != 'true'
        uses: actions/checkout@v4

      - name: Post auto review instruction to Copilot
        if: steps.trigger.outputs.enabled == 'true' && steps.guard.outputs.posted != 'true'
        run: |
          set -euo pipefail
          prompt_path=".github/prompts/cloud/copilot-auto-feedback-auto-review.prompt.md"
          if [ ! -s "${prompt_path}" ]; then
            echo "::error::Prompt file ${prompt_path} is missing or empty."
            exit 1
          fi
          COMMENT_BODY="$(cat "${prompt_path}")"
          if [ -z "${COMMENT_BODY}" ]; then
            echo "::error::COMMENT_BODY が空です。Prompt file ${prompt_path} を確認してください。"
            exit 1
          fi
          dry_run_guard() {
            local cmd_desc="$1"
            shift
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::notice::[DRY RUN] スキップ: ${cmd_desc}"
              echo "[DRY RUN] would execute: ${cmd_desc}"
              return 0
            fi
            "$@"
          }
          if dry_run_guard "PR への auto-review 指示コメント投稿" \
            gh pr comment "${PR_NUMBER}" \
              --repo "${REPO}" \
              --body "${COMMENT_BODY}"; then
            echo "✅ 敵対的レビュー指示コメントを PR #${PR_NUMBER} に投稿しました。"
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::group::DRY RUN Summary"
              echo "[DRY RUN] target_issue=${ISSUE_NUMBER}"
              echo "[DRY RUN] target_pr=${PR_NUMBER}"
              echo "[DRY RUN] simulate_label=${SIMULATE_LABEL}"
              echo "[DRY RUN] === Skipped writes ==="
              echo "[DRY RUN] would execute: gh pr comment ${PR_NUMBER} --body \"<COMMENT_BODY (500 chars preview)>\""
              echo "[DRY RUN] === Read-only checks executed ==="
              echo "[DRY RUN] existing review comment check: OK"
              echo "::endgroup::"
            fi
          else
            echo "::error::PR #${PR_NUMBER} へのコメント投稿に失敗しました。"
            exit 1
          fi

  auto-qa-on-issue:
    # Issue に *:qa-ready ラベルが付与された時に事前 QA 質問票を投稿する
    concurrency:
      group: copilot-auto-pre-qa-${{ github.event_name == 'workflow_dispatch' && inputs.target_issue || github.event.issue.number }}
      cancel-in-progress: false
    if: >
      (github.event_name == 'issues'
      && github.event.action == 'labeled'
      && contains(fromJSON('["ard:qa-ready","aas:qa-ready","aad:qa-ready","aad-web:qa-ready","asdw:qa-ready","asdw-web:qa-ready","adfd:qa-ready","adfdv:qa-ready","aag:qa-ready","aagd:qa-ready","akm:qa-ready","adoc:qa-ready"]'), github.event.label.name))
      || (github.event_name == 'workflow_dispatch'
      && contains(fromJSON('["ard:qa-ready","aas:qa-ready","aad:qa-ready","aad-web:qa-ready","asdw:qa-ready","asdw-web:qa-ready","adfd:qa-ready","adfdv:qa-ready","aag:qa-ready","aagd:qa-ready","akm:qa-ready","adoc:qa-ready"]'), inputs.simulate_label))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
      COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
      REPO: ${{ github.repository }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.target_issue || github.event.issue.number }}
      PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.target_pr || github.event.pull_request.number }}
      QA_READY_LABEL: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_label || github.event.label.name }}
      SIMULATE_LABEL: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_label || '' }}

    steps:
      - name: Diagnostic — トリガー条件確認
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "action=${{ github.event.action }}"
          echo "label.name=${{ github.event.label.name }}"
          echo "issue.number=${{ github.event.issue.number }}"
          echo "ref=${{ github.ref }}"

      - name: 冪等性ガード（既に事前 QA 投稿済みならスキップ）
        id: guard
        run: |
          set -euo pipefail
          MARKER="<!-- copilot-auto-pre-qa-posted -->"
          existing=0
          if existing=$(gh api "/repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
            --paginate \
            --jq "[.[] | select(.body | contains(\"${MARKER}\"))] | length" \
            2>/dev/null); then
            :
          else
            existing=0
          fi
          if [ "${existing:-0}" -gt 0 ]; then
            echo "事前 QA 指示コメントは既に投稿済みです。スキップします。"
            echo "posted=true" >> "${GITHUB_OUTPUT}"
          else
            echo "posted=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: pre-QA prompt source を checkout
        if: steps.guard.outputs.posted != 'true' || vars.ENABLE_COPILOT_QA_ASSIGN != 'false'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: steps.guard.outputs.posted != 'true' || vars.ENABLE_COPILOT_QA_ASSIGN != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: hve をインストール
        if: steps.guard.outputs.posted != 'true' || vars.ENABLE_COPILOT_QA_ASSIGN != 'false'
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .

      - name: Issue に事前 QA 質問票生成指示を投稿
        if: steps.guard.outputs.posted != 'true'
        run: |
          set -euo pipefail
          dry_run_guard() {
            local cmd_desc="$1"
            shift
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::notice::[DRY RUN] スキップ: ${cmd_desc}"
              echo "[DRY RUN] would execute: ${cmd_desc}"
              return 0
            fi
            "$@"
          }
          COMMENT_BODY="$(python3 -m hve emit-prompt pre-qa --comment-body)" || {
            echo "::error::hve emit-prompt の実行に失敗しました。"
            exit 1
          }
          if [ -z "${COMMENT_BODY}" ]; then
            echo "::error::COMMENT_BODY が空です。hve emit-prompt の出力を確認してください。"
            exit 1
          fi
          echo "::group::COMMENT_BODY preview (先頭500文字)"
          printf '%s' "${COMMENT_BODY}" | head -c 500
          echo
          echo "::endgroup::"
          if dry_run_guard "Issue への pre-QA 指示コメント投稿" \
            gh issue comment "${ISSUE_NUMBER}" \
              --repo "${REPO}" \
              --body "${COMMENT_BODY}"; then
            echo "✅ 事前 QA 質問票作成指示コメントを Issue #${ISSUE_NUMBER} に投稿しました。"
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::group::DRY RUN Summary"
              echo "[DRY RUN] target_issue=${ISSUE_NUMBER}"
              echo "[DRY RUN] target_pr=${PR_NUMBER}"
              echo "[DRY RUN] simulate_label=${SIMULATE_LABEL}"
              echo "[DRY RUN] === Skipped writes ==="
              echo "[DRY RUN] would execute: gh issue comment ${ISSUE_NUMBER} --body \"<COMMENT_BODY (500 chars preview)>\""
              echo "[DRY RUN] === Read-only checks executed ==="
              echo "[DRY RUN] issue_data fetched: OK"
              echo "[DRY RUN] pre-qa prompt generated by hve: OK"
              echo "::endgroup::"
            fi
          else
            echo "::error::Issue #${ISSUE_NUMBER} へのコメント投稿に失敗しました。"
            exit 1
          fi

      - name: Copilot を Issue にアサインして qa-drafting へ遷移
        if: ${{ vars.ENABLE_COPILOT_QA_ASSIGN != 'false' }}
        run: |
          set -euo pipefail
          dry_run_guard() {
            local cmd_desc="$1"
            shift
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::notice::[DRY RUN] スキップ: ${cmd_desc}"
              echo "[DRY RUN] would execute: ${cmd_desc}"
              return 0
            fi
            "$@"
          }
          issue_data=$(gh api "/repos/${REPO}/issues/${ISSUE_NUMBER}") || {
            echo "::error::Issue #${ISSUE_NUMBER} の取得に失敗しました。"
            exit 1
          }

          issue_labels=$(printf '%s' "${issue_data}" | python3 -c "
          import sys, json
          print(json.dumps([l['name'] for l in json.load(sys.stdin).get('labels', [])]))
          " 2>/dev/null || echo '[]')
          QA_DRAFTING_LABEL="${QA_READY_LABEL/:qa-ready/:qa-drafting}"

          qa_state_count=$(printf '%s' "${issue_labels}" | jq '
            [ .[] | select(endswith(":qa-ready") or endswith(":qa-drafting")) ] | length')
          if (( qa_state_count > 1 )); then
            echo "::error::複数の QA 状態ラベルを検出しました。状態を一意に修復してから再実行してください。"
            exit 1
          fi

          if printf '%s' "${issue_labels}" | python3 -c "
          import sys, json
          labels = json.load(sys.stdin)
          target = sys.argv[1]
          print('true' if target in labels else 'false')
          " "${QA_DRAFTING_LABEL}" | grep -q '^true$'; then
            echo "Issue #${ISSUE_NUMBER} は既に ${QA_DRAFTING_LABEL} 状態です。"
            exit 0
          fi

          BRANCH=$(printf '%s' "${issue_data}" | python3 -c "
          import sys, json, re
          body = json.load(sys.stdin).get('body', '')
          m = re.search(r'<!--\s*branch:\s*([^>]+?)\s*-->', body)
          print(m.group(1).strip() if m else 'main')
          " 2>/dev/null || echo 'main')
          [[ "${BRANCH}" =~ ^[A-Za-z0-9._/-]+$ && "${BRANCH}" != *".."* ]] || {
            echo "::error::対象ブランチ名が不正です: ${BRANCH}"
            exit 1
          }
          git check-ref-format --branch "${BRANCH}" >/dev/null 2>&1 || {
            echo "::error::対象ブランチ名が Git ref として不正です: ${BRANCH}"
            exit 1
          }
          CUSTOM_AGENT=$(printf '%s' "${issue_data}" | python3 -c "
          import sys, json, re
          body = json.load(sys.stdin).get('body', '')
          m = re.search(r'## Custom Agent\s*\n\s*\`([^\`]+)\`', body)
          print(m.group(1) if m else '')
          " 2>/dev/null || echo '')
          SELECTED_MODEL=$(printf '%s' "${issue_data}" | python3 -c "
          import sys, json, re
          body = json.load(sys.stdin).get('body', '')
          m = re.search(r'<!--\s*model:\s*([^\s-][^-]*?)\s*-->', body)
          print(m.group(1).strip() if m else '')
          " 2>/dev/null || echo '')

          source "${GITHUB_WORKSPACE}/.github/scripts/bash/lib/copilot-assign.sh"
          if ! dry_run_guard "Issue への Copilot アサイン" \
            assign_copilot "${ISSUE_NUMBER}" "${CUSTOM_AGENT}" "${BRANCH}" "" "${SELECTED_MODEL}"; then
            echo "::error::Issue #${ISSUE_NUMBER} への Copilot アサインに失敗しました。"
            exit 1
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            dry_run_guard "qa-drafting ラベル付与" \
              gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --add-label "${QA_DRAFTING_LABEL}"
            dry_run_guard "qa-ready ラベル除去" \
              gh api -X DELETE "/repos/${REPO}/issues/${ISSUE_NUMBER}/labels/${QA_READY_LABEL}" --silent
          else
            # 新状態を先に追加し、read-back 後に旧状態を解除する。
            gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --add-label "${QA_DRAFTING_LABEL}" || {
              echo "::error::${QA_DRAFTING_LABEL} ラベル付与に失敗しました。qa-ready を維持します。"
              exit 1
            }
            draft_labels_json=$(gh api "/repos/${REPO}/issues/${ISSUE_NUMBER}" --jq '[.labels[].name]')
            if ! printf '%s' "${draft_labels_json}" | jq -e --arg label "${QA_DRAFTING_LABEL}" 'index($label) != null' >/dev/null; then
              echo "::error::qa-drafting の read-back に失敗しました。qa-ready を維持します。"
              exit 1
            fi

            gh api -X DELETE \
              "/repos/${REPO}/issues/${ISSUE_NUMBER}/labels/${QA_READY_LABEL}" --silent 2>/dev/null || true
            final_labels_json=$(gh api "/repos/${REPO}/issues/${ISSUE_NUMBER}" --jq '[.labels[].name]')
            drafting_present=$(printf '%s' "${final_labels_json}" | jq -r --arg label "${QA_DRAFTING_LABEL}" 'index($label) != null')
            ready_present=$(printf '%s' "${final_labels_json}" | jq -r --arg label "${QA_READY_LABEL}" 'index($label) != null')
            if [[ "${drafting_present}" != "true" || "${ready_present}" == "true" ]]; then
              gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --add-label "${QA_READY_LABEL}" >/dev/null 2>&1 || true
              gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --remove-label "${QA_DRAFTING_LABEL}" >/dev/null 2>&1 || true
              echo "::error::qa-ready → qa-drafting 遷移に失敗したため qa-drafting をロールバックしました。"
              exit 1
            fi
          fi
          echo "✅ Issue #${ISSUE_NUMBER} に Copilot をアサインし、${QA_DRAFTING_LABEL} へ遷移しました。"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::group::DRY RUN Summary"
            echo "[DRY RUN] target_issue=${ISSUE_NUMBER}"
            echo "[DRY RUN] target_pr=${PR_NUMBER}"
            echo "[DRY RUN] simulate_label=${SIMULATE_LABEL}"
            echo "[DRY RUN] === Skipped writes ==="
            echo "[DRY RUN] would execute: assign_copilot ${ISSUE_NUMBER} ${CUSTOM_AGENT} ${BRANCH} '' ${SELECTED_MODEL}"
            echo "[DRY RUN] would execute: gh api -X DELETE /repos/${REPO}/issues/${ISSUE_NUMBER}/labels/${QA_READY_LABEL}"
            echo "[DRY RUN] would execute: gh issue edit ${ISSUE_NUMBER} --add-label \"${QA_DRAFTING_LABEL}\""
            echo "[DRY RUN] === Read-only checks executed ==="
            echo "[DRY RUN] issue_data fetched: OK"
