              "${STEP_LABELS}")
            S5_NUM=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['number'])")
            S5_ID=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id'])")
            echo "Step.5 作成: #${S5_NUM}"
            sleep 3

            # ---- Step.5.1 (WAF アーキテクチャレビュー) ----
            BODY_S51=$(printf '%s\n## 目的\nデプロイ済みAzureリソースを棚卸しし、Azure Well-Architected Framework（5本柱）と Azure Security Benchmark v3 を根拠にアーキテクチャ/セキュリティをレビューして、日本語のMermaid図付きレポートを生成する（APP-ID 指定時はスコープ内のリソースのみ）。\n\n## 入力\n- リソースグループ名: `%s`\n- `docs/catalog/use-case-catalog.md`\n- `docs/catalog/service-catalog-matrix.md`\n- `docs/azure/azure-services-compute.md`\n- `docs/azure/azure-services-data.md`\n- `docs/azure/azure-services-additional.md`\n- `docs/catalog/app-catalog.md`（アプリケーション一覧 — 対象 APP-ID のスコープ判定根拠。存在しない場合はスコープ絞り込みなしで全件処理）\n\n## 出力\n- `docs/azure/azure-architecture-review-report.md`\n\n## Custom Agent\n`QA-AzureArchitectureReview` を使用\n\n## 依存\n- Step.4.4（Playwright E2E テスト）が `asdw-web:done` であること\n- Step.5.2 と並列実行可能\n\n## 完了条件\n- `docs/azure/azure-architecture-review-report.md` が作成されている\n- 完了時に自身に `asdw-web:done` ラベルを付与すること%s%s' \
              "${ROOT_REF}" "${RESOURCE_GROUP}" "${APP_ID_SECTION}" "${ADDITIONAL_SECTION}")
            RESP=$(create_issue \
              "[ASDW-WEB] Step.5.1: WAF アーキテクチャレビュー${APP_ID_SUFFIX}" \
              "${BODY_S51}" \
              "${STEP_LABELS}")
            S51_NUM=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['number'])")
            S51_ID=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id'])")
            echo "Step.5.1 作成: #${S51_NUM}"
            sleep 3

            # ---- Step.5.2 (整合性チェック) ----
            BODY_S52=$(printf '%s\n## 目的\nサービスカタログ準拠で Azure 依存（参照・設定・IaC）を証跡付きで点検し、必要なら最小差分で修正する（APP-ID 指定時はスコープ内の依存のみ）。\n\n## 入力\n- リソースグループ名: `%s`\n- `docs/catalog/service-catalog-matrix.md`\n- `docs/azure/azure-services-compute.md`\n- `docs/azure/azure-services-data.md`\n- `docs/catalog/app-catalog.md`（アプリケーション一覧 — 対象 APP-ID のスコープ判定根拠。存在しない場合はスコープ絞り込みなしで全件処理）\n- `src/app/`, `src/api/`, `src/infra/`, `config/`, `.github/workflows/`\n\n## 出力\n- `docs/azure/dependency-review-report.md`\n\n## Custom Agent\n`QA-AzureDependencyReview` を使用\n\n## 依存\n- Step.4.4（Playwright E2E テスト）が `asdw-web:done` であること\n- Step.5.1 と並列実行可能\n\n## 完了条件\n- `docs/azure/dependency-review-report.md` が作成されている\n- 完了時に自身に `asdw-web:done` ラベルを付与すること%s%s' \
              "${ROOT_REF}" "${RESOURCE_GROUP}" "${APP_ID_SECTION}" "${ADDITIONAL_SECTION}")
            RESP=$(create_issue \
              "[ASDW-WEB] Step.5.2: 整合性チェック${APP_ID_SUFFIX}" \
              "${BODY_S52}" \
              "${STEP_LABELS}")
            S52_NUM=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['number'])")
            S52_ID=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id'])")
            echo "Step.5.2 作成: #${S52_NUM}"
            sleep 3

            # ---- Step.5.3 (要件適合実測) ----
            BODY_S53=$(printf '%s\n## 目的\nデプロイ済みの Web アプリと API を実際に動かし、機能要件・非機能要件への適合を**測定で**判定する。\n\n## なぜ必要か\nStep.5.1（WAF レビュー）と Step.5.2（整合性チェック）は設計文書と成果物の照合で完結するため、デプロイした構成が目標の応答時間・スループット・成功率を実際に満たすかは確認されていない。\n\n## 入力\n- リソースグループ名: `%s`\n- `docs/catalog/app-catalog.md`\n- `docs/azure/azure-architecture-review-report.md`（Step.5.1 出力 — 目標値と閾値の根拠）\n- `docs/azure/dependency-review-report.md`（Step.5.2 出力）\n- `src/test/e2e/playwright/`、`src/test/post-deploy/`、`src/test/integration/add-service/`（測定に再利用する既存テスト資産）\n\n## 出力\n- `docs/azure/requirements-conformance-report.md`\n\n## 測定要件\n- 測定対象は **デプロイ済みのエンドポイント**とする。本 Step のために Azure リソースを新規作成しない。\n- 測定には当該ワークフローが既に生成したテスト資産を再利用する。Azure Load Testing 等の利用は任意。\n- 応答時間は平均ではなくパーセンタイル（p50 / p95 等）で記録し、どのパーセンタイルかを明示する。\n- 設計成果物に数値目標が無い要件は `NO_TARGET` とし、実測値だけを残す。目標を推測で補わない。\n\n## レポートの固定フォーマット（HVE artifact gate が機械検証）\n- 測定条件: `Schema-Version` / `Workflow` / `Step` / `Agent` / `Measured-At` / `Target-Environment` / `Measurement-Tool` / `Secret-Redaction`\n- 測定表: `| Req ID | Kind | Target | Threshold | Measured | Judgement | Headroom | Evidence |`（1 行以上必須）\n- 判定語彙: `PASS` / `FAIL` / `NOT_MEASURED` / `NO_TARGET` の 4 値のみ\n- 結論: `- Conclusion:` と `- Rationale:`\n- 簡素化候補: `- Simplification-Candidate:`（該当なしは `none`）\n\n## 禁止事項\n- 測定していない数値を書かない。実行できなかった指標は `NOT_MEASURED` と理由を記す。\n- 実測値から逆算して目標・閾値を作らない。\n- 目標が無いこと（`NO_TARGET`）と測れなかったこと（`NOT_MEASURED`）を同じ語彙へ畳み込まない。\n- 測定のためにアプリケーション構成・インフラ定義・デプロイ済みリソースを変更しない。\n\n## Custom Agent\n`QA-RequirementsConformanceEval` を使用\n\n## 依存\n- Step.5.1（WAF アーキテクチャレビュー）と Step.5.2（整合性チェック）が `asdw-web:done` であること\n\n## 完了条件\n- `docs/azure/requirements-conformance-report.md` が作成されている\n- 測定条件ラベル 8 件がすべて記載されている\n- 測定表が 1 行以上あり、各行の判定が 4 値のいずれかである\n- `Conclusion` / `Rationale` / `Simplification-Candidate` が記載されている\n- 完了時に自身に `asdw-web:done` ラベルを付与すること%s%s' \
              "${ROOT_REF}" "${RESOURCE_GROUP}" "${APP_ID_SECTION}" "${ADDITIONAL_SECTION}")
            RESP=$(create_issue \
              "[ASDW-WEB] Step.5.3: 要件適合実測${APP_ID_SUFFIX}" \
              "${BODY_S53}" \
              "${STEP_LABELS}")
            S53_NUM=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['number'])")
            S53_ID=$(echo "${RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id'])")
            echo "Step.5.3 作成: #${S53_NUM}"
            sleep 3
          else
            echo "Step.4 はスキップされました。"
          fi

          # ---- Sub Issue 紐付け ----
          echo "Sub Issue 紐付けを開始します..."

          # Root → Step.1〜Step.5（コンテナ）
          [[ -n "${S1_ID}" ]] && { link_sub_issue "${ROOT_ISSUE}" "${S1_ID}"; echo "Root → Step.1 紐付け完了"; }
          [[ -n "${S2_ID}" ]] && { link_sub_issue "${ROOT_ISSUE}" "${S2_ID}"; echo "Root → Step.2 紐付け完了"; }
          [[ -n "${S3_ID}" ]] && { link_sub_issue "${ROOT_ISSUE}" "${S3_ID}"; echo "Root → Step.3 紐付け完了"; }
          [[ -n "${S4_ID}" ]] && { link_sub_issue "${ROOT_ISSUE}" "${S4_ID}"; echo "Root → Step.4 紐付け完了"; }
          [[ -n "${S5_ID}" ]] && { link_sub_issue "${ROOT_ISSUE}" "${S5_ID}"; echo "Root → Step.5 紐付け完了"; }

          # Step.1 → Step.1.1, Step.1.2, Step.1.3
          [[ -n "${S1_NUM}" && -n "${S11_ID}" ]] && { link_sub_issue "${S1_NUM}" "${S11_ID}"; echo "Step.1 → Step.1.1 紐付け完了"; }
          [[ -n "${S1_NUM}" && -n "${S12_ID}" ]] && { link_sub_issue "${S1_NUM}" "${S12_ID}"; echo "Step.1 → Step.1.2 紐付け完了"; }
          [[ -n "${S1_NUM}" && -n "${S13_ID}" ]] && { link_sub_issue "${S1_NUM}" "${S13_ID}"; echo "Step.1 → Step.1.3 紐付け完了"; }

          # Step.2 → Step.2.1〜2.6
          [[ -n "${S2_NUM}" && -n "${S21_ID}" ]] && { link_sub_issue "${S2_NUM}" "${S21_ID}"; echo "Step.2 → Step.2.1 紐付け完了"; }
          [[ -n "${S2_NUM}" && -n "${S22_ID}" ]] && { link_sub_issue "${S2_NUM}" "${S22_ID}"; echo "Step.2 → Step.2.2 紐付け完了"; }
          [[ -n "${S2_NUM}" && -n "${S23_ID}" ]] && { link_sub_issue "${S2_NUM}" "${S23_ID}"; echo "Step.2 → Step.2.3 紐付け完了"; }
          [[ -n "${S2_NUM}" && -n "${S24_ID}" ]] && { link_sub_issue "${S2_NUM}" "${S24_ID}"; echo "Step.2 → Step.2.4 紐付け完了"; }
          [[ -n "${S2_NUM}" && -n "${S25_ID}" ]] && { link_sub_issue "${S2_NUM}" "${S25_ID}"; echo "Step.2 → Step.2.5 紐付け完了"; }
          [[ -n "${S2_NUM}" && -n "${S26_ID}" ]] && { link_sub_issue "${S2_NUM}" "${S26_ID}"; echo "Step.2 → Step.2.6 紐付け完了"; }

          # Step.3 → Step.3.1〜3.5
          [[ -n "${S3_NUM}" && -n "${S31_ID}" ]] && { link_sub_issue "${S3_NUM}" "${S31_ID}"; echo "Step.3 → Step.3.1 紐付け完了"; }
          [[ -n "${S3_NUM}" && -n "${S32_ID}" ]] && { link_sub_issue "${S3_NUM}" "${S32_ID}"; echo "Step.3 → Step.3.2 紐付け完了"; }
          [[ -n "${S3_NUM}" && -n "${S33_ID}" ]] && { link_sub_issue "${S3_NUM}" "${S33_ID}"; echo "Step.3 → Step.3.3 紐付け完了"; }
          [[ -n "${S3_NUM}" && -n "${S34_ID}" ]] && { link_sub_issue "${S3_NUM}" "${S34_ID}"; echo "Step.3 → Step.3.4 紐付け完了"; }
          [[ -n "${S3_NUM}" && -n "${S35_ID}" ]] && { link_sub_issue "${S3_NUM}" "${S35_ID}"; echo "Step.3 → Step.3.5 紐付け完了"; }

          # Step.4 → Step.4.1〜4.4
          [[ -n "${S4_NUM}" && -n "${S41_ID}" ]] && { link_sub_issue "${S4_NUM}" "${S41_ID}"; echo "Step.4 → Step.4.1 紐付け完了"; }
          [[ -n "${S4_NUM}" && -n "${S42_ID}" ]] && { link_sub_issue "${S4_NUM}" "${S42_ID}"; echo "Step.4 → Step.4.2 紐付け完了"; }
          [[ -n "${S4_NUM}" && -n "${S43_ID}" ]] && { link_sub_issue "${S4_NUM}" "${S43_ID}"; echo "Step.4 → Step.4.3 紐付け完了"; }
          [[ -n "${S4_NUM}" && -n "${S44_ID}" ]] && { link_sub_issue "${S4_NUM}" "${S44_ID}"; echo "Step.4 → Step.4.4 紐付け完了"; }

          # Step.5 → Step.5.1〜5.3
          [[ -n "${S5_NUM}" && -n "${S51_ID}" ]] && { link_sub_issue "${S5_NUM}" "${S51_ID}"; echo "Step.5 → Step.5.1 紐付け完了"; }
          [[ -n "${S5_NUM}" && -n "${S52_ID}" ]] && { link_sub_issue "${S5_NUM}" "${S52_ID}"; echo "Step.5 → Step.5.2 紐付け完了"; }
          [[ -n "${S5_NUM}" && -n "${S53_ID}" ]] && { link_sub_issue "${S5_NUM}" "${S53_ID}"; echo "Step.5 → Step.5.3 紐付け完了"; }

          # ---- 最初に起動可能な Step を起動（DAG のトポロジカル順でフォールバック）----
          start_step() {
            local sid="$1"
            local num_var="S${sid//./}_NUM"
            local body_var="BODY_S${sid//./}"
            local num="${!num_var:-}"
            [[ -z "${num}" ]] && return 1
            if [[ "${sid}" == "1.1" && "${AUTO_QA}" == "true" ]]; then
              add_label "${num}" "asdw-web:qa-ready"
              echo "Step.${sid} (#${num}) に asdw-web:qa-ready を付与しました（QA 完了待ち）。Copilot アサインは QA 回答後に実行されます。"
              return 0
            fi
            add_label "${num}" "asdw-web:ready"
            local ca
            ca=$(extract_custom_agent "${!body_var:-}")
            if assign_copilot "${num}" "${ca}" "${BRANCH}" "" "${SELECTED_MODEL}"; then
              add_label "${num}" "asdw-web:running"
              echo "Step.${sid} (#${num}) を起動しました。"
            else
              echo "WARNING: Step.${sid} へのアサイン失敗。asdw-web:running は付与しません。"
            fi
            return 0
          }

          _STARTED="false"
          for _sid in 1.1 1.2 2.1 2.3 3.1 3.2 3.3 4.1 4.2 1.3 2.2 2.4 2.5 2.6 3.4 3.5 4.3 4.4 5.1; do
            if start_step "${_sid}"; then
              _STARTED="true"
              # Step.5.1 と Step.5.2 は依存が同じため並列起動する
              if [[ "${_sid}" == "5.1" ]]; then
                start_step "5.2" || true
              fi
              break
            fi
          done
          if [[ "${_STARTED}" == "false" ]]; then
            start_step "5.2" || start_step "5.3" || echo "起動可能な leaf Step が存在しません。初期化をスキップします。"
          fi

          echo "初期化完了。"

      # ----------------------------------------------------------------
      # 4. 状態遷移: asdw-web:done ラベル付与時
      # ----------------------------------------------------------------
      - name: 状態遷移処理
        if: steps.gate.outputs.mode == 'state_transition'
        env:
          DONE_ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
        run: |
          set -euo pipefail

          # Issue の body と title を API 経由で安全に取得（YAML 展開問題を回避）
          _ISSUE_JSON=$(curl -sf \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/issues/${DONE_ISSUE_NUMBER}")
          DONE_ISSUE_BODY=$(echo "${_ISSUE_JSON}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('body',''))")
          DONE_ISSUE_TITLE=$(echo "${_ISSUE_JSON}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('title',''))")
          export DONE_ISSUE_BODY DONE_ISSUE_TITLE

          # closed イベント由来の場合: asdw-web:done ラベルをまだ持っていなければ付与する
          # （labeled(asdw-web:done) イベントと closed イベントのどちらで state_transition に来ても正しく動作するための冪等処理）
          _HAS_DONE_LABEL=$(echo "${_ISSUE_JSON}" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          labels = [l['name'] for l in d.get('labels', [])]
          print('true' if 'asdw-web:done' in labels else 'false')
          ")
          if [[ "${_HAS_DONE_LABEL}" == "false" ]]; then
            echo "asdw-web:done ラベルを付与します（closed イベント由来）..."
            # add_label関数の定義より前なので直接curl（リトライなし・エラーは無視）
            curl -s -o /dev/null \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/issues/${DONE_ISSUE_NUMBER}/labels" \
              -d '{"labels":["asdw-web:done"]}' || true
            echo "asdw-web:done ラベルを付与しました。"
            sleep 2
          fi

          if [[ -z "${COPILOT_PAT}" ]]; then
            echo "WARNING: COPILOT_PAT が設定されていません。Copilot アサインは全てスキップされます。" >&2
          fi

          # ---- ユーティリティ関数（再定義） ----
          api_call() {
            local method="$1"; shift
            local url="$1"; shift
            local data="${1:-}"
            local max_retry=5
            local wait=1
            local http_code response body

            for i in $(seq 1 "${max_retry}"); do
              if [[ -n "${data}" ]]; then
                response=$(curl -s -w "\n%{http_code}" \
                  -X "${method}" \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  -H "Content-Type: application/json" \
                  "${url}" \
                  -d "${data}")
              else
                response=$(curl -s -w "\n%{http_code}" \
                  -X "${method}" \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "${url}")
              fi
              http_code=$(echo "${response}" | tail -1)
              body=$(echo "${response}" | head -n -1)
              if [[ "${http_code}" =~ ^2 ]]; then
                echo "${body}"
                return 0
              fi
              echo "API エラー: HTTP ${http_code}、${wait}秒後にリトライ (${i}/${max_retry})" >&2
              sleep "${wait}"
              wait=$((wait * 2))
            done
            echo "API 呼び出し失敗: ${method} ${url}" >&2
            return 1
          }

          add_label() {
            local issue_num="$1"
            local label="$2"
            api_call POST \
              "https://api.github.com/repos/${REPO}/issues/${issue_num}/labels" \
              "{\"labels\":[\"${label}\"]}" > /dev/null
            sleep 1
          }

          source "${GITHUB_WORKSPACE}/.github/scripts/bash/lib/assign-copilot.sh"

          post_comment() {
            local issue_num="$1"
            local body="$2"
            local data
            data=$(python3 -c "import sys,json; print(json.dumps({'body': sys.argv[1]}))" "${body}")
            api_call POST \
              "https://api.github.com/repos/${REPO}/issues/${issue_num}/comments" \
              "${data}" > /dev/null
            sleep 1
          }

          # Issue body から Custom Agent 名を抽出
          extract_custom_agent() {
            local body="$1"
            echo "${body}" | python3 /dev/fd/3 3<<'PY'
          import sys, re
          body = sys.stdin.read()
          m = re.search(r'## Custom Agent\s*\n\s*`([^`]+)`', body)
          print(m.group(1) if m else '')
          PY
          }

          activate_issue() {
            local issue_num="$1"
            local issue_body
            issue_body=$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/issues/${issue_num}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('body',''))") || true
            local agent_name
            agent_name=$(extract_custom_agent "${issue_body}") || true
            add_label "${issue_num}" "asdw-web:ready"
            if assign_copilot "${issue_num}" "${agent_name}" "${BRANCH:-main}" ""; then
              add_label "${issue_num}" "asdw-web:running"
              echo "Issue #${issue_num} を asdw-web:ready + copilot アサイン + asdw-web:running に設定しました。(custom_agent: ${agent_name})"
            else
              echo "WARNING: Issue #${issue_num} へのアサイン失敗。asdw-web:running は付与しません。"
            fi
          }

          # ---- done Issue の title から Step 番号を特定 ----
          STEP_MATCH=$(echo "${DONE_ISSUE_TITLE}" | python3 /dev/fd/3 3<<'PY'
          import sys, re
          title = sys.stdin.read().strip()
          m = re.search(r'\] Step\.(\d+(?:\.\d+)?[A-Z]{0,2})', title)
          print(m.group(1) if m else '')
          PY
          )

          if [[ -z "${STEP_MATCH}" ]]; then
            echo "Step 番号が特定できません（title: ${DONE_ISSUE_TITLE}）。スキップ。"
            exit 0
          fi

          echo "完了した Step: ${STEP_MATCH}"

          # ---- Root Issue 番号の取得 ----
          ROOT_ISSUE=$(python3 - <<'PY'
          import os, re
          body = os.environ.get('DONE_ISSUE_BODY', '')
          m = re.search(r'<!-- root-issue: #(\d+) -->', body)
          print(m.group(1) if m else '')
          PY
          )

          if [[ -z "${ROOT_ISSUE}" ]]; then
            echo "Root Issue 番号が取得できません。スキップ。"
            exit 0
          fi

          echo "Root Issue: #${ROOT_ISSUE}"

          # ---- ブランチ名の取得 ----
          BRANCH=$(python3 - <<'PY'
          import os, re
          body = os.environ.get('DONE_ISSUE_BODY', '')
          m = re.search(r'<!-- branch: (.+?) -->', body)
          print(m.group(1).strip() if m else 'main')
          PY
          )

          echo "対象ブランチ: ${BRANCH}"

          # ---- adversarial-review / auto-qa PR ラベル付与 ----
          ADVERSARIAL_REVIEW=$(python3 - <<'PY'
          import os, re
          body = os.environ.get('DONE_ISSUE_BODY', '')
          m = re.search(r'<!--\s*adversarial-review:\s*(true|false)\s*-->', body)
          print(m.group(1) if m else 'false')
          PY
          )
          AUTO_QA=$(python3 - <<'PY'
          import os, re
          body = os.environ.get('DONE_ISSUE_BODY', '')
          m = re.search(r'<!--\s*auto-qa:\s*(true|false)\s*-->', body)
          print(m.group(1) if m else 'false')
          PY
          )
          if [[ "${ADVERSARIAL_REVIEW}" == "true" ]] || [[ "${AUTO_QA}" == "true" ]]; then
            # Timeline API で Issue を close する open PR を逆引き（gh pr list --search では "closes:#N" 構文が機能しないため）
            LINKED_PRS=$(gh api "/repos/${REPO}/issues/${DONE_ISSUE_NUMBER}/timeline?per_page=100" \
              --jq '[.[] | select(.event == "cross-referenced" and .source.type == "pull_request" and .source.issue.state == "open") | .source.issue.number] | unique | .[]' \
              2>/dev/null || true)
            if [[ -n "${LINKED_PRS}" ]]; then
              while IFS= read -r pr_num; do
                if [[ "${ADVERSARIAL_REVIEW}" == "true" ]]; then
                  gh pr edit "${pr_num}" --repo "${REPO}" --add-label "adversarial-review" 2>/dev/null \
                    && echo "PR #${pr_num} に adversarial-review ラベルを付与しました。" \
                    || echo "WARNING: PR #${pr_num} への adversarial-review ラベル付与に失敗しました。" >&2
                fi
                if [[ "${AUTO_QA}" == "true" ]]; then
                  gh pr edit "${pr_num}" --repo "${REPO}" --add-label "auto-qa" 2>/dev/null \
                    && echo "PR #${pr_num} に auto-qa ラベルを付与しました。" \
                    || echo "WARNING: PR #${pr_num} への auto-qa ラベル付与に失敗しました。" >&2
                fi
              done <<< "${LINKED_PRS}"
            fi
          fi

          # ---- Root Issue の Sub Issues を取得して Step Issue を特定 ----
          get_sub_issue_number() {
            local pattern="$1"
            # Root Issue から全 Sub Issues を取得
            local resp
            resp=$(api_call GET \
              "https://api.github.com/repos/${REPO}/issues/${ROOT_ISSUE}/sub_issues")
            echo "${resp}" | python3 /dev/fd/3 "${pattern}" 3<<'PY'
          import sys, re, json
          issues = json.load(sys.stdin)
          pattern = sys.argv[1]
          for issue in issues:
              title = issue.get('title', '')
              if re.search(pattern, title):
                  print(issue['number'])
                  break
          PY
          }

          get_sub_issue_number_from_parent() {
            local parent_num="$1"
            local pattern="$2"
            local resp
            resp=$(api_call GET \
              "https://api.github.com/repos/${REPO}/issues/${parent_num}/sub_issues")
            echo "${resp}" | python3 /dev/fd/3 "${pattern}" 3<<'PY'
          import sys, re, json
          issues = json.load(sys.stdin)
          pattern = sys.argv[1]
          for issue in issues:
              title = issue.get('title', '')
              if re.search(pattern, title):
                  print(issue['number'])
                  break
          PY
          }

          # ---- 依存関係マップに基づき次 Step を特定 & 起動 ----
          # ---- 依存 DAG に基づき次に起動可能な Step を決定して起動 ----
          # 依存表は hve/workflow_registry.py の asdw-web 定義と一致させること。
          _TRANSITION=$(ROOT_ISSUE="${ROOT_ISSUE}" python3 - <<'PY'
          import json, os, re, urllib.error, urllib.request

          DEPS = {
              "1.1": [], "1.2": ["1.1"], "1.3": ["1.2", "4.2"],
              "2.1": ["1.1"], "2.2": ["1.3", "2.1"], "2.3": ["2.1"], "2.4": ["2.2", "2.3"],
              "2.5": ["2.1"], "2.6": ["2.2", "2.5"],
              "3.1": ["2.3"], "3.2": ["3.1"], "3.3": ["3.2"], "3.4": ["2.4", "3.3"], "3.5": ["3.4"],
              "4.1": ["3.3"], "4.2": ["1.2", "2.5", "4.1"], "4.3": ["3.5", "4.2"], "4.4": ["4.3"],
              "5.1": ["4.4"], "5.2": ["4.4"], "5.3": ["5.1", "5.2"],
          }
          BUSY = {"asdw-web:ready", "asdw-web:running", "asdw-web:done", "asdw-web:blocked"}

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          root = os.environ["ROOT_ISSUE"]

          def api(path):
              url = "https://api.github.com/repos/{}{}".format(repo, path)
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as exc:
                  # 生のトレースバックだと権限不足か一時障害かを Issue 上で判別できない。
                  raise SystemExit(
                      "ERROR: GitHub API {} が HTTP {} を返しました: {}".format(
                          url, exc.code, exc.reason
                      )
                  )
              except urllib.error.URLError as exc:
                  raise SystemExit(
                      "ERROR: GitHub API {} へ到達できません: {}".format(url, exc.reason)
                  )

          step_re = re.compile(r"\] Step\.(\d+(?:\.\d+)?):")
          steps = {}
          containers = {}
          for container in api("/issues/{}/sub_issues".format(root)):
              m = step_re.search(container.get("title", ""))
              if not m:
                  continue
              containers[m.group(1)] = (
                  container["number"],
                  {l["name"] for l in container.get("labels", [])},
              )
              for child in api("/issues/{}/sub_issues".format(container["number"])):
                  cm = step_re.search(child.get("title", ""))
                  if cm:
                      steps[cm.group(1)] = (
                          child["number"],
                          {l["name"] for l in child.get("labels", [])},
                      )

          def done(sid):
              # 生成されなかった Step（skip 指定 / 機能無効）は依存として満たされたとみなす
              return sid not in steps or "asdw-web:done" in steps[sid][1]

          lines = []
          for sid in sorted(DEPS):
              if sid not in steps:
                  continue
              num, labels = steps[sid]
              if labels & BUSY:
                  continue
              if all(done(d) for d in DEPS[sid]):
                  lines.append("READY {} {}".format(sid, num))

          for cid in sorted(containers):
              cnum, clabels = containers[cid]
              if "asdw-web:done" in clabels:
                  continue
              children = [s for s in DEPS if s.split(".")[0] == cid and s in steps]
              if children and all(done(s) for s in children):
                  lines.append("CONTAINER_DONE {} {}".format(cid, cnum))

          root_labels = {l["name"] for l in api("/issues/{}".format(root)).get("labels", [])}
          if steps and all(done(s) for s in steps) and "asdw-web:done" not in root_labels:
              lines.append("ALL_DONE - -")

          print("\n".join(lines))
          PY
          )

          _ALL_DONE="false"
          while IFS=' ' read -r _kind _sid _num; do
            [[ -z "${_kind}" ]] && continue
            case "${_kind}" in
              READY)
                activate_issue "${_num}"
                echo "Step.${STEP_MATCH} 完了 → Step.${_sid} (#${_num}) を起動しました。"
                ;;
              CONTAINER_DONE)
                add_label "${_num}" "asdw-web:done"
                echo "Step.${_sid} コンテナ (#${_num}) に asdw-web:done を付与しました。"
                ;;
              ALL_DONE)
                _ALL_DONE="true"
                ;;
            esac
          done <<< "${_TRANSITION}"

          if [[ "${_ALL_DONE}" == "true" ]]; then
                  gate_failed="false"
                  gate_reasons=()

                  # Root Issue の blocked ラベル確認（fail-closed: API 失敗時は gate_failed=true）
                  _root_api_err=$(mktemp)
                  if ! root_issue_json=$(gh api "/repos/${REPO}/issues/${ROOT_ISSUE}" 2>"${_root_api_err}"); then
                    _root_err_msg=$(head -3 "${_root_api_err}" 2>/dev/null || echo "unknown error")
                    rm -f "${_root_api_err}"
                    gate_failed="true"
                    gate_reasons+=("Root Issue 取得に失敗しました（API エラー）: ${_root_err_msg}")
                  else
                    rm -f "${_root_api_err}"
                    root_has_blocked=$(printf '%s' "${root_issue_json}" | jq -r '[.labels[]?.name] | index("asdw-web:blocked") != null' 2>/dev/null || echo false)
                    if [[ "${root_has_blocked}" == "true" ]]; then
                      gate_failed="true"
                      gate_reasons+=("Root Issue に \`asdw-web:blocked\` が残っています。")
                    fi
                  fi

                  # Sub Issues の blocked ラベル確認（fail-closed: API 失敗時は gate_failed=true）
                  _subs_api_err=$(mktemp)
                  if ! root_subs_all=$(gh api --paginate "/repos/${REPO}/issues/${ROOT_ISSUE}/sub_issues?per_page=100" 2>"${_subs_api_err}"); then
                    _subs_err_msg=$(head -3 "${_subs_api_err}" 2>/dev/null || echo "unknown error")
                    rm -f "${_subs_api_err}"
                    gate_failed="true"
                    gate_reasons+=("Root Sub Issues 取得に失敗しました（API エラー）: ${_subs_err_msg}")
                  else
                    rm -f "${_subs_api_err}"
                    subs_has_blocked=$(printf '%s' "${root_subs_all}" | python3 -c 'import sys,json; issues=json.load(sys.stdin); print("true" if any("asdw-web:blocked" in [l.get("name","") for l in i.get("labels",[])] for i in issues) else "false")' 2>/dev/null || echo false)
                    if [[ "${subs_has_blocked}" == "true" ]]; then
                      gate_failed="true"
                      gate_reasons+=("Sub Issue に \`asdw-web:blocked\` が残っています。")
                    fi
                  fi

                  # deploy / e2e 関連 Step の未検証キーワードを確認（Step.4.3 / Step.4.4 / Root body）
                  S4_NUM=$(get_sub_issue_number '\] Step\.4:')
                  S43_NUM=''
                  S44_NUM=''
                  if [[ -n "${S4_NUM}" ]]; then
                    S43_NUM=$(get_sub_issue_number_from_parent "${S4_NUM}" '\] Step\.4\.3:')
                    S44_NUM=$(get_sub_issue_number_from_parent "${S4_NUM}" '\] Step\.4\.4:')
                  fi

                  verify_text=''
                  for _issue_num in "${ROOT_ISSUE}" "${S43_NUM}" "${S44_NUM}"; do
                    if [[ -n "${_issue_num}" ]]; then
                      _body_api_err=$(mktemp)
                      if ! _body=$(gh api "/repos/${REPO}/issues/${_issue_num}" --jq '.body // ""' 2>"${_body_api_err}"); then
                        _body_err_msg=$(head -3 "${_body_api_err}" 2>/dev/null || echo "unknown error")
                        rm -f "${_body_api_err}"
                        gate_failed="true"
                        gate_reasons+=("Issue #${_issue_num} の body 取得に失敗しました（API エラー）: ${_body_err_msg}")
                      else
                        rm -f "${_body_api_err}"
                        verify_text=$(printf '%s\n%s\n' "${verify_text}" "${_body}")
                      fi
                    fi
                  done
                  if printf '%s' "${verify_text}" | grep -Eiq 'NEEDS-VERIFICATION|⏳|FAIL|未実行|手動実行が必要|残作業'; then
                    gate_failed="true"
                    gate_reasons+=("Root / Step.4.3 / Step.4.4 に未検証キーワード（NEEDS-VERIFICATION/⏳/FAIL/未実行/手動実行が必要/残作業）が残っています。")
                  fi

                  if [[ "${gate_failed}" == "true" ]]; then
                    reasons_text=$(printf '%s\n' "${gate_reasons[@]}" | sed '/^$/d' | sed 's/^/- /')
                    post_comment "${ROOT_ISSUE}" "⚠️ Root done gate により `asdw-web:done` 付与を停止しました。\n${reasons_text}\n\n未検証状態を解消後に再実行してください。"
                    echo "Root done gate で停止: ${reasons_text}"
                  else
                    # Root Issue に asdw-web:done を付与してワークフロー完了を示す
                    add_label "${ROOT_ISSUE}" "asdw-web:done"
                    echo "Root Issue #${ROOT_ISSUE} に asdw-web:done を付与しました。"
                    # Root Issue に完了コメント
                    post_comment "${ROOT_ISSUE}" "🎉 全ての開発ステップが完了しました！Root Issue #${ROOT_ISSUE} の Web App on Azure 開発ワークフローが正常に終了しました。"
                    echo "Root Issue #${ROOT_ISSUE} に完了コメントを投稿しました。"
                  fi
          fi
          # ── 自動クローズ判定（auto-merge 有効時）──────────────
          if [[ -f "${GITHUB_WORKSPACE}/.github/scripts/bash/lib/auto-close.sh" ]]; then
            source "${GITHUB_WORKSPACE}/.github/scripts/bash/lib/auto-close.sh"

            # コンテナ Issue の自動クローズ判定
            _AC_CONTAINER_NUM=""
            if [[ "${DONE_ISSUE_TITLE}" =~ ^\[ASDW-WEB\]\ Step\.[0-9]+\.[0-9] ]]; then
              _AC_PARENT_STEP=$(echo "${DONE_ISSUE_TITLE}" \
                | grep -oP '\]\s*Step\.\K\d+' | head -1)
              if [[ -n "${_AC_PARENT_STEP}" ]]; then
                _AC_CONTAINER_NUM=$(gh api --paginate \
                  "/repos/${REPO}/issues/${ROOT_ISSUE}/sub_issues?per_page=100" \
                  --jq ".[] | select(.title | test(\"\\\\\\\] Step\\\\.${_AC_PARENT_STEP}:\")) | .number" \
                  2>/dev/null | head -1) || _AC_CONTAINER_NUM=""
              fi
            fi

            if [[ -n "${_AC_CONTAINER_NUM}" && "${_AC_CONTAINER_NUM}" =~ ^[0-9]+$ ]]; then
              echo "=== コンテナ Issue #${_AC_CONTAINER_NUM} の自動クローズ判定 ==="
              auto_close_container_if_done "${_AC_CONTAINER_NUM}" "${REPO}" || true
            fi

            echo "=== Root Issue #${ROOT_ISSUE} の自動クローズ判定 ==="
            auto_close_root_if_all_done "${ROOT_ISSUE}" "${REPO}" || true
          fi

      # ----------------------------------------------------------------
      # 4.5. closed イベント時のコンテナ/Root 自動クローズ判定
      # ----------------------------------------------------------------
      - name: コンテナ自動クローズ判定（closed イベント）
        if: steps.gate.outputs.mode == 'container_close_check'
        env:
          DONE_ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
        run: |
          set -euo pipefail

          # ── 完了した Issue の情報取得 ──
          if ! DONE_ISSUE_JSON=$(gh api "/repos/${REPO}/issues/${DONE_ISSUE_NUMBER}" 2>/dev/null); then
            echo "::warning::Issue #${DONE_ISSUE_NUMBER} の取得に失敗しました（削除済みまたはアクセス不可）。"
            DONE_ISSUE_JSON='{}'
          fi
          DONE_ISSUE_TITLE=$(printf '%s' "${DONE_ISSUE_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('title',''))")
          DONE_ISSUE_BODY=$(printf '%s' "${DONE_ISSUE_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('body','') or '')")

          # ── Root Issue 番号の抽出 ──
          ROOT_ISSUE=$(echo "${DONE_ISSUE_BODY}" | python3 /dev/fd/3 3<<'PY'
          import sys, re
          b = sys.stdin.read()
          m = re.search(r'<!--\s*root-issue:\s*#(\d+)\s*-->', b)
          print(m.group(1) if m else '')
          PY
          )

          if [[ -z "${ROOT_ISSUE}" || ! "${ROOT_ISSUE}" =~ ^[0-9]+$ ]]; then
            echo "Root Issue を特定できないためスキップ。"
            exit 0
          fi
          echo "Root Issue: #${ROOT_ISSUE}"

          # ── auto-close.sh の読み込み ──
          if [[ ! -f "${GITHUB_WORKSPACE}/.github/scripts/bash/lib/auto-close.sh" ]]; then
            echo "auto-close.sh が見つかりません。スキップ。"
            exit 0
          fi
          source "${GITHUB_WORKSPACE}/.github/scripts/bash/lib/auto-close.sh"

          # ── コンテナ Issue の自動クローズ判定 ──
          _AC_CONTAINER_NUM=""
          if [[ "${DONE_ISSUE_TITLE}" =~ ^\[ASDW-WEB\]\ Step\.[0-9]+\.[0-9] ]]; then
            _AC_PARENT_STEP=$(echo "${DONE_ISSUE_TITLE}" \
              | grep -oP '\]\s*Step\.\K\d+' | head -1)
            if [[ -n "${_AC_PARENT_STEP}" ]]; then
              _AC_CONTAINER_NUM=$(gh api --paginate \
                "/repos/${REPO}/issues/${ROOT_ISSUE}/sub_issues?per_page=100" \
                --jq ".[] | select(.title | test(\"\\\\\\\] Step\\\\.${_AC_PARENT_STEP}:\")) | .number" \
                2>/dev/null | head -1) || _AC_CONTAINER_NUM=""
            fi
          fi

          if [[ -n "${_AC_CONTAINER_NUM}" && "${_AC_CONTAINER_NUM}" =~ ^[0-9]+$ ]]; then
            echo "=== コンテナ Issue #${_AC_CONTAINER_NUM} の自動クローズ判定 ==="
            auto_close_container_if_done "${_AC_CONTAINER_NUM}" "${REPO}" || true
          else
            echo "コンテナ Issue が特定できないためスキップ。"
          fi

          # ── Root Issue の自動クローズ判定 ──
          echo "=== Root Issue #${ROOT_ISSUE} の自動クローズ判定 ==="
          auto_close_root_if_all_done "${ROOT_ISSUE}" "${REPO}" || true

  self-improve:
    needs: orchestrate
    if: needs.orchestrate.result == 'success'
    runs-on: ${{ fromJSON(inputs.runner_type == 'self-hosted' && '["self-hosted","linux","x64","aca"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 180
    steps:
      - name: Parse Self-Improve settings
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          body=$(gh api "/repos/${REPO}/issues/${ISSUE_NUMBER}" --jq '.body // ""' 2>/dev/null || true)
          enable=$(printf '%s' "${body}" | sed -n 's/^.*<!-- enable-self-improve: *\([^>]*\) *-->.*$/\1/p' | head -1 | tr '[:upper:]' '[:lower:]' | xargs || true)
          max_iter=$(printf '%s' "${body}" | sed -n 's/^.*<!-- self-improve-max-iterations: *\([^>]*\) *-->.*$/\1/p' | head -1 | xargs || true)
          branch=$(printf "%s" "${body}" | sed -n 's/^.*<!-- branch: *\([^>]*\) *-->.*$/\1/p' | head -1 | xargs || true)
          quality_threshold=$(printf '%s' "${body}" | sed -n 's/^.*<!-- self-improve-quality-threshold: *\([^>]*\) *-->.*$/\1/p' | head -1 | xargs || true)
          if [[ -z "${enable}" ]]; then
            enable=$(printf '%s' "${body}" | python3 -c "
          import sys, re
          body = sys.stdin.read()
          m = re.search(r'###\s*自己改善ループ設定.*?\n(.*?)(?=###|\Z)', body, re.DOTALL)
          print('true' if (m and re.search(r'-\s*\[[xX]\]', m.group(1))) else 'false')
          " 2>/dev/null || echo "false")
          fi
          if [[ -z "${max_iter}" ]]; then
            max_iter=$(printf '%s' "${body}" | python3 -c "
          import sys, re
          body = sys.stdin.read()
          m = re.search(r'###\s*自己改善\s*最大イテレーション数.*?\n+(.+)', body)
          if m:
              n = re.match(r'(\d+)', m.group(1).strip())
              print(n.group(1) if n else '3')
          else:
              print('3')
          " 2>/dev/null || echo "3")
          fi
          if [[ -z "${quality_threshold}" ]]; then
            quality_threshold=$(printf '%s' "${body}" | python3 -c "
          import sys, re
          body = sys.stdin.read()
          m = re.search(r'###\s*自己改善\s*品質スコア閾値.*?\n+(.+)', body)
          if m:
              n = re.match(r'(\d+)', m.group(1).strip())
              print(n.group(1) if n else '80')
          else:
              print('80')
          " 2>/dev/null || echo "80")
          fi
          if [[ -z "${branch}" ]]; then
            branch=$(printf '%s' "${body}" | python3 -c "
          import sys, re
          body = sys.stdin.read()
          m = re.search(r'###\s*対象ブランチ.*?\n+(.+)', body)
          if m:
              val = m.group(1).strip()
              print(val if val and val != '_No response_' else 'main')
          else:
              print('main')
          " 2>/dev/null || echo "main")
          fi
          [[ -z "${enable}" ]] && enable="false"
          [[ -z "${max_iter}" ]] && max_iter="3"
          [[ -z "${quality_threshold}" ]] && quality_threshold="80"
          [[ -z "${branch}" ]] && branch="main"
          echo "enable=${enable}" >> "$GITHUB_OUTPUT"
          echo "max_iter=${max_iter}" >> "$GITHUB_OUTPUT"
          echo "quality_threshold=${quality_threshold}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.parse.outputs.enable == 'true' && steps.parse.outputs.branch != ''
        with:
          ref: ${{ steps.parse.outputs.branch }}

      - name: Skip Self-Improve when branch is missing
        if: steps.parse.outputs.enable == 'true' && steps.parse.outputs.branch == ''
        run: |
          echo "Skip Self-Improve: issue body に branch 情報がありません。"
      - uses: actions/setup-python@v5
        if: steps.parse.outputs.enable == 'true' && steps.parse.outputs.branch != ''
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.parse.outputs.enable == 'true' && steps.parse.outputs.branch != ''
        with:
          node-version: "20"
      - name: Install dependencies
        if: steps.parse.outputs.enable == 'true' && steps.parse.outputs.branch != ''
        run: |
          pip install ruff pytest pytest-cov
          npm install -g markdownlint-cli
      - name: Run Self-Improve
        if: steps.parse.outputs.enable == 'true' && steps.parse.outputs.branch != ''
        env:
          MAX_ITERATIONS: ${{ steps.parse.outputs.max_iter }}
          QUALITY_THRESHOLD: ${{ steps.parse.outputs.quality_threshold }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          from hve.self_improve import run_improvement_loop
          from hve.config import SDKConfig
          config = SDKConfig.from_env()
          config.auto_self_improve = True
          config.self_improve_scope = "workflow"
          config.self_improve_max_iterations = int(os.environ.get('MAX_ITERATIONS', '3'))
          config.self_improve_quality_threshold = int(os.environ.get('QUALITY_THRESHOLD', '80'))
          result = run_improvement_loop(config=config, repo_root='.')
          print(f'Self-Improve: {result["stopped_reason"]} (score={result["final_score"]})')
          PY
      - name: Commit improvements
        if: steps.parse.outputs.enable == 'true' && steps.parse.outputs.branch != '' && success()
        env:
          BRANCH: ${{ steps.parse.outputs.branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="${BRANCH}"

          git check-ref-format --branch "${branch}" >/dev/null 2>&1 || {
            echo "::error::Invalid branch name: ${branch}" >&2
            exit 1
          }

          git add -A

          if git diff --cached --quiet; then
            echo "No Self-Improve changes to commit."
            exit 0
          fi

          git commit -m "[Self-Improve] 自動品質改善"

          pushed=false
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3 to ${branch}"

            if git push origin "HEAD:refs/heads/${branch}"; then
              pushed=true
              break
            fi

            if [ "${attempt}" -lt 3 ]; then
              echo "Push failed. Fetching and rebasing onto origin/${branch}..."
              git fetch origin "${branch}"

              if ! git rebase "origin/${branch}"; then
                echo "::error::Rebase failed due to conflicts. Aborting rebase." >&2
                git rebase --abort || true
                exit 1
              fi
            fi
          done

          if [ "${pushed}" != "true" ]; then
            echo "::error::git push failed after 3 attempts." >&2
            exit 1
          fi
