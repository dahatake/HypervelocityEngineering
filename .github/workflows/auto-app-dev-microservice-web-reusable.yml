            BODY_S24=$(printf '%s\n## 目的\nTDD GREEN フェーズ: Step.2.3 で生成された追加サービス向けテストコードを、デプロイ済みの追加 Azure サービス（Step.2.2 の成果物）に対して実行し、全テストが PASS する状態を達成する。\n本 Step の修正範囲は追加サービスの構成・接続設定・テストフィクスチャに限定する（アプリ本実装は Step.3.x）。\n\n## 入力\n- Step.2.3 で生成されたテストコード（`src/test/integration/add-service/`）\n- Step.2.2 でデプロイ済みの追加 Azure サービス（実環境）\n- `docs/azure/azure-services-additional.md`\n- `docs/catalog/app-catalog.md`（アプリケーション一覧 — 対象 APP-ID のスコープ判定根拠。存在しない場合はスコープ絞り込みなしで全件処理）\n\n## 出力\n- 全テストが PASS する状態（テストコード本体の改変は最小限）\n- テスト実行ログ（Issue コメント記録）\n\n## Custom Agent\n`Dev-Microservice-Azure-AddServiceTesting` を使用\n\n## TDD GREEN 確認手順（必須）\n1. テスト実行コマンドを実行する\n2. FAIL があれば追加サービスの構成・接続設定・テストフィクスチャを修正する（最大 %s 回反復）\n3. 全テストが PASS したことをログで確認する\n4. %s 回で全 PASS にならない場合: `asdw-web:blocked` ラベルを付与し未 PASS テスト一覧を報告する\n\n## 依存\n- Step.2.2（追加 Azure サービス Deploy）と Step.2.3（追加サービスのテストコード生成）が `asdw-web:done` であること\n\n## 完了条件\n- 追加サービス向けテストが全 PASS である\n- 完了時に自身に `asdw-web:done` ラベルを付与すること%s%s' \
