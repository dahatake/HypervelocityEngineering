name: Validate io-contracts

on:
  pull_request:
    paths:
      - '.github/io-contracts/**'
      - '.github/scripts/validate-io-contract.py'
      - '.github/io-contract-exceptions.yaml'
      - '.github/workflows/validate-io-contract.yml'
      # registry-check の必須化(E-09)に伴い、StepDef 側の変更でも検証する。
      - 'hve/workflow_registry.py'
  push:
    branches:
      - main
    paths:
      - '.github/io-contracts/**'
      - '.github/scripts/validate-io-contract.py'
      - '.github/io-contract-exceptions.yaml'
      - '.github/workflows/validate-io-contract.yml'
      - 'hve/workflow_registry.py'

jobs:
  validate-io-contract:
    name: Validate .github/io-contracts/*.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Validate io-contracts (schema + integrity)
        # Schema と Integrity の厳格チェック。次ステップの registry-check も
        # hard fail のため、切り分けを容易にする目的で先に単体実行する。
        run: |
          python .github/scripts/validate-io-contract.py --no-registry-check

      - name: Validate io-contracts (registry-check, hard fail)
        # E-09: StepDef × io-contract 突き合わせ（registry mismatch）を必須化。
        # 126 件あった mismatch を 0 件へ解消したうえで warning-only を撤廃した。
        # 新たな mismatch は `hve/workflow_registry.py` の StepDef 宣言か
        # `.github/io-contracts/*.yaml` のいずれかを修正して解消すること
        # （registry mismatch は `.github/io-contract-exceptions.yaml` では抑止できない）。
        run: |
          python .github/scripts/validate-io-contract.py
