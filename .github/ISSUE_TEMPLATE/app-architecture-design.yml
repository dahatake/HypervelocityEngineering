name: "Architecture Design（アーキテクチャ設計）"
description: "APP別要求定義からサブシステム共通のアーキテクチャ設計を自動実行します (Step.1〜Step.8)"
title: "[Architecture Design] アーキテクチャ設計"
labels:
  - "auto-app-selection"
body:
  - type: markdown
    attributes:
      value: |
        ## Architecture Design（アーキテクチャ設計）
        このフォームから Issue を作成すると、要求定義からサブシステム共通のアーキテクチャ設計タスクが
        Sub-issue として生成され、Copilot が依存関係に従って実行します。

        ### 実行されるステップ
        | ステップ | 内容 | 旧ワークフロー |
        |---------|------|---------------|
        | **Step.1** | ソフトウェアアーキテクチャの推薦 | AAS Step.2 |
        | **Step.2.1** | ドメイン分析 | AAD Step.1.1 |
        | **Step.2.2** | サービス一覧抽出 | AAD Step.1.2 |
        | **Step.3.1** | データモデル作成 | AAD Step.2 |
        | **Step.3.2** | サンプルデータ生成 | AAD Step.2 |
        | **Step.4** | データカタログ作成 | AAD Step.3 |
        | **Step.5** | サービスカタログ | AAD Step.5 |
        | **Step.6** | テスト戦略書 | AAD Step.6 |
        | **Step.7** | ペルソナカタログ | — (新規) |
        | **Step.8** | ペルソナ別共通画面カタログ | — (新規) |

        ※ 旧 AAD Step.4（画面一覧と遷移図）は Web App Design（`web-app-design.yml`）へ移管されています。

        ⚠️ **前提条件**: このワークフローを実行する前に、以下のファイルが存在することを確認してください。
        - `docs/catalog/app-catalog.md`（ARD Step 4.1）
        - `docs/architectural-requirements-app-NNN.md`（ARD Step 4.2、app-catalogの全APP）

        ✅ **完了後の次ステップ**:
        - Web App Design（`web-app-design.yml`）
        - Dataflow Design（`batch-design.yml`）
        - AI Agent Design（`ai-agent-design.yml`）

        📚 **knowledge/ 参照**: `knowledge/` フォルダーに業務要件ドキュメント（D01〜D21: 事業意図、スコープ、業務プロセス、ユースケース、データモデル、セキュリティ等）が存在する場合、各ステップで業務コンテキストとして自動参照されます。設計精度を高めるため、事前に `knowledge-management` ワークフローを実行して `knowledge/` を充実させることを推奨します。

  - type: input
    id: branch
    attributes:
      label: "対象ブランチ"
      description: "設計ドキュメントをコミットするブランチ名を入力してください"
      placeholder: "例: main, develop, feature/design-v2"
      value: "main"
    validations:
      required: true

  - type: dropdown
    id: runner_type
    attributes:
      label: "実行 Runner"
      description: |
        ワークフローを実行する Runner を選択します。
        - **GitHub Hosted**: `ubuntu-latest`（GitHub 提供の標準ランナー）
        - **Self-hosted (ACA)**: `[self-hosted, linux, x64, aca]`（Azure Container Apps 上のセルフホストランナー）
        - Self-hosted runner はオプションです（GitHub Hosted を使う場合はスキップ可能）
        - Self-hosted を選ぶ場合は runner が online であり、label が一致していることを確認してください（詳細: `users-guide/setup-self-hosted-runner.md`）
      options:
        - "GitHub Hosted"
        - "Self-hosted (ACA)"
      default: 0
    validations:
      required: true

  - type: checkboxes
    id: steps
    attributes:
      label: "実行するステップ"
      description: |
        実行したいステップにチェックを入れてください。
        ✅ **デフォルト（全チェックなし）: すべてのチェックを外した状態で Issue を作成すると、全 Step が実行されます。**
        ⚠️ チェックを入れた場合: チェックを入れたステップだけが実行されます。依存関係があるステップは前段も必ずチェックしてください。
        📋 **依存関係**:
        Step.1 → Step.2.1 → Step.2.2 → Step.3.1 → (Step.3.2 ‖ Step.4) → Step.5 → Step.6 → Step.7 → Step.8
      options:
        - label: "Step.1 — ソフトウェアアーキテクチャの推薦（ARD Step 4.1/4.2成果物が必須）"
        - label: "Step.2.1 — ドメイン分析 ※ Step.1 が必須"
        - label: "Step.2.2 — サービス一覧抽出 ※ Step.2.1 が必須"
        - label: "Step.3.1 — データモデル作成 ※ Step.2.2 が必須"
        - label: "Step.3.2 — サンプルデータ生成 ※ Step.3.1 が必須"
        - label: "Step.4 — データカタログ作成 ※ Step.3.1 が必須（Step.3.2 と並列実行可）"
        - label: "Step.5 — サービスカタログ ※ Step.4 が必須"
        - label: "Step.6 — テスト戦略書 ※ Step.5 が必須"
        - label: "Step.7 — ペルソナカタログ ※ Step.6 が必須"
        - label: "Step.8 — ペルソナ別共通画面カタログ ※ Step.7 が必須"

  - type: dropdown
    id: model
    attributes:
      label: "使用するモデル"
      description: |
        Copilot cloud agent が使用するモデルを選択します（hve CLI `--model` と同等）。
        - `Auto`: GitHub が最適モデルを動的選択（プレミアムリクエスト 0.9x、推奨）
        - その他: hve/config.py の `MODEL_CHOICES` と同一の選択肢
        ※ `HVE_MODEL_OVERRIDE` 環境変数が設定されている場合はそちらが優先されます。
      options:
        - "Auto"
        - "claude-opus-4.7"
        - "claude-opus-4.6"
        - "gpt-5.5"
        - "gpt-5.4"
      default: 0
    validations:
      required: false
  - type: dropdown
    id: review_model
    attributes:
      label: "レビュー用モデル（任意）"
      description: |
        敵対的レビュー（adversarial-review）で使用するモデル（hve CLI `--review-model` 相当）。このモデル選択だけではレビューを発動しません。発動は「敵対的レビューを有効にする」の指定が必要です。一般 Code Review Agent の設定とは別です。
        `Auto` を選ぶと Copilot が最適モデルを自動選択します。明示指定でモデルを固定できます。
      options:
        - "Auto"
        - "claude-opus-4.7"
        - "claude-opus-4.6"
        - "gpt-5.5"
        - "gpt-5.4"
      default: 0
    validations:
      required: false

  - type: dropdown
    id: qa_model
    attributes:
      label: "QA 用モデル（任意）"
      description: |
        実行前 QA（auto-qa）の質問票生成で使用するモデル（hve CLI `--qa-model` 相当）。
        `Auto` を選ぶと Copilot が最適モデルを自動選択します。明示指定でモデルを固定できます。
      options:
        - "Auto"
        - "claude-opus-4.7"
        - "claude-opus-4.6"
        - "gpt-5.5"
        - "gpt-5.4"
      default: 0
    validations:
      required: false

  - type: dropdown
    id: akm_model
    attributes:
      label: "AKM 用モデル（任意）"
      description: |
        QA 回答を `knowledge/` へ同期する Knowledge Management (AKM) 実行で使用するモデル（hve CLI `--akm-model` 相当）。
        実行前 QA が有効なときだけ使われます。`Auto` を選ぶと Copilot が最適モデルを自動選択します。
      options:
        - "Auto"
        - "claude-opus-4.7"
        - "claude-opus-4.6"
        - "gpt-5.5"
        - "gpt-5.4"
      default: 0
    validations:
      required: false

  - type: checkboxes
    id: enable_qa_akm_merge
    attributes:
      label: "Knowledge Management マージ設定"
      description: |
        チェックを入れると、実行前 QA の回答を `knowledge/` へ取り込む Knowledge Management (AKM) をバックグラウンドで自動実行します（hve CLI `--qa-akm-background-merge` 相当）。
        デフォルト（チェックなし）ではマージしません。実行前 QA が有効なときだけ使われます。
      options:
        - label: "QA (質問票) を Knowledge Management へバックグラウンドでマージする"

  - type: checkboxes
    id: enable_review
    attributes:
      label: "レビュー設定"
      description: |
        チェックを入れると、Copilot が PR を完成させた際に敵対的レビュー（adversarial-review）を自動実行します。
        デフォルト（チェックなし）では敵対的レビューは実行されません。
      options:
        - label: "敵対的レビューを有効にする（チェックすると adversarial-review ラベルが付与されます）"

  - type: checkboxes
    id: enable_qa
    attributes:
      label: "質問票設定"
      description: |
        チェックを入れると、Copilot がステップ実行前に選択式の質問票（事前 QA）を作成します。回答後に実行が開始されます。
        デフォルト（チェックなし）では質問票は作成されません。
        詳細: `docs/operations/auto-qa-skip-if-existing.md` を参照してください。
      options:
        - label: "実行前 QA を実施する（チェックすると auto-qa ラベルが付与され、ステップ実行前に質問票が作成されます）"

  - type: checkboxes
    id: enable_self_improve
    attributes:
      label: "自己改善ループ設定"
      description: |
        チェックを入れると、全ステップ完了後に自己改善ループが実行されます。
        ruff（lint）/ pytest（テスト+カバレッジ）/ markdownlint（ドキュメント品質）を
        スキャンし、品質スコアが目標値に達するまで改善を繰り返します。
        デフォルト（チェックなし）では自己改善は実行されません。
      options:
        - label: "自己改善ループを有効にする"

  - type: dropdown
    id: self_improve_max_iterations
    attributes:
      label: "自己改善 最大イテレーション数"
      description: "自己改善ループを有効にした場合の最大繰り返し回数"
      options:
        - "1"
        - "2"
        - "3 (デフォルト)"
      default: 2
    validations:
      required: false

  - type: dropdown
    id: self_improve_quality_threshold
    attributes:
      label: "自己改善 品質スコア目標値"
      description: "この値に達した時点で改善完了とみなします"
      options:
        - "70（最低基準）"
        - "80（標準）"
        - "90（高品質）"
      default: 1
    validations:
      required: false

  - type: dropdown
    id: enable_auto_merge
    attributes:
      label: "PR完全自動化設定"
      description: |
        QA・レビュー完了後に PR の自動 Approve と Auto-merge（squash）が実行されます。
        ⚠️ この設定を有効にすると、人間によるレビュー・承認なしで PR がマージされます。
        本番ブランチへの直接マージには十分ご注意ください。
      options:
        - "有効にする"
        - "無効にする"
      default: 0
    validations:
      required: false

  - type: textarea
    id: additional_comment
    attributes:
      label: "追加コメント（任意）"
      description: "補足・制約・注意事項があれば記載してください。各 Step issue にも引用されます。"
      placeholder: "例: ユースケースは docs/catalog/use-case-catalog.md に記載済み。APP は3〜5個想定。"
    validations:
      required: false
