<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EABK Studio</title><style>
:root{font-family:Segoe UI,system-ui,sans-serif;color:#242424;background:#f7f7f7;--accent:#0f6cbd;--surface:#fff;--border:#d1d1d1}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2}button,input,select{font:inherit;padding:8px;border:1px solid var(--border);border-radius:4px;background:var(--surface)}button{cursor:pointer}button:focus,input:focus{outline:3px solid #9cc9f5;outline-offset:1px}main{padding:20px;max-width:1200px;margin:auto}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}table{border-collapse:collapse;width:100%;background:var(--surface)}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left}th{background:#f0f0f0}.link{color:var(--accent);cursor:pointer;text-decoration:underline}.drawer{position:fixed;right:0;top:0;height:100%;width:min(420px,90vw);background:#fff;box-shadow:-4px 0 18px #0003;padding:24px;overflow:auto;z-index:4}.hidden{display:none}.toast{position:fixed;bottom:20px;right:20px;background:#242424;color:#fff;padding:12px;border-radius:4px;z-index:5}dialog{border:1px solid var(--border);border-radius:8px;padding:20px} @media(prefers-color-scheme:dark){:root{color:#eee;background:#202020;--surface:#292929;--border:#555}header,th{background:#292929}}
</style></head><body><header><strong>EABK Studio</strong><button id="repoBtn"></button><button id="langBtn">EN</button><nav><a href="#/dashboard">Dashboard</a> <a href="#/tables">Tables</a> <a href="#/source">Source</a></nav><input id="q" aria-label="Search"></header><main id="view"></main><div id="results" class="card hidden"></div><aside id="drawer" class="drawer hidden"></aside><div id="toast" class="toast hidden"></div><dialog id="repoDialog"><label>Repository <input id="repoPath"></label><button id="repoOk">OK</button><button id="repoCancel">Cancel</button></dialog><script type="module" src="/web/js/app.js"></script></body></html>
