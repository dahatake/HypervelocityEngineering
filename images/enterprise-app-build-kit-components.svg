<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="'Segoe UI', Meiryo, 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="13" fill="#1f2328">
  <title>Enterprise App Build Kit Lite（HVE Lite）のコンポーネント図</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .frame { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .frame-label { font-size: 14px; font-weight: 600; fill: #57606a; }
      .box { stroke-width: 1.5; }
      .agent { fill: #ddf4ff; stroke: #0969da; }
      .lead { fill: #0969da; stroke: #0550ae; }
      .ctrl { fill: #fff8c5; stroke: #9a6700; }
      .perm { fill: #dafbe1; stroke: #1a7f37; }
      .temp { fill: #f6f8fa; stroke: #6e7781; }
      .ext { fill: #fbefff; stroke: #8250df; }
      .title { font-size: 15px; font-weight: 700; }
      .sub { font-size: 12px; fill: #57606a; }
      .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
      .dash { stroke-dasharray: 5 4; }
      .note { font-size: 12px; fill: #57606a; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="880" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700">HVE Lite のコンポーネント構成</text>

  <rect class="box ext" x="60" y="60" width="240" height="64" rx="8"/>
  <text class="title" x="180" y="84" text-anchor="middle">利用者</text>
  <text class="sub" x="180" y="106" text-anchor="middle">PM・Architect・SWE</text>
  <rect class="box lead" x="460" y="60" width="280" height="64" rx="8"/>
  <text class="title" x="600" y="84" text-anchor="middle" style="fill:#ffffff">Copilot（既定のエージェント）</text>
  <text class="sub" x="600" y="106" text-anchor="middle" style="fill:#ffffff">VS Code・CLI・app・cloud agent</text>
  <rect class="box ext" x="880" y="60" width="260" height="64" rx="8"/>
  <text class="title" x="1010" y="84" text-anchor="middle">GitHub Actions</text>
  <text class="sub" x="1010" y="106" text-anchor="middle">.github/workflows/ebak-verify.yml</text>
  <path class="line" d="M300,84 L458,84" marker-end="url(#arrow)"/>
  <text class="note" x="379" y="76" text-anchor="middle">依頼・承認・回答</text>
  <path class="line dash" d="M460,108 L302,108" marker-end="url(#arrow)"/>
  <text class="note" x="379" y="124" text-anchor="middle">報告・質問票</text>
  <path class="line" d="M600,124 L600,172" marker-end="url(#arrow)"/>
  <text class="note" x="610" y="150">規則に従い、同じ変更で更新・検査</text>

  <rect class="frame" x="40" y="160" width="1120" height="160" rx="10"/>
  <text class="frame-label" x="56" y="182">規則と手順の層（リポジトリに入る）</text>
  <rect class="box ctrl" x="60" y="196" width="330" height="108" rx="8"/>
  <text class="title" x="76" y="220">規則（常に読み込む）</text>
  <text class="sub" x="76" y="242">AGENTS.md</text>
  <text class="sub" x="76" y="262">.github/copilot-instructions.md</text>
  <text class="sub" x="76" y="282">ebak-abk のブロック（短い規則）</text>
  <rect class="box ctrl" x="420" y="196" width="330" height="108" rx="8"/>
  <text class="title" x="436" y="220">.github/skills/（手順書）</text>
  <text class="sub" x="436" y="242">requirement-definition</text>
  <text class="sub" x="436" y="262">rd-audit ・ adopt-existing</text>
  <text class="sub" x="436" y="282">必要なときだけ読み込む</text>
  <rect class="box agent" x="780" y="196" width="360" height="108" rx="8"/>
  <text class="title" x="796" y="220">.github/agents/rd-auditor</text>
  <text class="sub" x="796" y="242">節目に利用者が選んで頼む</text>
  <text class="sub" x="796" y="262">意味の矛盾・目的とのずれを監査</text>
  <text class="sub" x="796" y="282">読み取り専用（結果は work/audit/）</text>

  <rect class="frame" x="40" y="340" width="1120" height="160" rx="10"/>
  <text class="frame-label" x="56" y="362">決定的スクリプト（scripts/。Python 3.9 以上・標準ライブラリだけ）</text>
  <rect class="box ctrl" x="60" y="376" width="330" height="108" rx="8"/>
  <text class="title" x="76" y="400">ebak.config.json（設定）</text>
  <text class="sub" x="76" y="422">checks.profile（lite／full）</text>
  <text class="sub" x="76" y="442">verify.commands ・ base_branch</text>
  <text class="sub" x="76" y="462">adopt.py ・ summarize.py ほか</text>
  <rect class="box ctrl" x="420" y="376" width="330" height="108" rx="8"/>
  <text class="title" x="436" y="400">rdcheck.py ・ rdfix.py</text>
  <text class="sub" x="436" y="422">検査（CHK）と機械的な修復</text>
  <text class="sub" x="436" y="442">next-id.py … ID の採番</text>
  <text class="sub" x="436" y="462">ledger.py … 台帳の更新</text>
  <rect class="box ctrl" x="780" y="376" width="360" height="108" rx="8"/>
  <text class="title" x="796" y="400">verify.py / .ps1 / .sh</text>
  <text class="sub" x="796" y="422">データ層の検査（rdcheck）</text>
  <text class="sub" x="796" y="442">＋ verify.commands（ビルド・テスト）</text>
  <text class="sub" x="796" y="462">完了の前に exit 0</text>
  <path class="line" d="M390,430 L418,430" marker-end="url(#arrow)"/>
  <path class="line" d="M778,430 L752,430" marker-end="url(#arrow)"/>

  <path class="line dash" d="M1140,92 L1172,92 L1172,430 L1142,430" marker-end="url(#arrow)"/>
  <text class="note" x="1184" y="260" transform="rotate(90 1184 260)" text-anchor="middle">main への push・PR で同じ verify（検査だけ）</text>

  <path class="line" d="M585,500 L585,566" marker-end="url(#arrow)"/>
  <text class="note" x="595" y="540">検査・修復・採番・台帳の更新（ログは work/ へ）</text>

  <rect class="frame" x="40" y="520" width="1120" height="200" rx="10"/>
  <text class="frame-label" x="56" y="542">データ層（決まったパスのファイル）</text>
  <rect class="box perm" x="60" y="568" width="400" height="140" rx="8"/>
  <text class="title" x="76" y="592">docs/（永続・git で管理）</text>
  <text class="sub" x="76" y="614">requirements-definition.md … 要求定義書（正本）</text>
  <text class="sub" x="76" y="634">catalog.md … カタログ（要求と実装・テストの対応）</text>
  <text class="sub" x="76" y="654">integrations.md … 外部連携カタログ（任意）</text>
  <text class="sub" x="76" y="674">id-registry.md … ID 台帳（merge=union）</text>
  <rect class="box perm" x="480" y="568" width="280" height="140" rx="8"/>
  <text class="title" x="496" y="592">tests/system/（永続・git）</text>
  <text class="sub" x="496" y="614">ledger.json … System Test の台帳</text>
  <text class="sub" x="496" y="634">（ケースと最新の状態）</text>
  <text class="sub" x="496" y="654">System Test 本体（テストのコード）</text>
  <rect class="box temp" x="780" y="568" width="360" height="140" rx="8"/>
  <text class="title" x="796" y="592">work/（一時・git 管理外）</text>
  <text class="sub" x="796" y="614">verify のログ・証跡・作業メモ</text>
  <text class="sub" x="796" y="634">audit/&lt;日時&gt;/ … 監査の結果</text>
  <text class="sub" x="796" y="654">import/ … adopt.py の依頼文</text>
  <text class="sub" x="796" y="674">自動では削除しない</text>
  <rect class="box ext" x="60" y="760" width="1080" height="72" rx="8"/>
  <text class="title" x="600" y="784" text-anchor="middle">HVE Studio（HVE-Studio/studio.py）</text>
  <text class="sub" x="600" y="806" text-anchor="middle">データ層を図・表・検索で見る。127.0.0.1 だけで待ち受け、原本の閲覧と解析は読み取り専用</text>
  <path class="line" d="M600,758 L600,722" marker-end="url(#arrow)"/>
  <text class="note" x="610" y="746">読む</text>
</svg>
