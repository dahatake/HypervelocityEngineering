# markdown-query 配布パッケージの宣言。
#
# エンジン（mdq）・Skill 定義・共通セットアップ実装は上流の
# tools/skills/markdown_query/ が既に版管理下で保持しているので、ここでは
# 「どこから集めるか」だけを宣言する。実体をここへ複製しない。

[package]
name = "markdown-query"
version = "1.3.0"
engine = "mdq"
summary = "ローカル完結の Markdown 横断検索 Skill（BM25 + snippet 返却）"
source_repo = "dahatake/RoyalytyService2ndGen"

post_install_note = """\
生成された mdq.toml の index.roots を確認し、不要なディレクトリを除外してから
`mdq.ps1 index` / `./mdq.sh index` を再実行してください。"""

# コピー先で利用者が編集するファイル（既存なら上書きしない）。
# mdq.toml は導入先リポジトリのルートに生成されるためここには現れない。
preserve = []

[[package.sources]]
from = "tools/skills/markdown_query"
to = "."
exclude = [
    "results/**",
    "usage-report/**",
    "queries.json",
    "**/__pycache__/**",
    "__pycache__/**",
    "*.pyc",
    ".venv-*/**",
]

[[package.sources]]
from = "tools/for-other-repo/markdown-query/GETTING-STARTED.md"
to = "GETTING-STARTED.md"

[[package.docs]]
from = "users-guide/skills-markdown-query.md"
to = "docs/skills-markdown-query.md"

[[package.docs]]
from = "users-guide/images/skills-markdown-query"
to = "docs/images/skills-markdown-query"
