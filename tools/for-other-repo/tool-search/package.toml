# tool-search 配布パッケージの宣言。
#
# Tool Search には上流に配布キットが無いので、既存の実装をそのまま集める:
#   - hve/toolsearch/         : ランキング・ポリシー・統計・ダッシュボード本体
#   - mdq/tokenize.py         : ranking.py が使う日本語対応トークナイザ
#   - tools/skills/_kit/      : setup の共通実装（markdown-query / code-query と同一）
# ここに新規で足すのは CLI 入口（engine/cli.py, engine/__main__.py）だけで、
# 上流では hve/__main__.py の `toolsearch dashboard` がその役目を担っている。

[package]
name = "tool-search"
version = "1.3.0"
engine = "toolsearch"
summary = "Copilot SDK セッションのツール定義を遅延ロードし、ランキングを自前で持つ仕組み"
source_repo = "dahatake/RoyalytyService2ndGen"

post_install_note = """\
vendor/toolsearch/policy.json は上流リポジトリの pin / 語彙が入ったままです。
導入先のツール構成に合わせて書き換え、`toolsearch.ps1 policy` で確認してください。"""

# policy.json は導入先でチューニングする前提。既存なら上書きしない。
preserve = ["vendor/toolsearch/policy.json"]

[[package.sources]]
from = "tools/skills/_kit"
to = "kit"

[[package.sources]]
from = "hve/toolsearch"
to = "vendor/toolsearch"
exclude = ["**/__pycache__/**", "__pycache__/**", "*.pyc"]

[[package.sources]]
from = "mdq/__init__.py"
to = "vendor/mdq/__init__.py"

[[package.sources]]
from = "mdq/tokenize.py"
to = "vendor/mdq/tokenize.py"

# ranking.py の既定 BM25 実装 `_MiniBM25` の出所。module レベルの依存は
# stdlib と mdq.tokenize だけなので単体で同梱できる。
[[package.sources]]
from = "mdq/search.py"
to = "vendor/mdq/search.py"

[[package.sources]]
from = "tools/for-other-repo/tool-search/engine"
to = "vendor/toolsearch"

[[package.sources]]
from = "tools/for-other-repo/tool-search/kit.toml"
to = "kit.toml"

[[package.sources]]
from = "tools/for-other-repo/tool-search/toolsearch.ps1"
to = "toolsearch.ps1"

[[package.sources]]
from = "tools/for-other-repo/tool-search/toolsearch.sh"
to = "toolsearch.sh"

[[package.sources]]
from = "tools/for-other-repo/tool-search/toolsearch.cmd"
to = "toolsearch.cmd"

[[package.sources]]
from = "tools/for-other-repo/tool-search/GETTING-STARTED.md"
to = "GETTING-STARTED.md"

[[package.docs]]
from = "users-guide/tool-search.md"
to = "docs/tool-search.md"
