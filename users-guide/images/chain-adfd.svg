<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" role="img" aria-labelledby="title desc">
  <title id="title">ADFD Agent チェーン（3 ステップ）</title>
  <desc id="desc">ADFD の Prompt チェーン。step-1 Arch-Dataflow-AppSpec（ジョブ詳細仕様書）と step-2 Arch-Dataflow-MonitoringDesign（監視・運用設計書）を並列実行し、AND 合流して step-3 Arch-Dataflow-TDD-TestSpec（TDD テスト仕様書）を実行する。</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#586069"/></marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK JP", "Noto Sans JP", system-ui, -apple-system, sans-serif; fill: #24292e; }
    .t { font-size: 16px; font-weight: 700; }
    .sub { font-size: 11px; fill: #586069; }
    .step { fill: #e8d5f5; stroke: #6f42c1; stroke-width: 2; rx: 10; ry: 10; }
    .agent { font-size: 13px; font-weight: 700; fill: #6f42c1; }
    .ttl { font-size: 12px; font-weight: 600; }
    .io { font-size: 10px; fill: #475569; }
    .ln { stroke: #586069; stroke-width: 2; fill: none; marker-end: url(#arr); }
    .join { fill: #334155; }
  </style>
  <rect width="940" height="360" fill="#f6f8fa" rx="12"/>
  <text x="470" y="34" text-anchor="middle" class="t">ADFD Agent チェーン（3 ステップ）</text>
  <text x="470" y="54" text-anchor="middle" class="sub">入力: docs/catalog/*（AAS 出力） — step-1 ∥ step-2 を並列実行 → AND 合流 → step-3</text>

  <!-- step-1 -->
  <rect x="40" y="86" width="320" height="92" class="step"/>
  <text x="56" y="110" class="ttl">step-1: ジョブ詳細仕様書（per-job fanout）</text>
  <text x="56" y="132" class="agent">Arch-Dataflow-AppSpec</text>
  <text x="56" y="152" class="io">in: app-catalog.md / data-model.md / service-catalog-matrix.md</text>
  <text x="56" y="168" class="io">out: docs/dataflow/apps/{jobId}-{jobNameSlug}-spec.md</text>

  <!-- step-2 -->
  <rect x="40" y="196" width="320" height="92" class="step"/>
  <text x="56" y="220" class="ttl">step-2: 監視・運用設計書</text>
  <text x="56" y="242" class="agent">Arch-Dataflow-MonitoringDesign</text>
  <text x="56" y="262" class="io">in: app-catalog.md / service-catalog-matrix.md</text>
  <text x="56" y="278" class="io">out: docs/dataflow/dataflow-monitoring-design.md</text>

  <!-- AND join -->
  <circle cx="470" cy="187" r="10" class="join"/>
  <text x="470" y="167" text-anchor="middle" class="sub" fill="#334155">AND</text>
  <path class="ln" d="M360 132 L455 178"/>
  <path class="ln" d="M360 242 L455 196"/>

  <!-- step-3 -->
  <rect x="560" y="120" width="340" height="134" class="step"/>
  <text x="576" y="146" class="ttl">step-3: TDD テスト仕様書（per-job fanout）</text>
  <text x="576" y="170" class="agent">Arch-Dataflow-TDD-TestSpec</text>
  <text x="576" y="192" class="io">depends: step-1 AND step-2</text>
  <text x="576" y="210" class="io">in: test-strategy.md / service-catalog-matrix.md /</text>
  <text x="576" y="224" class="io">    {jobId}-spec.md / dataflow-monitoring-design.md</text>
  <text x="576" y="244" class="io">out: docs/test-specs/{jobId}-test-spec.md</text>
  <path class="ln" d="M481 187 L555 187"/>

  <text x="470" y="318" text-anchor="middle" class="sub">step-1 / step-3 は dataflow_catalog fanout で per-job に展開（ジョブごとに 1 ファイル生成）。</text>
  <text x="470" y="338" text-anchor="middle" class="sub">ラベル遷移: adfd:ready → adfd:running → adfd:done</text>
</svg>
