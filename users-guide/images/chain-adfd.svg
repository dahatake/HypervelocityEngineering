<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">ADFD チェーン図</title>
  <desc id="desc">ADFD の現行 7 Step。0.1 から 0.2、4、5 を直列で進み、Step 1 と Step 2 が並列に起動し、Step 3 が合流する。Step 1 と Step 3 は APP-ID fan-out。</desc>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Noto Sans JP", Arial, sans-serif; fill: #0f172a; }
    .title { font-size: 18px; font-weight: 700; }
    .note { font-size: 11px; fill: #475569; }
    .box { rx: 8; ry: 8; stroke-width: 1.6; fill: #ede9fe; stroke: #7c3aed; }
    .parallel { fill: #dcfce7; stroke: #15803d; }
    .text1 { font-size: 12px; font-weight: 700; }
    .text2 { font-size: 10px; }
    .line { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
  </style>

  <text x="560" y="30" text-anchor="middle" class="title">ADFD — Dataflow Design（現行 7 Step）</text>

  <rect x="30" y="108" width="130" height="58" class="box"/>
  <text x="95" y="134" text-anchor="middle" class="text1">Step 0.1</text>
  <text x="95" y="150" text-anchor="middle" class="text2">データモデル定義書</text>

  <rect x="194" y="108" width="130" height="58" class="box"/>
  <text x="259" y="134" text-anchor="middle" class="text1">Step 0.2</text>
  <text x="259" y="150" text-anchor="middle" class="text2">データフローアプリカタログ</text>

  <rect x="358" y="108" width="130" height="58" class="box"/>
  <text x="423" y="134" text-anchor="middle" class="text1">Step 4</text>
  <text x="423" y="150" text-anchor="middle" class="text2">サービスカタログ</text>

  <rect x="522" y="108" width="130" height="58" class="box"/>
  <text x="587" y="134" text-anchor="middle" class="text1">Step 5</text>
  <text x="587" y="150" text-anchor="middle" class="text2">テスト戦略書</text>

  <rect x="706" y="54" width="150" height="58" class="box parallel"/>
  <text x="781" y="80" text-anchor="middle" class="text1">Step 1</text>
  <text x="781" y="96" text-anchor="middle" class="text2">ジョブ詳細仕様書</text>
  <text x="781" y="108" text-anchor="middle" class="text2">APP-ID fan-out</text>

  <rect x="706" y="162" width="150" height="58" class="box parallel"/>
  <text x="781" y="188" text-anchor="middle" class="text1">Step 2</text>
  <text x="781" y="204" text-anchor="middle" class="text2">監視・運用設計書</text>

  <rect x="926" y="108" width="164" height="58" class="box"/>
  <text x="1008" y="134" text-anchor="middle" class="text1">Step 3</text>
  <text x="1008" y="150" text-anchor="middle" class="text2">TDD テスト仕様書</text>
  <text x="1008" y="162" text-anchor="middle" class="text2">APP-ID fan-out</text>

  <path d="M160 137 L194 137" class="line"/>
  <path d="M324 137 L358 137" class="line"/>
  <path d="M488 137 L522 137" class="line"/>
  <path d="M652 137 L706 83" class="line"/>
  <path d="M652 137 L706 191" class="line"/>
  <path d="M856 83 L926 122" class="line"/>
  <path d="M856 191 L926 152" class="line"/>

  <text x="560" y="266" text-anchor="middle" class="note">依存: 0.1 → 0.2 → 4 → 5 → (1 と 2 を並列起動) → 3。Cloud の旧 3 Step 表示ではなく、CLI / GUI の current registry を表す。</text>
</svg>
