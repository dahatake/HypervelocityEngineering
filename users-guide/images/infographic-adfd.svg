<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ADFD インフォグラフィック</title>
  <desc id="desc">ADFD の現行 7 Step と主成果物。0.1 から 5 までの producer を直列で進み、Step 1 と Step 2 を並列実行した後、Step 3 で APP-ID ごとの TDD テスト仕様を生成する。</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
    .zone { stroke: #94a3b8; stroke-width: 1.5; rx: 10; ry: 10; }
    .inputZone { fill: #f8fafc; } .processZone { fill: #eff6ff; } .outputZone { fill: #f0fdf4; }
    .zoneTitle { font-size: 18px; font-weight: 700; }
    .file { fill: #fff; stroke: #64748b; stroke-width: 1.5; rx: 8; ry: 8; }
    .workflow { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; rx: 10; ry: 10; }
    .step { fill: #e0ecff; stroke: #1d4ed8; stroke-width: 1.5; rx: 8; ry: 8; }
    .node { font-size: 12px; font-weight: 600; }
    .tiny { font-size: 10.5px; fill: #475569; }
  </style>

  <rect x="20" y="20" width="280" height="380" class="zone inputZone"/>
  <rect x="320" y="20" width="560" height="380" class="zone processZone"/>
  <rect x="900" y="20" width="280" height="380" class="zone outputZone"/>
  <text x="40" y="52" class="zoneTitle" fill="#64748b">INPUT（AAS / ARD）</text>
  <text x="340" y="52" class="zoneTitle" fill="#1d4ed8">PROCESS</text>
  <text x="920" y="52" class="zoneTitle" fill="#15803d">OUTPUT</text>

  <rect x="40" y="90" width="240" height="152" class="file"/>
  <text x="54" y="118" class="node">docs/catalog/app-catalog.md</text>
  <text x="54" y="138" class="node">docs/catalog/data-model.md</text>
  <text x="54" y="158" class="node">docs/catalog/service-catalog-matrix.md</text>
  <text x="54" y="178" class="node">docs/catalog/test-strategy.md</text>
  <text x="54" y="198" class="node">docs/catalog/domain-analytics.md</text>
  <text x="54" y="218" class="node">docs/catalog/use-case-catalog.md</text>

  <rect x="350" y="88" width="500" height="260" class="workflow"/>
  <text x="372" y="116" class="node" fill="#1d4ed8">Workflow: adfd（0.1 → 0.2 → 4 → 5 → (1 ∥ 2) → 3）</text>
  <text x="372" y="150" class="tiny">0.1 データモデル定義書 / 0.2 データフローアプリカタログ / 4 サービスカタログ / 5 テスト戦略書</text>
  <text x="372" y="176" class="tiny">1 ジョブ詳細仕様書（APP-ID fan-out） / 2 監視・運用設計書 / 3 TDD テスト仕様書（APP-ID fan-out）</text>
  <text x="372" y="214" class="tiny">Cloud の Issue Form / reusable workflow は旧 3 Step 表示のため、完全実行は CLI / GUI の current registry を使用</text>
  <text x="372" y="252" class="tiny">fan-out キー: dataflow_catalog parser が返す APP-ID</text>
  <text x="372" y="278" class="tiny">Step 3 は Step 1 と Step 2 の両方を待って起動</text>

  <rect x="920" y="90" width="240" height="208" class="file"/>
  <text x="934" y="118" class="node">docs/dataflow/dataflow-data-model.md</text>
  <text x="934" y="138" class="node">docs/dataflow/dataflow-app-catalog.md</text>
  <text x="934" y="158" class="node">docs/dataflow/dataflow-service-catalog.md</text>
  <text x="934" y="178" class="node">docs/dataflow/dataflow-test-strategy.md</text>
  <text x="934" y="198" class="node">docs/dataflow/apps/{APP-ID}-spec.md</text>
  <text x="934" y="218" class="node">docs/dataflow/dataflow-monitoring-design.md</text>
  <text x="934" y="238" class="node">docs/test-specs/{APP-ID}-test-spec.md</text>
</svg>
