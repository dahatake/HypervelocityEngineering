<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
  <title id="title">ADFDV インフォグラフィック</title>
  <desc id="desc">ADFDV の current registry 8 Step。Step 1.1 から 3 までは直列、Step 4.1 と 4.2 は Step 3 の後に並列、Step 4.3 は両方の完了後に実行する。</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
    .zone { stroke: #94a3b8; stroke-width: 1.5; rx: 10; ry: 10; }
    .inputZone { fill: #f8fafc; } .processZone { fill: #eff6ff; } .outputZone { fill: #f0fdf4; }
    .zoneTitle { font-size: 18px; font-weight: 700; }
    .file { fill: #fff; stroke: #64748b; stroke-width: 1.5; rx: 8; ry: 8; }
    .workflow { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; rx: 10; ry: 10; }
    .step { fill: #e0ecff; stroke: #1d4ed8; stroke-width: 1.5; rx: 8; ry: 8; }
    .node { font-size: 11px; font-weight: 600; }
    .tiny { font-size: 10px; fill: #475569; }
  </style>

  <rect x="20" y="20" width="300" height="520" class="zone inputZone"/>
  <rect x="340" y="20" width="930" height="520" class="zone processZone"/>
  <rect x="1290" y="20" width="190" height="520" class="zone outputZone"/>
  <text x="40" y="52" class="zoneTitle" fill="#64748b">INPUT</text>
  <text x="360" y="52" class="zoneTitle" fill="#1d4ed8">PROCESS</text>
  <text x="1310" y="52" class="zoneTitle" fill="#15803d">OUTPUT</text>

  <rect x="50" y="110" width="240" height="150" class="file"/>
  <text x="62" y="142" class="node">ADFD / AAS / ARD 成果物</text>
  <text x="62" y="164" class="tiny">app-catalog / service-catalog-matrix</text>
  <text x="62" y="180" class="tiny">use-case-catalog / dataflow-service-catalog</text>
  <text x="62" y="196" class="tiny">dataflow-data-model / app-catalog</text>
  <text x="62" y="212" class="tiny">monitoring-design / test-strategy</text>
  <text x="62" y="228" class="tiny">apps/{APP-ID}-spec.md / test-specs/{APP-ID}-test-spec.md</text>

  <rect x="370" y="80" width="870" height="430" class="workflow"/>
  <text x="392" y="108" class="node" fill="#1d4ed8">Workflow: adfdv（1.1 → 1.2 → 2.1 → 2.2 → 3 → (4.1 ∥ 4.2) → 4.3）</text>

  <rect x="390" y="150" width="120" height="64" class="step"/><text x="398" y="176" class="node">1.1 データサービス選定</text>
  <rect x="520" y="150" width="120" height="64" class="step"/><text x="528" y="176" class="node">1.2 Azure データリソース Deploy</text>
  <rect x="650" y="150" width="120" height="64" class="step"/><text x="658" y="176" class="node">2.1 TDD RED</text>
  <rect x="780" y="150" width="120" height="64" class="step"/><text x="788" y="176" class="node">2.2 TDD GREEN</text>
  <rect x="910" y="150" width="120" height="64" class="step"/><text x="918" y="176" class="node">3 Azure Functions/コンテナ Deploy</text>
  <rect x="860" y="298" width="150" height="72" class="step"/><text x="870" y="324" class="node">4.1 WAF レビュー</text>
  <rect x="1040" y="298" width="150" height="72" class="step"/><text x="1050" y="324" class="node">4.2 整合性チェック</text>
  <rect x="950" y="418" width="150" height="72" class="step"/><text x="966" y="444" class="node">4.3 要件適合実測</text>

  <rect x="1310" y="120" width="150" height="74" class="file"/><text x="1320" y="148" class="node">src/infra/azure/dataflow/</text>
  <rect x="1310" y="210" width="150" height="74" class="file"/><text x="1320" y="238" class="node">src/test/dataflow/</text>
  <rect x="1310" y="300" width="150" height="74" class="file"/><text x="1320" y="328" class="node">src/dataflow/</text>
  <rect x="1310" y="390" width="150" height="104" class="file"/>
  <text x="1320" y="418" class="node">docs/azure/</text>
  <text x="1320" y="438" class="tiny">waf-review.md / dependency-review.md</text>
  <text x="1320" y="458" class="tiny">docs/dataflow/requirements-conformance-report.md</text>
</svg>
