<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">HVE Workflow 間の接続</title>
  <desc id="desc">原本処理はADIに統合され、Step 1.1でD01からD21の質問票を並列生成し、Step 1.2で横断統合する。qaはAKMを経由してknowledgeへ反映され、設計と実装の全Workflowから参照される。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Segoe UI","Yu Gothic",Meiryo,sans-serif;fill:#172033}
      .title{font-size:28px;font-weight:700}.subtitle{font-size:14px;fill:#526077}.lane{font-size:15px;font-weight:700}
      .box{stroke-width:1.6}.input{fill:#eff6ff;stroke:#2563eb}.wf{fill:#f5f3ff;stroke:#7c3aed}
      .knowledge{fill:#fff7ed;stroke:#ea580c}.output{fill:#ecfdf5;stroke:#059669}
      .label{font-size:14px;font-weight:700}.small{font-size:11px;fill:#526077}
      .line{fill:none;stroke:#475569;stroke-width:1.8;marker-end:url(#arrow)}
      .soft{fill:none;stroke:#ea580c;stroke-width:1.6;stroke-dasharray:7 5;marker-end:url(#arrow)}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.3}
    </style>
  </defs>
  <rect width="1320" height="760" fill="#ffffff"/>
  <text x="34" y="46" class="title">HVE Workflow 間の接続</text>
  <text x="34" y="72" class="subtitle">原本 → 質問票 → knowledge と、要求 → 設計 → 実装の2本の流れをファイル成果物で疎結合に接続</text>

  <rect x="24" y="98" width="1272" height="248" rx="14" class="panel"/>
  <text x="46" y="128" class="lane">原本・knowledge パイプライン</text>
  <rect x="46" y="156" width="184" height="68" rx="10" class="box input"/>
  <text x="66" y="184" class="label">docs-original/</text><text x="66" y="204" class="small">読み取り専用の原本</text>
  <rect x="278" y="144" width="250" height="92" rx="10" class="box wf"/>
  <text x="298" y="174" class="label">ADI — 9 Step</text>
  <text x="298" y="196" class="small">Step 1: 目録・正規化</text><text x="298" y="214" class="small">Step 1.1: 21 fan-out → 1.2: join</text>
  <rect x="576" y="156" width="214" height="68" rx="10" class="box input"/>
  <text x="596" y="184" class="label">qa/（22成果物）</text><text x="596" y="204" class="small">D01〜D21 + 横断質問票</text>
  <rect x="838" y="156" width="184" height="68" rx="10" class="box wf"/>
  <text x="858" y="184" class="label">AKM</text><text x="858" y="204" class="small">分類・差分統合</text>
  <rect x="1070" y="144" width="196" height="92" rx="10" class="box knowledge"/>
  <text x="1090" y="174" class="label">knowledge/</text><text x="1090" y="196" class="small">D01〜D21</text><text x="1090" y="214" class="small">確定業務コンテキスト</text>
  <path d="M230 190H278" class="line"/><path d="M528 190H576" class="line"/><path d="M790 190H838" class="line"/><path d="M1022 190H1070" class="line"/>
  <path d="M403 236V294H930V224" class="soft"/>
  <text x="476" y="288" class="small" fill="#c2410c">ADI Step 4 routingはAKMが任意参照（soft dependency）</text>

  <rect x="24" y="370" width="1272" height="302" rx="14" class="panel"/>
  <text x="46" y="402" class="lane">要求・設計・実装パイプライン</text>
  <rect x="50" y="436" width="140" height="64" rx="10" class="box wf"/>
  <text x="72" y="464" class="label">ARD</text><text x="72" y="484" class="small">要求・UC</text>
  <rect x="238" y="436" width="140" height="64" rx="10" class="box wf"/>
  <text x="260" y="464" class="label">AAS</text><text x="260" y="484" class="small">全体設計</text>
  <rect x="440" y="416" width="150" height="58" rx="10" class="box wf"/>
  <text x="462" y="449" class="label">AAD-WEB</text>
  <rect x="440" y="486" width="150" height="58" rx="10" class="box wf"/>
  <text x="462" y="519" class="label">ADFD</text>
  <rect x="440" y="556" width="150" height="58" rx="10" class="box wf"/>
  <text x="462" y="589" class="label">AAG</text>
  <rect x="646" y="416" width="156" height="58" rx="10" class="box wf"/>
  <text x="668" y="449" class="label">ASDW-WEB</text>
  <rect x="646" y="486" width="156" height="58" rx="10" class="box wf"/>
  <text x="668" y="519" class="label">ADFDV</text>
  <rect x="646" y="556" width="156" height="58" rx="10" class="box wf"/>
  <text x="668" y="589" class="label">AAGD</text>
  <rect x="858" y="416" width="150" height="58" rx="10" class="box wf"/>
  <text x="880" y="449" class="label">AAR</text>
  <text x="880" y="466" class="small">検索Add-on</text>
  <rect x="858" y="528" width="150" height="72" rx="10" class="box wf"/>
  <text x="880" y="557" class="label">ADOC</text><text x="880" y="579" class="small">src → docs-generated</text>
  <rect x="1064" y="436" width="202" height="164" rx="10" class="box output"/>
  <text x="1084" y="466" class="label">主要成果物</text>
  <text x="1084" y="490" class="small">docs/ 設計書</text><text x="1084" y="512" class="small">src/ 実装・テスト</text>
  <text x="1084" y="534" class="small">Azure / infra</text><text x="1084" y="556" class="small">docs-generated/</text>
  <path d="M190 468H238" class="line"/><path d="M378 468H416V445H440" class="line"/>
  <path d="M378 468H416V515H440" class="line"/><path d="M378 468H416V585H440" class="line"/>
  <path d="M590 445H646" class="line"/><path d="M590 515H646" class="line"/><path d="M590 585H646" class="line"/>
  <path d="M590 445C690 382 800 382 858 445" class="soft"/>
  <path d="M802 515C830 515 832 564 858 564" class="line"/>
  <path d="M802 445C910 390 1018 410 1064 470" class="line"/><path d="M1008 445H1064" class="line"/><path d="M1008 564H1064" class="line"/>
  <path d="M1168 236V330H308V436" class="soft"/>
  <text x="738" y="326" class="small" fill="#c2410c">knowledge/を全設計・実装Promptが業務コンテキストとして参照</text>

  <rect x="24" y="700" width="1272" height="40" rx="10" class="panel"/>
  <text x="46" y="725" class="small">実線: 必須成果物フロー　破線: 任意参照 / context注入　正本: hve/workflow_registry.py</text>
</svg>
