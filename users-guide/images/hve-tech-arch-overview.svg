<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 830" font-family="Segoe UI, Hiragino Kaku Gothic ProN, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .title { font-size: 18px; font-weight: bold; }
      .h    { font-size: 14px; font-weight: bold; }
      .box  { fill: #fff; stroke: #444; stroke-width: 1.2; }
      .cloud { fill: #e8f1fb; stroke: #1f6feb; }
      .cli   { fill: #eaf6ee; stroke: #1a7f37; }
      .gui   { fill: #f8eaf6; stroke: #8250df; }
      .prompt { fill: #ede9fe; stroke: #7c3aed; }
      .shared { fill: #fff5d6; stroke: #9a6700; }
      .sdk   { fill: #fbe9e7; stroke: #b91c1c; }
      .ext   { fill: #efefef; stroke: #666; }
      .arr   { stroke: #444; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
      .dashed { stroke-dasharray: 4 3; }
    </style>
  </defs>

  <text class="title" x="20" y="30">HVE 3 Orchestrator + Prompt 利用面（疎結合レイヤ構造）</text>

  <!-- Top: 3 Orchestrator entry layer -->
  <rect class="box cloud" x="30"  y="60" width="320" height="120" rx="6"/>
  <text class="h" x="50" y="84">① HVE Cloud Agent Orchestrator</text>
  <text x="50" y="106">入口: GitHub Issue Template</text>
  <text x="50" y="124">実行: GitHub Actions (reusable workflows)</text>
  <text x="50" y="142">UI 層: GitHub Web UI / Sub-Issue</text>
  <text x="50" y="162">エンジン: bash + assign-copilot.sh + Coding Agent</text>

  <rect class="box cli" x="390" y="60" width="320" height="120" rx="6"/>
  <text class="h" x="410" y="84">② HVE CLI Orchestrator</text>
  <text x="410" y="106">入口: `python -m hve orchestrate ...`</text>
  <text x="410" y="124">実行: ローカル端末 (asyncio)</text>
  <text x="410" y="142">UI 層: Rich Live Workbench (TUI)</text>
  <text x="410" y="162">エンジン: hve.orchestrator + DAGExecutor</text>

  <rect class="box gui" x="750" y="60" width="320" height="120" rx="6"/>
  <text class="h" x="770" y="84">③ HVE GUI Orchestrator</text>
  <text x="770" y="106">入口: `python -m hve` / `... gui`</text>
  <text x="770" y="124">実行: ローカル端末 (PySide6)</text>
  <text x="770" y="142">UI 層: 2-step Wizard + Workbench Pane</text>
  <text x="770" y="162">エンジン: subprocess → CLI を流用</text>

  <!-- Prompt surface (not a fourth Orchestrator) -->
  <rect class="box prompt" x="390" y="196" width="680" height="90" rx="6"/>
  <text class="h" x="410" y="220">Prompt 版（Orchestrator ではない利用面）</text>
  <text x="410" y="240">入口: GUI の既存 Copilot ドック / GitHub Copilot CLI / VS Code Copilot Chat</text>
  <text x="410" y="258">hve-prompt-edition Skill → request → `hve prompt plan` → plan SHA-256 を提示</text>
  <text x="410" y="276">明示承認 + hash 一致時だけ `prompt run` → 既存 CLI Orchestrator へ委譲</text>

  <!-- Shared engine layer -->
  <rect class="box shared" x="390" y="310" width="680" height="110" rx="6"/>
  <text class="h" x="410" y="334">共有実行エンジン（HVE 独自 Python）</text>
  <text x="410" y="354">hve.orchestrator / dag_planner / dag_executor / runner.StepRunner</text>
  <text x="410" y="372">workflow_registry (WorkflowDef + StepDef DAG) / prompt_loader / skill_resolver</text>
  <text x="410" y="390">prompt_request / prompt_execution / run_state / qa_merger / template_engine</text>
  <text x="410" y="408">並列制御: asyncio.Semaphore(max_parallel) / Fan-out 展開 / Fork-on-Retry</text>

  <!-- Cloud-specific path (bash) -->
  <rect class="box cloud" x="30" y="310" width="320" height="110" rx="6"/>
  <text class="h" x="50" y="334">Cloud 専用パス（bash）</text>
  <text x="50" y="354">.github/workflows/auto-*-reusable.yml</text>
  <text x="50" y="372">.github/scripts/bash/lib/assign-copilot.sh</text>
  <text x="50" y="390">Sub-Issue 作成 → Copilot Coding Agent アサイン</text>
  <text x="50" y="408">PR 生成・ラベル遷移自動化</text>

  <!-- SDK layer -->
  <rect class="box sdk" x="30" y="460" width="1040" height="80" rx="6"/>
  <text class="h" x="50" y="484">GitHub Copilot CLI SDK（外部 PyPI: github-copilot-sdk）</text>
  <text x="50" y="506">CopilotClient(SubprocessConfig | ExternalServerConfig) / CopilotSession / PermissionHandler</text>
  <text x="50" y="524">create_session() → send_and_wait() / event stream (text / tool_use / permission_request)</text>

  <!-- External: Copilot CLI process -->
  <rect class="box ext" x="30" y="580" width="500" height="100" rx="6"/>
  <text class="h" x="50" y="604">外部プロセス: GitHub Copilot CLI（`copilot`）</text>
  <text x="50" y="624">モデル選択・推論呼び出し・MCP 管理・Plugin 管理</text>
  <text x="50" y="642">認証ストア: OS Credential Manager / Keychain / Secret Service</text>
  <text x="50" y="660">`copilot mcp list` / `copilot plugin list` / `copilot login`</text>

  <!-- MCP / Plugin / Skills (Copilot-managed) -->
  <rect class="box ext" x="550" y="580" width="520" height="100" rx="6"/>
  <text class="h" x="570" y="604">Copilot CLI 管理リソース（HVE は透過利用）</text>
  <text x="570" y="624">MCP Server: azure-mcp / github / workiq / 任意</text>
  <text x="570" y="642">Plugin: workiq@work-iq / 任意</text>
  <text x="570" y="660">Skills: .github/skills/*/SKILL.md（マニフェストで検索）</text>

  <!-- HVE-managed agents/workflows/skills -->
  <rect class="box shared" x="30" y="720" width="1040" height="90" rx="6"/>
  <text class="h" x="50" y="744">HVE 管理: Prompt / Workflow / Skill（リポジトリ内ファイル）</text>
  <text x="50" y="764">.github/prompts/*.prompt.md（Arch-*, Dev-*, QA-*, Doc-*, KnowledgeManager 等）</text>
  <text x="50" y="782">hve/workflow_registry.py（ARD/AAS/ADA/AAD-WEB/ASDW-WEB/ADFD/ADFDV/AAG/AAGD/AAR/AKM/ADI/ADOC）</text>
  <text x="50" y="800">.github/skills/*/SKILL.md（hve-prompt-edition / task-dag-planning / markdown-query 等）</text>

  <!-- Arrows -->
  <path class="arr" d="M190,180 L190,310"/>
  <path class="arr" d="M550,180 L370,180 L370,365 L390,365"/>
  <path class="arr" d="M910,180 L1080,180 L1080,365 L1070,365"/>
  <path class="arr" d="M730,286 L730,310"/>
  <path class="arr" d="M730,420 L730,460"/>
  <path class="arr" d="M550,540 L550,580"/>
  <path class="arr dashed" d="M810,680 L810,720"/>
  <path class="arr dashed" d="M730,540 L730,720"/>
</svg>
