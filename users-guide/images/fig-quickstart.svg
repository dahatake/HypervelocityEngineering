<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380" role="img" aria-labelledby="t d" font-family="Segoe UI, Meiryo, Yu Gothic UI, sans-serif">
<title id="t">はじめの 3 ステップ</title>
<desc id="d">インストール、最初の依頼、確認の 3 ステップ</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#667"/></marker></defs>
<rect width="1100" height="380" fill="#fafafa"/>
<rect x="30" y="40" width="320" height="190" rx="10" fill="#fff" stroke="#0f5fa8" stroke-width="2" />
<rect x="30" y="40" width="320" height="8" rx="4" fill="#0f5fa8" stroke="#0f5fa8" stroke-width="1" />
<text x="190.0" y="76" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">1. インストール</text>
<text x="190.0" y="98" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">対象リポジトリのルートで</text>
<text x="190.0" y="116" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">install.ps1 / install.sh を実行</text>
<text x="190.0" y="134" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">→ AGENTS.md・scripts/・docs/ など</text>
<text x="190.0" y="152" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">が入る（更新は同じコマンド）</text>
<rect x="390" y="40" width="320" height="190" rx="10" fill="#fff" stroke="#7b3fc4" stroke-width="2" />
<rect x="390" y="40" width="320" height="8" rx="4" fill="#7b3fc4" stroke="#7b3fc4" stroke-width="1" />
<text x="550.0" y="76" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">2. 最初の依頼</text>
<text x="550.0" y="98" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">Copilot のチャットに</text>
<text x="550.0" y="116" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">「○○ができるようにして」</text>
<text x="550.0" y="134" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">→ 要求・AC・テストが</text>
<text x="550.0" y="152" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">同じ変更で更新される</text>
<rect x="750" y="40" width="320" height="190" rx="10" fill="#fff" stroke="#107c10" stroke-width="2" />
<rect x="750" y="40" width="320" height="8" rx="4" fill="#107c10" stroke="#107c10" stroke-width="1" />
<text x="910.0" y="76" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">3. 確認する</text>
<text x="910.0" y="98" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">python scripts/verify.py → exit 0</text>
<text x="910.0" y="116" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">python HVE-Studio/studio.py --role pm</text>
<text x="910.0" y="134" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">→ ブラウザーで状態を見る</text>
<text x="910.0" y="152" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">→ 納得したらマージ</text>
<path d="M350 135 H390" stroke="#667" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<path d="M710 135 H750" stroke="#667" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="550" y="290" font-size="13" fill="#333" font-weight="bold" text-anchor="middle">詳細: README の「インストール」と「Quickstart」、users-guide の 1・2 章、Studio の S1 章</text>
</svg>
