<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 1010" role="img" aria-labelledby="title desc">
  <title id="title">HVE アプリケーションアーキテクチャ（カスタマイズ／パラメータ観点）</title>
  <desc id="desc">3 つの Orchestrator（Cloud / CLI / GUI）、既存 CLI へ委譲する Prompt 利用面、共有実行エンジン、設定・拡張できる定義ファイル、主要パラメータ・環境変数を示す詳細アーキテクチャ図。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK JP", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 26px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #475569; }
      .lane { font-size: 13px; font-weight: 700; fill: #64748b; }
      .card { rx: 10; ry: 10; stroke-width: 1.5; }
      .entry { fill: #e0f2fe; stroke: #0369a1; }
      .core { fill: #dbeafe; stroke: #1d4ed8; }
      .custom { fill: #fef3c7; stroke: #d97706; }
      .runner { fill: #ede9fe; stroke: #7c3aed; }
      .sdk { fill: #fae8ff; stroke: #a21caf; }
      .output { fill: #dcfce7; stroke: #15803d; }
      .param { fill: #fff7ed; stroke: #ea580c; }
      .label { font-size: 14px; font-weight: 700; }
      .body { font-size: 11.5px; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; fill: #0f172a; }
      .small { font-size: 10.5px; fill: #475569; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arr); }
      .arrow-dash { fill: none; stroke: #d97706; stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#arr); }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .star { font-size: 12px; font-weight: 700; fill: #b45309; }
    </style>
  </defs>

  <rect x="0" y="0" width="1340" height="1010" fill="#ffffff"/>
  <text x="28" y="44" class="title">HVE アプリケーションアーキテクチャ（カスタマイズ／パラメータ観点）</text>
  <text x="28" y="68" class="subtitle">Orchestrator は Cloud / CLI / GUI の 3 つ。Prompt 版は plan SHA-256 の一致後に CLI へ委譲する利用面。★ = 編集・設定する拡張点。</text>

  <!-- ===== Main pipeline (left ~74%) ===== -->
  <!-- Lane 1: Entry -->
  <text x="28" y="100" class="lane">1. 入口 / 利用面（Orchestrator は 3 つ）</text>
  <rect x="28" y="110" width="220" height="86" class="card entry"/>
  <text x="44" y="134" class="label">Cloud Agent</text>
  <text x="44" y="154" class="mono">.github/ISSUE_TEMPLATE/*.yml</text>
  <text x="44" y="172" class="small">ラベル付き Issue → dispatcher →</text>
  <text x="44" y="188" class="small">reusable workflow（bash, DAGExecutor 不使用）</text>

  <rect x="266" y="110" width="220" height="86" class="card entry"/>
  <text x="282" y="134" class="label">CLI</text>
  <text x="282" y="154" class="mono">python -m hve orchestrate</text>
  <text x="282" y="172" class="small">ローカルプロセスで DAG 実行</text>
  <text x="282" y="188" class="small">出力: Rich Workbench（TUI）</text>

  <rect x="504" y="110" width="220" height="86" class="card entry"/>
  <text x="520" y="134" class="label">GUI</text>
  <text x="520" y="154" class="mono">python -m hve / gui</text>
  <text x="520" y="172" class="small">2-step Wizard</text>
  <text x="520" y="188" class="small">orchestrate を子プロセス起動</text>

  <rect x="742" y="110" width="220" height="86" class="card entry"/>
  <text x="758" y="134" class="label">Prompt 版（利用面）</text>
  <text x="758" y="154" class="mono">Copilot Chat → request</text>
  <text x="758" y="172" class="small">plan → SHA-256 → 明示承認</text>
  <text x="758" y="188" class="small">一致後に CLI へ委譲</text>

  <!-- arrows entry -> orchestrator -->
  <path class="arrow" d="M376 196 L430 224"/>
  <path class="arrow" d="M614 196 L520 224"/>
  <path class="arrow" d="M852 196 L852 210 L590 210 L560 224"/>

  <!-- Lane 2: orchestrator.py -->
  <rect x="300" y="226" width="392" height="58" class="card core"/>
  <text x="316" y="250" class="label">hve/orchestrator.py — 司令塔</text>
  <text x="316" y="270" class="small">run_orchestrate(): 引数検証 → DAG 構築 → Issue/PR 連携 → 実行 → 後処理</text>

  <path class="arrow" d="M400 284 L300 314"/>
  <path class="arrow" d="M592 284 L692 314"/>

  <!-- Lane 3: planner + executor -->
  <rect x="60" y="316" width="430" height="78" class="card core"/>
  <text x="76" y="340" class="label">hve/dag_planner.py</text>
  <text x="76" y="360" class="small">build_dag_plan(): WorkflowDef → 実行可能 DAG</text>
  <text x="76" y="378" class="small">fanout 展開・skip 条件評価</text>

  <rect x="510" y="316" width="430" height="78" class="card core"/>
  <text x="526" y="340" class="label">hve/dag_executor.py — DAGExecutor</text>
  <text x="526" y="360" class="small">asyncio.Semaphore(max_parallel) で並列実行</text>
  <text x="526" y="378" class="small">依存解決 / Fork-on-Retry（1 回限定）</text>

  <path class="arrow" d="M275 394 L275 414"/>
  <path class="arrow" d="M725 394 L725 600"/>
  <text x="735" y="500" class="small">各ステップを</text>
  <text x="735" y="515" class="small">StepRunner で実行</text>

  <!-- Lane 4: customization band -->
  <text x="28" y="430" class="lane">2. 定義・カスタマイズ点（★ 編集対象）</text>
  <rect x="60" y="416" width="430" height="150" class="panel"/>
  <rect x="74" y="430" width="402" height="30" class="card custom"/>
  <text x="84" y="450" class="star">★ hve/workflow_registry.py（WorkflowDef / StepDef）</text>
  <text x="84" y="476" class="small">custom_agent（使用 Prompt 名）/ output_paths / depends_on /</text>
  <text x="84" y="492" class="small">fanout / skip 条件。ワークフローとステップ DAG をここで定義。</text>
  <rect x="74" y="500" width="402" height="26" class="card custom"/>
  <text x="84" y="518" class="star">★ .github/prompts/*.prompt.md（Prompt 本文）</text>
  <rect x="74" y="530" width="196" height="26" class="card custom"/>
  <text x="84" y="548" class="star">★ .github/io-contracts/*.yaml</text>
  <rect x="280" y="530" width="196" height="26" class="card custom"/>
  <text x="290" y="548" class="star">★ .github/skills/*/SKILL.md</text>

  <!-- arrows: registry -> planner (dashed), prompts/skills -> steprunner -->
  <path class="arrow-dash" d="M275 416 L275 394"/>
  <text x="150" y="408" class="small">WorkflowDef を planner が読む</text>
  <path class="arrow-dash" d="M476 520 L520 520 L520 636 L488 636"/>

  <!-- Lane 5: StepRunner -->
  <text x="28" y="592" class="lane">3. ステップ実行（共有）</text>
  <rect x="60" y="600" width="760" height="92" class="card runner"/>
  <text x="76" y="624" class="label">hve/runner.py — StepRunner（1 ステップ = 1 Copilot セッション）</text>
  <text x="76" y="648" class="mono">prompt_loader → skill_resolver → template_engine → CopilotClient → artifact_validation</text>
  <text x="76" y="668" class="small">prompt_loader: .github/prompts を読み込み / skill_resolver: skill_manifest.json で候補抽出 /</text>
  <text x="76" y="684" class="small">artifact_validation: output_paths の存在確認 / 失敗時 DAGExecutor が Fork-on-Retry</text>

  <path class="arrow" d="M440 692 L440 720"/>

  <!-- Lane 6: SDK -->
  <rect x="60" y="722" width="760" height="86" class="card sdk"/>
  <text x="76" y="746" class="label">github-copilot-sdk（公開 API のみ利用）</text>
  <text x="76" y="768" class="mono">CopilotClient( SubprocessConfig | ExternalServerConfig )</text>
  <text x="76" y="786" class="small">await create_session() → await send_and_wait(prompt)。イベント: text / tool_use / permission_request / completion。</text>
  <text x="76" y="802" class="small">PermissionHandler でツール実行許可ポリシーを注入（安全ガード）。</text>

  <path class="arrow" d="M440 808 L440 836"/>

  <!-- Lane 7: outputs -->
  <text x="28" y="832" class="lane">4. 成果物</text>
  <rect x="60" y="838" width="760" height="56" class="card output"/>
  <text x="76" y="862" class="label">成果物</text>
  <text x="76" y="882" class="small">docs/ ・ knowledge/ ・ src/ ・ src/test/ ・ qa/ ・ Azure リソース ・ PR / ラベル遷移（Cloud）</text>

  <!-- ===== Right panel: parameters / env ===== -->
  <rect x="984" y="110" width="328" height="540" class="panel"/>
  <text x="1000" y="136" class="label">主なパラメータ／環境変数</text>
  <text x="1000" y="154" class="small">CLI option / env var とその効果</text>

  <rect x="1000" y="166" width="296" height="48" class="card param"/>
  <text x="1010" y="184" class="mono">--model / --review-model / --qa-model</text>
  <text x="1010" y="204" class="small">本実行・レビュー・QA 各 Agent のモデル</text>

  <rect x="1000" y="220" width="296" height="44" class="card param"/>
  <text x="1010" y="238" class="mono">--max-parallel（既定 15）</text>
  <text x="1010" y="256" class="small">DAGExecutor の Semaphore サイズ＝並列度</text>

  <rect x="1000" y="270" width="296" height="44" class="card param"/>
  <text x="1010" y="288" class="mono">--steps</text>
  <text x="1010" y="306" class="small">実行ステップの絞り込み（部分実行）</text>

  <rect x="1000" y="320" width="296" height="44" class="card param"/>
  <text x="1010" y="338" class="mono">--mcp-config</text>
  <text x="1010" y="356" class="small">MCP Server を SDK セッションへ注入</text>

  <rect x="1000" y="370" width="296" height="44" class="card param"/>
  <text x="1010" y="388" class="mono">--self-improve / HVE_AUTO_SELF_IMPROVE</text>
  <text x="1010" y="406" class="small">完了後の自己改善ループ起動</text>

  <rect x="1000" y="420" width="296" height="44" class="card param"/>
  <text x="1010" y="438" class="mono">HVE_FORK_ON_RETRY=true</text>
  <text x="1010" y="456" class="small">失敗ステップを新 session で 1 回フォーク再試行</text>

  <rect x="1000" y="470" width="296" height="44" class="card param"/>
  <text x="1010" y="488" class="mono">--cli-path / --cli-url</text>
  <text x="1010" y="506" class="small">Subprocess（既定）/ ExternalServer 接続の切替</text>

  <rect x="1000" y="520" width="296" height="44" class="card param"/>
  <text x="1010" y="538" class="mono">--dry-run</text>
  <text x="1010" y="556" class="small">DAG/プロンプトを生成のみ（実行しない）</text>

  <text x="1000" y="584" class="small">Prompt gate: plan SHA-256 = --expected-sha256</text>
  <text x="1000" y="602" class="small">（一致時だけ `prompt run` が orchestrate を起動）</text>
  <text x="1000" y="624" class="small">完全な一覧: python -m hve orchestrate --help</text>
  <text x="1000" y="642" class="small">詳細: users-guide/hve-technical-architecture.md</text>

  <!-- Legend -->
  <rect x="984" y="666" width="328" height="220" class="panel"/>
  <text x="1000" y="690" class="label">凡例</text>
  <rect x="1000" y="702" width="22" height="16" class="card entry"/><text x="1030" y="715" class="small">入口 / 利用面</text>
  <rect x="1000" y="726" width="22" height="16" class="card core"/><text x="1030" y="739" class="small">共有実行エンジン（hve/*.py）</text>
  <rect x="1000" y="750" width="22" height="16" class="card custom"/><text x="1030" y="763" class="small">★ カスタマイズ点（定義ファイル）</text>
  <rect x="1000" y="774" width="22" height="16" class="card runner"/><text x="1030" y="787" class="small">StepRunner</text>
  <rect x="1000" y="798" width="22" height="16" class="card sdk"/><text x="1030" y="811" class="small">github-copilot-sdk</text>
  <rect x="1000" y="822" width="22" height="16" class="card output"/><text x="1030" y="835" class="small">成果物</text>
  <rect x="1000" y="846" width="22" height="16" class="card param"/><text x="1030" y="859" class="small">パラメータ / 環境変数</text>
  <line x1="1004" y1="876" x2="1026" y2="876" class="arrow-dash"/><text x="1034" y="880" class="small">定義ファイルの読み込み</text>
</svg>
