<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">ASDW-WEB データフロー図</title>
  <desc id="desc">ASDW-WEB の代表的な current file flows。コンテナごとに主要な入力、Prompt、出力の例を示す。</desc>
  <style>
    text { font-family: "Trebuchet MS", Verdana, Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 26px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #4b5563; }
    .col-title { font-size: 18px; font-weight: 700; }
    .card { rx: 9; ry: 9; stroke-width: 2; }
    .input { fill: #e2e8f0; stroke: #475569; }
    .agent { fill: #dcfce7; stroke: #15803d; }
    .output { fill: #ede9fe; stroke: #6d28d9; }
    .label { font-size: 13px; }
    .step { font-size: 12px; fill: #334155; }
  </style>
  <rect width="1500" height="760" fill="#ffffff"/>
  <text x="40" y="48" class="title">ASDW-WEB データフロー（代表的な current file flows）</text>
  <text x="40" y="76" class="subtitle">各行は 1 コンテナの代表 Step を示します。全 Step の依存は users-guide と workflow_registry.py を参照してください。</text>
  <text x="120" y="126" class="col-title">入力ファイル</text>
  <text x="700" y="126" class="col-title">Prompt（タスク）</text>
  <text x="1180" y="126" class="col-title">出力ファイル</text>

  <rect class="card input" x="60" y="156" width="460" height="70"/>
  <text class="label" x="80" y="184">docs/catalog/data-model.md / domain-analytics.md / service-catalog.md / app-catalog.md</text>
  <rect class="card agent" x="620" y="156" width="330" height="70"/>
  <text class="label" x="640" y="184">Step 1.1 — Dev-Microservice-Azure-DataDesign</text>
  <text class="step" x="640" y="206">データストア選定</text>
  <rect class="card output" x="1060" y="156" width="380" height="70"/>
  <text class="label" x="1080" y="198">docs/azure/azure-services-data.md</text>

  <rect class="card input" x="60" y="252" width="460" height="86"/>
  <text class="label" x="80" y="280">docs/catalog/use-case-catalog.md / service-catalog.md / app-catalog.md</text>
  <text class="label" x="80" y="302">docs/azure/azure-services-data.md / docs/azure/azure-services-compute.md</text>
  <rect class="card agent" x="620" y="252" width="330" height="86"/>
  <text class="label" x="640" y="280">Step 2.1 — Dev-Microservice-Azure-AddServiceDesign</text>
  <text class="step" x="640" y="302">AAD-WEB 2.5 の成果物への差分追記</text>
  <rect class="card output" x="1060" y="252" width="380" height="86"/>
  <text class="label" x="1080" y="294">docs/azure/azure-services-additional.md</text>

  <rect class="card input" x="60" y="364" width="460" height="86"/>
  <text class="label" x="80" y="392">docs/services/{serviceId}-*-description.md / docs/test-specs/{serviceId}-test-spec.md</text>
  <text class="label" x="80" y="414">docs/catalog/service-catalog.md / service-catalog-matrix.md / app-catalog.md</text>
  <rect class="card agent" x="620" y="364" width="330" height="86"/>
  <text class="label" x="640" y="392">Step 3.2 / 3.3 — ServiceTestCoding → ServiceCoding-AzureFunctions</text>
  <text class="step" x="640" y="414">サービス fan-out（ownership_parallel=4 対象）</text>
  <rect class="card output" x="1060" y="364" width="380" height="86"/>
  <text class="label" x="1080" y="392">src/test/api/{serviceId}.Tests/</text>
  <text class="label" x="1080" y="414">src/api/{serviceId}-{serviceNameSlug}/</text>

  <rect class="card input" x="60" y="476" width="460" height="86"/>
  <text class="label" x="80" y="504">src/app/package.json / Step 3.5 post-deploy 成果物 / 既存 SWA workflow</text>
  <text class="label" x="80" y="526">resource_group / static_web_app_name</text>
  <rect class="card agent" x="620" y="476" width="330" height="86"/>
  <text class="label" x="640" y="504">Step 4.3 — UIDeploy-AzureStaticWebApps</text>
  <text class="step" x="640" y="526">repository-managed workflow を実行</text>
  <rect class="card output" x="1060" y="476" width="380" height="86"/>
  <text class="label" x="1080" y="518">create / verify / switch / rollback の実行証跡</text>

  <rect class="card input" x="60" y="588" width="460" height="86"/>
  <text class="label" x="80" y="616">docs/azure/waf-review.md / dependency-review.md / deployed endpoints</text>
  <text class="label" x="80" y="638">既存テスト資産 / review outputs</text>
  <rect class="card agent" x="620" y="588" width="330" height="86"/>
  <text class="label" x="640" y="616">Step 5.3 — QA-RequirementsConformanceEval</text>
  <text class="step" x="640" y="638">要件適合実測</text>
  <rect class="card output" x="1060" y="588" width="380" height="86"/>
  <text class="label" x="1080" y="630">docs/azure/requirements-conformance-report.md</text>
</svg>
