<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
  <title id="title">HVE Workflow と Prompt エコシステム</title>
  <desc id="desc">12のWorkflowが、要求定義、設計、実装、知識管理、文書化のPrompt群を共有する構成。ADIは原本取込に加えてStep 1.1と1.2で質問票を生成・統合する。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Segoe UI","Yu Gothic",Meiryo,sans-serif;fill:#172033}
      .title{font-size:28px;font-weight:700}.subtitle{font-size:14px;fill:#526077}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.phase{font-size:15px;font-weight:700}
      .wf{stroke-width:1.6}.wftext{font-size:14px;font-weight:700}.small{font-size:11px;fill:#526077}
      .ingest{fill:#fff7ed;stroke:#ea580c}.arch{fill:#eff6ff;stroke:#2563eb}
      .design{fill:#f5f3ff;stroke:#7c3aed}.dev{fill:#ecfdf5;stroke:#059669}
      .prompt{fill:#ffffff;stroke:#64748b;stroke-width:1.4}.prompt-title{font-size:14px;font-weight:700}
      .line{fill:none;stroke:#475569;stroke-width:1.6;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#7c3aed;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="780" fill="#ffffff"/>
  <text x="36" y="48" class="title">HVE Workflow と Prompt エコシステム</text>
  <text x="36" y="75" class="subtitle">WorkflowDef / StepDef が12 Workflowを構成し、共通Promptと入出力契約をStep単位で割り当てる</text>

  <rect x="28" y="104" width="1224" height="354" rx="16" class="panel"/>
  <text x="52" y="136" class="phase">Workflow Registry（12 ID）</text>

  <text x="58" y="177" class="phase" fill="#c2410c">原本・知識・文書化</text>
  <rect x="52" y="193" width="270" height="76" rx="10" class="wf ingest"/>
  <text x="72" y="220" class="wftext">ADI — 9 Step</text>
  <text x="72" y="242" class="small">取込・D01〜D21質問票・選別・下流候補</text>
  <text x="72" y="258" class="small">Step 1.1: 21 fan-out → Step 1.2: join</text>
  <rect x="52" y="282" width="128" height="64" rx="10" class="wf ingest"/>
  <text x="72" y="310" class="wftext">AKM</text><text x="72" y="330" class="small">knowledge統合</text>
  <rect x="194" y="282" width="128" height="64" rx="10" class="wf ingest"/>
  <text x="214" y="310" class="wftext">ADOC</text><text x="214" y="330" class="small">技術文書化</text>

  <text x="372" y="177" class="phase" fill="#1d4ed8">要求・全体設計</text>
  <rect x="366" y="193" width="152" height="64" rx="10" class="wf arch"/>
  <text x="388" y="222" class="wftext">ARD</text><text x="388" y="242" class="small">要求定義</text>
  <rect x="532" y="193" width="152" height="64" rx="10" class="wf arch"/>
  <text x="554" y="222" class="wftext">AAS</text><text x="554" y="242" class="small">Architecture</text>

  <text x="734" y="177" class="phase" fill="#6d28d9">詳細設計</text>
  <rect x="728" y="193" width="150" height="64" rx="10" class="wf design"/>
  <text x="748" y="222" class="wftext">AAD-WEB</text><text x="748" y="242" class="small">Web設計</text>
  <rect x="892" y="193" width="150" height="64" rx="10" class="wf design"/>
  <text x="912" y="222" class="wftext">ADFD</text><text x="912" y="242" class="small">Dataflow設計</text>
  <rect x="1056" y="193" width="150" height="64" rx="10" class="wf design"/>
  <text x="1076" y="222" class="wftext">AAG</text><text x="1076" y="242" class="small">Agent設計</text>
  <rect x="728" y="282" width="150" height="64" rx="10" class="wf design"/>
  <text x="748" y="310" class="wftext">AAR</text><text x="748" y="330" class="small">検索Add-on</text>

  <text x="908" y="296" class="phase" fill="#047857">実装・デプロイ</text>
  <rect x="902" y="312" width="142" height="64" rx="10" class="wf dev"/>
  <text x="922" y="340" class="wftext">ASDW-WEB</text><text x="922" y="360" class="small">Web実装</text>
  <rect x="1058" y="312" width="142" height="64" rx="10" class="wf dev"/>
  <text x="1078" y="340" class="wftext">ADFDV</text><text x="1078" y="360" class="small">Dataflow実装</text>
  <rect x="980" y="390" width="142" height="52" rx="10" class="wf dev"/>
  <text x="1000" y="421" class="wftext">AAGD</text>

  <path d="M518 225H532" class="line"/><path d="M684 225H728" class="line"/>
  <path d="M803 257V282" class="dash"/><path d="M803 257C803 292 940 276 973 312" class="line"/>
  <path d="M967 257C967 292 1096 276 1129 312" class="line"/>
  <path d="M1131 257C1190 300 1160 370 1051 390" class="line"/>

  <rect x="28" y="482" width="1224" height="258" rx="16" class="panel"/>
  <text x="52" y="516" class="phase">Prompt / Contract レイヤ</text>
  <rect x="52" y="540" width="216" height="110" rx="10" class="prompt"/>
  <text x="72" y="570" class="prompt-title">Arch-*</text><text x="72" y="592" class="small">分析・要求・設計</text><text x="72" y="612" class="small">ARD / AAS / AAD / ADFD / AAG</text>
  <rect x="288" y="540" width="216" height="110" rx="10" class="prompt"/>
  <text x="308" y="570" class="prompt-title">Dev-*</text><text x="308" y="592" class="small">実装・テスト・デプロイ</text><text x="308" y="612" class="small">ASDW / ADFDV / AAGD / AAR</text>
  <rect x="524" y="540" width="216" height="110" rx="10" class="prompt"/>
  <text x="544" y="570" class="prompt-title">Doc-*</text><text x="544" y="592" class="small">原本カード・技術文書</text><text x="544" y="612" class="small">ADI / ADOC</text>
  <rect x="760" y="540" width="216" height="110" rx="10" class="prompt"/>
  <text x="780" y="570" class="prompt-title">QA-*</text><text x="780" y="592" class="small">質問票・横断整合・レビュー</text><text x="780" y="612" class="small">ADI 1.1 / 1.2ほか</text>
  <rect x="996" y="540" width="216" height="110" rx="10" class="prompt"/>
  <text x="1016" y="570" class="prompt-title">KnowledgeManager</text><text x="1016" y="592" class="small">D01〜D21差分統合</text><text x="1016" y="612" class="small">AKM</text>
  <text x="52" y="700" class="small">正本: hve/workflow_registry.py / .github/prompts/*.prompt.md / .github/io-contracts/*.yaml</text>
</svg>
