<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 420" role="img" aria-labelledby="title desc">
  <title id="title">ASDW-WEB チェーン図</title>
  <desc id="desc">ASDW-WEB の current registry。5つのコンテナ配下に Step 1.1〜5.3 を持ち、全体の max_parallel は 1、fan-out child の一部だけ ownership_parallel=4 で並列化される。</desc>
  <style>
    text { font-family: "Segoe UI", "Noto Sans JP", Arial, sans-serif; fill: #0f172a; }
    .title { font-size: 18px; font-weight: 700; }
    .lane { font-size: 13px; font-weight: 700; }
    .box { rx: 10; ry: 10; stroke-width: 1.6; }
    .data { fill: #dbeafe; stroke: #1d4ed8; }
    .svc { fill: #dcfce7; stroke: #15803d; }
    .ui { fill: #ede9fe; stroke: #7c3aed; }
    .qa { fill: #ffedd5; stroke: #c2410c; }
    .small { font-size: 10.5px; }
    .mono { font-family: "Consolas", "SFMono-Regular", monospace; font-size: 10px; }
  </style>

  <text x="610" y="28" text-anchor="middle" class="title">ASDW-WEB — Web App Dev &amp; Deploy（5 コンテナ / current registry）</text>

  <rect x="30" y="70" width="220" height="278" class="box data"/>
  <text x="48" y="96" class="lane">1 データ</text>
  <text x="48" y="122" class="small">1.1 Azure データストア選定</text>
  <text x="48" y="142" class="small">1.2 データストア検証テスト生成 (TDD RED)</text>
  <text x="48" y="162" class="small">1.3 Azure データサービス Deploy (TDD GREEN)</text>
  <text x="48" y="194" class="mono">1.3 は 1.2 と 4.2 を待つ live Step</text>

  <rect x="266" y="70" width="220" height="278" class="box svc"/>
  <text x="284" y="96" class="lane">2 追加サービス</text>
  <text x="284" y="122" class="small">2.1 追加 Azure サービス選定</text>
  <text x="284" y="142" class="small">2.2 追加 Azure サービス Deploy</text>
  <text x="284" y="162" class="small">2.3 追加サービステストコード生成 (TDD RED)</text>
  <text x="284" y="182" class="small">2.4 追加サービステスト実施 (TDD GREEN)</text>
  <text x="284" y="202" class="small">2.5 Agentic Retrieval Azure 実装設計</text>
  <text x="284" y="222" class="small">2.6 Agentic Retrieval Deploy（設定で無効化可）</text>
  <text x="284" y="254" class="mono">2.1 は AAD-WEB 2.5 の差分更新</text>

  <rect x="502" y="70" width="220" height="278" class="box svc"/>
  <text x="520" y="96" class="lane">3 Compute</text>
  <text x="520" y="122" class="small">3.1 Azure コンピュート選定</text>
  <text x="520" y="142" class="small">3.2 サービステストコード生成 (TDD RED)</text>
  <text x="520" y="162" class="small">3.3 サービスコード実装 (TDD GREEN)</text>
  <text x="520" y="182" class="small">3.4 Azure Compute Deploy</text>
  <text x="520" y="202" class="small">3.5 Deploy 後 再テスト</text>
  <text x="520" y="234" class="mono">3.2 fan-out child は ownership_parallel=4</text>

  <rect x="738" y="70" width="220" height="278" class="box ui"/>
  <text x="756" y="96" class="lane">4 UI</text>
  <text x="756" y="122" class="small">4.1 UI テストコード生成 (TDD RED)</text>
  <text x="756" y="142" class="small">4.2 UI 実装 (TDD GREEN)</text>
  <text x="756" y="162" class="small">4.3 Web アプリ Deploy (Azure SWA)</text>
  <text x="756" y="182" class="small">4.4 UI E2E テスト (Playwright)</text>
  <text x="756" y="214" class="mono">4.1 fan-out child は ownership_parallel=4</text>

  <rect x="974" y="70" width="216" height="278" class="box qa"/>
  <text x="992" y="96" class="lane">5 レビュー</text>
  <text x="992" y="122" class="small">5.1 WAF アーキテクチャレビュー</text>
  <text x="992" y="142" class="small">5.2 整合性チェック</text>
  <text x="992" y="162" class="small">5.3 要件適合実測</text>
  <text x="992" y="194" class="mono">5.1 / 5.2 は 4.4 後に並列、5.3 が合流</text>

  <text x="610" y="386" text-anchor="middle" class="small">全体の並列上限は max_parallel=1。local-first / live-last の実行順は registry と runner の gate に従う。</text>
</svg>
