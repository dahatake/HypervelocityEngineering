<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1029" font-family="system-ui, -apple-system, sans-serif" role="img" aria-labelledby="ard-flow-title ard-flow-desc">
  <title id="ard-flow-title">ARD: 要求定義の自動化 データフロー（8 実 Step / 表示 4 グループ）</title>
  <desc id="ard-flow-desc">ARD の 8 実 Step、入出力ファイル、fan-out、Step 2 から並列に起動可能な KPI/OKR 定義とユースケース骨格抽出、および Step 1.2 からの条件付き bridge を示します。</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#586069"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1029" fill="#f6f8fa" rx="12"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#24292e">ARD: 要求定義の自動化 データフロー</text>
  <text x="600" y="56" text-anchor="middle" font-size="11" fill="#586069">各 Prompt の入出力ファイル（8 実 Step 構成 / 表示 4 グループ）</text>

  <!-- Column headers -->
  <text x="175" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#0366d6">入力ファイル</text>
  <text x="565" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#6f42c1">Prompt（タスク）</text>
  <text x="980" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">成果物</text>

  <!-- ==================== Step 1 ==================== -->
  <text x="565" y="98" text-anchor="middle" font-size="10" fill="#959da5" font-weight="bold">Step 1: 事業分野候補列挙</text>
  <rect x="20" y="105" width="310" height="55" rx="8" fill="#e8f0fe" stroke="#0366d6" stroke-width="1.5"/>
  <text x="175" y="124" text-anchor="middle" font-size="10" fill="#24292e">company_name / target_region</text>
  <text x="175" y="140" text-anchor="middle" font-size="10" fill="#24292e">survey_base_date / analysis_purpose</text>
  <text x="175" y="155" text-anchor="middle" font-size="10" fill="#24292e">attached_docs（任意）</text>
  <rect x="430" y="105" width="270" height="55" rx="8" fill="#e8d5f5" stroke="#6f42c1" stroke-width="2"/>
  <text x="565" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#24292e">Arch-ARD-BusinessAnalysis-</text>
  <text x="565" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#24292e">Untargeted</text>
  <text x="565" y="155" text-anchor="middle" font-size="10" fill="#586069">候補事業の列挙</text>
  <rect x="800" y="118" width="360" height="38" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="980" y="141" text-anchor="middle" font-size="10" fill="#24292e">docs/company-business-recommendation.md</text>
  <line x1="330" y1="135" x2="430" y2="135" stroke="#586069" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="135" x2="800" y2="137" stroke="#586069" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ==================== Step 1.1 (fan-out) ==================== -->
  <text x="565" y="182" text-anchor="middle" font-size="10" fill="#959da5" font-weight="bold">Step 1.1: 事業分野別深掘り分析（fan-out: business_candidate）</text>
  <line x1="565" y1="160" x2="565" y2="185" stroke="#e36209" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <rect x="20" y="192" width="310" height="48" rx="8" fill="#e8f0fe" stroke="#0366d6" stroke-width="1.5"/>
  <text x="175" y="214" text-anchor="middle" font-size="10" fill="#24292e">docs/company-business-recommendation.md</text>
  <text x="175" y="230" text-anchor="middle" font-size="10" fill="#24292e">（候補キー単位で並列展開）</text>
  <rect x="430" y="190" width="270" height="52" rx="8" fill="#e8d5f5" stroke="#6f42c1" stroke-width="2"/>
  <text x="565" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#24292e">Arch-ARD-BusinessAnalysis-</text>
  <text x="565" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#24292e">Untargeted</text>
  <text x="565" y="238" text-anchor="middle" font-size="10" fill="#586069">事業分野ごとに深掘り</text>
  <rect x="800" y="200" width="360" height="38" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="980" y="223" text-anchor="middle" font-size="10" fill="#24292e">docs/business/{key}-analysis.md</text>
  <line x1="330" y1="216" x2="430" y2="216" stroke="#586069" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="216" x2="800" y2="219" stroke="#586069" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ==================== Step 1.2 ==================== -->
  <text x="565" y="264" text-anchor="middle" font-size="10" fill="#959da5" font-weight="bold">Step 1.2: 事業分析統合</text>
  <line x1="565" y1="242" x2="565" y2="267" stroke="#e36209" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <rect x="20" y="274" width="310" height="42" rx="8" fill="#e8f0fe" stroke="#0366d6" stroke-width="1.5"/>
  <text x="175" y="293" text-anchor="middle" font-size="10" fill="#24292e">docs/business/{key}-analysis.md</text>
  <text x="175" y="308" text-anchor="middle" font-size="10" fill="#24292e">（全 fan-out 結果）</text>
  <rect x="430" y="272" width="270" height="48" rx="8" fill="#e8d5f5" stroke="#6f42c1" stroke-width="2"/>
  <text x="565" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#24292e">Arch-ARD-BusinessAnalysis-</text>
  <text x="565" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#24292e">Untargeted</text>
  <text x="565" y="318" text-anchor="middle" font-size="10" fill="#586069">企業全体の事業要件統合</text>
  <rect x="800" y="280" width="360" height="38" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="980" y="303" text-anchor="middle" font-size="10" fill="#24292e">docs/company-business-requirement.md</text>
  <line x1="330" y1="295" x2="430" y2="295" stroke="#586069" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="295" x2="800" y2="299" stroke="#586069" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ==================== Step 2 ==================== -->
  <text x="565" y="346" text-anchor="middle" font-size="10" fill="#959da5" font-weight="bold">Step 2: 対象業務深掘り分析（直接指定または bridge 生成）</text>
  <line x1="565" y1="320" x2="565" y2="349" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arr)"/>
  <text x="580" y="334" font-size="8" fill="#0f766e">グループ 1 + 2 bridge</text>
  <rect x="20" y="356" width="310" height="55" rx="8" fill="#e8f0fe" stroke="#0366d6" stroke-width="1.5"/>
  <text x="175" y="375" text-anchor="middle" font-size="10" fill="#24292e">target_business（パラメータ）</text>
  <text x="175" y="391" text-anchor="middle" font-size="10" fill="#24292e">docs/company-business-requirement.md</text>
  <text x="175" y="406" text-anchor="middle" font-size="10" fill="#586069" font-style="italic">グループ 1 + 2 では Step 1.2 後に生成</text>
  <rect x="430" y="356" width="270" height="55" rx="8" fill="#e8d5f5" stroke="#6f42c1" stroke-width="2"/>
  <text x="565" y="377" text-anchor="middle" font-size="11" font-weight="bold" fill="#24292e">Arch-ARD-BusinessAnalysis-</text>
  <text x="565" y="391" text-anchor="middle" font-size="11" font-weight="bold" fill="#24292e">Targeted</text>
  <text x="565" y="406" text-anchor="middle" font-size="10" fill="#586069">対象業務の事業分析</text>
  <rect x="800" y="369" width="360" height="38" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="980" y="392" text-anchor="middle" font-size="10" fill="#24292e">docs/business-requirement.md</text>
  <line x1="330" y1="385" x2="430" y2="385" stroke="#586069" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="385" x2="800" y2="388" stroke="#586069" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ==================== Step 2.1 (KPI/OKR・任意) ==================== -->
  <text x="565" y="437" text-anchor="middle" font-size="10" fill="#959da5" font-weight="bold">Step 2.1: KPI/OKR 定義（任意・表示グループ 3。Step 3.1 と並列）</text>
  <line x1="565" y1="411" x2="565" y2="440" stroke="#e36209" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <rect x="20" y="447" width="310" height="55" rx="8" fill="#e8f0fe" stroke="#0366d6" stroke-width="1.5"/>
  <text x="175" y="466" text-anchor="middle" font-size="10" fill="#24292e">docs/business-requirement.md</text>
  <text x="175" y="482" text-anchor="middle" font-size="10" fill="#24292e">（または）</text>
  <text x="175" y="497" text-anchor="middle" font-size="10" fill="#24292e">docs/company-business-requirement.md</text>
  <rect x="430" y="447" width="270" height="55" rx="8" fill="#e8d5f5" stroke="#6f42c1" stroke-width="2"/>
  <text x="565" y="471" text-anchor="middle" font-size="11" font-weight="bold" fill="#24292e">Arch-ARD-KPIOKRDefinition</text>
  <text x="565" y="490" text-anchor="middle" font-size="10" fill="#586069">KPI/OKR・計測データ・収集設計</text>
  <rect x="800" y="460" width="360" height="38" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="980" y="483" text-anchor="middle" font-size="10" fill="#24292e">docs/recommended-kpi-okr.md</text>
  <line x1="330" y1="478" x2="430" y2="478" stroke="#586069" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="478" x2="800" y2="479" stroke="#586069" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2.1 と Step 3.1 は Step 2 を共有親とする兄弟ノード。 -->
  <path d="M 700 405 L 740 405 L 740 565 L 700 565" fill="none" stroke="#e36209" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="752" y="485" text-anchor="middle" font-size="8" fill="#9a3412" transform="rotate(90 752 485)">Step 2 → Step 3.1</text>

  <!-- ==================== Step 3.1 ==================== -->
  <text x="565" y="528" text-anchor="middle" font-size="10" fill="#959da5" font-weight="bold">Step 3.1: ユースケース骨格抽出（Step 2 スキップ時は 1.2 出力を入力）</text>
  <rect x="20" y="538" width="310" height="55" rx="8" fill="#e8f0fe" stroke="#0366d6" stroke-width="1.5"/>
  <text x="175" y="557" text-anchor="middle" font-size="10" fill="#24292e">docs/business-requirement.md</text>
  <text x="175" y="573" text-anchor="middle" font-size="10" fill="#24292e">（または）</text>
  <text x="175" y="588" text-anchor="middle" font-size="10" fill="#24292e">docs/company-business-requirement.md</text>
  <rect x="430" y="538" width="270" height="55" rx="8" fill="#e8d5f5" stroke="#6f42c1" stroke-width="2"/>
  <text x="565" y="562" text-anchor="middle" font-size="11" font-weight="bold" fill="#24292e">Arch-ARD-UseCaseCatalog</text>
  <text x="565" y="581" text-anchor="middle" font-size="10" fill="#586069">UC 骨格（タイトル・概要）の抽出</text>
  <rect x="800" y="551" width="360" height="38" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="980" y="574" text-anchor="middle" font-size="10" fill="#24292e">docs/catalog/use-case-skeleton.md</text>
  <line x1="330" y1="569" x2="430" y2="569" stroke="#586069" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="569" x2="800" y2="570" stroke="#586069" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ==================== Step 3.2 (fan-out) ==================== -->
  <text x="565" y="620" text-anchor="middle" font-size="10" fill="#959da5" font-weight="bold">Step 3.2: ユースケース詳細生成（fan-out: use_case_skeleton）</text>
  <line x1="565" y1="593" x2="565" y2="623" stroke="#e36209" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <rect x="20" y="630" width="310" height="48" rx="8" fill="#e8f0fe" stroke="#0366d6" stroke-width="1.5"/>
  <text x="175" y="651" text-anchor="middle" font-size="10" fill="#24292e">docs/catalog/use-case-skeleton.md</text>
  <text x="175" y="667" text-anchor="middle" font-size="10" fill="#24292e">（UC キー単位で並列展開）</text>
  <rect x="430" y="628" width="270" height="52" rx="8" fill="#e8d5f5" stroke="#6f42c1" stroke-width="2"/>
  <text x="565" y="648" text-anchor="middle" font-size="11" font-weight="bold" fill="#24292e">Arch-ARD-UseCaseCatalog</text>
  <text x="565" y="665" text-anchor="middle" font-size="10" fill="#586069">UC ごとに詳細フロー・例外を生成</text>
  <rect x="800" y="639" width="360" height="38" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="980" y="662" text-anchor="middle" font-size="10" fill="#24292e">docs/usecase/{key}-detail.md</text>
  <line x1="330" y1="654" x2="430" y2="654" stroke="#586069" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="654" x2="800" y2="658" stroke="#586069" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ==================== Step 3.3 ==================== -->
  <text x="565" y="704" text-anchor="middle" font-size="10" fill="#959da5" font-weight="bold">Step 3.3: ユースケースカタログ統合</text>
  <line x1="565" y1="680" x2="565" y2="707" stroke="#e36209" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <rect x="20" y="714" width="310" height="42" rx="8" fill="#e8f0fe" stroke="#0366d6" stroke-width="1.5"/>
  <text x="175" y="733" text-anchor="middle" font-size="10" fill="#24292e">docs/usecase/{key}-detail.md</text>
  <text x="175" y="748" text-anchor="middle" font-size="10" fill="#24292e">（全 fan-out 結果）</text>
  <rect x="430" y="712" width="270" height="48" rx="8" fill="#e8d5f5" stroke="#6f42c1" stroke-width="2"/>
  <text x="565" y="732" text-anchor="middle" font-size="11" font-weight="bold" fill="#24292e">Arch-ARD-UseCaseCatalog</text>
  <text x="565" y="748" text-anchor="middle" font-size="10" fill="#586069">UC 一覧のカタログ統合</text>
  <rect x="800" y="721" width="360" height="38" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="980" y="744" text-anchor="middle" font-size="10" fill="#24292e">docs/catalog/use-case-catalog.md</text>
  <line x1="330" y1="735" x2="430" y2="735" stroke="#586069" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="735" x2="800" y2="740" stroke="#586069" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ==================== Legend ==================== -->
  <rect x="20" y="791" width="1160" height="218" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="40" y="815" font-size="12" font-weight="bold" fill="#9a3412">凡例 / 読み方</text>
  <rect x="40" y="827" width="22" height="14" fill="#e8f0fe" stroke="#0366d6" stroke-width="1.5"/>
  <text x="72" y="839" font-size="11" fill="#24292e">入力ファイル / パラメータ</text>
  <rect x="240" y="827" width="22" height="14" fill="#e8d5f5" stroke="#6f42c1" stroke-width="2"/>
  <text x="272" y="839" font-size="11" fill="#24292e">Prompt（.github/prompts/*.prompt.md）</text>
  <rect x="560" y="827" width="22" height="14" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="592" y="839" font-size="11" fill="#24292e">成果物ファイル</text>
  <line x1="760" y1="834" x2="800" y2="834" stroke="#586069" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="810" y="838" font-size="11" fill="#24292e">データフロー（ファイル受け渡し）</text>
  <line x1="1010" y1="829" x2="1050" y2="839" stroke="#e36209" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="1060" y="838" font-size="11" fill="#24292e">宣言済み依存（DAG）</text>
  <line x1="930" y1="855" x2="970" y2="855" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arr)"/>
  <text x="980" y="859" font-size="10" fill="#24292e">条件付き bridge</text>
  <text x="40" y="863" font-size="11" fill="#24292e">• {key} は fan-out キー。Step 1.1 は事業分野、Step 3.2 はユースケース ID ごとに並列実行されます。</text>
  <text x="40" y="881" font-size="11" fill="#24292e">• Step 2 は target_business パラメータ指定時のみ実行。未指定時は Step 1.2 完了後、Step 3.1 の skip_fallback_deps=["1.2"] により Step 2 をスキップして Step 3.1 へ進みます。</text>
  <text x="40" y="899" font-size="11" fill="#24292e">• 最大並列数: 15（hve/workflow_registry.py ARD.max_parallel）。</text>
  <text x="40" y="917" font-size="11" fill="#24292e">• Step 2.1（KPI/OKR 定義）は表示グループ 3 に対応し、CLI / GUI ともに既定で選択されます。Step 2 完了で起動し（Step 2 スキップ時は 1.2 出力を入力）、Step 3.1 と並列に実行されます。</text>
  <text x="40" y="935" font-size="11" fill="#24292e">• 出典: hve/workflow_registry.py ARD WorkflowDef（ADR-0003 / Sub-10）。</text>
  <text x="40" y="967" font-size="11" font-weight="bold" fill="#9a3412">関連 Prompt ファイル:</text>
  <text x="40" y="985" font-size="10" fill="#24292e">.github/prompts/Arch-ARD-BusinessAnalysis-Untargeted.prompt.md / Arch-ARD-BusinessAnalysis-Targeted.prompt.md / Arch-ARD-KPIOKRDefinition.prompt.md / Arch-ARD-UseCaseCatalog.prompt.md</text>
</svg>
