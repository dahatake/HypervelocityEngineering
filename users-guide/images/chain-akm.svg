<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 340" role="img" aria-label="AKM チェーン図">
  <desc>AKM（Knowledge Management）: Step.1 KnowledgeManager が D01〜D21 の 21 並列 fan-out で knowledge/D{NN}-*.md と -ChangeLog.md を生成・更新し、Step.2 QA-DocConsistency が横断整合性レビューを行って knowledge/business-requirement-document-status.md を更新する。</desc>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Noto Sans JP", Arial, sans-serif; }
    .km  { fill: #D4A017; stroke: #7A5C00; stroke-width: 1.5; }
    .qa  { fill: #E07B39; stroke: #8B4513; stroke-width: 1.5; }
    .fan { fill: #E8C46A; stroke: #7A5C00; stroke-width: 1.2; }
    .out { fill: #9E9E9E; stroke: #5A5A5A; stroke-width: 1.5; }
    .ln  { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
    .bt  { fill: white; font-weight: bold; font-size: 10px; }
    .bs  { fill: white; font-size: 9px; }
    .fk  { fill: #3A2C00; font-weight: bold; font-size: 10px; }
    .ttl { font-size: 15px; font-weight: bold; fill: #7A5C00; }
    .lg  { font-size: 11px; fill: #333; }
    .nt  { font-size: 10px; fill: #555; }
  </style>

  <text x="395" y="26" text-anchor="middle" class="ttl">AKM — Knowledge Management（Step.1 は D01〜D21 の 21 並列 fan-out）</text>

  <!-- Step 1 -->
  <rect x="20" y="105" width="155" height="62" rx="5" class="km"/>
  <text x="97" y="126" text-anchor="middle" class="bt">Step.1</text>
  <text x="97" y="141" text-anchor="middle" class="bs">KnowledgeManager</text>
  <text x="97" y="155" text-anchor="middle" class="bs">knowledge/ 生成・管理</text>

  <!-- Fan-out children (D01..D21) -->
  <line x1="175" y1="136" x2="212" y2="61" class="ln"/>
  <line x1="175" y1="136" x2="212" y2="105" class="ln"/>
  <line x1="175" y1="136" x2="212" y2="176" class="ln"/>

  <rect x="212" y="44" width="118" height="34" rx="4" class="fan"/>
  <text x="271" y="65" text-anchor="middle" class="fk">1/D01</text>
  <rect x="212" y="88" width="118" height="34" rx="4" class="fan"/>
  <text x="271" y="109" text-anchor="middle" class="fk">1/D02</text>
  <text x="271" y="145" text-anchor="middle" class="fk">⋮</text>
  <rect x="212" y="159" width="118" height="34" rx="4" class="fan"/>
  <text x="271" y="180" text-anchor="middle" class="fk">1/D21</text>
  <text x="271" y="210" text-anchor="middle" class="nt">21 並列（各子は自分の D のみ書き込み）</text>

  <!-- Fan-out -> Step 2 (AND join) -->
  <line x1="330" y1="61" x2="392" y2="130" class="ln"/>
  <line x1="330" y1="105" x2="392" y2="134" class="ln"/>
  <line x1="330" y1="176" x2="392" y2="142" class="ln"/>

  <!-- Step 2 -->
  <rect x="392" y="105" width="172" height="62" rx="5" class="qa"/>
  <text x="478" y="126" text-anchor="middle" class="bt">Step.2</text>
  <text x="478" y="141" text-anchor="middle" class="bs">QA-DocConsistency</text>
  <text x="478" y="155" text-anchor="middle" class="bs">knowledge/ 横断整合性レビュー</text>

  <!-- Step 1 children output -->
  <line x1="271" y1="228" x2="271" y2="252" class="ln"/>
  <rect x="150" y="252" width="242" height="52" rx="5" class="out"/>
  <text x="271" y="271" text-anchor="middle" class="bt">Step.1 の成果物</text>
  <text x="271" y="285" text-anchor="middle" class="bs">knowledge/D{NN}-*.md</text>
  <text x="271" y="298" text-anchor="middle" class="bs">knowledge/D{NN}-*-ChangeLog.md</text>

  <!-- Step 2 output -->
  <line x1="564" y1="136" x2="596" y2="136" class="ln"/>
  <rect x="596" y="102" width="180" height="68" rx="5" class="out"/>
  <text x="686" y="123" text-anchor="middle" class="bt">Step.2 の成果物</text>
  <text x="686" y="138" text-anchor="middle" class="bs">knowledge/</text>
  <text x="686" y="151" text-anchor="middle" class="bs">business-requirement-</text>
  <text x="686" y="164" text-anchor="middle" class="bs">document-status.md</text>

  <!-- Legend -->
  <rect x="420" y="252" width="14" height="14" rx="3" class="km"/>
  <text x="440" y="263" class="lg">KnowledgeManager（金）</text>
  <rect x="420" y="274" width="14" height="14" rx="3" class="qa"/>
  <text x="440" y="285" class="lg">QA-*（橙）: 品質確認</text>
  <rect x="620" y="252" width="14" height="14" rx="3" class="fan"/>
  <text x="640" y="263" class="lg">fan-out 子ステップ</text>
  <rect x="620" y="274" width="14" height="14" rx="3" class="out"/>
  <text x="640" y="285" class="lg">ファイル/ディレクトリ（灰）</text>
</svg>
