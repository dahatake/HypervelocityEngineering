<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">AAGD チェーン図</title>
  <desc id="desc">AAGD の current registry 9 Step。1 → 2.1 → 2.2 → 2.3 → 3 → 4 → 5 → 6 → 7 を順に進む。Step 1 は AAG Step 1 の成果物を差分更新する。</desc>
  <style>
    text { font-family: "Segoe UI", "Noto Sans JP", Arial, sans-serif; fill: #0f172a; }
    .title { font-size: 18px; font-weight: 700; }
    .box { rx: 8; ry: 8; stroke-width: 1.6; }
    .arch { fill: #dbeafe; stroke: #1d4ed8; }
    .dev { fill: #dcfce7; stroke: #15803d; }
    .qa { fill: #ffedd5; stroke: #c2410c; }
    .small { font-size: 10px; }
    .head { font-size: 12px; font-weight: 700; }
  </style>
  <text x="560" y="28" text-anchor="middle" class="title">AAGD — AI Agent Dev &amp; Deploy（current registry 9 Step）</text>

  <rect x="26" y="76" width="120" height="64" class="box arch"/><text x="86" y="102" text-anchor="middle" class="head">1 構成設計</text><text x="86" y="122" text-anchor="middle" class="small">AAG Step 1 を差分更新</text>
  <rect x="162" y="76" width="120" height="64" class="box arch"/><text x="222" y="102" text-anchor="middle" class="head">2.1 テスト仕様</text><text x="222" y="122" text-anchor="middle" class="small">TDD RED</text>
  <rect x="298" y="76" width="120" height="64" class="box dev"/><text x="358" y="102" text-anchor="middle" class="head">2.2 テストコード</text><text x="358" y="122" text-anchor="middle" class="small">TDD RED</text>
  <rect x="434" y="76" width="120" height="64" class="box dev"/><text x="494" y="102" text-anchor="middle" class="head">2.3 実装</text><text x="494" y="122" text-anchor="middle" class="small">TDD GREEN</text>
  <rect x="570" y="76" width="120" height="64" class="box dev"/><text x="630" y="102" text-anchor="middle" class="head">3 Deploy</text><text x="630" y="122" text-anchor="middle" class="small">AgentDeploy</text>
  <rect x="706" y="76" width="120" height="64" class="box qa"/><text x="766" y="102" text-anchor="middle" class="head">4 tool search 実測</text>
  <rect x="842" y="76" width="120" height="64" class="box qa"/><text x="902" y="102" text-anchor="middle" class="head">5 要件適合</text>
  <rect x="230" y="182" width="180" height="64" class="box qa"/><text x="320" y="208" text-anchor="middle" class="head">6 検索経路の適正化実測</text>
  <rect x="458" y="182" width="180" height="64" class="box dev"/><text x="548" y="208" text-anchor="middle" class="head">7 Microsoft 365 / Teams 公開</text>

  <text x="560" y="280" text-anchor="middle" class="small">主成果物: docs/agent/agent-application-definition.md、docs/test-specs/{key}-test-spec.md、src/test/agent/{key}.Tests/、src/agent/{key}/、deploy / eval / publish レポート</text>
</svg>
