<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d" font-family="Segoe UI, Meiryo, Yu Gothic UI, sans-serif">
<title id="t">The daily flow of HVE Lite</title>
<desc id="d">From a request to Copilot's change, verify, CI, Studio and milestone audits</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#667"/></marker></defs>
<rect width="1100" height="520" fill="#fafafa"/>
<rect x="30" y="60" width="190" height="110" rx="10" fill="#fff" stroke="#0f5fa8" stroke-width="2" />
<rect x="30" y="60" width="190" height="8" rx="4" fill="#0f5fa8" stroke="#0f5fa8" stroke-width="1" />
<text x="125.0" y="96" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">1 Ask</text>
<text x="125.0" y="118" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">Your usual Copilot</text>
<text x="125.0" y="136" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">as you always do</text>
<rect x="270" y="60" width="230" height="110" rx="10" fill="#fff" stroke="#7b3fc4" stroke-width="2" />
<rect x="270" y="60" width="230" height="8" rx="4" fill="#7b3fc4" stroke="#7b3fc4" stroke-width="1" />
<text x="385.0" y="96" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">2 Updated in one change</text>
<text x="385.0" y="118" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">Code + requirements</text>
<text x="385.0" y="136" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">+ catalog + tests</text>
<text x="385.0" y="154" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">(rules in AGENTS.md)</text>
<rect x="550" y="60" width="230" height="110" rx="10" fill="#fff" stroke="#107c10" stroke-width="2" />
<rect x="550" y="60" width="230" height="8" rx="4" fill="#107c10" stroke="#107c10" stroke-width="1" />
<text x="665.0" y="96" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">3 Check locally</text>
<text x="665.0" y="118" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">python scripts/verify.py</text>
<text x="665.0" y="136" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">Fix until exit code 0</text>
<rect x="830" y="60" width="240" height="110" rx="10" fill="#fff" stroke="#107c10" stroke-width="2" />
<rect x="830" y="60" width="240" height="8" rx="4" fill="#107c10" stroke="#107c10" stroke-width="1" />
<text x="950.0" y="96" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">4 Push → CI</text>
<text x="950.0" y="118" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">ebak-verify runs</text>
<text x="950.0" y="136" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">the same checks</text>
<path d="M220 115 H270" stroke="#667" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<path d="M500 115 H550" stroke="#667" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<path d="M780 115 H830" stroke="#667" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<rect x="270" y="250" width="230" height="120" rx="10" fill="#fff" stroke="#7b3fc4" stroke-width="2" />
<rect x="270" y="250" width="230" height="8" rx="4" fill="#7b3fc4" stroke="#7b3fc4" stroke-width="1" />
<text x="385.0" y="286" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">Data layer (in git)</text>
<text x="385.0" y="308" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">docs/requirements-definition.md</text>
<text x="385.0" y="326" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">docs/catalog.md</text>
<text x="385.0" y="344" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">tests/system/ledger.json</text>
<rect x="550" y="250" width="230" height="120" rx="10" fill="#fff" stroke="#0f5fa8" stroke-width="2" />
<rect x="550" y="250" width="230" height="8" rx="4" fill="#0f5fa8" stroke="#0f5fa8" stroke-width="1" />
<text x="665.0" y="286" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">See it in HVE Studio</text>
<text x="665.0" y="308" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">Charts, tables, search (read-only)</text>
<text x="665.0" y="326" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">PM / Architect / SWE</text>
<rect x="830" y="250" width="240" height="120" rx="10" fill="#fff" stroke="#c0309b" stroke-width="2" />
<rect x="830" y="250" width="240" height="8" rx="4" fill="#c0309b" stroke="#c0309b" stroke-width="1" />
<text x="950.0" y="286" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">Milestones only: rd-auditor</text>
<text x="950.0" y="308" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">Audits contradictions and</text>
<text x="950.0" y="326" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">goal drift (work/audit/)</text>
<path d="M385 170 V250" stroke="#667" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<path d="M500 310 H550" stroke="#667" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<path d="M780 310 H830" stroke="#667" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="550" y="440" font-size="13" fill="#333" font-weight="bold" text-anchor="middle">People decide: requests, approvals, answers, merges. Scripts check: IDs, links, paths, ledger (no LLM involved).</text>
<text x="550" y="466" font-size="12" fill="#555" font-weight="normal" text-anchor="middle">IDs come from next-id.py, the ledger changes only via ledger.py. Temporary files go in /work.</text>
</svg>
