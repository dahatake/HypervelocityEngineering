<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="AAS 10ステップチェーン図">
  <desc>AAS（App Architecture Design）: 10ステップチェーン。Step.1 Arch-ArchitectureCandidateAnalyzer → Step.2.1 Arch-Microservice-DomainAnalytics → Step.2.2 Arch-Microservice-ServiceIdentify → Step.3.1 Arch-DataModeling（データモデル）→ Step.3.2 Arch-DataModeling（サンプルデータ）・Step.4 Arch-DataCatalog → Step.5 Arch-Microservice-ServiceCatalog → Step.6 Arch-TDD-TestStrategy → Step.7 Arch-PersonaCatalog → Step.8 Arch-UI-PersonaScreenList</desc>
