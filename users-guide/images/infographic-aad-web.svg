<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">AAD-WEB インフォグラフィック</title>
  <desc id="desc">AAD-WEB の入力、現行 Step 群、主成果物の対応。画面・サービス・TDD 仕様を生成し、Step 2.5 と 2.6 は Step 2.2 から独立して派生する。</desc>
  <style>
    text { font-family: "Segoe UI", "Noto Sans JP", Arial, sans-serif; fill: #0f172a; }
    .title { font-size: 18px; font-weight: 700; }
    .head { font-size: 13px; font-weight: 700; }
    .box { rx: 10; ry: 10; stroke-width: 1.6; }
    .input { fill: #e0f2fe; stroke: #0369a1; }
    .proc { fill: #ede9fe; stroke: #7c3aed; }
    .out { fill: #dcfce7; stroke: #15803d; }
    .mono { font-family: "Consolas", "SFMono-Regular", monospace; font-size: 10px; }
    .small { font-size: 11px; }
  </style>

  <text x="490" y="28" text-anchor="middle" class="title">AAD-WEB データフロー（現行 Step と成果物）</text>

  <text x="130" y="62" class="head">入力</text>
  <rect x="36" y="74" width="250" height="220" class="box input"/>
  <text x="52" y="102" class="small">AAS / ARD 成果物</text>
  <text x="52" y="126" class="mono">docs/catalog/app-arch-catalog.md</text>
  <text x="52" y="142" class="mono">docs/catalog/app-catalog.md</text>
  <text x="52" y="158" class="mono">docs/catalog/domain-analytics.md</text>
  <text x="52" y="174" class="mono">docs/catalog/service-catalog.md</text>
  <text x="52" y="190" class="mono">docs/catalog/data-model.md</text>
  <text x="52" y="206" class="mono">docs/catalog/service-catalog-matrix.md</text>
  <text x="52" y="222" class="mono">docs/catalog/test-strategy.md</text>
  <text x="52" y="238" class="mono">docs/catalog/use-case-catalog.md（Step 2.5）</text>

  <text x="490" y="62" class="head">主要 Step</text>
  <rect x="332" y="74" width="316" height="220" class="box proc"/>
  <text x="348" y="102" class="small">Step 1: 画面一覧と遷移図</text>
  <text x="348" y="126" class="small">Step 2.1 / 2.2: 画面定義書・サービス定義書</text>
  <text x="348" y="150" class="small">Step 2.3 / 2.4: サービス別・画面別 TDD テスト仕様</text>
  <text x="348" y="174" class="small">Step 2.5: 追加 Azure サービス選定</text>
  <text x="348" y="198" class="small">Step 2.6: Agentic Retrieval 機能要件（設定で無効化可）</text>
  <text x="348" y="222" class="small">Step 3: 画面 ↔ サービス整合性レビュー</text>
  <text x="348" y="254" class="small">依存: 2.1→2.4、2.2→2.3、2.2→2.5/2.6、</text>
  <text x="348" y="272" class="small">3 は 2.1 / 2.2 / 2.3 / 2.4 を待つ</text>

  <text x="810" y="62" class="head">主成果物</text>
  <rect x="694" y="74" width="250" height="220" class="box out"/>
  <text x="710" y="102" class="mono">docs/catalog/screen-catalog-APP-*.md</text>
  <text x="710" y="126" class="mono">docs/screen/{screenId}-*-description.md</text>
  <text x="710" y="150" class="mono">docs/services/{serviceId}-*-description.md</text>
  <text x="710" y="174" class="mono">docs/test-specs/{serviceId}-test-spec.md</text>
  <text x="710" y="190" class="mono">docs/test-specs/{screenId}-test-spec.md</text>
  <text x="710" y="214" class="mono">docs/azure/azure-services-additional.md</text>
  <text x="710" y="230" class="mono">docs/services/{serviceId}-agentic-retrieval-spec.md</text>
  <text x="710" y="254" class="mono">docs/catalog/screen-service-consistency-report.md</text>
</svg>
